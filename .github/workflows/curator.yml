name: Knowledge Curator — flags to knowledge

# The feedback half of the loop. Visitors (and the site itself, on a weak
# answer) open GitHub Issues labelled `knowledge-flag`. This workflow:
#   1. rebuilds the fabric from the current sources,
#   2. re-asks every open flag; closes the ones the sources now cover,
#   3. commits the ledger (knowledge_sources/flags/flags.json) to main, so the
#      site shows open gaps and the integration test guards resolved ones,
#   4. opens or updates one PR with proposal stubs for the gaps that remain —
#      a human completes the fact; the curator never invents one.

on:
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC, an hour after the Factory sync
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: curator
  cancel-in-progress: false

jobs:
  curate:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'knowledge-flag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build fabric from current sources
        run: python -m pipeline.build_index

      - name: Curate flags (close what the sync fixed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m knowledge_factory.curator --close || true

      - name: Commit ledger to main
        run: |
          git config user.name "knowledge-curator[bot]"
          git config user.email "knowledge-curator@users.noreply.github.com"
          git add knowledge_sources/flags/flags.json
          if git diff --cached --quiet; then echo "ledger unchanged"; else
            git commit -m "curator: update knowledge flag ledger"
            git push
          fi

      - name: Open or update the proposals PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(python -c "import json;print(json.load(open('knowledge_sources/flags/flags.json'))['summary']['open'])")
          if [ "$OPEN" = "0" ]; then echo "no open gaps — no proposals PR"; exit 0; fi
          git checkout -B curator/proposals
          git add knowledge_sources/flags/proposals.md
          if git diff --cached --quiet && git rev-parse --verify -q origin/curator/proposals; then
            echo "proposals unchanged"; exit 0; fi
          git commit -m "curator: $OPEN proposed knowledge update(s)" || true
          git push -f origin curator/proposals
          if gh pr list --head curator/proposals --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit curator/proposals --title "curator: $OPEN proposed knowledge update(s)" \
              --body "Open knowledge flags the current sources do not cover. Complete each stub in \`knowledge_sources/flags/proposals.md\`, move the fact into \`profile.yaml\` (or the right source), and the next build closes the flag."
          else
            gh pr create --head curator/proposals --base main --draft \
              --title "curator: $OPEN proposed knowledge update(s)" \
              --body "Open knowledge flags the current sources do not cover. Complete each stub in \`knowledge_sources/flags/proposals.md\`, move the fact into \`profile.yaml\` (or the right source), and the next build closes the flag."
          fi
