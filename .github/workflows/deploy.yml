name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Knowledge Factory commits refreshed sources on a schedule; that push
  # lands on main and triggers this workflow, so the fabric rebuilds itself.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build fabric from docs_source + knowledge_sources
        run: |
          python -m pipeline.build_index \
            --source docs_source \
            --knowledge knowledge_sources \
            --out site/data/index.json \
            --semantic-out site/data/semantic.json
      - name: Sentence embeddings (semantic NLU for the canon and retrieval)
        run: |
          pip install --quiet sentence-transformers
          python -m pipeline.embed --index site/data/index.json --out site/data/vectors.json

      - name: Cache-bust the site's modules with the commit id
        run: |
          STAMP="${GITHUB_SHA::8}"
          find site -name '*.html' -o -name '*.js' | xargs sed -i -E "s/\?v=[0-9a-z]+/?v=${STAMP}/g"
          grep -c "?v=${STAMP}" site/index.html
      - name: Verify build artifacts
        run: |
          test -f site/index.html
          test -f site/data/index.json
          test -f site/data/semantic.json
          ls -lh site/data/index.json site/data/semantic.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Blocks the deploy if pipeline output and browser code have drifted apart.
      - name: Browser integration test
        run: node tests/integration.test.mjs

      # A retrieval regression ships broken answers to every visitor. Failing the
      # deploy is cheaper than shipping a fabric that quietly stopped finding things.
      - name: Retrieval quality gate
        run: python -m eval.evaluate --gate --json site/data/eval_report.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
