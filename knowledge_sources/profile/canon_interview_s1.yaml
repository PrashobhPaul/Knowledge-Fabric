- id: iv1-metrics
  topics: [interview, ml]
  questions:
  - Explain the difference between precision, recall, F1, ROC-AUC and PR-AUC. When would you prioritize each?
  - When would you prioritize precision over recall?
  - What is the difference between ROC-AUC and PR-AUC?
  - Which classification metrics do you use, and when do you prefer precision, recall, F1 or AUC?
  keywords:
  - precision
  - recall
  - f1
  - roc auc
  - pr auc
  - precision over recall
  - recall over precision
  - classification metrics
  answer: >-
    Precision is true positives over everything I flagged: of what I flagged, how much was right. Recall is
    true positives over everything that was really positive: of what was there, how much I caught. F1 is their
    harmonic mean, so it is high only when both are. All three depend on the threshold you choose. ROC-AUC is
    threshold-free: the area under the curve of true-positive rate against false-positive rate across all
    thresholds, which equals the probability that a random positive is ranked above a random negative. It
    measures ranking quality, but under heavy imbalance it flatters, because the false-positive rate divides by
    a huge number of negatives. PR-AUC, or average precision, plots precision against recall, ignores true
    negatives, and its baseline is the positive rate itself, so it tells the truth about rare classes. When I
    prioritise each: precision when a false positive is expensive or irritating, such as blocking a genuine
    customer's card, auto-closing a ticket, or an alert that wakes an engineer at night. Recall when a miss is
    expensive: fraud that gets through, a clinical finding missed in a note, a safety defect. F1 when both
    errors cost about the same and I need one number to tune on, or F-beta when they do not, with beta above
    one favouring recall. ROC-AUC to compare models on reasonably balanced data, or before the threshold is
    decided. PR-AUC for imbalanced problems such as fraud, anomalies and rare conditions. In the end I take a
    cost-weighted view: every cell of the confusion matrix gets a business cost, and the threshold sits where
    the total cost is lowest, within a recall or precision floor the business signs off.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud detection, where recall and precision trade off against customer friction
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: Clinical NLP, where a missed finding is expensive

- id: iv1-fraud-accuracy
  topics: [interview, ml]
  questions:
  - A fraud model has 99% accuracy but misses 40% of fraudulent transactions. Successful? How would you improve it?
  - Is a fraud model with 99 percent accuracy successful if it misses 40 percent of fraud?
  - Our fraud detection model is 99% accurate but catches only 60% of fraud. How would you fix it?
  - Why is 99% accuracy misleading for a fraud model, and how would you improve it?
  keywords:
  - 99 accuracy
  - 99 percent accuracy
  - 99 accurate
  - fraud model
  - fraud detection model
  - fraudulent transactions
  - misses 40
  - accuracy paradox
  answer: >-
    No, it is not successful, and the 99 percent is the warning sign, not the achievement. Fraud is usually well
    under one percent of transactions, so a model that never flags anything also scores 99 percent accuracy.
    That is the accuracy paradox of class imbalance. The number that matters here is recall, and a recall of 60
    percent means four frauds in ten get through. I would restate success in money: fraud losses prevented,
    minus the cost of friction for genuine customers and of analyst time, with precision and recall at the
    operating threshold, and PR-AUC to compare models. Then I would improve it in this order. One, the
    threshold. Models are often deployed at a default of 0.5, and moving along the precision-recall curve can
    recover a lot of recall at once. I set it against the cost of a missed fraud versus the cost of a false
    decline, and I use tiers: auto-block above a high score, step-up authentication such as an OTP in the middle
    band, an analyst review queue below that. Tiers raise recall without blocking good customers outright. Two,
    class imbalance in training: class weights or a cost-sensitive loss, undersampling or SMOTE on the training
    folds only, and probability calibration afterwards. Three, features, which is usually where the missed 40
    percent lives: velocity features such as transactions per card per hour, deviation from the customer's own
    behaviour, device, IP and location mismatches, merchant risk, and graph features, because cards, devices
    and accounts shared across many customers are a strong fraud signal. Four, the model's blind spots:
    gradient boosting as the workhorse, plus an anomaly detector for patterns the labels have never seen, and an
    analysis of the missed frauds by segment, because they are rarely random. Five, labels and validation:
    chargebacks arrive weeks late, so handle label delay, validate on time-based splits, and feed analyst
    decisions back. Six, production: recall monitored on matured labels, drift tracked as fraudsters adapt, and
    explanations so analysts and regulators can see why a transaction was stopped. I built fraud detection,
    loan eligibility and credit-scoring models in BFSI risk analytics at Yash Technologies, and the hardest
    conversations were never about the algorithm. They were about the cost of a missed fraud against a blocked
    genuine customer, a balance the risk team owns.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud detection, loan eligibility and credit scoring models for BFSI clients
  - url: profile:skills/Domain Knowledge
    source: resume
    why: BFSI analytics, fraud detection, risk modelling

# ----------------------------------------------------------------------------- C. LLM and GenAI
- id: iv1-transformer
  topics: [interview, genai]
  questions:
  - Explain the architecture of a Transformer. What are attention and self-attention?
  - How does a transformer model work?
  - What is self-attention and how is it different from attention?
  - Explain the attention mechanism in transformers.
  keywords:
  - transformer architecture
  - architecture of a transformer
  - self attention
  - attention mechanism
  - multi head attention
  - transformer model
  - transformer
  - attention
  answer: >-
    A Transformer turns a sequence of tokens into contextual representations using attention instead of
    recurrence. Tokens become embeddings, positional information is added, sinusoidal or rotary, and the result
    passes through a stack of identical blocks. Each block
    has two sub-layers, multi-head attention and a position-wise feed-forward network, each wrapped in a residual
    connection and layer normalisation. The 2017 design was an encoder-decoder for translation; BERT-style
    models keep only the encoder, and GPT-style LLMs keep only the decoder, with a causal mask so each token sees
    only the tokens before it. Attention is a learned, weighted lookup. Each token is projected into a query, a
    key and a value. A token's query is compared with every key by a dot product, scaled by the square root of
    the key dimension, turned into weights with a softmax, and the output is the weighted sum of the values.
    Self-attention is attention where the queries, keys and values all come from the same sequence, so every
    word can draw on every other word in its own sentence: that is how the word bank means one thing next to
    river and another next to loan. Cross-attention takes queries from one sequence and keys and values from
    another, as the decoder does over the encoder's output. Multi-head attention runs several of these in
    parallel in smaller subspaces, so different heads can track syntax, coreference or position. Two
    consequences matter to an architect. Attention is quadratic in sequence length, which is why long contexts
    are expensive and inference relies on a KV cache. And because every position is computed in parallel,
    training scales on GPUs in a way the RNNs and LSTMs I worked with before transformers never did. FinBERT in
    my stock-analysis pipeline and the MiniLM embeddings in Knowledge Fabric are both encoder-only transformers.
  evidence:
  - url: profile:skills/NLP & Machine Learning
    source: resume
    why: Transformers and NLP
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Evolved from basic NLP to transformers, LSTMs, LLMs and SLMs
  - url: https://github.com/PrashobhPaul/StockAnalysis_IndianMarket
    source: github
    why: FinBERT, an encoder transformer, for news sentiment

- id: iv1-training-vs-rag
  topics: [interview, genai]
  questions:
  - What is the difference between pre-training, fine-tuning, instruction tuning and RAG?
  - When should I fine-tune a model and when should I use RAG?
  - How is instruction tuning different from fine-tuning and pre-training?
  - Fine-tuning versus RAG, which would you choose for enterprise knowledge?
  keywords:
  - pre training
  - pretraining
  - fine tuning
  - fine tune
  - instruction tuning
  - fine tuning versus rag
  - fine tune or rag
  - rag or fine tuning
  answer: >-
    They change different things. Pre-training builds the model: self-supervised next-token prediction over
    trillions of tokens of text and code, on thousands of GPUs for weeks. It is where language, reasoning
    patterns and broad world knowledge come from, and almost no enterprise should do it. Fine-tuning continues
    training a pre-trained model on a smaller labelled dataset for a domain or a task, so it changes the weights:
    style, format, domain vocabulary, a classification head, or a narrow skill. Full fine-tuning updates every
    weight; parameter-efficient methods such as LoRA train a small adapter. Instruction tuning is a specific kind
    of fine-tuning on instruction and response pairs across many tasks, usually followed by preference alignment
    such as RLHF or DPO. It is what turns a raw next-token predictor into an assistant that follows instructions;
    every chat model you call is instruction-tuned. RAG changes nothing in the model. At question time it
    retrieves relevant passages from your own sources and puts them in the prompt, so the answer is grounded in
    current, private, permissioned data and can cite it. My rule: fine-tune for behaviour, RAG for knowledge. If
    the model does not know your facts, or the facts change weekly, or different users may see different
    documents, use RAG; fine-tuning bakes knowledge in, cannot cite, cannot honour permissions, and goes stale.
    If the problem is format, tone, latency or cost at high volume on a narrow task, fine-tune, often a smaller
    model. Many production systems use both: a small fine-tuned model for routing or extraction, and RAG for the
    facts. Knowledge Fabric is pure retrieval and curation with no fine-tuning at all, because knowledge,
    freshness and citations were the whole point.
  evidence:
  - url: profile:skills/Generative AI & Agents
    source: resume
    why: RAG, LLM fine-tuning, prompt engineering
  - url: doc:Knowledge_Fabric
    source: resume
    why: Retrieval and curated answers, nothing generated

- id: iv1-lora
  topics: [interview, genai]
  questions:
  - When would you use LoRA or QLoRA instead of full fine-tuning?
  - What is LoRA and how is QLoRA different?
  - Why use parameter-efficient fine-tuning instead of full fine-tuning?
  - LoRA versus full fine-tuning, how do you choose?
  keywords:
  - lora
  - qlora
  - parameter efficient
  - full fine tuning
  - low rank
  - peft
  - adapters
  answer: >-
    Most of the time. Full fine-tuning updates every weight, so a 7-billion-parameter model needs memory for the
    weights, the gradients and the optimiser states, well over 100 GB in mixed precision, and every task
    produces a full copy of the model. LoRA keeps the base model frozen and learns a low-rank update for selected
    weight matrices, usually the attention projections: instead of changing a d-by-d matrix you learn two thin
    matrices of rank r, typically 8 to 64. That trains well under one percent of the parameters, fits a mid-size
    model on a single GPU, and each adapter is megabytes, not gigabytes. QLoRA goes further: the frozen base
    model is quantised to 4-bit NF4, with double quantisation and paged optimisers, and the LoRA adapters train
    on top in higher precision. The original paper fine-tuned a 65-billion-parameter model on a single 48 GB GPU
    that way, at some cost in training speed. I choose LoRA when the data is modest; when I need many variants, one adapter per task, tenant or language over one shared
    base; when I want rollback as simple as removing an adapter; and when the GPU budget is limited. QLoRA when
    memory is the binding constraint. Full fine-tuning when the domain shift is large, the data is plentiful,
    the last points of quality matter, or I am doing continued pre-training on a new language or domain, and
    the budget exists. At serving time I merge the adapter into the weights when one variant serves all the
    traffic, so there is no latency overhead, or serve many adapters on one base with a server such as vLLM.
    And before any of this I check whether prompting or RAG already solves the problem; most enterprise problems
    are knowledge problems, not fine-tuning problems.
  evidence:
  - url: profile:skills/Generative AI & Agents
    source: resume
    why: LLM fine-tuning
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: MLOps, SageMaker and Vertex AI for training and serving

- id: iv1-sampling
  topics: [interview, genai]
  questions:
  - How do temperature, top-p and token limits influence generation?
  - What does temperature do in an LLM?
  - What is the difference between temperature and top-p sampling?
  - How should I set temperature and max tokens for an enterprise use case?
  keywords:
  - temperature
  - top p
  - nucleus sampling
  - max tokens
  - max output tokens
  - token limits
  - token limit
  - sampling parameters
  answer: >-
    They control how the next token is chosen and how much gets generated. At every step the model produces a
    probability for every token in its vocabulary. Temperature divides the logits before the softmax. Below 1 it
    sharpens the distribution toward the most likely tokens, so the output is focused and repeatable, and at 0
    it is effectively greedy decoding. Above 1 it flattens the distribution, so the output is more varied and,
    eventually, incoherent. Top-p, or nucleus sampling, keeps only the smallest set of tokens whose cumulative
    probability reaches p, say 0.9, and samples from that set. It cuts the long tail of unlikely tokens
    adaptively: few candidates when the model is confident, more when it is not. Top-k is the cruder version, a
    fixed number of candidates. I tune temperature or top-p, rarely both at once, because their effects
    compound. Token limits work at two levels. The context window bounds input plus output. Max output tokens
    caps the response, which controls cost and latency directly, since output tokens are slower and pricier than
    input tokens, but set too tight it truncates mid-sentence or mid-JSON, so I pair it with stop sequences and
    instructions on length. My defaults: temperature 0 to 0.2 for extraction, classification, structured output,
    code and RAG answers, where faithfulness matters more than variety, and around 0.7 for drafting and
    brainstorming. And I never assume that temperature 0 means deterministic: batching and floating-point
    effects still vary outputs, which is why on ValidAIte and QMentisAI we test behaviour across repeated runs
    instead of expecting identical strings.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating GenAI systems
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering
  - url: profile:skills/LLM Platforms
    source: resume
    why: OpenAI, Claude and Gemini

- id: iv1-hallucination
  topics: [interview, genai]
  questions:
  - What happens when an LLM hallucinates? How would you minimize it?
  - Why do large language models hallucinate?
  - How do you reduce hallucinations in an LLM application?
  - What causes LLM hallucination and how do you prevent it?
  keywords:
  - hallucinates
  - hallucinate
  - minimize hallucination
  - reduce hallucinations
  - causes hallucination
  - llm hallucination
  - prevent hallucinations
  - stop hallucinations
  answer: >-
    A hallucination is fluent, confident output that is not supported by the sources or by fact: an invented
    citation, a wrong number, a policy that does not exist. It happens because an LLM is trained to predict
    plausible next tokens, not to check truth, and nothing in plain decoding says I do not know. The usual
    triggers are a question outside what the model learned, retrieval that returned the wrong context or none,
    ambiguous prompts, long contexts where the relevant passage is buried in the middle, high temperature, and
    prompts that pressure the model to always answer. I minimise it in layers. Ground it: RAG over the
    authoritative sources, with retrieval tuned and measured, because most hallucinations in RAG systems begin as
    retrieval failures. Constrain it: instructions to answer only from the supplied context, an explicit
    permitted answer of not found, low temperature, and structured output validated against a schema. Make it
    cite: every claim linked to a passage, and a check that the cited passage actually supports the claim, with
    an entailment model or an LLM judge. Decompose it: smaller, verifiable steps instead of one long generation.
    Verify it: self-consistency across samples or a second verification pass for high-stakes answers, and human
    review where a mistake is expensive. Measure it: a groundedness metric in the evaluation set and on sampled
    production traffic. The surest way to avoid it is not to generate at all where you do not need to. The twin you are
    talking to answers only with curated answers or verbatim cited sentences, and says plainly when nothing on
    record covers a question. In clinical NLP the same principle held for me: every output traced back to the
    note it came from, because a clinician will not act on a number they cannot verify.
  evidence:
  - url: doc:Knowledge_Fabric
    source: resume
    why: Verbatim, cited evidence; nothing generated
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: Clinical NLP where every output must be traceable

- id: iv1-open-vs-proprietary
  topics: [interview, genai]
  questions:
  - How would you select between open-source and proprietary LLMs for an enterprise?
  - Should an enterprise use open-source or proprietary language models?
  - How do you choose between open-weight models and commercial model APIs for an enterprise?
  - What factors decide open-source versus closed LLMs?
  keywords:
  - open source and proprietary
  - open source or proprietary
  - open source versus closed
  - proprietary llms
  - proprietary
  - open weight
  - closed llms
  - commercial model apis
  answer: >-
    I decide on evidence from the enterprise's own task, not on leaderboards, across six criteria. Data and
    compliance first. If prompts carry patient data, personal data or regulated financial data, and the contract
    or the regulator does not allow it to leave, open-weight models self-hosted in the client's cloud account or
    on premises win by default, or a proprietary model through a private deployment with no data retention,
    such as Azure OpenAI or Amazon Bedrock. Quality on our task: I run a golden set of real cases through the
    candidates. Frontier proprietary models still lead on hard reasoning, long context and tool use; for
    classification, extraction, summarisation and routing, a well-chosen open model, sometimes fine-tuned, is
    often good enough. Total cost of ownership: APIs are pay per token with no idle cost; self-hosting means
    GPUs, MLOps engineers, patching, scaling and on-call, so I calculate the break-even with real traffic.
    Latency and control: self-hosting gives predictable latency, quantisation, LoRA adapters and version
    pinning, while APIs can change models under you. Licensing and risk: Apache 2.0 or MIT weights against
    community licences with usage limits, vendor indemnities, and concentration risk on one provider. And the
    roadmap: how fast the client can absorb better models as they arrive. The answer is usually a portfolio
    behind a model gateway, not a single choice: a frontier API for complex reasoning, smaller open models for
    high-volume or sensitive tasks, all behind one interface so a model can be swapped on evaluation results.
    My AgentBasedSystem has a provider-agnostic LLM layer that targets
    OpenAI, Azure OpenAI or Anthropic with the same code and falls back to rules when no model is configured,
    and CodeFabric runs with Anthropic, OpenAI, a local Ollama model, or no model at all.
  evidence:
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: Provider-agnostic LLM layer with a rule-based fallback
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Works with or without an LLM; any one provider; permissively licensed model weights
