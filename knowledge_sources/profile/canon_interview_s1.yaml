# Session 1 (technical depth, sections A to E) and "five questions never to
# skip" #1 and #3, answered the way Prashobh answers them.
# =============================================================================
#
# Same schema and rules as canon.yaml: first person, no claim without evidence,
# the first question is the interview question as asked, the rest are the ways an
# interviewer rephrases it. Keywords are precise multi-word cues, so these answers
# never take a question that belongs to an existing entry. Examples come only from
# his own record: Primera, Brane, TCS, Yash, Tech Mahindra, Qualizeal, and his
# public repositories. Client names stay confidential.
#
