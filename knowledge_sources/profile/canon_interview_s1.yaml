- id: iv1-secure-rag
  topics: [interview, rag-agentic]
  questions:
  - 20,000 documents, multiple departments, different permissions, frequent updates — design RAG so users only retrieve what they are authorized to see.
  - How would you design RAG for 20,000 documents across departments with different permissions and frequent updates?
  - How would you design a permission-aware RAG system so users only retrieve documents they are authorized to see?
  - How do you enforce document-level access control in RAG across departments?
  keywords:
  - authorized to see
  - authorised to see
  - permission aware
  - document level access control
  - document level permissions
  - different permissions
  - access control in rag
  - 20 000 documents
  - multiple departments
  diagram: assets/diagrams/iv1-permission-aware-rag.svg
  answer: >-
    The principle: authorisation is enforced at retrieval, inside the query, before the LLM sees anything. A
    model cannot leak a chunk it was never given, and prompt instructions are not access control. Ingestion with
    permissions attached. Connectors to each source sync the content and its access-control list together:
    which users and groups may read each document, from SharePoint or Confluence groups or a database's
    row-level rules. Every chunk inherits its document's ACL plus metadata: department, classification, owner,
    version and a content hash. These document-level permissions travel with the chunk into both the vector and
    the keyword index. Identity-aware retrieval. Users sign in through SSO; at query time I resolve their
    identity and group memberships from the identity provider, cached for a few minutes, and pass them as a
    mandatory filter. Metadata filtering happens inside the search, as a pre-filter, not by post-filtering the
    top results, which leaks through counts and starves recall. Deny by default: a chunk without a resolvable ACL
    is invisible. Tenant isolation. Departments with hard boundaries, such as HR, legal or finance, get separate
    indexes or namespaces and separate encryption keys, so a filter bug cannot cross them; shared content sits in
    a common index with filters. Caches, semantic caches included, are keyed by the user's permission set and
    never shared across it. Incremental indexing for frequent updates. Change feeds or webhooks drive the
    pipeline, content hashes skip unchanged documents, and only changed chunks are re-embedded. Permission-only
    changes update metadata without re-embedding and take priority, because a revoked permission must take
    effect in minutes. Deletions apply immediately, with a nightly reconciliation against each source to catch
    missed events. Auditability. Every request logs who asked, the groups used for filtering, the document and
    chunk IDs retrieved, the model and the answer, so security can always answer who saw what, and why.
    Retrieval evaluation. Beyond recall at five and MRR per department, I keep a leakage test set: users in each
    role ask questions whose answers live only in documents they must not see. The pass mark is zero leaked
    chunks, and it gates every deploy, together with a test that a revoked user stops seeing a document. I have
    applied these ideas at small scale: Knowledge Fabric masks confidential client names at build time so they
    never reach the index, and every deploy is gated on its test sets; CodeFabric re-indexes incrementally by
    content hash. And as I have written, a company's knowledge layer needs access control and provenance as much
    as it needs search.
  evidence:
  - url: profile:posts/ontology and knowledge layer
    source: linkedin
    why: The knowledge layer needs access control and provenance as much as search
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Incremental indexing by content hash
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Build-time masking of confidential names; deploys gated by test sets

# ----------------------------------------------------------------------------- E. Testing and evaluation of AI
- id: iv1-rag-evaluation
  topics: [interview, evaluation]
  questions:
  - How do you evaluate the quality of a RAG system?
  - What metrics do you use to measure RAG quality?
  - How would you measure whether a RAG pipeline is working well?
  - How do you test a retrieval-augmented generation system?
  keywords:
  - quality of a rag
  - rag quality
  - rag metrics
  - evaluate a rag
  - measure rag
  - rag evaluation
  - test a retrieval augmented
  - rag pipeline is working
  answer: >-
    In three layers, offline and online, because a RAG system can fail at retrieval, at generation, or in the
    experience around them. Retrieval quality: on a golden set of real questions with known source passages, I
    measure recall at k, whether the right passage came back in the top five or ten; MRR and nDCG, how high it
    ranked; and context precision, how much of what we sent was relevant. For permissioned systems, a leakage
    test that must stay at zero. Generation quality: faithfulness or groundedness, whether every claim is
    supported by the retrieved context; answer relevance, whether it addresses the question; correctness against
    a reference answer or a rubric of must-have points; citation accuracy; and correct abstention when the
    context does not contain the answer. I score with a mix of deterministic checks, frameworks such as RAGAS,
    and an LLM judge whose verdicts I calibrate against human labels before I trust it. End to end and in
    production: task success, user feedback, escalation and no-answer rates, latency and cost per answer, and
    sampled human review, with production failures fed back into the golden set. Every change, a new chunking
    scheme, embedding model, prompt or LLM, runs against the same sets in CI, and a regression blocks the
    release. That is how I run my own system. Knowledge Fabric has a retrieval gold set scored on recall, MRR
    and nDCG in lexical, semantic and hybrid modes, and CI fails the deploy if hybrid recall at five drops below
    0.70 or MRR below 0.55. Above that, over 1,400 questions run through the real answer path on every deploy.
    And on our AI-testing platforms at Qualizeal, ValidAIte and QMentisAI, this kind of layered evaluation is
    what the platforms are built for.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Retrieval gold set with recall, MRR and nDCG per mode; CI fails on regression
  - url: profile:engagements/ValidAIte
    source: resume
    why: Platform for testing and validating AI and GenAI systems
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering

- id: iv1-retrieval-vs-generation
  topics: [interview, evaluation]
  questions:
  - What is the difference between retrieval quality and generation quality?
  - How do you tell whether a bad RAG answer is a retrieval problem or a generation problem?
  - Retrieval quality versus generation quality, how do you measure each?
  - How do you separate retrieval failures from generation failures in RAG?
  keywords:
  - retrieval quality
  - generation quality
  - retrieval problem
  - generation problem
  - retrieval failures
  - generation failures
  answer: >-
    Retrieval quality asks whether the system found the right evidence. Generation quality asks whether the
    model used that evidence well. They fail for different reasons, so I measure them separately. Retrieval
    quality is a search problem: given the question, are the right passages in the top k and ranked high, and is
    the context free of noise. The metrics are recall at k, precision at k, MRR, nDCG, context precision and
    context recall, and the fixes live in parsing, chunking, embeddings, hybrid search, filters and reranking.
    Generation quality is a reasoning and instruction-following problem: given the context, is the answer
    faithful to it, relevant to the question, complete, correctly cited and in the required format, and does it
    abstain when the context does not hold the answer. The metrics are faithfulness or groundedness, answer
    relevance, correctness against a reference and citation accuracy, and the fixes live in the prompt, the
    choice of model, the ordering of the context and the output constraints. To diagnose a bad answer I look at
    the retrieved context first. Right context, wrong answer: a generation problem. Wrong context: a retrieval
    problem, and no prompt will fix it. A useful trick is to run the generator with oracle context, the gold
    passages, which shows the ceiling generation can reach, and to score retrieval alone against the gold
    passages, which shows the ceiling of the whole system. Knowledge Fabric keeps the two apart the same way: its
    retrieval gold set measures recall, MRR and nDCG per retrieval mode, while the question sets check the
    answer a visitor actually receives.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Retrieval metrics per mode, separate from the answer-path question sets
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating GenAI systems

