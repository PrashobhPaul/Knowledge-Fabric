canon:
# ----------------------------------------------------------------------------- A. Experience and ownership
- id: iv1-complex-solution
  topics: [interview, experience]
  questions:
  - Walk me through the most complex AI solution you have architected. What was the business problem, architecture, technology stack and outcome?
  - What is the most complex AI solution you have architected?
  - Describe the most complex AI system you designed, from the business problem to the outcome.
  - Tell me about the most complex AI project you have architected end to end.
  keywords:
  - most complex ai solution
  - most complex ai system
  - most complex ai project
  - complex ai solution you
  - business problem architecture
  - technology stack and outcome
  answer: >-
    The most complex one I have designed and built is the clinical NLP platform behind the physician's
    note reader at Primera Medical Technologies. The business problem: a US hospital network needed every
    inpatient's notes read in real time, across more than sixty hospitals of at least a hundred beds each,
    so that diagnostics, clinical decision support and analytics could work from what clinicians actually
    wrote, not only from coded fields. The constraints shaped everything: regulated patient data, so privacy
    was non-negotiable; two EMR families, Epic and Meditech, with records arriving as HL7, FHIR and MAR
    medication records; and clinicians who will not act on a number they cannot trace back to the note.
    The architecture had six layers. Ingestion consumed the HL7 and FHIR streams and collated physician
    notes, nursing notes and medication records into one view per patient. Clinical NLP handled the hard
    language: abbreviations, negation, and the same drug or condition written many ways. Ontology mapping
    resolved every mention to SNOMED, LOINC and ICD-10 concepts, and that was the backbone, because once
    mentions are standard concepts, notes from different hospitals and formats can be joined. A per-patient
    relationship graph linked conditions, medications, labs and events. Real-time analytics and predictive
    models for patient outcomes sat on the graph. And the note reader surfaced each finding with the record
    it came from. The stack: NLP and machine-learning pipelines in Python, HL7 and FHIR interfaces to Epic
    and Meditech, the SNOMED, LOINC and ICD-10 terminologies, OCR tools for EOBs and diagnostic documents,
    and predictive models on top. Many small, separately tested NLP and ML components, not one big model.
    The outcome: the note reader ran in production across more than sixty US hospitals, clinical NLP on
    that volume of data done for the first time. The lesson I carry into GenAI work is that the model was
    never the hard part. Reliability across many small components, a shared vocabulary of concepts, and
    traceability from every output back to its record were. The same shape shows up in my agentic work at
    Qualizeal today, where the knowledge layer under the agents matters more than the agents themselves.
  evidence:
  - url: profile:career_projects/Medical Note Reader
    source: resume
    why: Real-time medical note reader deployed across 60+ US hospitals
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: EMR pipelines for Epic and Meditech, HL7/FHIR at scale, predictive models for patient outcomes
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: The note reader in his words, SNOMED, LOINC, ICD-10 and relationship graphs
  - url: doc:Career_In_Depth
    source: resume
    why: Primera in depth

- id: iv1-contributions
  topics: [interview, experience]
  questions:
  - What were your personal contributions versus what your engineering team delivered?
  - What did you personally build, and what did your team deliver?
  - Which parts were your own contribution and which were the team's?
  - How much of the delivery was yours versus your engineering team's?
  keywords:
  - personal contributions
  - personal contribution
  - personally build
  - personally built
  - your team deliver
  - team delivered
  - own contribution
  - versus your engineering team
  - do personally
  - you do personally
  answer: >-
    I keep that line explicit, because an architect who cannot say what he personally built is a presenter.
    On the clinical platform at Primera my own contribution was the NLP core: the pipeline that read the notes,
    the handling of clinical abbreviations and negation, the normalisation of the many ways a drug or condition
    gets written, the mapping of every mention to SNOMED, LOINC and ICD-10, and the per-patient relationship
    graph the analytics ran on. I was the pillar of the NLP team for AI and advanced analytics there.
    Integration with the hospitals' EMR systems and the rollout across them were team efforts that I contributed
    to, not things I did alone. At Qualizeal the split is similar. I lead the architecture of our agentic
    client solutions and work hands-on on our AI-testing platforms, ValidAIte and QMentisAI, and I write a
    good part of the implementation myself: the orchestration design, the evaluation and guardrail approach, and the pieces
    where a wrong call is expensive. The engineers, including the interns and freshers I mentor in the AI
    Center of Excellence, build out features on the patterns I set, and I review what they ship. My public
    repositories, Knowledge Fabric, CodeFabric, CogniFlow and the rest, are my own design and build end to
    end, which is why I point interviewers to them: the code shows what I can do without a team behind me.
    What I never do is present a number or an outcome the team produced as if it were mine alone, and I give
    credit by name when I talk about a delivery.
  evidence:
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: The pillar of the NLP team at Primera; the note reader work
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading and contributing hands-on across internal platforms and client solutions
  - url: doc:Career_In_Depth
    source: resume
    why: Designs and implements; mentors the interns and freshers of the AI CoE
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Public code he designed and built

- id: iv1-architecture-decision
  topics: [interview, experience]
  questions:
  - What was the biggest architectural decision you made, and what alternatives did you reject?
  - What is the most important architecture decision you have made, and what did you reject?
  - Tell me about a major architectural decision and the alternatives you rejected.
  - Which design alternatives did you reject in your biggest architecture call?
  keywords:
  - biggest architectural decision
  - architectural decision
  - alternatives did you reject
  - alternatives you rejected
  - alternatives did you
  - did you reject
  - most important architecture decision
  - biggest architecture call
  answer: >-
    The decision I would defend in any review is the one at the heart of Knowledge Fabric: no text is generated
    at answer time. Every answer is either a curated answer in my own words, whose evidence links must resolve
    to real records at build time or the build reports them, or verbatim sentences retrieved and cited from the
    sources, with an honest no-answer when nothing on record covers the question. The alternatives I rejected
    were the obvious ones. First, the standard RAG stack: a vector database, an LLM writing fluent answers, an
    API key and a backend. For a system that speaks about a real person, one confident invented fact costs more
    trust than a hundred good answers earn, and the running cost and key management never end. Second, a
    transformer embedding model shipped to the browser at the start: a payload of more than 20 MB broke the
    zero-cost static constraint, so semantic retrieval began as LSA over TF-IDF, 0.4 MB of int8 vectors, and
    MiniLM sentence embeddings came later, precomputed in the build. Third, retrieval alone: early answers were
    cited but read like collages, so I put the curated layer on top. What I gave up is real: no free-form
    answers to questions nobody anticipated, and curation work for every new topic. What I gained is a
    deterministic system, the same files in and the same index out, so the quality gates mean something: over
    1,400 questions run on every deploy and the build fails when an answer regresses. In enterprise work the
    equivalent call was at Primera, where mapping every mention to standard ontologies, SNOMED, LOINC and
    ICD-10, rather than matching text hospital by hospital, is what let notes from sixty hospitals be joined
    and reasoned over. The pattern is the same: choose the boring, verifiable foundation, then add intelligence
    on top of it.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: 'Design decisions: deterministic build, LSA instead of an in-browser transformer, no backend or API keys'
  - url: doc:Knowledge_Fabric
    source: resume
    why: BM25, LSA and MiniLM; fully static, no vector database
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Ontology mapping at Primera

- id: iv1-failure
  topics: [interview, experience]
  questions:
  - Tell me about an AI implementation that failed or underperformed. What went wrong?
  - Describe an AI project of yours that underperformed and what went wrong.
  - Have you had an AI implementation fail? What went wrong?
  - Tell me about a time an AI system of yours did not perform as expected.
  - What was your biggest failure?
  keywords:
  - biggest failure
  - your biggest failure
  - failed or underperformed
  - underperformed
  - underperform
  - that failed
  - implementation fail
  - what went wrong
  - did not perform as expected
  - not perform as expected
  answer: >-
    Two, and I learned more from them than from the successes. The first was at Brane Enterprises. An object
    detection system's accuracy had dropped from 86 to 76 percent when the label set grew from 80 to 120
    classes, and it was assigned to me. What went wrong is a classic: the class space was expanded without
    re-validating the data and the model together. The off-the-shelf YOLO weights were weak on Indian scenes,
    the new classes were visually close to existing ones, and I had never trained custom weights. Rather than
    fight only at the bounding-box level, I brought my NLP side in: scene descriptions, text tagging of images
    and a custom word2vec layer, so the model could use context, what usually appears together, to separate
    similar classes. It reached 89.5 percent, above where it started. The lesson: when the label space
    changes, re-baseline everything, and check that the data represents where the model will actually run.
    The second is my own Knowledge Fabric. The first version answered by stitching retrieved sentences
    together. Every sentence was cited, yet the answers read like collages, and a question about one employer
    could pull in a sentence about another. Then I wrote two new rounds of questions and ran them untuned, as
    held-out checks, and the matcher scored 81 and 78 percent, far below the perfect scores on the sets I had
    tuned against. I had overfitted to my own test set. The fixes were a curated answer layer with evidence
    resolved at build, guards so one employer's question is never answered from another employer's record, an
    honest no-answer, and a habit I now insist on everywhere: keep a held-out set you have not tuned on. In
    both cases the model was not the root cause; the evaluation was. That is why evaluation design is the first
    thing I review on any AI program today.
  evidence:
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: 'Object detection: 86 to 76 percent after 80 to 120 classes, recovered to 89.5 with a hybrid NLP approach'
  - url: profile:roles/Brane Enterprises
    source: resume
    why: Real-time object detection systems at Brane
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: 'Held-out rounds first run untuned: 81 and 78 percent; employer guards in the integration test'

- id: iv1-rebuild
  topics: [interview, experience]
  questions:
  - If you had to rebuild your most successful AI solution today, what would you change?
  - How would you rebuild your most successful AI system with today's technology?
  - What would you do differently if you rebuilt your best AI solution now?
  - If you rebuilt the physician's note reader today, what would you change?
  keywords:
  - rebuild your most successful
  - most successful ai
  - rebuild
  - rebuilt
  - do differently
  - rebuild your most
  answer: >-
    My most successful AI solution by reach is the physician's note reader, in production across more than
    sixty US hospitals. If I rebuilt it today I would keep the backbone and change most of what is around it.
    What I would keep: mapping every mention to SNOMED, LOINC and ICD-10. Standard concepts are what let notes
    from different hospitals be joined, and an LLM does not remove that need; it makes it more important,
    because a free-text answer you cannot map is a free-text answer you cannot audit. What I would change.
    First, extraction: many of the hand-built pieces for abbreviations, negation and spelling variants would
    become a smaller set of models, a fine-tuned open model or an LLM with constrained, schema-validated output,
    with the ontology step still deciding the final concept. Second, privacy by architecture: de-identification
    before any model call, and for patient data, open models self-hosted inside the hospital's boundary rather
    than notes sent to an external API. Third, evaluation first: a clinician-labelled golden set with precision
    and recall per concept type, gating every model or prompt change, plus a held-out set nobody tunes on.
    Fourth, FHIR-first ingestion driven by change events, so each patient's record updates incrementally.
    Fifth, observability: a trace from each finding back to the sentence it came from, a confidence on every
    extraction, and a human review queue for the low-confidence ones. Sixth, a retrieval layer so clinicians
    can ask questions in plain language and get answers cited to the source note, the way Knowledge Fabric
    answers about me. What I would not do is replace the whole pipeline with one large model. The small,
    testable pieces were why it was reliable; the rebuild would make them fewer and smarter, not invisible.
  evidence:
  - url: profile:career_projects/Medical Note Reader
    source: resume
    why: Deployed across 60+ US hospitals
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: The note reader and its ontology mapping
  - url: doc:Knowledge_Fabric
    source: resume
    why: Cited answers with lineage, the pattern he would add

- id: iv1-draw-complex
  topics: [interview, experience]
  questions:
  - Draw the most complex AI solution you have personally architected; explain every component and why.
  - Draw the architecture of your most complex project.
  - Can you draw the architecture of your most complex AI solution?
  - Walk me through the architecture of your most complex solution, component by component.
  keywords:
  - draw the architecture
  - draw the most complex
  - architecture of your most complex
  - architecture of the most complex
  - most complex project
  - personally architected
  - explain every component
  - every component and why
  - component by component
  diagram: assets/diagrams/iv1-clinical-nlp-platform.svg
  answer: >-
    Here is the clinical NLP platform behind the physician's note reader at Primera, drawn as six layers, top
    to bottom, with each component and the reason it exists. One, EMR sources: Epic and Meditech across more
    than sixty hospitals, arriving as HL7 messages, FHIR resources and MAR medication records. Why: you design
    for the formats you actually receive, so every format needed its own parser before anything downstream saw
    it. Two, ingestion and per-patient collation: physician notes, nursing notes and medication records brought
    together for each patient. Why: clinical meaning sits across documents; a medication in the MAR explains a
    phrase in a nursing note. Three, clinical NLP: abbreviations, negation, and normalisation of the many ways
    a drug or condition is written. Why: a phrase such as no evidence of pneumonia must never be read as
    pneumonia. These were many small, separately tested components rather than one model, so a failure could
    be found and fixed in isolation. Four, ontology mapping to SNOMED, LOINC and ICD-10. Why: this is the
    backbone. Once every mention is a standard concept, notes from different hospitals, systems and formats can
    be joined, counted and reasoned over. Five, the per-patient relationship graph linking conditions,
    medications, labs and events. Why: real-time analytics and the predictive models for patient outcomes need
    relationships, not isolated entities. Six, real-time analytics and the note reader itself, where each
    finding traces back to its source. Why: a clinician will not act on a number they cannot verify. Around all
    six sat privacy and access control for regulated patient data, which was non-negotiable. If you want the
    GenAI-era system I personally architected end to end and can show in public code, it is Knowledge Fabric:
    a factory that syncs the sources and masks confidential client names, a build that chunks and indexes BM25,
    LSA and MiniLM vectors and a typed knowledge graph, curated answers whose evidence must resolve, hybrid
    retrieval fused with reciprocal rank fusion, and test sets that gate every deploy. The principles are the
    same in both: a standard vocabulary, traceability, and evaluation as a component, not an afterthought.
  evidence:
  - url: profile:career_projects/Medical Note Reader
    source: resume
    why: The note reader across 60+ US hospitals
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Epic, Meditech, HL7, MAR, SNOMED, LOINC, ICD-10, relationship graphs, real-time analytics
  - url: profile:career_projects/EHR Parser
    source: resume
    why: Structured extraction from HL7-encoded clinical streams
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: The architecture he built end to end, in public code

# ----------------------------------------------------------------------------- B. Traditional AI and ML
- id: iv1-ml-vs-llm
  topics: [interview, ml]
  questions:
  - When would you choose traditional ML over an LLM-based solution?
  - When is classical machine learning a better choice than an LLM?
  - Why not just use an LLM for everything instead of traditional ML?
  - How do you decide between traditional machine learning and a large language model?
  keywords:
  - traditional ml
  - traditional machine learning
  - classical machine learning
  - classical ml
  - llm based solution
  - instead of traditional
  answer: >-
    Whenever the problem is structured, high-volume or regulated, and the output is a number or a label. That
    covers most of what I built in BFSI at Yash Technologies: fraud detection, loan eligibility and credit
    scoring run on tabular data, where gradient-boosted trees or logistic regression are usually more accurate
    than an LLM, answer in milliseconds, cost almost nothing per prediction, and give reasons a risk team and a
    regulator can follow. Forecasting, churn, anomaly detection on transactions or sensors, recommendations and
    optimisation are the same story. I choose traditional ML when I have labelled data and a clear target
    metric, when latency must be in milliseconds at scale, when every decision must be explainable and
    reproducible, when the cost per prediction must be near zero, and when the data is numbers and categories
    rather than language. An LLM earns its place when the input is unstructured language, the output has to be
    generated, the task varies too much to label, or there is no training data and you need zero-shot ability.
    The best designs often combine them: a language model turns text into features, and a classical model makes
    the decision. My stock-analysis pipeline does exactly that. FinBERT classifies news headlines, that score
    is one weighted input to rule-based and statistical scoring, and if the model fails to load the pipeline
    falls back to keyword sentiment instead of crashing. At TCS, ticket classification for Ultimatix was a
    supervised multi-class problem, not a generative one. Using an LLM where a classifier will do is the most
    common cost mistake I see.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud detection, loan eligibility and credit scoring models for BFSI clients
  - url: https://github.com/PrashobhPaul/StockAnalysis_IndianMarket
    source: github
    why: FinBERT for news only, a weighted sub-score, with a rule-based fallback
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Multi-class classification for Ultimatix at TCS

- id: iv1-ml-task-types
  topics: [interview, ml]
  questions:
  - Explain the difference between classification, regression, clustering and anomaly detection, with enterprise use cases.
  - What is the difference between classification and regression, and where do clustering and anomaly detection fit?
  - Give enterprise use cases for classification, regression, clustering and anomaly detection.
  - How do classification and regression differ from clustering and anomaly detection?
  keywords:
  - classification regression clustering
  - classification and regression
  - clustering and anomaly detection
  - anomaly detection
  - clustering
  - regression
  - enterprise use cases
  answer: >-
    Classification and regression are supervised: you learn from labelled examples. Classification predicts a
    discrete class, regression a continuous number. Clustering, and most anomaly detection, is unsupervised:
    there is no label, and you look for structure, or for the points that do not fit it. Classification answers
    which bucket. From my own work: fraud or genuine, and approve or decline a loan, at Yash Technologies;
    routing tickets into categories, the multi-class Ultimatix problem I worked on at TCS; sentiment of customer
    interactions. I judge it with precision, recall, F1 and PR-AUC. Regression answers how much: credit limits,
    expected loss, demand and revenue forecasts, delivery times, patient length of stay. Metrics are MAE, RMSE
    and MAPE, and I prefer MAE when the business thinks in absolute units, because RMSE punishes outliers
    heavily. Clustering answers which items naturally belong together, with no labels: customer segmentation,
    grouping support tickets to discover new categories, and topic modelling over documents, which I built for
    enterprise knowledge management at Yash. K-means, hierarchical clustering or HDBSCAN on embeddings, judged
    by silhouette scores and, more honestly, by whether the business can act on the segments. Anomaly
    detection answers what is unusual: new fraud patterns, network intrusions, sensor faults, unusual claims.
    Isolation forests, autoencoders or statistical baselines, used where labels are rare or the pattern is new.
    In practice they work together: a supervised fraud classifier catches the known patterns, an anomaly
    detector catches the new ones, and clustering the flagged cases tells analysts which new pattern is
    emerging.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud, credit and risk models; topic modelling and semantic search for knowledge management
  - url: profile:roles/Tata Consultancy Services
    source: resume
    why: Sentiment analysis and text classification over millions of customer interactions
  - url: profile:skills/Domain Knowledge
    source: resume
    why: Fraud detection, credit scoring, risk modelling

- id: iv1-class-imbalance
  topics: [interview, ml]
  questions:
  - How would you handle class imbalance in a production classification system?
  - How do you deal with imbalanced classes in production?
  - What techniques do you use for a highly imbalanced dataset like fraud?
  - How do you train a classifier when the positive class is rare?
  - Why is accuracy misleading on imbalanced data?
  keywords:
  - class imbalance
  - imbalanced classes
  - imbalanced dataset
  - imbalanced
  - imbalance
  - positive class is rare
  - minority class
  - smote
  answer: >-
    First I make sure we measure the right thing. With fraud at well under one percent of transactions,
    accuracy is meaningless, so I report precision, recall, PR-AUC and, above all, the business cost of each
    type of error, with a confusion matrix at the operating threshold. Then I work at four levels. Data:
    stratified splits, and time-based validation so the test set is the future rather than a shuffle of the
    past. Resampling where it helps, undersampling the majority class, oversampling, or SMOTE, applied only to
    the training folds, never to validation or test, or the metrics lie. Algorithm: class weights or a
    cost-sensitive loss, scale_pos_weight in gradient boosting, focal loss for neural models. In my experience
    reweighting is usually as good as resampling and simpler to keep correct. Decision: the threshold is a
    business decision, not 0.5. I choose it on the precision-recall curve against the cost of a missed fraud
    versus the cost of blocking a genuine customer, and I calibrate the probabilities, because resampling
    distorts them. Often the answer is tiers: block, step-up verification, review queue. Production: the base
    rate drifts, so I monitor the predicted-positive rate, the precision of the review queue, and recall on
    labels as they mature, which in fraud means chargebacks weeks later, and analyst decisions flow back into
    training. For very rare or new patterns I add an anomaly detector beside the classifier. This is the
    trade-off I worked in BFSI at Yash Technologies: a fraud model has to balance catching fraud against
    blocking genuine customers, and that balance is set with the risk team, not by the data scientist alone.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud detection and credit scoring for BFSI clients
  - url: profile:skills/Domain Knowledge
    source: resume
    why: Fraud detection, credit scoring, risk modelling

- id: iv1-drift
  topics: [interview, ml]
  questions:
  - How do you identify and manage data drift and concept drift?
  - What is the difference between data drift and concept drift, and how do you detect them?
  - How do you monitor a production model for drift?
  - How would you detect that the relationship between inputs and outcomes has changed?
  keywords:
  - data drift
  - concept drift
  - model drift
  - drift
  - covariate shift
  - relationship between inputs and outcomes
  answer: >-
    Data drift is a change in the input distribution, P of X: new customer segments, a new product, an upstream
    field that changed meaning. Concept drift is a change in the relationship between inputs and the target, P of
    Y given X: a transaction pattern that used to be genuine is now fraud because fraudsters adapted. Data drift
    can show on day one; concept drift usually shows only when labels arrive. To identify them I monitor three
    layers. Inputs: per-feature tests against a reference window, the stability index PSI over binned
    distributions, where I treat above 0.1 as a warning and above 0.25 as significant, Kolmogorov-Smirnov for continuous features and
    chi-square for categorical ones, plus data-quality checks on nulls and schemas, because a lot of apparent
    drift is a broken pipeline. Outputs: the distribution of predictions and confidence scores, which moves
    before accuracy does. Outcomes: precision, recall or error on labelled data as it arrives, by segment, and
    business KPIs such as approval rates or chargebacks. To manage them: alerts with owners and thresholds, a
    root-cause step before any retraining, scheduled retraining on rolling windows where drift is expected,
    triggered retraining when performance crosses an agreed tolerance, and champion-challenger or shadow
    evaluation before promotion. For fast, adversarial concept drift, as in fraud, I add recency weighting and
    faster feedback from analysts. LLM systems drift too, because the questions people ask change. In Knowledge
    Fabric every answer leaves a trace, a weak answer can be flagged, and a curator job re-asks every flagged
    question against the freshly synced sources each week, which is drift detection on the question mix.
  evidence:
  - url: profile:roles/Yash Technologies
    source: resume
    why: Production fraud, credit and risk models
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Traces, flags and the weekly curator that re-asks flagged questions

- id: iv1-retraining
  topics: [interview, ml]
  questions:
  - How would you determine whether a model needs retraining?
  - How do you decide when to retrain a model?
  - What signals tell you a production model should be retrained?
  - When is retraining a model actually necessary?
  keywords:
  - needs retraining
  - retraining
  - retrain
  - retrained
  - when to retrain
  answer: >-
    Retraining is a decision with evidence, not a calendar habit. I look for four signals. One, performance
    against an agreed tolerance: recall, precision or error on recent labelled data, by segment, compared with
    the baseline the model was approved on. If the drop is beyond the tolerance we set with the business, it is
    a candidate. Two, drift that matters: stability tests on the features with the highest importance, and a
    shift in the prediction distribution. Drift on an unimportant feature is a note, not a retrain. Three,
    business signals: approval rates, chargebacks, complaints or escalations moving while the model's own
    metrics look fine, which usually means the labels or the objective have changed. Four, a change in the
    world or the data contract: a new product, a new region, a new regulation, a new upstream system. Before
    retraining I find the cause. A broken pipeline, a renamed field or a label delay looks exactly like drift,
    and retraining on bad data makes the problem permanent. If it is real, I train a challenger on recent data,
    evaluate it on a time-based holdout and on the same golden set as the champion, run it in shadow, and
    promote it only if it wins on the business metric without regressing anywhere else. My stock-analysis
    pipeline applies the same discipline to signals: a stock appears only if its signals cleared a 60 percent
    hit rate in a three-year walk-forward backtest on its own history, with no look-ahead. A model, like a
    signal, has to keep proving itself on data it has not seen.
  evidence:
