- id: iv1-chunking
  topics: [interview, rag-agentic]
  questions:
  - How would you select chunk size and overlap?
  - What chunk size do you use for RAG?
  - How do you decide chunk overlap for embeddings?
  - What is your chunking strategy for documents in RAG?
  keywords:
  - chunk size
  - chunk overlap
  - chunking strategy
  - chunking
  - chunk sizes
  - size and overlap
  answer: >-
    By experiment, not by convention, but I start from sensible defaults and from the structure of the content.
    Three things set the range. The embedding model: many sentence-embedding models were trained on short
    passages and truncate their input, MiniLM at 256 word pieces for example, so a 2,000-token chunk is partly
    invisible to them. The questions: factoid questions want small, precise chunks; questions about procedures
    or reasoning want larger ones. The documents: policies, contracts, code and slide decks each have a different
    natural unit. My starting point for prose is 300 to 500 tokens with 10 to 15 percent overlap, so a sentence
    that straddles a boundary still lands whole in one chunk. Overlap beyond about 20 percent mostly buys
    duplicate hits and a bigger index. Structure beats size. I split on headings, sections and paragraphs first
    and only cut what is still too long, keep tables whole with their headers, and prefix each chunk with its
    document title and section path so it carries its context. For code I chunk on the syntax tree: CodeFabric
    uses structure-aware chunking so a function is never sliced in half, and Knowledge Fabric labels every chunk
    by kind: prose, table, header or fragment. For long documents I often use
    small-to-big retrieval: match on small chunks for precision, then pass the enclosing section, the parent, to
    the model for context. Then I measure. On a set of real questions with known source passages I compare two
    or three configurations on recall at five and MRR, plus answer faithfulness, and pick the winner. Chunking
    is cheap to change before launch and expensive after it, because a change means re-embedding everything.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Structure-aware (cAST) chunking along the syntax tree
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Typed chunks and a retrieval gold set scored on recall and MRR

- id: iv1-dense-sparse
  topics: [interview, rag-agentic]
  questions:
  - What is the difference between dense retrieval, sparse retrieval and hybrid search?
  - Dense versus sparse retrieval, when do you use which?
  - Why use hybrid search instead of only vector search?
  - How does BM25 compare with embedding-based retrieval?
  keywords:
  - dense retrieval
  - sparse retrieval
  - hybrid search
  - vector search
  - bm25
  - dense versus sparse
  - dense and sparse
  - embedding based retrieval
  answer: >-
    Sparse retrieval represents text as weighted terms over the vocabulary, mostly zeros, and matches on shared
    words: TF-IDF and BM25 over an inverted index, or learned sparse models such as SPLADE. It is fast, needs no
    training, explains itself, and is excellent for exact terms: names, product codes, error messages, clause
    numbers, acronyms. It fails on paraphrase: a search for car repair will not find automobile maintenance.
    Dense retrieval encodes the query and the passages into embedding vectors with a bi-encoder and finds the
    nearest neighbours by cosine similarity, using an approximate index such as HNSW. It understands meaning and
    paraphrase, works across languages, and copes with vague questions. It is weaker on exact identifiers and
    rare terms, can be confidently wrong out of domain, and needs an embedding model, a vector store, and
    re-embedding whenever the model changes. Hybrid search runs both and fuses the result lists, usually with
    reciprocal rank fusion, where each document scores the sum of one over sixty plus its rank in each list, or
    with normalised, weighted scores. Because their failure modes are different, hybrid is more robust than
    either alone, and in enterprise corpora full of codes and jargon I treat it as the default, not an option.
    That is how my own systems retrieve. Knowledge Fabric fuses BM25, LSA and MiniLM sentence embeddings with
    reciprocal rank fusion at k equal to 60, and its evaluation harness reports recall, MRR and nDCG per mode,
    lexical, semantic and hybrid, so the uplift of hybrid over lexical is measured, not assumed. CodeFabric does
    the same for code, with code-aware tokenisation so that getUserById matches get user by id.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: BM25 plus LSA, Reciprocal Rank Fusion with k = 60, metrics per retrieval mode
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Field-boosted BM25 and dense embeddings merged with RRF; code-aware tokenisation
  - url: doc:Knowledge_Fabric
    source: resume
    why: BM25, LSA and MiniLM sentence embeddings

- id: iv1-reranking
  topics: [interview, rag-agentic]
  questions:
  - When would you use reranking?
  - What is a cross-encoder reranker and when is it worth it?
  - Why add a reranking step to a RAG pipeline?
  - When is reranking not worth the latency?
  keywords:
  - reranking
  - reranker
  - rerank
  - re ranking
  - re ranker
  - cross encoder
  - reranking step
  answer: >-
    When precision at the top of the list matters more than the extra latency, which in RAG is most of the
    time. The pattern is two-stage. First-stage retrieval, BM25 and a bi-encoder, is fast because the query and
    the documents are encoded separately, so it is built for recall: get the right passage somewhere in the top
    50 or 100. A reranker, usually a cross-encoder, reads the query and each candidate together, so it can judge
    real relevance, and reorders them so that the best three to five go to the LLM. You get better answers,
    fewer distracting passages and fewer context tokens. I add reranking when the corpus is large or noisy, when
    hybrid fusion mixes candidates from different retrievers, when the answer depends on the top few passages,
    when near-duplicates compete, such as versions of the same policy, and when I want to cut the context sent to
    the model. I skip it when the corpus is small and first-stage recall at three is already high, when the
    latency budget is tight, since a cross-encoder over 50 pairs adds tens to a few hundred milliseconds
    depending on the model and the hardware, or when cost matters more than the last points of precision. An
    LLM as a reranker is the most accurate and the most expensive option, so I keep it for low-volume,
    high-value queries. The decision is made on numbers: MRR, nDCG and answer quality with and without the
    reranker on the golden set. That is why reranking sits on the roadmap of both my retrieval projects,
    CodeFabric and Knowledge Fabric, as a stage to be evaluated against the existing baseline rather than
    switched on by default.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: 'Roadmap: a cross-encoder reranking stage'
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: 'Roadmap: a transformer re-ranker evaluated against the LSA baseline with the existing harness'

- id: iv1-complex-documents
  topics: [interview, rag-agentic]
  questions:
  - How would you handle documents containing tables, images, diagrams and unstructured content?
  - How do you do RAG over PDFs with tables and images?
  - How do you index scanned documents, charts and diagrams for retrieval?
  - How do you handle multimodal documents in RAG?
  keywords:
  - tables images diagrams
  - tables and images
  - containing tables
  - scanned documents
  - multimodal documents
  - multimodal rag
  - pdfs with tables
  - charts and diagrams
  answer: >-
    I treat a document as a set of typed elements, not a stream of text, and give each type its own path into
    the index. First, layout-aware parsing: a parser that understands PDF and Office layout, reading order,
    headings, tables and figures, with OCR for scanned pages. Each element gets a type and a location: page,
    section and element ID. Tables: never split mid-table and never flatten into word soup. I keep each table
    whole with its caption and headers as one chunk, serialised as markdown or HTML so the model sees rows and
    columns, and for large tables I chunk by rows while repeating the header in every chunk. When people ask
    numeric questions across many tables, the better design is to load them into a database and answer with
    SQL, using retrieval to find the right table. Images, charts and diagrams: OCR for the text inside them, and
    a vision-language model to write a description, what the chart shows or what connects to what in a diagram,
    which is embedded as text and linked to the original image. At answer time a multimodal model can look at
    the image itself. Multimodal embeddings help image search, but text descriptions are easier to filter,
    evaluate and cite. Unstructured text: strip headers, footers and boilerplate, chunk along the structure, and
    attach metadata so every chunk knows where it came from. I have done versions of all of this. At Primera I
    worked on OCR tools for EOBs and diagnostic documents. At Brane the object detection fix was the same idea in
    reverse: describing images and scenes in words so that language methods could add context. Knowledge Fabric
    classifies chunks as prose, tables, headers and fragments. The rule is the same everywhere: retrieve the
    element, and cite the page it came from.
  evidence:
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: OCR tools for EOB and diagnostic insights
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Describing images and scenes with text tagging at Brane
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Typed records and chunks with provenance

- id: iv1-agent-vs-assistant
  topics: [interview, rag-agentic]
  questions:
  - Explain the difference between an AI agent, an AI assistant and a traditional workflow automation.
  - What makes something an AI agent rather than an AI assistant?
  - How is an AI agent different from workflow automation like RPA?
  - Agent, assistant or workflow automation, how do you decide which to build?
  - What separates an AI agent from an AI assistant and from workflow automation?
  keywords:
  - ai agent
  - ai assistant
  - workflow automation
  - traditional workflow
  - rpa
  - agent rather than
  - agent assistant or workflow
  - agentbasedsystem
  answer: >-
    The difference is who decides the next step. Traditional workflow automation, rule engines, BPM and RPA,
    follows steps a person designed in advance: if this, then that. It is predictable, cheap, fast and
    auditable, and it breaks the moment the input does not match the rules. Use it whenever the process is
    stable and the decisions are well defined, which is more often than the hype suggests. An AI assistant
    responds to a person: it answers, drafts and summarises, and may call a tool when asked, but the human drives
    each turn and owns every action. A copilot is an assistant. An AI agent is given a goal rather than a step.
    It plans, chooses tools, acts, observes the result and loops until the goal is met or it hits a limit, with
    state and memory along the way. That delegated autonomy is what makes it powerful and what makes it risky.
    They are a spectrum, and I place a system on it with two questions: how variable is the input, and how
    expensive is a wrong action. Low variability: workflow. High variability with a human owning every action:
    assistant. High variability, bounded actions and measurable outcomes: agent, with guardrails, step limits and
    a human checkpoint where mistakes are costly. In practice the best production agents are mostly workflow,
    with intelligence at the decision points. My AgentBasedSystem is built that way: a LangGraph state machine
    classifies the request and routes it to deterministic FAQ, recommender, calendar and registration agents,
    and calls an LLM only for fuzzy intent, falling back to rules if the model fails. For a major US airline we
    use Kiro for the same reason: it is spec-driven, so the agents work from an agreed specification and a team
    reviews each step.
  evidence:
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: LangGraph classify, route, node, end; deterministic agents with an optional LLM classifier
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Agentic AI for the SDLC with Kiro for an airline client
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems

- id: iv1-mcp-tools
  topics: [interview, rag-agentic]
  questions:
  - How do MCP, function calling and tool orchestration differ?
  - What is the Model Context Protocol and how is it different from function calling?
  - What is the difference between function calling and MCP?
  - How do you orchestrate tools for an LLM agent?
  keywords:
  - model context protocol
  - function calling
  - tool calling
  - tool orchestration
  - orchestrate tools
  - mcp server
  - mcp
  answer: >-
    They sit at three different layers. Function calling is a model capability. You describe tools with a name,
    a description and a JSON schema; the model decides a tool is needed and returns a structured call with
    arguments instead of text. Your code executes it and sends the result back. The model never runs anything
    itself, and each provider has its own format for it. MCP, the Model Context Protocol, is an open standard
    for connecting AI applications to tools and data. An MCP server exposes tools, resources and prompts over
    JSON-RPC, locally over standard input and output or remotely over HTTP, and any MCP-capable client can
    discover and use them. It solves the integration problem: write a connector once and every compliant
    assistant or agent can use it, instead of rebuilding it for every model and every app. Underneath, the client
    still relies on the model's function calling. Tool orchestration is the application logic above both: which
    tools to call, in what order or in parallel, with what state, retries, timeouts, budgets, permissions and
    human approvals, and how results flow between steps or agents. That is what LangGraph or the Microsoft Agent
    Framework provide, and where most of the engineering and most of the risk live. Put simply, function calling
    is the model asking, MCP is the standard socket, and orchestration is the conductor. I use all three. I built
    CogniFlow as an MCP server, so Claude hands it a description and CogniFlow compiles and renders the diagram,
    and CodeFabric exposes code search, symbol lookup, callers and impact analysis to agents over MCP. The rule I
    hold for every tool layer: least-privilege tools, authenticated servers, and nothing a model returns is
    executed as code without validation.
  evidence:
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: CogniFlow attached to Claude as an MCP server
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: MCP server exposing search, symbols, callers and impact analysis
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Microsoft Agent Framework and .NET

- id: iv1-agent-loops
  topics: [interview, rag-agentic]
  questions:
  - How would you prevent an agent from entering an infinite execution loop?
  - How do you stop an AI agent from looping forever?
  - What safeguards keep agents from getting stuck in loops?
  - How do you put limits on an autonomous agent's steps and cost?
  keywords:
  - infinite execution loop
  - infinite loop
  - looping forever
  - stuck in loops
  - stuck in a loop
  - step budget
  - recursion limit
  - limits on an autonomous agent
  answer: >-
    With hard limits the agent cannot argue with, plus a design that makes loops unlikely in the first place.
    Hard limits: a maximum number of steps or iterations per task, LangGraph's recursion limit being one form of
    it; a token and cost budget per run; a wall-clock timeout per run and per tool call; and a cap on retries per
    tool. When a limit is hit the agent stops and returns its best partial result, clearly marked as forced, or
    escalates to a human. It never just keeps going. Loop detection: track the history of actions and
    observations, and stop or re-plan when the same tool is called with the same arguments again and again, or
    when the state has not changed for several steps. Design: prefer an explicit graph with defined edges and a
    guaranteed path to the end over a free-form loop; give every task a clear completion condition and a
    structured way to say done or cannot be done; make tool errors informative so the agent does not retry
    blindly; and make tools idempotent so a retry is harmless. Observability: trace every step, and alert on
    runs that come close to the limits, because those are the tasks your design does not understand yet. My own
    agents follow this. In AgentBasedSystem the LangGraph state machine is classify, route, node, end, so every
    path terminates, and the LLM layer falls back to rules on any error or low confidence. In my research
    data-analyst agent, a planner and a coder investigate with SQL under a step budget, and the report records
    whether the agent concluded on its own or the budget forced the conclusion, so forced endings are visible in
    the evaluation instead of hidden.
  evidence:
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: classify, route, node, end; graceful fallback to rules
  - url: https://github.com/PrashobhPaul/JEV_Researchwork
    source: github
    why: 'Data-analyst agent: planner and coder under a step budget; concluded is false when the budget forced it'

- id: iv1-multi-agent
  topics: [interview, rag-agentic]
  questions:
  - When would you choose a multi-agent architecture over a single-agent architecture?
  - Single agent or multiple agents, how do you decide?
  - When does a multi-agent system make sense?
  - What are the trade-offs of multi-agent systems?
  keywords:
  - multi agent architecture
  - single agent architecture
  - multi agent system
  - multi agent systems
  - single agent or multiple
  - multiple agents
  - single agent
  answer: >-
    I start with a single agent with good tools, and move to multiple agents only when a specific limit forces
    it, because every extra agent adds tokens, latency, failure modes and testing effort. The reasons that
    justify multiple agents: distinct roles that need different instructions, tools, permissions or even
    models, such as a planner on a strong reasoning model and a coder on a cheaper one; a context window
    overloaded by too many tools or too much state, where splitting by responsibility makes each agent reliable
    again; work that can run in parallel; separation of duties, a maker and a checker, where one agent verifies
    another independently; and ownership, where different teams own different agents and need clean interfaces
    between them. The usual patterns are a supervisor routing to specialist workers, a fixed pipeline of agents
    with handoffs, or a hierarchy for large tasks. I prefer explicit orchestration with typed state over free
    conversation between agents, because it is easier to trace, test and bound. From my own work: the STLC
    solution for a global professional-services firm is naturally multi-agent, because requirements analysis,
    test design, test-case writing and automation are different roles with different inputs and checks, and it
    is built on the Microsoft Agent Framework and .NET. At Tech Mahindra I designed multi-agent orchestration for
    customer insights, digital reporting and automated decision-making. In my research data-analyst, a planner
    and a coder split the reasoning from the SQL. And my AgentBasedSystem is the counterpoint: several agents
    behind one router, yet most of them deterministic, because the problem did not need more intelligence than
    that.
  evidence:
