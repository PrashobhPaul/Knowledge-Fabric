  - hallucination testing
  - test for hallucinations
  - testing for hallucinations
  - test whether
  - is hallucinating
  answer: >-
    I test for it deliberately, with question types designed to provoke it, and I measure it as a rate, not as an
    anecdote. The test set has four kinds of cases. Answerable questions with known evidence, to check that every
    claim is supported. Unanswerable questions, whose answer is not in the sources, where the only correct
    behaviour is to say so. False-premise and leading questions, such as asking about a policy or a feature that
    does not exist. And conflicting or outdated sources, to see whether the model picks the right one and says
    when it is unsure. Scoring is claim-level. I split each answer into atomic claims and check each against the
    retrieved context with an entailment model or a calibrated LLM judge: supported, contradicted, or not found.
    That gives a groundedness score and a hallucination rate per category. I also check citations: does the
    cited passage actually contain the claim. Because outputs vary, I run each case several times and compare;
    claims that change between samples are a strong hallucination signal, which is the idea behind SelfCheckGPT.
    A sample goes to human reviewers to keep the automatic judge honest. All of it runs in CI as a regression
    gate, and the same checks run on sampled production traffic. The twin you are talking to is tested this way.
    Alongside the answerable questions, every one of its test sets has questions that must be declined, things
    not on record, private details, errands and off-topic trivia, and the build fails if any of them gets an
    answer instead of an honest decline. Testing what a system must not say matters as much as testing what it
    should.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Test sets with questions that must be declined honestly, run on every push
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI and GenAI systems

- id: iv1-eval-dataset
  topics: [interview, evaluation]
  questions:
  - How would you build an evaluation dataset?
  - How do you create a golden dataset for testing?
  - How many examples should an evaluation set have, and where do they come from?
  - What goes into a good golden set for LLM evaluation?
  keywords:
  - evaluation dataset
  - evaluation set
  - golden dataset
  - golden set
  - build an evaluation
  - ground truth
  answer: >-
    I build it like a product, with sources, coverage targets, labels and versions. Sources, in order of value:
    real user questions from logs or pilots; questions from subject-matter experts and support teams about what
    users actually ask and what goes wrong; past incidents and escalations; and synthetic questions generated by
    an LLM from the documents, useful for coverage but always reviewed by a person before they count. Coverage:
    I stratify by intent, user role, document type, difficulty and language, and I deliberately include the hard
    tail: paraphrases, typos, multi-part questions, follow-ups, unanswerable questions, false premises,
    prompt-injection attempts, and permission-boundary cases where the right answer is a refusal. Labels: for
    each case the expected behaviour, the gold source passages for retrieval metrics, and a rubric of must-have
    points rather than one exact reference answer, because a good answer can be phrased many ways. Size: 50 to
    100 excellent cases beat a thousand noisy ones at the start, and the set grows to hundreds or thousands as
    production teaches us. And I keep a held-out portion that nobody tunes on. Maintenance: versioned in the
    repository, reviewed like code, refreshed from production failures, and run on every change. Knowledge
    Fabric is built exactly this way: a golden set of 221 questions plus 9 that must be declined, then harder
    rounds written afterwards for paraphrases, typos, Malayalam, Telugu and Hindi, comparisons, follow-ups,
    privacy and errands. Two of those rounds were first run untuned, as held-out checks, and scored 81 and 78
    percent, which is exactly why the held-out portion matters. Every flagged answer becomes a regression case,
    and the rubric points of these interview answers are tested the same way.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: 'Golden set of 221 plus 9 to decline; harder rounds; held-out rounds at 81 and 78 percent'
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering

- id: iv1-nondeterministic
  topics: [interview, evaluation]
  questions:
  - How do you test non-deterministic AI applications?
  - How do you test an LLM app when the output changes every run?
  - How do you write tests for non-deterministic LLM outputs?
  - How do you make testing of AI applications repeatable?
  keywords:
  - non deterministic
  - nondeterministic
  - output changes every run
  - changes every run
  - repeatable
  - flaky
  answer: >-
    I separate what can be deterministic from what cannot, and test each the right way. The deterministic shell
    around the model gets ordinary tests: parsing, tool calls, routing, permissions, retries, state transitions.
    In those unit tests the model is replaced by a fake or by recorded responses, so they are fast, free and
    repeatable. My research data-analyst agent, for example, is tested with scripted fake planner and coder
    models, and AgentBasedSystem's 27 tests run on an isolated, seeded database with deterministic agents. For
    the model's behaviour I control what I can: pinned model versions, low temperature, fixed seeds where the
    provider supports them, versioned prompts. Then I stop asserting exact strings and assert properties
    instead: the output parses and matches the schema; the required facts or rubric points are present; nothing
    forbidden appears; the claims are grounded in the context; the right tool was chosen; and the answer is
    semantically equivalent to a reference above a threshold. Because outputs vary, I evaluate statistically: run
    each case several times, measure the pass rate and the variance, and set thresholds such as at least 95
    percent of runs passing. Comparisons between prompts or models use enough cases to be significant, not three
    demos, and LLM judges get explicit rubrics and are calibrated against human labels. Finally, production is
    part of testing: canary releases, sampled evaluation of live traffic and drift alerts. That is the core idea
    behind ValidAIte and QMentisAI at Qualizeal: test behaviour against criteria such as groundedness, task
    completion, safety and consistency across runs, not exact matches.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI and GenAI systems
  - url: https://github.com/PrashobhPaul/JEV_Researchwork
    source: github
    why: Scripted fake planner and coder models in the data-analyst tests
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: 27 tests on an isolated, per-test seeded database

- id: iv1-prompt-injection
  topics: [interview, evaluation]
  questions:
  - What is your approach to prompt injection and adversarial testing?
  - How do you protect an LLM application from prompt injection?
  - How do you red-team an AI agent?
  - What is indirect prompt injection and how do you defend against it?
  keywords:
  - prompt injection
  - adversarial testing
  - red team
  - red teaming
  - jailbreak
  - jailbreaks
  - indirect prompt injection
  answer: >-
    I assume injection will happen, build so it cannot do much damage, and attack my own system first. Two
    kinds matter. Direct injection is a user typing text meant to override the system's
    rules or extract its configuration. Indirect injection is worse: hostile text hidden in a document, web page,
    email or tool result that the model reads while doing its job, telling it to leak data or take an action. In
    RAG and agents, every retrieved chunk and every tool output is untrusted input. Defence in depth. Keep the
    trusted directions and the untrusted data in clearly separated, delimited channels, and treat retrieved
    content as data, never as commands. Least privilege: an agent gets only the tools and data scopes its task
    needs, with credentials held by the tools and never placed in the prompt. Human approval for consequential
    actions such as sending, paying or deleting. Validate outputs: schemas, allow-listed actions and
    destinations, and no rendering of arbitrary links or images that could carry data out. Input and output
    classifiers to screen known attack patterns. Sandboxed execution, and nothing a model returns is executed as
    code without validation, a rule I hold in CogniFlow. Adversarial
    testing is continuous, not a launch event. I keep a red-team suite organised around the OWASP Top 10 for LLM
    applications: direct and indirect injection, jailbreak corpora, data exfiltration, excessive agency and tool
    misuse, and permission-boundary probes, with planted malicious documents for the indirect cases. Tools such
    as garak or PyRIT generate variants at scale, people find the creative ones, and every successful attack
    becomes a regression test in CI. The twin you are talking to is tested the same way: attempts to make it
    reveal its configuration or step outside what is on record are in its test sets, and it must decline them.
  evidence:
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: Nothing an AI model returns is executed as code
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Test sets include off-topic and adversarial questions that must be declined
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI systems

# ----------------------------------------------------------------------------- Five questions never to skip: #3
- id: iv1-poc-to-production
  topics: [interview, delivery]
  questions:
  - An AI application you moved from POC to production; the biggest challenges.
  - Tell me about an AI application you took from proof of concept to production. What were the biggest challenges?
  - What were the biggest challenges in moving a GenAI POC into production?
  - How did you get an AI pilot into production, and what got in the way?
  keywords:
  - poc to production
  - proof of concept to production
  - from poc
  - poc into production
  - pilot into production
  - moved from poc
  - genai poc
  - into production
  answer: >-
    The one I would pick is the LLM-based conversational systems I led for global clients at Tech Mahindra, where
    I also managed the production deployments. Most of my job there was turning a promising demo into something
    that survives real traffic, and almost none of that work was about the model. The biggest challenges were
    these. Grounding: a demo answers the questions its builders chose, while real users ask about things the
    model does not know, and an ungrounded model answers anyway. We grounded the answers in the client's own data
    with RAG, with citations and a way to say not found. Evaluation: a POC is judged on a handful of hand-picked
    questions; production needs a golden set of real queries with rubrics, run on every prompt, model or data
    change. That set is the most valuable artefact a program produces. Latency and cost: token usage that is
    trivial in a demo becomes a real line item at production volume, and p95 latency matters more than the
    average. Keeping both predictable meant trimming prompts and context, caching, streaming, and tracking cost
    per conversation. Data and security: real customer data brings access control, personal-data handling,
    logging rules and security reviews that a POC never faces. Operations: monitoring, alerting, rollback of a bad
    prompt or model, and clear ownership after go-live. Trust: any decision an automated flow made needed
    monitoring and human review around it, and users needed to see why an answer was given before they relied on
    it. The lesson I took is that a POC proves possibility and production proves reliability, and the gap between
    them is evaluation, observability, security and cost control. I plan for those from the first sketch now. You
    can see the same discipline in my public work: Knowledge Fabric ships only when its test sets pass, and my
    AgentBasedSystem began as a prototype that did not even run, before I rebuilt it into typed, tested layers
    with a rule-based fallback.
  evidence:
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Led LLM-based conversational systems for global clients and managed production deployments
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: A prototype that did not run, rewritten into tested, production-shaped layers
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deploys gated by test sets
