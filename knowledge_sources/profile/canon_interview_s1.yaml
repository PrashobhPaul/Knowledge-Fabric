- id: iv1-latency-tokens
  topics: [interview, genai]
  questions:
  - How would you optimize inference latency and token consumption?
  - How do you reduce LLM latency in production?
  - How can I cut token usage in an LLM application?
  - What techniques reduce response time and token usage for LLM calls?
  keywords:
  - inference latency
  - token consumption
  - token usage
  - reduce latency
  - llm latency
  - time to first token
  - response time and token
  answer: >-
    I measure before I optimise: time to first token, tokens per second, end-to-end latency at p50 and p95, and
    input and output tokens per request, broken down by prompt section and by feature. The breakdown usually
    shows that a few things dominate. For latency: stream the response, so the user sees the first words in a
    few hundred milliseconds. Route simple requests to smaller, faster models. Use provider prompt caching for
    long, stable prefixes such as system prompts and tool definitions, which cuts both latency and input cost.
    Cap output tokens, because generation is sequential and output dominates latency. Run independent calls in
    parallel rather than in a chain, and remove model calls that deterministic code can do. Cache whole answers
    for repeated questions. When self-hosting, use a serving engine such as vLLM with continuous batching, a
    paged KV cache, quantisation and speculative decoding, and keep the models close to the users. For tokens:
    trim and version the system prompt; keep only the few-shot examples that measurably help; retrieve fewer,
    better chunks with reranking instead of stuffing twenty; summarise or window the conversation history
    instead of resending all of it; ask for concise, structured output; and use batch APIs for anything not
    interactive. Then I verify every change against the evaluation set, because a faster answer that is wrong
    is not an optimisation. My own systems sit at the far end of this on purpose. Knowledge Fabric answers with
    zero tokens at run time, from curated answers and in-browser retrieval, and CodeFabric has a fully
    extractive mode with no LLM at all, calling a model only when one is configured. Not calling a model is the
    biggest optimisation there is.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Static site, no backend, no API keys, no runtime model cost
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Extractive mode with zero setup and zero cost; LLM only if configured

- id: iv1-cost-cut
  topics: [interview, genai]
  questions:
  - 10,000 requests/day, GPT inference costs $5,000/month; cut cost 60% without hurting quality.
  - We serve 10,000 requests a day and spend $5,000 a month on GPT. How would you cut the cost by 60 percent without hurting quality?
  - How would you reduce LLM inference cost by 60% while keeping quality?
  - Our GPT bill is too high. How do you cut LLM costs without losing quality?
  keywords:
  - cut cost
  - cut the cost
  - inference cost
  - inference costs
  - reduce llm inference cost
  - without hurting quality
  - without losing quality
  - llm costs
  - gpt bill
  - 10 000 requests
  answer: >-
    First the arithmetic, because it frames the plan. 10,000 requests a day is about 300,000 a month, so we pay
    roughly 1.7 cents a request, and the target is about 0.7 cents, or $2,000 a month. I would change nothing
    until two things exist: a cost breakdown per request, input against output tokens, system prompt, retrieved
    context and history, by feature; and an evaluation set of a few hundred real requests with expected answers
    and rubrics, so that without hurting quality is a gate, not a hope. Every lever below ships only if it
    passes that gate. The levers, cheapest first. Prompt optimization: trim the system prompt, drop few-shot
    examples that do not measurably help, cap output tokens and ask for concise structured output; with
    provider prompt caching on the static prefix this alone often saves 20 to 30 percent. Selective RAG:
    retrieve only when a request needs knowledge, and send three reranked chunks instead of ten, because
    retrieved context is often most of the input tokens. Semantic caching: embed each request and serve a cached
    answer when an earlier one is close enough, with a similarity threshold, a time to live, and cache keys
    scoped by the user's permissions. Support-style traffic repeats, so even a 20 percent hit rate removes those
    calls entirely. Model routing to smaller models: rules or a light classifier send simple requests to a model
    that costs a tenth as much, and escalate only the hard or low-confidence ones. If 70 percent of traffic can
    go to the small model, cost falls to about 37 percent of today on that lever alone. Batching: anything not
    interactive, nightly summaries or bulk classification, goes through batch APIs at roughly half price.
    Distillation: for high-volume narrow tasks, fine-tune a small open model on the large model's validated
    outputs. Quantization and self-hosting: at this volume self-hosting rarely pays, but for a stable, narrow
    workload a quantized open model can, so I calculate the break-even rather than assume it. Evaluation-driven
    model substitution ties it together: every quarter the candidate models run against the same evaluation set,
    and the cheapest one that passes takes the traffic. Routing, caching and prompt and context trimming
    together usually clear 60 percent with margin. I roll out behind a flag, shadow-test against the current
    model, and track cost per request and quality scores on one dashboard. It is the same instinct as my
    AgentBasedSystem, where rules handle the clear cases and a model is called only for fuzzy intent.
  evidence:
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: Rule-based by default; an LLM only for fuzzy intent, with graceful fallback
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Every build gated by test sets; zero runtime model cost
  - url: profile:roles/Tech Mahindra
    source: resume
    why: LLM-based systems in production for global clients

# ----------------------------------------------------------------------------- D. RAG and agentic AI
- id: iv1-rag-architecture
  topics: [interview, rag-agentic]
  questions:
  - Explain the complete RAG architecture, from document ingestion to response generation.
  - How does a RAG pipeline work end to end?
  - What are the components of a production RAG system?
  - Explain retrieval-augmented generation from ingestion to the final answer.
  - What is RAG?
  keywords:
  - rag architecture
  - rag pipeline
  - retrieval augmented generation
  - document ingestion
  - response generation
  - production rag system
  - components of a production rag
  - rag system work
  - codefabric
  diagram: assets/diagrams/iv1-rag-pipeline.svg
  answer: >-
    I split it into an offline indexing path and an online query path, with evaluation and observability across
    both. Ingestion and indexing. Connectors pull from the sources, SharePoint, Confluence, databases and file
    shares, with change detection so only new or modified documents are processed. Parsing turns PDFs, Office
    files and HTML into clean text that keeps its structure, headings, tables and page numbers, with OCR for
    scans. Enrichment adds metadata: source, owner, department, date, document type, and the access-control list
    copied from the source system. Chunking follows the document's structure; each chunk is embedded and written
    to two indexes, a vector index for dense retrieval and a keyword index for BM25, with the metadata stored
    alongside for filtering. Content hashes make re-indexing incremental, and deletions propagate. The query
    path. The user is authenticated and their groups resolved. The query is understood: intent, rewriting or
    expansion, and a decision on whether retrieval is needed at all. Hybrid retrieval runs BM25 and dense search
    with permission and metadata filters applied inside the query, and fuses the lists with reciprocal rank
    fusion. A cross-encoder reranks the top 50 or so down to a handful. Context assembly removes duplicates,
    keeps diversity, orders by relevance and fits a token budget. The prompt carries the instructions, the
    context with source identifiers, and the question. The LLM generates an answer with citations, and
    post-processing checks that the citations exist and support the claims, applies guardrails and formats the
    response. When nothing relevant comes back, the system says so instead of guessing. Across both paths:
    traces of every stage, retrieval and generation metrics on a golden set in CI, user feedback flowing back
    into that set, and cost and latency per request. I have built most of this myself. CodeFabric does
    structure-aware chunking that never slices a function in half, field-boosted BM25 plus dense embeddings
    fused with RRF, a code-graph boost and incremental re-indexing by content hash, and serves it to agents over
    MCP. Knowledge Fabric adds a curated layer, MMR sentence selection, a derived confidence score and the
    honest no-answer.
  evidence:
