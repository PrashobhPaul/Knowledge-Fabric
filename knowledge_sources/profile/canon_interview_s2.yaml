- id: iv2-ka-vector-db-down
  topics:
  - interview
  - whiteboard
  - reliability
  questions:
  - What happens if the vector database goes down?
  - What if the vector DB goes down?
  - How does the assistant behave when the vector store is unavailable?
  - How do you handle a vector database outage in a RAG system?
  - Vector DB goes down?
  keywords:
  - vector db goes down
  - vector database goes down
  - vector store goes down
  - vector db is down
  - vector database is down
  - vector store is unavailable
  - vector database outage
  - vector db outage
  - vector store outage
  - vector db fails
  - vector database crashes
  - vector db crashes
  - vector database fails
  answer: 'It should be a degraded service, not an outage, and the design decides that in advance.

    Prevention first. The vector index runs replicated across availability zones, with replicas serving
    reads, regular snapshots to the object store, and health checks that take a bad node out of the pool.
    Because chunks, metadata and ACLs are kept in the relational database and the object store as the
    source of truth, the index is a derived artifact: I can restore a snapshot and replay the ingestion
    queue since that point, or rebuild it entirely, without going back to SharePoint or Confluence.

    If it still goes down, the retrieval service has a circuit breaker on the vector call and falls back
    to keyword-only BM25 search on the separate keyword index, with the same permission filters, plus
    answers already in the semantic cache. Quality drops a little, so the assistant shows that search
    is degraded, and agents that need deep retrieval pause rather than guess. If no retrieval path is
    available, the assistant says it cannot answer from the documents right now. It never falls back to
    the model''s own memory, because an ungrounded answer from an enterprise assistant is worse than no
    answer.

    Operationally, the outage raises alerts on error rate and latency, the runbook covers failover and
    reindexing, and I rehearse this path in chaos drills rather than meeting it for the first time in
    production. And I measure the keyword-only mode on the golden set before I ever need it, so the quality
    of the fallback is a known number, not a hope.'
