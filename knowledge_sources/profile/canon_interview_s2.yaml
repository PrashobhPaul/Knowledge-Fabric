  keywords:
  - knowledge assistant
  - enterprise ai knowledge assistant
  - sharepoint and confluence
  - sharepoint confluence
  - 50 000 documents
  - 5 000 employees
  - department permissions
  - whiteboard
  answer: 'Before drawing anything I ask: which decisions should this speed up, and how will we measure
    it? Which departments go first? How fresh must answers be, and how clean are the SharePoint and Confluence
    permissions? Which data classes may leave our network? What latency SLA, data residency and budget?
    My assumptions: p95 under 5 seconds with streaming, permission changes live within minutes, 99.9 percent
    availability, and no restricted data sent to external APIs.

    Then the layers.

    Ingestion: connectors for SharePoint through Microsoft Graph, Confluence and the internal databases,
    driven by change events plus a nightly reconciliation crawl, with ETL as idempotent queue jobs. Parsing
    per format: layout-aware PDF and DOCX, slide-level PPTX, table-aware XLSX, and OCR for scans and images.

    Processing: structure-aware chunking on headings and tables, a few hundred tokens with overlap. Every
    chunk carries metadata: document ID, version, department, ACL groups, classification and dates. Enrichment
    adds titles, summaries, entities and PII tags.

    Storage: originals and parsed text in an object store; documents, ACLs, versions and lineage in a
    relational database, PostgreSQL; chunks in a vector DB with a keyword index. I would choose OpenSearch
    for BM25, vectors and ACL filters in one engine, and reject a vector-only store, because enterprise
    questions are full of codes and names that keyword search finds best.

    Retrieval: hybrid BM25 and dense search fused with reciprocal rank fusion, permission filtering inside
    the query before ranking, cross-encoder reranking of the top 50, and a no-answer path when evidence
    is weak. It is the retrieval pattern I run in my own Knowledge Fabric, scaled up here with enterprise
    identity and permissions.

    Intelligence: an LLM gateway abstracts the providers, routes simple questions to a small model and
    hard ones to a frontier model, caches, and redacts PII before any external call. Orchestration runs
    in LangGraph, chosen for explicit state and approval steps: a router picks a direct answer, RAG or
    an agent. Agents are reserved for multi-step work, such as comparing policies or querying a database,
    through read-only tools over MCP that run with the user''s permissions. Every answer cites its sources.

    Security: SSO through the identity provider, RBAC for features, ABAC on department and classification
    for data, encryption in transit and at rest with KMS keys, tenant isolation for departments that need
    separate indexes, and a PII redaction gateway.

    Infrastructure: containers on Kubernetes with horizontal autoscaling on in-flight requests and queue
    depth, sized by a load test at twice the 1,000-user peak; Redis for sessions and the semantic cache;
    separate ingestion workers. I prefer this to serverless because streaming and steady load suit long-lived
    services.

    Observability: structured logs, OpenTelemetry traces across retrieval, model and tool calls, metrics
    for latency, tokens and cost, and evaluation: a golden set gating every release, plus sampled faithfulness
    scoring and user feedback in production.

    Governance: an immutable audit of user, question, retrieved documents, model and answer; lineage from
    answer to chunk to source version; model versioning, with prompt and index versions and one-step rollback.

    Failure modes are designed in: a vector outage falls back to keyword search, a provider outage fails
    over, an identity outage fails closed. Cost is mostly tokens, so routing and caching come first.'
