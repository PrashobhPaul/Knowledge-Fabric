- id: iv2-app-testing-vs-model-eval
  topics:
  - interview
  - engineering
  - evaluation
  questions:
  - How do you separate application testing from model evaluation?
  - How do you keep software tests separate from LLM evaluation?
  - How do you test the application code independently of the LLM's quality?
  - What is the difference between testing the application and evaluating the model?
  keywords:
  - application testing
  - model evaluation
  - testing from model evaluation
  - software tests
  - test the application
  - testing the application
  - evaluating the model
  - separate from llm evaluation
  answer: 'They answer different questions, so they run differently. Application testing asks whether
    the software does what we built it to do, deterministically. Model evaluation asks how well the AI
    behaves on the task, statistically.

    Application tests replace the model with a fake or recorded responses, so they are fast, free and
    deterministic: unit tests on parsing, chunking, permission filters and tool logic; contract tests
    that each provider adapter handles formats, errors and timeouts; integration tests on the API, authentication,
    retries and fallbacks; and security tests such as cross-tenant access. They run on every commit and
    must pass in full.

    Model evaluation runs the real model on golden datasets and measures quality against thresholds, not
    exact matches: retrieval recall and MRR, groundedness, answer correctness, safety, consistency across
    repeated runs, latency and cost, scored by metrics, LLM judges calibrated against humans, and expert
    review. It runs whenever prompts, models, retrieval or data change, and nightly against the production
    versions, and it gates releases on tolerances against a baseline.

    The boundary is an interface: the LLM adapter is injected, so the same code path runs with a fake
    in tests and with the real model in evaluation.

    This split is what our AI-testing platforms at Qualizeal, ValidAIte and QMentisAI, are built around,
    because an LLM or an agent cannot be tested like ordinary software: the same input can produce different
    outputs. A failing application test is a bug to fix; a falling evaluation score is a release decision,
    and the two should never be confused.'
