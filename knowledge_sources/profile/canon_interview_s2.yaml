  answer: 'In layers with one-way dependencies, so the model is a detail, not the centre of the code.

    My usual layout: an API layer with FastAPI routers, Pydantic request and response schemas and authentication;
    a service layer with the use cases, orchestration and business rules; an AI layer with interfaces
    for the LLM, embeddings, retrieval and tools, each with an adapter per provider; a repository layer
    for databases, vector stores and object storage; and workers for background jobs. Prompts live as
    versioned templates in their own package or registry, not as strings scattered through the code. Configuration
    is typed settings from the environment, with secrets from a vault.

    Cross-cutting from the first commit: structured logging and OpenTelemetry tracing, typed models everywhere,
    dependency injection so tests can swap the LLM for a fake, timeouts and retries on every outbound
    call, and graceful fallbacks.

    Tooling: pyproject with pinned dependencies, ruff and mypy, pre-commit hooks, pytest unit tests on
    the deterministic code, contract tests on the LLM adapters, and a separate evaluation suite with golden
    sets that runs when prompts or models change. Container images are small and reproducible.

    My AgentBasedSystem rewrite is this in miniature: LangGraph orchestration, an intent agent, the individual
    agents, a repository layer for data, typed User and Session models instead of raw tuples, environment-driven
    configuration for the database and the LLM provider, and a Streamlit UI and CLI on top, with 27 tests
    running on an isolated, per-test seeded database; the original prototype did not run, and clear layers
    are what made it testable and fixable. If swapping the model provider or the vector store touches
    more than one adapter, the layering has failed.'
