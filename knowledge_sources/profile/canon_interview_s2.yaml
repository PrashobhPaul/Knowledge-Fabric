  answer: 'First the sizing questions: which model and context length, the expected tokens per second
    and concurrency, the latency SLA, and the GPU budget. They decide the GPU type, the quantization and
    the replica count before any YAML is written.

    The stack: a GPU node pool with the NVIDIA GPU operator, taints so only inference pods land there,
    and a cluster autoscaler that can add GPU nodes. The model is served by a production inference server,
    vLLM by default for its continuous batching, paged attention and OpenAI-compatible API, or Hugging
    Face TGI or Triton with TensorRT-LLM where they fit better, wrapped in KServe or a plain Deployment
    and Service.

    Weights come from a model registry or object store and are cached on a persistent volume or baked
    into the image, so a new pod does not download tens of gigabytes on every start, and startup and readiness
    probes wait until the model is loaded. Quantization, AWQ, GPTQ or FP8, cuts memory so a model fits
    on fewer GPUs, and tensor parallelism spreads a larger model across the GPUs of one node.

    Scaling uses KEDA or the HPA on queue length, in-flight requests or GPU utilisation rather than CPU,
    with a warm minimum replica because cold starts are long. In front sits the LLM gateway with authentication,
    rate limits and routing, so to the application the self-hosted model is just one more provider.

    Observability covers tokens per second, time to first token, queue time and GPU memory and utilisation,
    in Prometheus and Grafana. Rollouts are canary, with the evaluation suite run against the new model
    before it takes traffic.

    I self-host where data cannot leave the network or where volume makes it cheaper than an API; on managed
    estates a SageMaker or Vertex AI endpoint gives the same pattern with less to operate.'
