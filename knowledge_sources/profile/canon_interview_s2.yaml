- id: iv2-ka-access-revoked
  topics:
  - interview
  - whiteboard
  - security
  questions:
  - What happens when a user loses access to a document?
  - How do you make sure a user who loses access to a document can no longer retrieve it?
  - How are permission changes reflected in the knowledge assistant?
  - What if someone's access to a SharePoint document is revoked?
  - A user loses access to a document?
  keywords:
  - loses access
  - losing access
  - employee loses access
  - lost access
  - lose access
  - access is revoked
  - access revoked
  - revoke access
  - permission changes
  - permissions change
  - no longer has access
  - no longer retrieve
  answer: 'The user must stop seeing it in answers within a bounded time, and I guarantee that with two
    layers.

    Layer one is sync. Each chunk carries the document''s ACL as metadata, as group IDs rather than user
    names. The connectors subscribe to permission-change events from SharePoint and Confluence and update
    the ACL metadata on every chunk of that document without re-embedding, because only metadata changed.
    Group membership changes come from the identity provider. A periodic reconciliation job compares the
    source ACLs with the index and repairs any drift, and I agree an SLA with the security team, typically
    minutes.

    Layer two is query time. Retrieval filters on the user''s current group claims, resolved from the
    identity provider at sign-in and refreshed often, so a user removed from a group loses access even
    before the documents are re-synced. For highly sensitive sources I add a late check: before chunks
    go to the model, the service confirms access for the top results against the source system''s own
    API.

    Then the caches. The semantic cache and conversation memory are keyed by permission scope, and a permission
    change invalidates every cached answer that used that document, so an old answer cannot leak it. Answers
    already given remain in the audit log, which records the documents used and the permissions in force
    at that moment, so security can see exactly what was exposed and when.

    And I test it as a security control: automated tests revoke access in a test tenant and assert that
    retrieval, the cache and the agents all stop returning the document.'
