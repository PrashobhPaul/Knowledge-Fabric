- id: iv2-performance-turnaround
  topics:
  - interview
  - problem-solving
  diagram: assets/diagrams/iv2-performance-plan.svg
  questions:
  - 'Problem-solving: response time 12s→4s; hallucination 18%→<5%; monthly cost ₹8 lakh→₹5 lakh; retrieval
    accuracy 72%→90%; concurrent users 200→2,000. Investigation process, priorities, architectural improvements.'
  - Response time 12s→4s; hallucination 18%→<5%; monthly cost ₹8 lakh→₹5 lakh; retrieval accuracy 72%→90%;
    concurrent users 200→2,000. Investigation process, priorities, architectural improvements.
  - A RAG application has a 12-second response time, an 18% hallucination rate, a monthly cost of ₹8 lakh,
    72% retrieval accuracy and supports 200 concurrent users. The targets are 4 seconds, under 5% hallucination,
    ₹5 lakh a month, 90% retrieval accuracy and 2,000 concurrent users. How would you investigate, prioritise
    and improve it?
  - 'Problem-solving: response time 12s to 4s, hallucination 18% to under 5%, monthly cost ₹8 lakh to
    ₹5 lakh, retrieval accuracy 72% to 90%, concurrent users 200 to 2,000. What is your investigation
    process, priorities and architectural improvements?'
  - How would you cut response time from 12 seconds to 4 seconds and hallucination from 18% to under 5%?
  - How would you improve a RAG system's latency, hallucination rate, cost, retrieval accuracy and concurrency?
  keywords:
  - 12 seconds
  - 12s to 4s
  - 12 second response
  - 18 hallucination
  - hallucination rate
  - 8 lakh
  - 5 lakh
  - retrieval accuracy
  - 200 concurrent
  - 2 000 concurrent
  answer: 'I would not touch the model first. Five symptoms usually come from three or four root causes,
    and swapping the LLM hides them. So: measure, isolate each layer, and fix in order of dependency.

    Week one is investigation. I trace every request end to end with OpenTelemetry and profile latency
    per stage: query rewriting, embedding, retrieval, reranking, prompt assembly, time to first token,
    generation and post-processing. I build a labelled evaluation set of a few hundred real questions
    with their correct source passages, so retrieval accuracy and hallucination are measured the same
    way every time. And I break the cost down per stage: prompt tokens, completion tokens, embeddings
    and infrastructure.

    Then I fix in this order, because each fix feeds the next.

    First, retrieval, 72 to 90 percent, which is usually the root of the hallucinations too. I check chunking,
    structure-aware chunks on headings and tables instead of fixed windows; then hybrid search, BM25 plus
    dense with reciprocal rank fusion, because exact terms and codes defeat pure vector search; metadata
    filters for department, product and date; a cross-encoder for reranking the top 50; and query rewriting
    for vague questions, each change measured on recall at k.

    Second, hallucination, 18 to under 5 percent. Better context comes first: fewer, better chunks. Then
    a prompt that answers only from the context with citations per claim, a no-answer path when retrieval
    confidence is low, a grounding check of each claim against its cited chunks before the answer is shown,
    and a faithfulness eval in CI and on sampled live traffic.

    Third, latency, 12 to 4 seconds. The traces usually show sequential calls and bloated prompts. I run
    retrieval and tool calls in parallel with async, cut the context from twenty chunks to the five best
    after reranking, use streaming so the first tokens arrive within a second, cache embeddings and frequent
    answers, and keep connections warm.

    Fourth, cost, ₹8 lakh to ₹5 lakh a month. Shorter prompts and fewer chunks already cut tokens. Then
    model routing, a small model for simple and classification steps and the large one only for hard synthesis;
    a semantic cache for repeated questions; prompt caching for the fixed system prompt; and batch APIs
    for offline work, each substitution passing the evaluation set first.

    Fifth, scale, 200 to 2,000 concurrent users: stateless services with horizontal autoscaling on Kubernetes,
    driven by in-flight requests, queueing for ingestion and long tasks, connection pooling, replicated
    indexes, provider quota pooled through a gateway with rate limits, and a load test at 2,000 users
    replaying real traffic.

    My priorities: retrieval and grounding first, because they fix quality and reduce tokens; latency
    and cost next, because they mostly fall out of a smaller context, caching and routing; scale last,
    as an infrastructure exercise proven by load tests. Only if the evaluation still shows a gap do I
    consider a different model, as a measured substitution, not a guess.'
