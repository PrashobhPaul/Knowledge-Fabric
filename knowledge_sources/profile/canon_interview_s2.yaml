  - url: profile:roles/Tech Mahindra
    source: resume
    why: GenAI and agentic implementations for telecom and BFSI clients, taken into production
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance at the AI Center of Excellence
