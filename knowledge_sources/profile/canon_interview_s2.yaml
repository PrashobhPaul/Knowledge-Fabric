  keywords:
  - sensitive information
  - sensitive data
  - external llm apis
  - external llm api
  - external llm providers
  - external models
  - third party llm
  - confidential data from
  answer: 'With a policy enforced in the request path, not a guideline in a wiki.

    It starts at ingestion: every document and chunk gets a classification, public, internal, confidential
    or restricted, from source labels and a PII and secrets scan, and that label travels with the chunk
    as metadata.

    At request time, every prompt passes through a PII redaction gateway before it can leave our network.
    It detects personal data, account numbers, credentials and client names with pattern rules plus an
    NER model, replaces them with consistent placeholders, and puts the real values back into the response
    on our side, so the external model reasons over the structure without seeing the identities. The gateway
    also enforces routing by classification: restricted content never goes to an external API; it goes
    to a self-hosted open model inside our network, on our own Kubernetes GPU nodes or a private SageMaker
    or Vertex AI endpoint.

    For what does go out, I use enterprise agreements with zero data retention and no training on our
    data, private endpoints in our region, encryption in transit, and no raw-prompt logging at the provider.
    Retrieval sends only the few chunks needed, never whole documents.

    I apply the same rule in my own work: in my Knowledge Fabric, confidential client names are masked
    in every source at build time, before indexing, so the system can never quote them.

    Then verification: the gateway logs what was redacted and where each request was routed, red-team
    tests try to push sensitive data through, and an output filter checks that responses do not leak it
    back. A policy nobody tests is a guideline in a wiki again.'
