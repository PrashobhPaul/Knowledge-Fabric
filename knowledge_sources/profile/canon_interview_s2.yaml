  answer: 'By never letting application logic talk to a provider SDK. Everything goes through one model
    interface, and the provider becomes configuration.

    The pieces: an LLM gateway, our own thin service or something like LiteLLM, exposing one API for chat,
    embeddings and tool calls. Behind it, adapters per provider absorb the differences in message formats,
    tool-calling schemas, streaming and error codes. The application asks for a capability, such as a
    grounded answer or a cheap classification, and a routing table maps capabilities to concrete models,
    so a switch is a configuration change with a rollout, not a code change. I build my own code this
    way: in AgentBasedSystem the LLM layer uses LangChain''s init_chat_model, so the same code targets
    OpenAI, Azure OpenAI or Anthropic from configuration alone and falls back to rules on any error, and
    CodeFabric picks its provider with one flag, none, Anthropic, OpenAI or Ollama.

    What actually breaks in a switch is behaviour, not the API, so three more things. Prompts are versioned
    per model family, because the best prompt for one model is rarely the best for another. Outputs are
    validated against schemas, so a model that formats differently is caught. And every candidate model
    runs the same golden evaluation set for groundedness, accuracy, refusals, latency and cost before
    it gets traffic. Then traffic moves gradually, shadow first, then canary, with the old model kept
    warm for instant rollback.

    Embeddings are the exception: a new embedding model means a re-index, so each index is versioned with
    its embedding model, and the new one is built beside the old before the cut-over.'
