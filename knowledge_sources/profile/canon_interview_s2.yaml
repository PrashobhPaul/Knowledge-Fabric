    Prompts: templates in Git with semantic versions, or in a prompt registry, never strings in code.
    Each prompt version is linked to the model it was tested with and to its evaluation scores, and production
    refers to a prompt by name and version, so a rollback is a pointer change.

    Datasets: training data, golden evaluation sets and the document corpus are versioned with DVC, lakeFS
    or object-store snapshots, with data cards for source, consent, PII handling and labelling. Evaluation
