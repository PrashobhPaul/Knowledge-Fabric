  answer: 'At the gateway, per request, with attribution. When every model call goes through one LLM gateway,
    it records everything consistently: prompt tokens, completion tokens and cached tokens, the model
    and its version, latency split into queue time, time to first token and total time, retries, cache
    hits, and the cost computed from a price table, all tagged with the application, tenant, user, feature
    and prompt version.

    Those go into OpenTelemetry traces using the GenAI semantic conventions, so one trace shows the whole
    request, retrieval, reranking, each model call and each tool call, with their latency and tokens.
    Metrics go to Prometheus and Grafana, Datadog or the cloud''s monitoring, and LLM tools such as Langfuse
    or LangSmith help with prompt-level analysis.

    The dashboards answer business questions: cost per conversation and per resolved query, cost by department,
    p50 and p95 latency per stage, tokens per request over time, and cache hit rate. Alerts fire on budget
    burn rate, latency SLO breaches and anomalies, such as an agent loop suddenly using ten times its
    normal tokens.

    Then control, not just visibility: token budgets and rate limits per tenant and per user, a maximum
    number of steps and tokens per agent run, and automatic routing to cheaper models as a budget tightens.

    I always put quality on the same dashboard as cost, because cost can always be cut by giving worse
    answers. A cheaper model or a smaller context is a win only if groundedness and accuracy hold, so
    cost changes go through the same evaluation gate as any other change.'
