- id: iv2-enterprise-rag-5000
  topics:
  - interview
  - rag
  - architecture
  diagram: assets/diagrams/iv2-permission-aware-rag.svg
  questions:
  - Design an enterprise RAG system with 5,000 concurrent users, strict access control and multiple LLM
    providers.
  - How would you design an enterprise RAG platform for 5,000 concurrent users with strict access control?
  - Design a permission-aware RAG system that uses multiple LLM providers at enterprise scale.
  - How do you build enterprise RAG with strict access control and several LLM providers?
  keywords:
  - enterprise rag
  - 5 000 concurrent
  - 5000 concurrent
  - 5k concurrent
  - strict access control
  - permission aware rag
  - multiple llm providers
  - several llm providers
  answer: 'My first questions: what does strict access control mean here, document, section or row level,
    and is it driven by groups, attributes or both? Which identity provider and source systems hold the
    truth? How fast must a permission change apply? What latency and availability SLAs, which data may
    go to which provider, and what budget per query? I would assume document-level ACLs plus attributes
    such as department and classification, changes live within minutes, p95 under 5 seconds with streaming,
    99.9 percent availability, and a few hundred queries per second at peak, because 5,000 concurrent
    users rarely ask at the same moment.

    The core principle: the model never sees anything the user could not open themselves, and access is
    decided by retrieval, not by the prompt.

    Ingestion and indexing: connectors pull documents and their ACLs; parsing, OCR and structure-aware
    chunking; every chunk carries metadata: document ID, version, ACL groups, department, classification
    and tenant. Incremental indexing handles adds, updates, permission changes and deletes with tombstones,
    and a reconciliation job repairs drift.

    Identity-aware retrieval: the user signs in through SSO, the retrieval service resolves their groups
    and attributes, and the ACL filter goes inside the index query, filtering before ranking, never after,
    so the top results are always results the user may see. Hybrid search, BM25 and dense vectors fused
    with reciprocal rank fusion, then a cross-encoder for reranking. RBAC governs features and tools;
    ABAC governs data. The most sensitive collections get separate indexes with tenant isolation and their
    own encryption keys.

    Multiple LLM providers: every call goes through an LLM gateway with one API and adapters per provider,
    routing by task, cost and data classification, failover between providers, quota pooled across regions,
    per-user rate limits, and PII redaction before any external call. Restricted data goes only to a self-hosted
    model in our network. Prompts are versioned per model, and a model is admitted only after it passes
    the same evaluation set.

    Scale for 5,000 users: stateless services on Kubernetes with horizontal autoscaling on in-flight requests,
    streaming responses, Redis for sessions, a semantic cache keyed by permission scope so cached answers
    never cross access boundaries, replicated index shards, and queues so ingestion never competes with
    queries. Load tests at twice peak before go-live.

    Agents where they earn their place: a LangGraph orchestrator sends simple questions to direct RAG
    and multi-step work to agents whose tools, exposed over MCP, run with the user''s own permissions.

    Auditability and evaluation: every request logs the user, the permissions applied, the retrieved chunk
    IDs, the model and prompt versions and the answer, immutably. A golden set gates releases on retrieval
    recall, groundedness and permission tests that try to retrieve forbidden documents and must return
    nothing; production samples are judged for faithfulness, and user feedback flows back into the set.

    Failure modes: a provider outage fails over, a vector store outage falls back to keyword search, and
    an identity outage fails closed, never open.'
