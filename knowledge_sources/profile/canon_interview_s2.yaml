- id: iv2-ka-sensitive-data
  topics:
  - interview
  - whiteboard
  - security
  diagram: assets/diagrams/iv2-llm-gateway.svg
  questions:
  - How do you keep sensitive information out of external LLM APIs?
  - How do you stop confidential data from reaching external LLM providers?
  - How do you prevent personal data from being sent to OpenAI or other external models?
  - How do you protect sensitive data when using third-party LLM APIs?
