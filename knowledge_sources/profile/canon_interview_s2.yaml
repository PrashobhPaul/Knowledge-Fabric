  - 1000 simultaneous
  - 1 000 users
  - 1000 users
  - thousand concurrent
  - thousand simultaneous
  answer: 'First I turn users into load. 1,000 concurrent users of a chat assistant is perhaps 20 to 50
    questions per second at peak, each with retrieval, reranking and a model call streaming a few hundred
    tokens. That is very achievable; the constraints are model throughput and provider rate limits, not
    the web tier.

    Then per layer. The API and orchestration services are stateless containers on Kubernetes, with horizontal
    pod autoscaling on in-flight requests and queue depth, spread across zones, and sessions in Redis.
    Answers stream, so users see the first tokens within a second even when the full answer takes longer.
    Retrieval runs on replicated index nodes sized from a load test, with the permission filter inside
    the query so it stays fast, and the reranker as a batched service with a strict top-k. The LLM gateway
    pools quota across providers and regions, enforces per-user rate limits, and routes easy questions
    to a smaller, faster model. A semantic cache, scoped by permissions, answers repeated questions at
    almost no cost, and in an enterprise a large share of questions repeat.

    Ingestion runs on separate worker pools and queues, so a large re-index never slows users down.

    Around it: backpressure with a queue and an honest wait message instead of timeouts, admission control
    per department if quota runs short, and load tests that replay the real question mix at 1.5 to 2 times
    peak before launch. In production I watch p95 latency, time to first token, tokens per second, cache
    hit rate and error rate, with autoscaling and alerts tied to them. Make latency and token cost predictable
    first, then add users, never the other way round.'
