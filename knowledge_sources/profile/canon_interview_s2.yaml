  answer: 'FastAPI is my default for AI backends because it is async-native, typed with Pydantic, and
    gives an OpenAPI contract that front ends and other teams can rely on.

    The architecture: thin routers per domain, chat, search, ingestion and admin, that only validate input
    and call services; dependency injection for the current user, tenant, database session and LLM adapter,
    so authentication and authorization are enforced in one place and every route can be tested with fakes;
    a service layer with the use cases; and adapters for the LLM gateway, the vector store and the databases.
    Everything on the request path is async: model calls, retrieval and database access use async drivers
    with connection pooling and strict timeouts, so one slow model call never blocks a worker.

    Chat answers stream over server-sent events, with the citations sent first and the tokens after. Anything
    slow and not interactive, such as document ingestion, re-indexing, bulk evaluation or report generation,
    becomes a background job: the endpoint enqueues it and returns a job ID, and a worker pool on Celery,
    Arq or a cloud queue does the work, with status polling or a webhook.

    Middleware handles request IDs, OpenTelemetry tracing, structured logs, rate limiting and token accounting
    per user. The app runs as Uvicorn workers in containers on Kubernetes behind an API gateway, with
    health and readiness endpoints that check dependencies, and scales horizontally because it holds no
    state.

    Tests use FastAPI''s TestClient with the LLM dependency overridden by a deterministic fake, so the
    API suite is fast and stable, and model quality is evaluated separately.'
