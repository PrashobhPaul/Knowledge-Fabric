  - documents are deleted
  - document deletion
  - disappear from retrieval
  - removed from the vector index
  answer: 'Deletion is the part of incremental indexing most teams forget, and it is a compliance issue,
    not a nicety.

    Every chunk carries a stable document ID and version, and a relational catalogue maps each document
    to its chunks and index entries. When a connector sees a delete event, or the reconciliation crawl
    finds a document missing at the source, the pipeline writes a tombstone, removes that document''s
    chunks from the vector and keyword indexes by document ID, deletes the parsed text from the object
    store under the retention policy, and invalidates any cached answers that cited it. Until the purge
    completes, retrieval filters out tombstoned IDs at query time, so the document disappears from answers
    immediately even if physical deletion takes longer.

    Updates work the same way: a new version gets new chunks, and the old version''s chunks are removed
    in the same step, so the index never holds two versions that contradict each other.

    Because events get missed, I never rely on events alone. A nightly reconciliation compares the source
    inventory with the catalogue and repairs the difference, and a metric tracks orphaned chunks, which
    must be zero. For legal holds and the right to erasure, the catalogue keeps an auditable record of
    when each document and its chunks, embeddings and cached answers were removed, because a deletion
    you cannot prove is, for an auditor, a deletion that did not happen.'
