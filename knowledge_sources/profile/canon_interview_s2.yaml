- id: iv2-microservices-monolith-serverless
  topics:
  - interview
  - architecture
  questions:
  - How do you decide whether to use microservices, modular monoliths or serverless architecture?
  - When would you choose a modular monolith over microservices for an AI system?
  - How do you choose between microservices, a modular monolith and serverless for an AI application?
  - When does serverless make sense for GenAI workloads?
  keywords:
  - modular monolith
  - modular monoliths
  - microservices or
  - serverless architecture
  - serverless for
  - monolith over microservices
  - microservices a modular
  - microservices
  - serverless
  answer: 'I decide on team size, scaling profile and rate of change, not fashion.

    A modular monolith is my default for a new AI product with one team: one deployable, clear internal
    modules for ingestion, retrieval, orchestration and the API, strict interfaces between them, and one
    place to test and debug. Early AI applications fail on quality far more often than on scale, and a
    monolith lets the team iterate on prompts and retrieval fastest. Because the module boundaries are
    clean, any module can be lifted out later.

    I move to microservices when parts of the system have genuinely different scaling, runtime or ownership
    needs, and in AI systems that split comes naturally. GPU inference scales differently from a CPU web
    tier; ingestion is bursty batch work; and the LLM gateway, retrieval service and evaluation service
    are shared by many applications and owned by a platform team. Those become services with their own
    SLOs, deployments and autoscaling on Kubernetes. I do not split further than the team and its operational
    maturity can carry, because every service adds network hops, latency and failure modes to a request
    path that already waits on a model.

    Serverless fits event-driven and spiky work: document-arrival triggers for ingestion, scheduled re-indexing,
    webhooks, light orchestration steps and low-traffic internal tools. It is a poor fit for long streaming
    responses, GPU inference, or steady high load, where cold starts and per-invocation cost hurt.

    So the usual answer is a hybrid: a modular monolith or a few services for the core, serverless functions
    for event handling, and dedicated inference services for models.'
