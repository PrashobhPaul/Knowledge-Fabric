- id: iv2-rollback
  topics:
  - interview
  - engineering
  - governance
  questions:
  - How do you design rollback mechanisms for a model or prompt update?
  - How do you roll back a bad prompt or model change?
  - What is your rollback strategy when a new model version degrades quality?
  - How do you safely release and revert prompt updates?
  keywords:
  - rollback
  - roll back
  - rollback mechanisms
  - rollback strategy
  - prompt update
  - prompt updates
  - revert prompt
  - model or prompt update
  answer: 'Rollback has to be a pointer change that takes seconds, and the decision to roll back should
    be automatic where possible.

    I design for it. Models and prompts are versioned and immutable, and production refers to them by
    name and version through configuration or a registry, never by editing them in place. The release
    manifest pins the combination that was evaluated together, model, prompt, retrieval settings and index
    version, so a rollback restores a known-good combination, not one piece of it. The previous version
    stays deployed and warm.

    Releases go in stages: the new version first runs in shadow mode on live traffic, with outputs compared
    offline; then a canary to a few percent of users or one department behind a feature flag; then a ramp.
    During the canary, automated checks compare it with the baseline on error rate, latency, cost, refusal
    rate, schema validity, sampled groundedness scores from an LLM judge, and user feedback. A breach
    flips the flag back automatically and alerts the owner.

    Indexes follow the blue-green pattern: the new index is built beside the old one, an alias switches
    only after evaluation passes, and rollback switches the alias back.

    The harder cases need thought in advance. An embedding change cannot be rolled back without the old
    index, so I keep it until the new one is proven, and conversation memory or agent state written by
    a new version must stay readable by the old one.

    Finally, every request logs the versions it used, so after a rollback I can find exactly which users
    got answers from the bad version and review them. A rollback without that trace fixes the future but
    not the past.'
