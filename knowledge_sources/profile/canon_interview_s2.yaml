  answer: 'I separate the interactive path from everything else. The rule is simple: if it can take more
    than a few seconds and the user does not need to watch it, it is a job.

    Inside a request I use async I/O: concurrent retrieval and tool calls with asyncio, async drivers,
    timeouts and cancellation, so each worker serves many requests while it waits on models.

    Outside the request, a durable queue, SQS, Pub/Sub, Service Bus, RabbitMQ or Redis streams, with a
    worker pool per job type, Celery or Arq in Python, scaled on queue depth with KEDA on Kubernetes.
    Typical jobs are document ingestion, OCR, chunking and embedding, re-indexing, batch evaluation runs,
    scheduled syncs and long agent tasks.

    Every job is designed to fail safely: idempotent with a job key, so a retry never duplicates chunks;
    retries with exponential backoff; a dead-letter queue for poison messages, with alerts; and checkpoints,
    so a 10,000-document ingestion resumes instead of restarting. Jobs carry trace IDs, so one upload
    can be followed from the API through every worker, and status is exposed through a job API with webhooks
    or server-sent events on completion.

    Long multi-step workflows, such as an agent that waits for human approval, go to a durable workflow
    engine, Temporal, Step Functions, or LangGraph with a persistent checkpointer, so state survives restarts
    and the run resumes where it stopped.

    I batch where it pays: batch embedding and batch LLM APIs for offline work cost far less than real-time
    calls.'
