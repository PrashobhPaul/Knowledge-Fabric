  answer: 'Everything that changes behaviour gets a version, an owner and an evaluation result, and every
    answer in production can be traced back to the exact versions that produced it.

    Models: a model registry, MLflow, SageMaker Model Registry or the Vertex AI Model Registry, for anything
    we train or fine-tune, with lineage to the training data, the code commit and the evaluation report.
    For hosted LLMs we pin dated model versions, never a floating alias, and record them in the release
