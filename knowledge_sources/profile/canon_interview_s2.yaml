  - retrieval is still good
  - retrieval in production
  answer: 'Offline metrics tell me a release is safe; production metrics tell me it still works for real
    users. I need both.

    Offline, before every release: a golden set of real questions with the documents that should answer
    them, labelled with subject-matter experts, scored for recall at k, MRR and nDCG per department and
    document type; a release fails if any score drops below its floor.

    In production, three kinds of signal. First, user feedback, explicit and implicit: thumbs up and down,
    citation clicks, copies, escalations to a human, and rephrasing of the same question, because a rephrase
    within a minute is a strong sign retrieval missed. Second, automated judgement on a daily sample of
    live traffic: an LLM judge, calibrated against human ratings, scores context relevance, whether the
    retrieved chunks were about the question, context sufficiency, and the faithfulness of the answer
    to those chunks, which separates retrieval failures from generation failures. Third, system signals:
    the no-answer rate, reranker score distributions, the share of queries with no chunk above the relevance
    threshold, and drift between what users ask and what the index covers, which reveals content gaps.

    Every request is traced with its query, filters, retrieved chunk IDs and scores, reranked order and
    cited chunks, so any bad answer can be replayed. Failures found in production are labelled and added
    to the golden set, so the regression suite grows from real misses.'
