- id: iv2-gpu-throughput
  topics:
  - interview
  - engineering
  - infrastructure
  questions:
  - How do you manage GPU utilization and inference throughput?
  - How do you maximize GPU utilization for LLM inference?
  - How do you improve inference throughput on GPUs?
  - How do you get more tokens per second out of your GPUs?
  keywords:
  - gpu utilization
  - gpu utilisation
  - inference throughput
  - tokens per second
  - maximize gpu
  - maximise gpu
  - out of your gpus
  - gpus
  answer: 'GPUs are the most expensive line on the bill, so I measure first: tokens per second per GPU,
    memory and compute utilisation, time to first token, queue time and cost per thousand tokens. Low
    utilisation usually means poor batching or a wrongly sized model, not too few GPUs.

    The levers, in the order I pull them. Right-size the model: a smaller or distilled model for routine
    requests, chosen by a router, often takes most of the load off the large model. Batch: continuous
    batching in vLLM or TGI keeps the GPU busy across many requests, and offline work runs as large batch
    jobs at full utilisation instead of real-time calls. Fit more per GPU: quantization to 8 or 4 bits,
    paged attention and KV-cache management raise concurrency, and prefix caching reuses the shared system
    prompt and retrieved context. Speed up decoding: speculative decoding with a small draft model, and
    optimised kernels such as TensorRT-LLM. Trim the tokens: shorter prompts, fewer and better chunks,
    and output limits, because the cheapest token is the one never generated. Schedule: separate pools
    for interactive and batch work, priorities and queues that protect latency-sensitive traffic, autoscaling
    on queue depth to a warm minimum, spot or preemptible GPUs for batch jobs, and GPU partitioning for
    small models.

    Every change is measured against the evaluation set as well, because a quantization that saves memory
    but loses accuracy is not a saving.

    I have squeezed models into tight compute before: at Brane Enterprises I took AI onto edge devices
    with ONNX for quadrupedal robots, and that habit of fitting the model to the hardware budget carries
    straight into GPU inference economics.'
