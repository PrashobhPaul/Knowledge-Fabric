- id: iv2-10k-concurrent-users
  topics:
  - interview
  - architecture
  questions:
  - What are the architectural considerations when deploying an AI application for 10,000 concurrent users?
  - How would you architect an AI application for 10,000 concurrent users?
  - How would you design an AI application that serves 10,000 concurrent users?
  - How do you scale a GenAI application to 10,000 concurrent users?
  - What changes when an AI application has to serve 10,000 users at the same time?
  keywords:
  - 10 000 concurrent
  - 10000 concurrent
  - 10k concurrent
  - 10 000 users
  - 10000 users
  - 10k users
  - ten thousand concurrent
  - ten thousand users
  answer: 'First I pin down what 10,000 concurrent means, because 10,000 open sessions is very different
    from 10,000 requests per second. I ask for the request rate at peak, prompt and response sizes, the
    latency SLA, and whether traffic is global or regional. In chat, an active user sends a question every
    20 to 60 seconds, so 10,000 sessions may be a few hundred model calls per second, and the real bottleneck
    is model throughput and provider token quotas, not the web tier.

    Then the considerations, layer by layer. Stateless API and orchestration services behind a load balancer,
    on Kubernetes with horizontal autoscaling on queue depth and in-flight requests, not just CPU. Session
    state and conversation memory in Redis or a database, never in the pod. Streaming over server-sent
    events or WebSockets, so time to first token stays under a second. An LLM gateway that pools quota
    across regions and deployments, applies per-tenant rate limits and token budgets, and routes simple
    questions to smaller, cheaper models. A semantic cache in front of the model, scoped by permissions,
    because enterprise questions repeat. Retrieval sized for the read load, with replicated vector and
    keyword indexes and metadata filters pushed into the index. Ingestion and report generation on a queue
    with workers, so they never compete with interactive traffic.

    Around it: backpressure and graceful degradation, so at saturation a user gets a queued or cached
    answer instead of a timeout; a load test that replays realistic conversations at above peak before
    go-live; and observability on p50 and p95 latency, tokens, cache hit rate and cost per request per
    tenant.

    I keep the cheapest path the default: precompute and cache whatever does not need a live model call,
    because at peak the cheapest request is the one that never reaches the model.'
  evidence:
  - url: doc:Knowledge_Fabric
    source: resume
    why: A fully static site with no backend, no vector database and no API keys
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Solution architecture, microservices, Docker, Kubernetes, AWS and GCP
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Production deployments of LLM-based conversational systems for global clients
- id: iv2-high-availability
  topics:
  - interview
  - architecture
  questions:
  - How do you design an AI application for high availability and fault tolerance?
  - How do you make an AI system highly available and fault tolerant?
  - How do you keep an LLM application running when one of its components fails?
  - What is your approach to failover and resilience in GenAI applications?
  keywords:
  - high availability
  - fault tolerance
  - fault tolerant
  - highly available
  - failover and
  - resilience in
  - disaster recovery
  - components fails
  answer: 'High availability and fault tolerance start with an availability target per capability, because
    an AI application is several services with different needs: 99.9 percent for the chat front door is
    a different budget from nightly ingestion. Then I list every dependency that can fail, the LLM provider,
    the vector index, the identity provider and the document sources, and design a degraded mode for each
    one.

    The model layer is the most fragile, so it sits behind a gateway with timeouts, retries with backoff
    and jitter, circuit breakers, and failover to a second deployment or provider of equivalent quality.
    Prompts are versioned per model, so the fallback model gets a prompt it was evaluated with. Retrieval
    runs on indexes replicated across availability zones; if the vector index fails, search falls back
    to the keyword index, and if both are down the assistant says so honestly instead of answering without
    grounding. Services are stateless and spread across zones on Kubernetes, with readiness and liveness
    probes, pod disruption budgets and autoscaling; state lives in managed databases with backups and
    point-in-time recovery. Ingestion is idempotent and queue-based with dead-letter queues, so a failed
    document is retried, not lost, and a bad batch never replaces a good index; my own Knowledge Factory
    works that way, keeping the last good data when a source fails and recording the failure.

    I test the failure modes on purpose: kill a provider, slow the vector store, expire a token, and check
    that the SLOs and the user experience hold. Health checks cover quality as well as uptime, because
    a model that answers fast and wrong is an outage too.'
  evidence:
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: LLM classifier with graceful fallback to rules; never hard-fails because of the model
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: A failed source leaves last week's data in place and records the failure in the manifest
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Solution architecture, MLOps, Docker and Kubernetes
- id: iv2-multi-tenancy
  topics:
  - interview
  - architecture
  questions:
  - How would you handle multi-tenancy in an enterprise GenAI platform?
  - How do you design tenant isolation in a multi-tenant GenAI platform?
  - What is your approach to multi-tenancy for LLM applications?
  - How would you isolate several business units or customers on one GenAI platform?
  keywords:
  - multi tenancy
  - multitenancy
  - multi tenant
  - multitenant
  - tenant isolation
  - isolate several business units
  - several business units or customers
  answer: 'For multi-tenancy, first I ask what a tenant is here: a business unit, a subsidiary or an external
    customer, and what isolation the contract and the regulator require. That decides the model: silo,
    pool or a bridge between them.

    For most internal platforms I use a pooled control plane with tenant-aware data. Identity carries
    the tenant: every request has a tenant ID and user claims from the identity provider, enforced at
    the gateway, never trusted from the caller. Data is isolated by default: per-tenant namespaces or
    collections in the vector store, row-level security in the relational database, per-tenant prefixes
    in the object store, and encryption with per-tenant keys in a KMS where a tenant needs it. Retrieval
    applies the tenant filter inside the index query, before ranking, so another tenant''s document can
    never reach the prompt. Caches are keyed by tenant and permission scope, because a shared semantic
    cache is the easiest way to leak an answer across tenants.

    For regulated or high-value tenants I move to a silo: a dedicated index and model deployment, sometimes
    a dedicated account or region for data residency. The same infrastructure-as-code templates stamp
    out either shape, so it is a configuration choice, not a rewrite.

    The model layer is shared but governed per tenant: model allow-lists, prompt templates, guardrail
    policies, token budgets and rate limits per tenant, with cost attributed from the gateway logs for
    chargeback. Audit logs, evaluation results and dashboards are per tenant too. Noisy neighbours are
    real with LLM quotas, so I reserve capacity for critical tenants and queue the rest.

    Finally I test tenant isolation like any security control: automated cross-tenant tests in CI try
    to retrieve another tenant''s documents and must always come back empty.'
  evidence:
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Solution architecture, AI governance, microservices and Kubernetes
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Client names masked in every source before indexing
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance across enterprise programs
- id: iv2-security-auth
  topics:
  - interview
  - architecture
  - security
  questions:
  - How do you approach authentication, authorization and data security in AI applications?
  - How do you secure an AI application end to end?
  - What is your approach to authentication and authorization for LLM applications?
  - How do you handle data security and access control in GenAI systems?
  keywords:
  - authentication authorization
  - authentication and authorization
  - authorization and data security
  - data security in ai
  - data security and access control
  - secure an ai application
  - security in ai applications
  - authorization in a rag
  - access control in rag
  answer: 'I treat an AI application as an enterprise application with three new attack surfaces: the
    prompt, the retrieved context and the tools an agent can call.

    Authentication goes through the enterprise identity provider with SSO over OIDC or SAML, and MFA.
    Service-to-service calls use managed identities or short-lived tokens, never keys in code, and secrets
    live in a vault.

    Authorization is layered. RBAC decides which features and tools a role can use; ABAC decides which
    data a user can see, from attributes such as department, region, clearance and project. The rule for
    RAG is that the model never decides access: permissions are applied at retrieval time as metadata
    filters inside the index query, synced from the source systems'' ACLs, so the LLM only sees chunks
    the user could open in SharePoint or Confluence themselves. Agents act on behalf of the user with
    least privilege, every tool call is authorized again at the tool, and anything irreversible needs
    human approval.

    Data security: encryption in transit with TLS and at rest with KMS-managed keys, private networking
    to model endpoints, tenant isolation, and data classification at ingestion, a discipline I first learned
    on regulated patient data in clinical NLP for US hospitals. A PII redaction gateway masks personal
    and confidential data before any prompt leaves for an external LLM API, under enterprise terms of
    no retention and no training on our data, and the most sensitive classes are routed to a self-hosted
    model. Outputs are filtered too, for leakage and for prompt-injection payloads hidden in documents.

    Everything is audited: who asked what, which documents were retrieved, which model answered and what
    it returned, kept immutable for compliance.

    However the rest is built, the model is never the security boundary; identity, the retrieval filter
    and the gateway are.'
  evidence:
  - url: profile:roles/Primera
    source: resume
    why: Clinical NLP on HL7 and FHIR data for US hospitals
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Confidential client names masked before indexing
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: AI governance and solution architecture
- id: iv2-multi-cloud
  topics:
  - interview
  - architecture
  - cloud
  questions:
  - How would you design an AI solution that must work across AWS, Azure and GCP?
  - How do you build a multi-cloud AI architecture?
  - How would you make a GenAI platform portable across AWS, Azure and Google Cloud?
  - What is your approach to cloud-agnostic AI solutions?
  keywords:
  - aws azure and gcp
  - aws azure gcp
  - across aws
  - multi cloud
  - multicloud
  - cloud agnostic
  - azure and google cloud
  - portable across
  answer: 'First question: why multi-cloud? Data residency, a contractual mandate, the best models in
    each cloud, or avoiding lock-in. The answer changes the design. Running every workload active-active
    in three clouds is expensive; most enterprises need portability and per-cloud deployment, not one
    system stretched across all three.

    My approach is a portable core with thin cloud adapters. The application runs in containers on Kubernetes,
    EKS, AKS or GKE, defined in Terraform and deployed through the same GitOps pipeline. Business logic
    talks to interfaces, not cloud SDKs: a model gateway with one API that routes to Bedrock, Azure OpenAI,
    Vertex AI or a self-hosted model; a storage interface over S3, Blob Storage and GCS; and search on
    a portable engine such as OpenSearch, Elasticsearch or pgvector rather than a cloud-only service.
    Identity is federated through one enterprise identity provider, and secrets come from each cloud''s
    vault behind one abstraction. Observability uses OpenTelemetry, so traces, metrics and token costs
    land in one place whatever the cloud.

    Data gravity decides placement: retrieval and inference run in the cloud where the data lives, to
    avoid egress cost and data residency problems, and only queries and answers cross the boundary. Prompts
    and evaluation sets are cloud-neutral assets in Git, so a model swap in any cloud is tested against
    the same golden set before it ships.

    My own experience spans AWS SageMaker and GCP Vertex AI, and Microsoft estates where I build agents
    with the Microsoft Agent Framework and .NET. In all three I accept a managed service where it clearly
    wins, such as a provider''s model catalogue, but only behind an adapter, so every lock-in is a conscious,
    documented decision.'
  evidence:
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: AWS, GCP, AWS SageMaker, GCP Vertex AI, Docker and Kubernetes
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Microsoft Agent Framework and .NET for a global professional-services firm
  - url: https://github.com/PrashobhPaul/AgentBasedSystem
    source: github
    why: One provider-agnostic LLM layer for OpenAI, Azure OpenAI or Anthropic
- id: iv2-standard-components
  topics:
  - interview
  - architecture
  - governance
  questions:
  - What architectural components would you standardize across multiple enterprise AI applications?
  - Which components should be shared across all enterprise AI applications?
  - What would you build once as a common AI platform for many applications?
  - What reusable building blocks would you standardize for enterprise AI?
  keywords:
  - components would you standardize
  - components would you standardise
  - components should be standardized
  - standardized across
  - standardize across
  - standardise across
  - shared across all enterprise ai
  - common ai platform
  - reusable building blocks
  - across multiple enterprise ai
  answer: 'I standardize what is risky, expensive or slow to get right, and leave the use-case logic to
    the teams.

    The shared platform, in order of value. First, an LLM gateway: one API to every approved model, with
    routing, fallback, rate limits, token budgets, caching, PII redaction and cost attribution per application.
    Second, identity and access: SSO, the RBAC and ABAC model, and permission-aware retrieval as a shared
    service, so no team reinvents document security. Third, ingestion and retrieval: connectors for the
    common sources, parsing and OCR, a chunking and metadata standard, versioned embedding models, a hybrid
    search and reranking service, and incremental indexing that handles deletions. Fourth, guardrails:
    input and output filters, prompt-injection defences and grounding checks as policy, not code each
    team copies. Fifth, evaluation: golden-set tooling, LLM judges calibrated against humans, regression
    gates in CI and online feedback capture; it is the component teams skip most and regret most. In the
    Qualizeal AI Center of Excellence, our ValidAIte and QMentisAI platforms make AI testing and evaluation
    exactly this kind of shared capability instead of a per-project afterthought. Sixth, observability:
    OpenTelemetry tracing of every prompt, retrieval and tool call, with dashboards for latency, quality,
    tokens and cost. Seventh, a registry of models, prompts, datasets and agents, with owners, evaluation
    results and approval status, which is the backbone of governance and audit. Eighth, the delivery path:
    templates, CI/CD, infrastructure-as-code and deployment patterns on Kubernetes.

    Standards also cover contracts: an agent interface, and MCP for exposing tools, so agents built by
    different teams use the same tools safely. The test of a platform is adoption: if a team ships faster
    on the paved road than off it, the standards enforce themselves.'
