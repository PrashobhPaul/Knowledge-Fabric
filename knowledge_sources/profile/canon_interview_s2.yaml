  - Design a production-ready Enterprise AI Knowledge Assistant for 50,000 documents from SharePoint,
    Confluence and internal databases, 5,000 employees with department permissions, PDF, DOCX, PPTX, XLSX
    and images, 1,000 concurrent users at peak, multiple LLM providers, and strict privacy and audit requirements.
  - 'Whiteboard: design an Enterprise AI Knowledge Assistant.'
  - Design an Enterprise AI Knowledge Assistant.
