# =============================================================================
# Canon — Senior / Enterprise AI Architect interview, Session 2
# Enterprise architecture and engineering (tests/interview_brief.md, sections A–D),
# the Enterprise AI Knowledge Assistant whiteboard with every follow-up, the
# 12s / 18% / ₹8 lakh problem-solving challenge, and "never skip" #4 and #5.
# =============================================================================
#
# Same schema and rules as canon.yaml: first person, as Prashobh answers in an
# architect interview; every example from his own work is backed by evidence that
# resolves in the index; client names stay confidential. Design answers start the
# way he starts at a whiteboard: the questions he asks and the assumptions he makes,
# then the layers, the choices and the alternatives he rejects.
# Regression set: tests/qa_interview_s2.json.

canon:
- id: iv2-requirement-to-architecture
  topics:
  - interview
  - architecture
  questions:
  - How do you translate a business requirement into an AI solution architecture?
  - How do you go from a business requirement to an AI architecture?
  - What is your process for converting business needs into an AI solution design?
  - How do you turn business requirements into an AI solution architecture?
  keywords:
  - business requirement
  - business requirements
  - business needs into
  - requirement into an ai
  - requirements into an ai
  - into an ai solution
  - ai solution design
  - requirement to an ai architecture
  answer: 'I never start with a model. I start with the questions the design depends on: the business
    objective and how we will measure it, the users and where they work, the data and who owns it, the
    constraints and SLAs such as latency, availability, compliance and data residency, the security model,
    the budget, and what happens when the AI is wrong. I write the answers down as assumptions and get
    the business owner to sign them off, because many AI projects fail by solving a different problem
    from the one the business has.

    Then I classify the problem. Prediction on structured data is classic ML, cheaper and more explainable
    than an LLM. Reading, summarising or answering over documents is RAG. Multi-step work across systems
    is an agent, and only for the steps that need judgement. A fixed process is a workflow with a model
    at one or two decision points. Each choice is tied to a success metric agreed up front: accuracy,
    deflection rate, time saved or cost per transaction.

    Then I draw the architecture in layers: data and ingestion, retrieval and knowledge, the model layer
    behind a gateway, orchestration, the user channel, and the cross-cutting layers of security, evaluation,
    observability and governance. Every layer gets an explicit non-functional target, such as p95 latency,
    availability, cost per request and the access model, so the design can be tested against the requirement
    rather than against my taste. Decisions and the alternatives I rejected go into short architecture
    decision records. I prove the riskiest assumption first with a thin end-to-end slice on real data
    and a small golden evaluation set, and only then scale out.

    I worked this way at Tech Mahindra, turning GenAI demos for telecom and BFSI clients into production
    systems, and I run engagements in the Qualizeal AI Center of Excellence the same way. The sequence
    does not change with the project: requirement, metric, layers, decision record, evaluation gate.'
