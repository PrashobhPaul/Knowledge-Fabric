  answer: 'My rule: centralize what is expensive, risky or must be consistent, and decentralize what depends
    on knowing the business problem. A platform team that tries to build every use case becomes the bottleneck,
    and teams without a shared platform each rebuild security and evaluation, badly.

    I would standardize centrally: the LLM gateway as the only path to models, with routing, quotas, caching,
    PII redaction and cost attribution; identity, access and data security, meaning SSO, the RBAC and
    ABAC model, permission-aware retrieval, encryption and data classification; the retrieval platform,
    with connectors, parsing, chunking and metadata standards and a hybrid search and reranking service;
    guardrails and policy, including which data classes may go to which models; evaluation and observability,
    with golden-set tooling, release gates, OpenTelemetry tracing and quality and cost dashboards; a registry
    of models, prompts, datasets and agents, each with an owner and an approval status, plus audit and
    lineage; and the contracts and paved roads, MCP for tools, an agent interface, templates, CI/CD and
    infrastructure-as-code.

    I would decentralize to the domain teams: the use cases and their success metrics, prompts and orchestration
    logic, which agents to build and where autonomy is justified, their own domain evaluation sets and
    acceptance criteria, the user experience, and model choice within the approved catalogue, so a team
    can pick a small fast model or a frontier one as the task needs.

    Why: governance only works when the compliant path is also the easiest one. If the gateway, evaluation
    and security are paved roads, teams adopt them because they ship faster, not because of a mandate.
    The centre sets guardrails and measures outcomes; the domains own the value.

    I would run it as a federated model: a small central platform team and architecture board, architects
    embedded in the domains, and a heavier review only for high-risk use cases.'
