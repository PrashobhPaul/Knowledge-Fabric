- id: iv4-gp-capacity-dr-cost
  topics: [interview, whiteboard, reliability, economics]
  questions:
  - Capacity, availability, disaster recovery and cost management.
  - How would you plan capacity, availability and disaster recovery for the GenAI platform?
  - How would you size and cost the GenAI platform for 3,000 concurrent users?
  - What availability, disaster recovery and cost targets would the GenAI platform have?
  keywords:
  - disaster recovery and cost
  - capacity availability
  - 3 000 concurrent users
  - size and cost the genai platform
  - availability disaster recovery
  answer: >-
    I size it with explicit assumptions and design availability around the parts we control. Capacity:
    3,000 concurrent interactive users sending a request every two to three minutes is about 20 requests per
    second at peak. With 2,000 input and 300 output tokens per request, that is 40,000 input and 6,000 output
    tokens per second through the gateway. If the average day runs at half the peak for ten working hours,
    that is roughly eight million requests and 18 billion tokens a month, before batch. The token bill
    depends on the routing mix: at an illustrative blended two dollars per million tokens it is about 36,000
    dollars a month, and the share sent to frontier models moves it several-fold either way, which is why
    routing and caching are cost architecture, not tuning. Self-hosted serving for restricted data is sized
    by Little's law and a load test, per region, with headroom of about 30 percent and one spare replica.
    Availability: 99.9 percent monthly for interactive use is about 43 minutes of downtime. Each external
    provider's availability is not ours to set, so the gateway fails over across two providers and the
    in-region open model; two independent providers at 99.5 percent would give far better than 99.9 on
    paper, but failures correlate and failover has its own errors, so I measure it. Retrieval and the gateway
    run active-active across availability zones. Degradation is designed: retrieval-only answers with
    citations when no model is available, queued batch work, and read-only agents. Disaster recovery, within
    each residency jurisdiction: configuration, registries and prompts as code, recovery point near zero;
    audit logs replicated write-once, near zero; vector indexes either snapshotted for a recovery time of
    minutes or rebuilt from the sources of truth in hours, a choice per domain; conversation history
    best-effort. Drills every quarter. Cost management: quotas and budgets per business unit at the gateway,
    alerts at 80 percent, showback from day one and chargeback later, and cost per successful task as the
    unit everyone reports.
  diagram: assets/diagrams/iv4-gp-capacity.svg
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture
  - url: profile:roles/Tech Mahindra
