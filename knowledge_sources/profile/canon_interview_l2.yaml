- id: iv4-gp-discovery
  topics: [interview, whiteboard]
  questions:
  - What missing requirements would you identify before drawing the GenAI platform design?
  - Which questions would you ask before designing the enterprise GenAI platform?
  - What would you clarify first in the GenAI platform whiteboard?
  - Lead discovery for the enterprise GenAI platform before drawing anything.
  keywords:
  - missing requirements
  - before drawing
  - before designing the enterprise genai platform
  - lead discovery
  - clarify first
  answer: >-
    The brief has gaps that would change the architecture, so I close them first and write down an
    assumption for every one I cannot close in the room. Business: which three of the hundred use cases are
    funded first, who owns each outcome, and what metric moves if it works? Without that, 90 days becomes a
    platform with no users. Users and load: are the 3,000 concurrent users evenly spread across time zones
    or concentrated in one region's working hours, and how chatty is a session? That decides whether peak
    is twenty requests per second or sixty. Data residency and retention: which countries restrict which
    data classes, and does the restriction cover prompts, embeddings, logs, evaluation sets and vendor
    support access, or only stored documents? Data: which sources are systems of record, how clean are their
    permissions, how fresh must answers be, and who may approve indexing a SharePoint estate? Models: which
    providers are already contracted, on what data-retention terms, and is there an appetite for
    self-hosting, with GPUs in which regions? Actions: what counts as consequential, a record update, an
    email to a customer, a code merge, and who is authorised to approve each? Security: the classification
    scheme, the DLP and SIEM already in place, and the CISO's red lines. Reliability: an availability
    target, a recovery point and recovery time, and what may degrade during an outage. Economics: the budget,
    who pays, and whether business units will be charged. Delivery: what production in 90 days means to
    the sponsor, which teams I get, and which enterprise dependencies, identity, networking, procurement,
    have long lead times. Governance: which regulations apply by region, the EU AI Act for EU deployments for
    instance, and which risk tiers exist. I would also ask what has already failed, because a previous
    attempt usually explains the politics. Then I draw only what those answers justify.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance
  - url: profile:services/AI Consulting & Strategy
