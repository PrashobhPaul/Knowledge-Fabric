- id: iv4-gp-90-day-slice
  topics: [interview, whiteboard, delivery]
  diagram: assets/diagrams/iv4-gp-90-day-slice.svg
  questions:
  - What is the first 90-day delivery slice for the enterprise GenAI platform?
  - What would you deliver in the first 90 days of the GenAI platform?
  - What is in and out of scope for the platform's initial production release?
  - How would you scope the initial 90-day production release of the platform?
  keywords:
  - first 90 day delivery
  - initial production release
  - 90 days of the genai platform
  - in and out of scope
  - initial 90 day
  answer: >-
    A thin vertical slice that is truly in production, rather than a wide platform that is not. Scope: one
    region, one business unit, two read-only use cases chosen for value and low risk, a knowledge assistant
    over that unit's SharePoint and Confluence, and an engineering assistant over its documentation and code
    search. In scope: the AI gateway with two model providers and failover, identity federation and
    permission-aware retrieval, one knowledge service with hybrid search and reranking, the evaluation
    service with golden sets gating releases, OpenTelemetry tracing with redaction, the audit store, quotas
    and showback by team, and the risk-tier process with an AI inventory. Out of scope, said explicitly:
    autonomous writes into business systems, the second region, self-hosted GPUs, customer-facing use, and
    the other ninety-eight use cases. Plan. Weeks one to three: discovery, decisions recorded, golden sets
    drafted with the business owner, environments, identity and network dependencies requested on day one
    because they have the longest lead time. Weeks four to eight: build the gateway, ingestion with ACL
    sync, retrieval and the two applications on the paved-road templates; red-team and permission-leak tests
    from week six. Weeks nine to eleven: pilot with a hundred to three hundred users, measure, fix. Week
    twelve: production for the business unit, with a go or no-go on written criteria. Acceptance criteria:
    golden-set task success at the level agreed with the owner, zero failures in forbidden-document tests,
    p95 time to first token under two seconds, availability measured against 99.9 percent, cost per
    successful task reported weekly, and an incident runbook rehearsed once. Adoption plan: champions in the
    business unit, training, feedback in the product, and weekly usage and quality reviews. Risks I track:
    permission hygiene in SharePoint, procurement of the second provider, and scope creep, which I handle by
    keeping a visible backlog for phase two.
