- id: iv4-gp-operating-model
  topics: [interview, whiteboard, leadership]
  questions:
  - Migration, adoption, ownership and operating model.
  - What migration, adoption and ownership model would the GenAI platform need?
  - How would you migrate existing AI applications onto the new GenAI platform?
  - What operating model and ownership would run the GenAI platform?
  keywords:
  - migration adoption ownership
  - adoption ownership
  - operating model
  - migrate existing ai applications
  - ownership model
  answer: >-
    Ownership is explicit per layer, migration is in waves by risk, and adoption is earned by making the
    platform the easiest path. Ownership: a platform team, run as a product team with a product manager, owns
    the gateway, knowledge services infrastructure, agent runtime, evaluation service, observability and
    FinOps, with SLOs and an on-call rota. Domain teams in each business unit own their use cases, prompts,
    workflows, golden sets, knowledge content and business outcomes, and the first-line response for their
    applications. Security, privacy and legal own policies, which the platform encodes. An AI risk council,
    business, security, legal and architecture, owns the risk tiers and approves the high-risk use cases. A
    small enabling team of architects embeds with domains to get them started. That is a hub and spoke: a
    central hub for shared capability and governance, federated spokes for delivery, moving towards more
    federation as domains mature. Migration of existing AI applications, which a 30,000-person enterprise
    will already have: an inventory first, every application, model, provider, data source and owner, then
    waves. Wave one is the applications with the highest risk, personal or restricted data reaching external
    APIs, which move behind the gateway first, often with no code change beyond the endpoint. Then the ones
    that gain most from shared services, such as retrieval or evaluation. Duplicates are consolidated, and
    applications without an owner or users are retired. Adoption: a use-case intake with a clear path to a
    governed pilot in days, paved-road templates, champions in each business unit, training for builders and
    for users, internal showcases of measured results, and a feedback channel in every application. I track
    adoption by the share of AI traffic through the gateway and by the satisfaction of the teams building on
    it. The operating model is the part most designs skip, and the one that decides whether the
    architecture survives its first year.
