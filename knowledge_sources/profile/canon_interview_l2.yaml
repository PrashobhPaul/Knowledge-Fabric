# ----------------------------------------------------------------------------- S1.2 Model and inference architecture
- id: iv4-attention-kv-cache
  topics: [interview, models]
  questions:
  - Explain the architectural implications of transformer attention, context length, KV caching and decoding strategy for production inference.
  - What are the production inference implications of attention, context length and the KV cache?
  - How do KV caching and decoding strategy affect production inference?
  - Why does the KV cache matter so much for serving LLMs in production?
  keywords:
  - kv caching
  - kv cache
  - decoding strategy
  - production inference
  - attention context length
  - serving llms in production
  answer: >-
    Inference has two phases with different bottlenecks, and most serving architecture follows from that.
    Prefill processes the whole prompt in parallel; self-attention there costs compute roughly quadratic in
    prompt length, so long prompts drive time to first token. Decode generates one token at a time, and each
    step must read the model's weights and the cached keys and values of every earlier token, so decode is
    bound by memory bandwidth, not compute. That is why batching many sequences together raises throughput
    almost for free, until memory runs out. The KV cache is what memory runs out of. Its size per token is
    two, for keys and values, times layers, times KV heads, times head dimension, times bytes per value. For
    a 70-billion-parameter class model with 80 layers, 8 KV heads under grouped-query attention and a head
    dimension of 128 in FP16, that is about 320 KB per token, so one 8,000-token conversation holds roughly
    2.6 GB, and a few hundred concurrent long sessions need more GPU memory for cache than for weights. Four
    architectural consequences. Context length is a budget, not a feature: every extra retrieved chunk costs
    latency, memory and concurrency, so I retrieve fewer, better chunks. Cache management decides capacity:
    paged KV memory as in vLLM, KV-cache quantization, and prefix caching for shared system prompts. Decoding
    strategy is a product decision: greedy or low temperature for extraction and classification, sampling for
    drafting, and constrained decoding against a JSON schema whenever output feeds a program, which removes a
    whole class of parsing failures. And latency targets need two numbers, time to first token and
    inter-token latency, because users feel the first and batch jobs care about total tokens per second. In
    my own work the same budget logic showed up from the other side: on Brane's edge devices with ONNX, and
    in my Knowledge Fabric, which precomputes MiniLM embeddings at build time so nothing heavy runs at
    question time.
  evidence:
  - url: profile:roles/Brane Enterprises
    source: resume
    why: AI on edge devices with ONNX
  - url: doc:Knowledge_Fabric
    source: notes
    why: MiniLM sentence embeddings precomputed in the build

- id: iv4-model-families
  topics: [interview, models]
  questions:
  - How would you choose between dense, mixture-of-experts, encoder-decoder and smaller task-specific models for different enterprise workloads?
  - When would you choose a mixture-of-experts model over a dense model?
  - How do you pick between dense, MoE, encoder-decoder and small task-specific models?
  - Which model architecture would you use for which enterprise workload?
  keywords:
  - mixture of experts
  - encoder decoder
  - smaller task specific
  - task specific models
  - dense mixture
  - moe model
  answer: >-
    I choose by workload shape: how open-ended the output is, the volume, the latency budget and where the
    model must run. Dense decoder models are the default for open-ended generation and reasoning at modest
    volume, through an API or self-hosted; they are predictable to serve, because every token uses every
    parameter. Mixture-of-experts models activate only a few experts per token, so a model with hundreds of
    billions of parameters in memory can cost per token like a much smaller one. DeepSeek-V3, for example, has
    671 billion parameters with about 37 billion active per token. The catch is memory and operations: you
    must hold every expert, which pushes you to multi-GPU nodes and expert parallelism, and load imbalance
    between experts hurts tail latency. MoE pays off for high-volume, broad workloads on a shared platform
    where the hardware is already large; it is a poor fit for a small dedicated deployment. Encoder-decoder
    and encoder-only models are underrated in enterprises. For classification, extraction, routing, ranking
    and embeddings, a fine-tuned encoder or a T5-class model is faster, cheaper, easier to evaluate and does
    not hallucinate free text. Smaller task-specific models, small language models or classic ML, win
    wherever the task is narrow and the volume is high, and they run on CPUs or at the edge. My portfolio
    rule: route each step of a workflow to the cheapest model that passes that step's evaluation, and keep
    the frontier model for the steps that need it. This is not theory for me. At TCS I built custom OpenNLP
    models and a multi-class ticket classifier, at Yash classic models for fraud and credit, at Brane object
    detection on edge devices with ONNX, and my Knowledge Fabric runs MiniLM for meaning with no generative
    model at all. The frontier model is the exception in a well-designed system, not the default.
  evidence:
  - url: profile:roles/Tata Consultancy Services
    source: resume
    why: Custom NLP models and text classification
  - url: profile:roles/Yash Technologies
    source: resume
    why: Fraud, loan eligibility and credit-scoring models
  - url: profile:roles/Brane Enterprises
    source: resume
    why: Object detection on edge devices
  - url: doc:Knowledge_Fabric
    source: notes
    why: MiniLM embeddings, no generative model at answer time

- id: iv4-adaptation-methods
  topics: [interview, models]
  questions:
  - Compare full fine-tuning, instruction tuning, PEFT/LoRA, distillation, continued pre-training and retrieval augmentation. What problem does each solve, and what does it not solve?
  - Compare full fine-tuning, PEFT, distillation and continued pre-training.
  - When would you use distillation or continued pre-training instead of LoRA?
  - What does each model adaptation method solve and not solve?
  keywords:
  - continued pre training
  - continued pretraining
  - distillation
  - peft lora
  - adaptation method
  - what does it not solve
  answer: >-
    I map each method to the problem it actually fixes, because most enterprise disappointments come from
    using one to fix another's problem. Full fine-tuning updates every weight. It solves deep behaviour
    change in a domain or task when you have a lot of good data and the budget, and it does not solve
    knowledge freshness; it is expensive to repeat and risks catastrophic forgetting. Instruction tuning
    teaches a base model to follow instructions and formats; it solves usability and alignment to a style of
    task, not missing domain facts. PEFT methods such as LoRA, and QLoRA on a 4-bit base, train small
    adapter matrices; they solve format, tone, task style and domain phrasing cheaply, and let one base model
    serve many adapters, but they do not reliably inject new facts and they do not fix weak reasoning.
    Distillation trains a small student on a large teacher's outputs; it solves cost and latency for a
    narrow, high-volume task, and it does not make the student better than its teacher. I also check the
    provider's terms first, because several prohibit using their outputs to train competing models.
    Continued pre-training on domain text solves vocabulary and language the base model barely saw, clinical
    notes or a legal corpus in a regional language; it does not teach tasks, and it needs a large clean
    corpus and an evaluation for forgetting. Retrieval augmentation solves fresh, citable, permissioned
    knowledge, and it does not change behaviour or format, and it is only as good as retrieval. My default
    order: prompt and retrieval first, PEFT when format or task style still fails the evaluation, distillation
    when volume makes cost the problem, continued pre-training only for a genuinely unfamiliar language.
    Clinical NLP at Primera is the reason I respect domain language: abbreviations, negation and drug
    spellings are what general models get wrong.
  evidence:
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: Clinical NLP on EMR data
  - url: profile:roles/Qualizeal
    source: resume
    why: Practices for GenAI integration, prompt engineering and RAG

- id: iv4-quantization
  topics: [interview, models]
  questions:
  - How would you evaluate quantization trade-offs across quality, memory, throughput and hardware?
  - How do you evaluate the trade-offs of quantizing a model?
  - How would you decide between FP8, INT8 and 4-bit quantization?
  - What do you measure before quantizing an LLM for production?
  keywords:
  - quantization trade offs
  - quantizing a model
  - quantizing an llm
  - 4 bit quantization
  - fp8 int8
  - quantization
  answer: >-
    I treat quantization as a model change that must pass the same evaluation as a new model, not as a
    free optimisation. Four axes, measured together. Quality: perplexity is not enough, because a quantized
    model can keep perplexity and lose exactly the behaviour you need. I run the task evaluation set,
    including the long-context, multilingual, structured-output and tool-calling cases, since those degrade
    first, and I compare against the full-precision model with a paired test, not eyeballing. Memory: weights
    shrink in proportion to bits. A 70-billion-parameter model is about 140 GB in FP16, 70 GB in FP8 or INT8
    and about 35 to 40 GB at 4-bit, which can turn a four-GPU deployment into one or two, and the freed memory
    becomes KV cache, which means more concurrent users. KV-cache quantization is a separate decision with
    its own quality check. Throughput and latency: decode is memory-bound, so fewer bytes read per step means
    faster tokens, but only if the kernels are good. Weight-only 4-bit methods such as GPTQ or AWQ help
    small-batch latency; at high batch sizes dequantization overhead can erase the gain, so I benchmark at
    our real batch size and sequence lengths. Hardware: FP8 has native tensor-core support on Hopper-class
    GPUs such as the H100 and on Ada-generation L4 and L40S cards, but not on the A100, where INT8 or 4-bit
    weight-only formats are the practical choices; on CPUs and edge devices INT8 through ONNX Runtime is the
    common path, which is how I took models onto edge devices at Brane. My decision rule: pick the lowest
    precision whose task evaluation stays within the agreed tolerance, often one to two points, on every
    critical slice, at a measured cost per million tokens on the target hardware. And I keep the
    full-precision model as the reference, so a regression later can be traced to quantization or ruled out.
  evidence:
  - url: profile:roles/Brane Enterprises
    source: resume
    why: AI on edge devices with ONNX
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture

- id: iv4-model-routing
  topics: [interview, models]
  questions:
  - How would you design model routing across frontier APIs, self-hosted open-weight models and specialist models?
  - How would you route requests between frontier APIs and self-hosted open-weight models?
  - How do you design a model router across providers and specialist models?
  - What decides which model a request is routed to?
  keywords:
  - model routing
  - frontier apis
  - self hosted open weight
  - open weight models
  - specialist models
  - model router
  answer: >-
    Routing is a policy decision first and a quality decision second. The router sits in the AI gateway,
    and its first input is not the prompt but the data classification and the caller: restricted or
    resident data can only go to models inside the boundary, typically self-hosted open-weight models or a
    regional private endpoint, whatever the quality trade-off. Only within what policy allows does the
    router optimise. Second, the task class, declared by the calling application rather than guessed: extract,
    classify, embed, summarise, answer with retrieval, reason over many steps, generate code. Specialist
    models take their tasks, an embedding model, a reranker, a classifier, a code model, because they are
    cheaper and easier to evaluate. Third, difficulty and value within a task: a small model first, with
    escalation to a frontier API when a confidence signal fails, schema validation, a grounding check, or an
    explicit uncertainty, so the expensive model sees only the cases that need it. I prefer declared task
    classes and cascades to a learned router at first, because they are explainable and testable; a learned
    router comes later, trained on logged outcomes. Fourth, live conditions: latency budget, rate limits,
    provider health and cost budget per tenant, with circuit breakers and a fallback chain. Every route
    must be evaluation-gated: a model is admitted to a route only after it passes that route's golden set,
    and prompts are versioned per model, because the same prompt is not portable across providers. The
    abstraction hides transport and authentication, never capability, so a route that needs tool calling or
    long context declares it, and a fallback model that lacks it is not a fallback. I apply the same
    principle at Qualizeal: framework and model choices follow the client's need, the Microsoft Agent
    Framework on a .NET estate, Kiro for spec-driven development, rather than one stack everywhere.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and production multi-agent systems
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Microsoft Agent Framework and .NET for a global professional-services firm
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Kiro for a major US airline

- id: iv4-serving-optimizations
  topics: [interview, models]
  questions:
  - What are the operational implications of speculative decoding, continuous batching, prefix caching and tensor parallelism?
  - What are the trade-offs of speculative decoding and continuous batching?
  - How do prefix caching and tensor parallelism change how you operate LLM serving?
  - What operational issues come with speculative decoding?
  keywords:
  - speculative decoding
  - continuous batching
  - prefix caching
  - tensor parallelism
  - llm serving
  answer: >-
    Each one buys throughput or latency and charges it somewhere in operations. Continuous batching,
    scheduling at the level of each decode step so new requests join a running batch as others finish, is
    the biggest throughput win and the default in vLLM and similar servers. Its operational cost is
    variable per-request latency: a request's speed depends on what else is in the batch, so I need
    admission control, per-tenant fairness and SLOs on time to first token and inter-token latency, and I
    must load-test with our real mix of prompt and output lengths, not a synthetic constant. Speculative
    decoding has a small draft model, or extra decoding heads, propose several tokens that the large model
    verifies in one pass; with proper verification the output distribution is unchanged. Gains depend on the
    acceptance rate, so they are large for predictable text such as code or templated answers and small for
    creative text, and they shrink at high batch sizes where the GPU is already compute-bound. Operationally
    it is a second model to version, fit in memory and monitor; I track acceptance rate as a metric and turn
    it off when it stops paying. Prefix caching reuses the KV cache of shared prompt prefixes, the system
    prompt, tool definitions, a long document. It cuts prefill cost and time to first token sharply, but
    only if prompts are designed with the stable part first and the variable part last, and only if the
    router sends similar requests to the same replicas, which conflicts with naive load balancing. It is also
    a tenant-isolation question: a shared cache must never let one tenant's prefix serve another. Tensor
    parallelism splits each layer across GPUs to fit large models and cut per-token latency; it needs fast
    interconnects such as NVLink within a node, it makes the GPU group one failure domain, and it changes
    capacity math, because you scale in units of whole groups. I decide all four with benchmarks on our
    traffic, never from a vendor's headline.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Managed production deployments of LLM-based systems

- id: iv4-quality-root-cause
  topics: [interview, models]
  questions:
  - How would you determine whether a quality problem is caused by the model, prompt, retrieval, tools, data or task decomposition?
  - How do you find out whether a bad answer comes from the model, the prompt or retrieval?
  - How would you root-cause a GenAI quality problem?
  - How do you isolate which layer causes poor answer quality?
  keywords:
  - quality problem is caused
  - task decomposition
  - root cause a genai quality
  - root-cause a genai quality
  - which layer causes
  - bad answer comes from
  answer: >-
    I never start by swapping the model; I start by locating the failure, layer by layer, with traces and
    controlled substitutions. Step one is a labelled sample of failures, fifty to a hundred, each with its
    full trace: the input, the retrieved chunks, the prompt as sent, tool calls and results, and the output.
    I tag each failure by where it first went wrong. Then I test each layer independently. Retrieval: was
    the right evidence in the top k? Recall at k on the failure set answers that; if the evidence was never
    retrieved, no model or prompt can fix it. Data: was the evidence itself wrong, stale or missing from the
    corpus? That is a source problem, and I check provenance and dates before blaming anything else. Prompt:
    with the correct evidence pinned into the context by hand, does the same model answer correctly? If yes,
    retrieval or context assembly is the problem; if no, try a revised prompt on the same pinned context.
    Model: with the same pinned context and prompt, does a stronger model succeed where this one fails? If
    yes, it is capability, and the question becomes whether the gain is worth its cost. Tools: replay the
    tool calls with recorded correct responses; if the answer recovers, the tool or its schema is the cause,
    a timeout, a malformed result, an ambiguous description. Task decomposition: if every step passes its
    own check and the end result still fails, the plan is wrong, steps missing or ordered badly, and the fix
    is the workflow, not any component. Each test changes one variable, and each layer gets its own metric
    afterwards, so the regression cannot return silently. This is how my Knowledge Fabric is built to be
    debugged: retrieval is evaluated separately from answers on a gold set in lexical, semantic and hybrid
    modes, and every answer carries the lineage of each sentence back to its record.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Retrieval gold set in three modes; lineage of every sentence
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems

- id: iv4-serving-capacity
  topics: [interview, models, whiteboard]
  diagram: assets/diagrams/iv4-serving-capacity.svg
  questions:
  - Estimate the serving capacity needed for a stated request rate and output-token profile. State assumptions.
  - How would you estimate the GPU serving capacity for a given request rate and output-token profile?
  - Estimate how many GPUs you need to serve an LLM at a given request rate.
  - How do you size LLM serving capacity from request rate and token counts?
  keywords:
  - serving capacity
  - output token profile
  - request rate and output
  - how many gpus
  - size llm serving
  - gpu serving capacity
  answer: >-
    I will state the assumptions first, because the method matters more than the numbers. Assume a peak of
    20 requests per second, roughly 3,000 active users each sending a request every two and a half minutes;
    2,000 input tokens per request including retrieved context; 300 output tokens; a self-hosted
    70-billion-parameter class model in FP8 on H100 80 GB GPUs; and targets of time to first token under 1.5
    seconds and about 25 tokens per second per stream at p95. Step one, token demand: 20 times 300 is 6,000
    output tokens per second to decode, and 20 times 2,000 is 40,000 prompt tokens per second to prefill.
    Step two, concurrency, by Little's law, requests in flight equal arrival rate times time in system: 300
    tokens at 25 per second is 12 seconds, plus about a second of prefill, so 20 times 13 is about 260
    sequences in flight. Step three, memory: at roughly 320 KB of KV cache per token in FP16 for this model
    class, 260 sequences of 2,300 tokens hold about 190 GB of cache, half that with an FP8 KV cache, plus 70
    GB of FP8 weights. Step four, throughput per replica, which I measure rather than assume: suppose a
    four-GPU tensor-parallel replica sustains 2,000 output tokens per second while still meeting 25 tokens
    per second per stream. Then 6,000 divided by 2,000 is three replicas at peak; with 30 percent headroom
    and one replica for failure, five replicas, twenty GPUs. Check memory per replica: about 87 sequences,
    roughly 64 GB of cache, which fits beside the weights. Check prefill: it is compute-bound at about two
    FLOPs per parameter per token, roughly 13,000 prompt tokens per second per replica, comfortable on four
    H100s. Step five, cost and alternatives: twenty GPUs at our hourly rate against the same tokens through
    an API, and whether a smaller model or prefix caching halves the fleet. The numbers that move the answer
    most are output length and the per-stream latency target, so those are what I would challenge first.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Managed production deployments of LLM-based systems

- id: iv4-long-context
  topics: [interview, models]
  questions:
  - Explain the impact of long context on latency, memory and answer quality.
  - How does a long context window affect latency, memory and answer quality?
  - What are the downsides of stuffing a long context instead of retrieving?
  - Does a million-token context window make RAG unnecessary?
  keywords:
  - long context
  - context window affect
  - stuffing a long context
  - million token context
  - long context on latency
  answer: >-
    Long context costs on three axes, and quality is the one people underestimate. Latency: prefill must
    process every prompt token before the first output token, and attention cost grows faster than linearly
    with prompt length, so time to first token rises with the size of the context. A 100,000-token prompt
    can take seconds before anything streams, even on fast hardware, and every turn of a conversation pays
    it again unless the prefix is cached. Memory: the KV cache grows linearly with tokens, around 320 KB per
    token in FP16 for a 70-billion-parameter class model, so one 100,000-token session holds about 32 GB of
    cache. That is concurrency you no longer have: the same GPUs serve far fewer users. Cost: with APIs you
    pay for every input token on every call, so a habit of sending whole documents multiplies the bill.
    Quality: more context is not more understanding. The well-known lost-in-the-middle finding showed that
    models use information at the start and end of a long context better than in the middle, and irrelevant
    passages actively distract. Needle-in-a-haystack tests overstate real comprehension, because finding one
    planted sentence is not the same as reasoning across fifty pages. So long context does not make
    retrieval unnecessary; it changes what retrieval is for. My rule: retrieve a few high-quality chunks for
    question answering over a large corpus; use long context when one coherent document must be read whole,
    a contract, a design specification, a long code file, where chunking would cut the reasoning apart; and
    cache the stable prefix when the same document is asked about repeatedly. And I measure it: answer
    accuracy against context length on our own evaluation set, with the evidence placed at different
    positions, before I trust a window size in production.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Best practices for GenAI integration and RAG pipelines
  - url: doc:Knowledge_Fabric
    source: notes
    why: Retrieval-first, cited answers

- id: iv4-fair-benchmarking
  topics: [interview, models]
  questions:
  - How would you benchmark models fairly across providers with different tokenization, rate limits and hidden infrastructure?
  - How do you compare LLM providers fairly when tokenizers and rate limits differ?
  - How would you run a fair model bake-off across providers?
  - How do you benchmark models across different LLM providers?
  keywords:
  - benchmark models fairly
  - hidden infrastructure
  - different tokenization
  - tokenizers and rate limits
  - model bake off
  - across providers
  answer: >-
    I benchmark tasks, not tokens, and I control everything the providers do not. Tokenization differs, so
    cost per token and tokens per second are not comparable across providers; the same paragraph can be
    noticeably more tokens in one tokenizer than another. I normalise to the unit the business pays for:
    cost per successful task, latency per completed task, and quality on our own evaluation set. The set is
    private and built from our workload, because public benchmarks are contaminated and do not reflect our
    documents, languages or tools. Prompts are adapted fairly: each model gets the same task specification
    and a fixed, equal budget of prompt tuning on a development split, then a frozen test split, because a
    prompt tuned for one model handicaps the others. Sampling settings are fixed, and I run every case
    several times, reporting the mean, the spread and pass rate over repeated trials, since non-determinism
    differs by provider too. Rate limits and hidden infrastructure I handle by measuring in the conditions
    we will run in: from our cloud region and network path, at our expected concurrency, across different
    times of day and days of the week, reporting p50, p95 and p99 rather than averages, plus error and
    throttling rates. Providers change models behind a name, so I pin exact model version identifiers,
    record them in every result, and re-run the benchmark on a schedule and on every version change. If I
    use an LLM as judge, it comes from a different family than the models being judged, its verdicts are
    calibrated against a human-labelled sample, and answer order is randomised, to control its known
    position, length and self-preference biases. The output is a decision table per task class, not a single
    leaderboard. It is the same discipline behind ValidAIte, our platform for validating AI systems.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering

# ----------------------------------------------------------------------------- S1.3 Advanced RAG and knowledge systems
- id: iv4-beyond-rag
  topics: [interview, rag]
  questions:
  - When does conventional RAG stop being the right abstraction? Compare RAG with long-context approaches, fine-tuning, knowledge graphs and database/query-based retrieval.
  - When does conventional RAG stop being the right abstraction?
  - When would you use a knowledge graph or a database query instead of RAG?
  - How do you choose between RAG, long context, fine-tuning and knowledge graphs?
  keywords:
  - conventional rag
  - right abstraction
  - database query instead of rag
  - query based retrieval
  - long context approaches
  - stop being
  answer: >-
    Conventional RAG, chunk, embed, retrieve the top k, generate, is the right abstraction when the answer
    lives in a passage of text and the question names its topic. It stops being right in five situations,
    and each has a better tool. When the answer is a computation over records, how many orders shipped late
    in March, retrieval of text is the wrong primitive: the system of record should answer through a
    governed query, text-to-SQL against a semantic layer with the user's permissions, or an API, and the
    model only plans the query and explains the result. Embedding a database into chunks loses joins,
    aggregates and freshness. When the question needs relationships and multi-hop joins, which suppliers of
    a failed part also serve another plant, or who calls this function, a knowledge graph or a code graph
    answers by traversal, with retrieval only for the descriptive text. When the question needs a whole
    document reasoned over end to end, a contract or a specification, long context beats fragmenting it into
    chunks. When the problem is behaviour, format, tone or domain phrasing rather than knowledge, fine-tuning
    or an adapter fixes it and retrieval cannot. And when the question is global, summarise the themes
    across ten thousand tickets, top-k retrieval sees a sliver; that needs map-reduce summarisation or
    community summaries over a graph, as in Microsoft's GraphRAG. The architecture I build is therefore a
    router over knowledge services, not one RAG pipeline: text retrieval, structured query, graph
    traversal and document reading behind one interface, each evaluated on its own question class. My own
    systems show the split. Knowledge Fabric answers from cited text but keeps a typed knowledge graph with
    23 node types and cross-source entity resolution, and CodeFabric pairs hybrid search with a code
    knowledge graph of calls, inheritance and imports, because "who calls this" is a traversal, not a
    similarity search.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Typed knowledge graph with cross-source entity resolution
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Keyword index, vector index and a code knowledge graph

- id: iv4-mixed-content-retrieval
  topics: [interview, rag]
  questions:
  - 'Design a retrieval strategy for mixed content: tables, scanned PDFs, diagrams, code, audio transcripts and frequently changing records.'
  - How would you design retrieval for mixed content such as code, audio transcripts and live records?
  - What retrieval strategy fits mixed content including code and audio transcripts?
  - How do you retrieve across code, audio transcripts and frequently changing records in one system?
  keywords:
  - mixed content
  - audio transcripts
  - frequently changing records
  - retrieval strategy for mixed
  answer: >-
    One retrieval interface, several representations underneath, each built for how that content carries
    meaning, and a shared metadata spine so they can be filtered and fused together. Tables: never flatten
    a table into prose chunks. I keep the table as structured data with its caption and headers, index a
    textual description of what it contains for retrieval, and answer numeric questions by querying the
    table itself, so the model reads cells, not a garbled row. Scanned PDFs: OCR with layout analysis to
    recover reading order, headings and tables, and I keep the OCR confidence on every chunk, so low-quality
    pages can be flagged or routed to a vision-language model rather than trusted blindly. I did this kind
    of work at Primera with OCR tools for EOBs and diagnostic documents. Diagrams: a vision model writes a
    description of components and relationships, indexed as text and linked to the image, and where the
    diagram is the source of truth, a CogniFlow or Mermaid source, I index the source rather than the
    picture. Code: syntax-aware chunking so a function is never cut in half, code-aware tokenization so
    getUserById matches "get user by id", field-boosted BM25 on symbol names and docstrings plus dense
    embeddings fused with reciprocal rank fusion, and a call graph for questions about callers and impact,
    which is exactly how my CodeFabric works. Audio transcripts: chunk by speaker turn or chapter with
    timestamps, so a citation plays the moment it came from; my Knowledge Fabric cites YouTube chapters at
    the cited second. Frequently changing records: do not embed them at all; query the system of record live
    through an API or SQL with the user's permissions, and index only their stable descriptions. Across all
    of it, hybrid retrieval with reranking, and an evaluation set per content type, because one aggregate
    score hides the type that fails.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Syntax-aware chunking, code-aware tokenization, hybrid BM25 and dense with RRF, code graph
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: OCR tools for EOB and diagnostic documents
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Video chapters cited at the second

- id: iv4-retrieval-eval-independent
  topics: [interview, rag, evaluation]
  questions:
  - How would you evaluate retrieval independently from answer generation?
  - How do you evaluate retrieval separately from the generated answer?
  - How would you measure retrieval quality on its own, without the LLM?
  - How do you test the retriever independently of the generator?
  keywords:
  - retrieval independently
  - independently from answer generation
  - retrieval separately
  - retriever independently
  - retrieval quality on its own
  answer: >-
    I evaluate retrieval as its own system with its own gold set and gate, because if the right evidence
    never reaches the context window, no generator can fix it, and if it does, a bad answer is the
    generator's fault. The gold set pairs real questions with the documents or passages that answer them,
    labelled by domain experts, with graded relevance where it matters, and with questions that deliberately
    have no answer in the corpus. I build it from logged production questions, stratified by department,
    content type and question class, and refresh it as the corpus changes. Then I measure the retriever
    alone, with no model involved: recall at k, is the relevant passage among the top k at all, which is the
    number that predicts whether the system can work; precision at k, how much noise enters the context;
    MRR, how high the first relevant passage ranks; and nDCG at k, when relevance is graded. I report them
    per retrieval mode, lexical, dense and hybrid, so the value of each layer is demonstrated, and per slice,
    so a weak content type cannot hide behind the average. Two further checks keep it honest: permission
    tests, where a user without access must retrieve nothing from a restricted document, and the no-answer
    questions, where the retriever's top score should stay low. In production, without labels, I watch
    proxies: the share of answers whose citations the grounding check accepts, low top-score rates, and user
    feedback, sampled for human review. Retrieval changes, a new embedding model or chunking, are gated on
    this set in CI. My Knowledge Fabric does exactly this: a retrieval gold set runs in lexical, semantic and
    hybrid modes on every build, computing recall at 5 and 10, MRR and nDCG at 10, and the deploy fails if
    hybrid recall at 5 drops below 0.70 or MRR below 0.55.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Retrieval gold set in three modes on every build; the deploy fails below the floor

- id: iv4-retrieval-choice
  topics: [interview, rag]
  questions:
  - Explain how you would choose between dense, sparse, hybrid, graph-based and learned retrieval.
  - How would you choose between graph-based and learned retrieval?
  - When would you pick learned sparse or graph-based retrieval over hybrid search?
  - How do you decide which retrieval method fits a corpus?
  keywords:
  - graph based
  - learned retrieval
  - learned sparse
  - retrieval method fits
  - sparse hybrid graph
  answer: >-
    I choose by the shape of the questions and the corpus, and I prove the choice on a gold set rather than
    by preference. Sparse retrieval, BM25, wins on exact terms: product codes, error messages, names,
    clause numbers, acronyms. It is cheap, explainable, needs no training and handles new vocabulary on day
    one. Dense retrieval wins on paraphrase and meaning, when users describe a problem in words the documents
    never use, but it blurs exact identifiers and depends on an embedding model that may not know your
    domain. Hybrid, both fused with reciprocal rank fusion and then a cross-encoder reranker, is my enterprise
    default, because real questions mix both kinds and RRF needs no score calibration between retrievers.
    Graph-based retrieval is for relationship questions and multi-hop joins, where the answer is a path
    between entities rather than a passage, and for disambiguation, since an entity graph knows that two
    surface forms are one thing. It costs an extraction and entity-resolution pipeline that must itself be
    evaluated. Learned retrieval, fine-tuned dense encoders, learned sparse models such as SPLADE, or
    late-interaction models such as ColBERT, is what I reach for when the gold set shows a measurable gap that
    the general models leave, and when there are enough labelled query-passage pairs to train and to test
    separately. It costs training, re-indexing on every model change and an evaluation pipeline. My order is
    BM25 baseline, then hybrid, then reranking, then graph for the question classes that need it, then learned
    retrieval only if the numbers justify it. Each step must beat the last on recall at k and task success.
    That is how my own systems evolved: Knowledge Fabric fuses BM25, LSA and MiniLM by rank, CodeFabric adds a
    code graph to hybrid search, and a transformer re-ranker sits on the fabric's roadmap, to be evaluated
    against the existing baseline with the same harness before it ships.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: BM25, LSA and MiniLM fused by rank; re-ranker on the roadmap, evaluated against the baseline
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Hybrid search plus a code knowledge graph

- id: iv4-retrieval-failure-modes
  topics: [interview, rag]
  questions:
  - What are the failure modes of chunking, embedding similarity and semantic search? How would you detect them?
  - What are the failure modes of chunking and embedding similarity?
  - How does semantic search fail, and how do you detect it?
  - What goes wrong with embedding similarity in production search?
  keywords:
  - failure modes of chunking
  - embedding similarity
  - semantic search fail
  - how does semantic search
  - wrong with embedding
  answer: >-
    Each layer fails in characteristic ways, and each has a detector. Chunking: a fixed-size splitter cuts
    a table from its header, a condition from its exception, or a function in half, so the retrieved chunk
    is relevant but incomplete or misleading. Chunks that are too small lose context, too large dilute the
    embedding. I detect it by reading the retrieved chunks for failed gold questions, by measuring how often
    the answer spans a chunk boundary, and by comparing structure-aware chunking against fixed windows on
    recall at k. Embedding similarity: similar is not relevant. Embeddings rank a passage on the same topic
    above the one that answers; they are weak on negation, "does not support" sits beside "supports"; on
    numbers, dates and identifiers; and on domain vocabulary the model never saw. They also drift when the
    embedding model changes, and anisotropy makes every score look high, so a fixed similarity threshold
    means little. I detect it with targeted test slices, negation pairs, identifier queries and domain
    jargon, and by tracking the score distribution per release, not a single cut-off. Semantic search as a
    system: near-duplicate chunks crowd out diversity, so the top five say the same thing; stale versions
    outrank current ones; popular boilerplate, disclaimers and headers matches everything; and there is
    always a nearest neighbour, so a question with no answer still retrieves confident-looking junk. I
    detect those with duplicate rates in the top k, version checks on retrieved chunks, boilerplate filters
    and the no-answer questions in the gold set. The cure is the stack: hybrid sparse and dense, reranking,
    deduplication by maximal marginal relevance, metadata filters for version and validity, and a calibrated
    no-answer path. In my Knowledge Fabric, a duplicate-sentence check after MMR is part of the integration
    test, and questions with nothing on record must be declined honestly instead of answered with a collage.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Integration tests, MMR deduplication and honest no-answer
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Structure-aware chunking that never slices a function in half

- id: iv4-provenance-permissions
  topics: [interview, rag]
  questions:
  - How do you preserve provenance, temporal validity, document versioning and access permissions throughout ingestion and retrieval?
  - How do you keep provenance and document versions intact from ingestion to retrieval?
  - How do you preserve temporal validity and access permissions through a RAG pipeline?
  - How do you carry provenance and permissions on every chunk?
  keywords:
  - temporal validity
  - document versioning
  - preserve provenance
  - provenance and document versions
  - provenance and permissions
  answer: >-
    By making them fields of every chunk, set at ingestion, enforced at query time and checked at build,
    never reconstructed later. Provenance: each chunk carries its source system, document ID, version, the
    URL a person can open to verify it, its position in the document, and a hash of the source content. Every
    derived artefact, an embedding, a summary, a graph edge, points back to the chunk IDs it came from, so
    lineage runs from answer to sentence to chunk to source version. Temporal validity: two dates, not one,
    when the record was produced and the period it is valid for, an effective date and a superseded date for
    policies, plus how the date was obtained and how confident that is. In my Knowledge Fabric a source's own
    timestamp counts 0.95, a revision stamp 0.85, PDF metadata 0.60, a date in the text 0.35 and the crawl
    date 0.30, and an unknown date is stored as unknown, never guessed. Retrieval filters on validity, so a
    question about the current policy never retrieves a superseded version, while a question about last
    year can. Versioning: a new version is ingested beside the old one, the old one marked superseded and
    kept for audit and point-in-time questions, and a deletion propagates as a tombstone to every index,
    cache and derived summary. Access permissions: the document's ACL groups and classification are copied
    to each chunk, synchronised from the source on change events plus a reconciliation crawl, and applied as
    a filter inside the index query, before ranking, from the user's identity on every request. Then the
    checks: an evidence link that resolves to nothing is reported, which my fabric's build does for every
    curated answer, and permission tests in the gold set prove a user without access retrieves nothing. The
    principle is that metadata is part of the data, not an afterthought.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Provenance on every record and the date-confidence scale
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Evidence resolved at build; lineage of every sentence

- id: iv4-contradictory-sources
  topics: [interview, rag, research]
  questions:
  - How would you handle contradictory sources, stale content and questions with insufficient evidence?
  - How do you handle contradictory sources and stale content in a RAG system?
  - What should a RAG system do when the evidence is insufficient?
  - How do you deal with stale content and contradictory documents in retrieval?
  keywords:
  - contradictory sources
  - stale content
  - insufficient evidence
  - evidence is insufficient
  - contradictory documents
  answer: >-
    This is my PhD question in production form, so I have a concrete answer from Eidolon and a direction
    beyond it. Contradictions first. I detect them rather than let the model silently pick one: when the
    retrieved evidence for the same claim disagrees, a different date, figure or owner, the system resolves
    by explicit rules and says so. Authority comes first, the system of record over a copy, the owner's
    document over a summary of it. Recency counts only when the date is known with confidence. If the
    conflict cannot be resolved, the answer presents both claims with their sources and dates instead of
    averaging them into a fluent falsehood. Eidolon does a version of this today: when my resume and my
    website disagree, the resume wins, and an older resume stays in the index marked as not current. A real
    case is years of experience, where the resume and website say over eleven and a chatbot source said
    thirteen. Stale content: every chunk carries validity dates and a date-confidence score, superseded
    versions are filtered out of current-state questions, freshness never treats an unknown date as old, and
    stale-content alerts go to the document owner, because the fix belongs at the source. Insufficient
    evidence: a calibrated no-answer path, when the top retrieval scores are weak or the grounding check
    cannot support a claim, the system says it does not have that on record and offers the nearest questions
    it can answer, rather than stitching unrelated sentences into a plausible paragraph. For a single
    unsupported claim inside a good answer, the claim is dropped, not the answer. Where I am taking it: today
    these are hand-written rules; my research at Anurag University is about replacing them with a trust score
    measured per source and per claim, so that two agreeing sources outweigh an outlier on the evidence itself,
    and a low-trust claim is stated only when a second source corroborates it.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Precedence rules, the experience-figure conflict and the honest no-answer
  - url: doc:Knowledge_Fabric
    source: notes
    why: Cited answers with lineage

- id: iv4-multi-hop
  topics: [interview, rag]
  questions:
  - How would you design retrieval for multi-hop questions that require joining facts across documents or systems?
  - How do you design retrieval for multi-hop questions?
  - How would you answer questions that need facts joined across several documents or systems?
  - What is your approach to multi-hop retrieval across systems?
  keywords:
  - multi hop
  - joining facts
  - joined across several
  - facts joined across
  answer: >-
    Single-shot top-k retrieval fails multi-hop questions by design, because the second fact is only
    findable once you know the first. Which projects did the people who left the payments team work on, or
    which customers are affected by a defect in a component used by a supplier we are dropping. So I design
    for the hops explicitly, and I pick among three patterns by how stable the relationships are. Pattern
    one, an entity graph for stable relationships. If the joins are repeatedly asked about, people, teams,
    products, components, contracts, I extract entities and relations into a knowledge graph at ingestion,
    resolve their surface forms to one node, and answer by traversal, with text retrieval only to describe
    and cite each node. My Knowledge Fabric resolves the same project or employer across the website,
    GitHub, YouTube, the resume and LinkedIn into one node with several sources, and CodeFabric answers
    impact questions by walking the call and import graph. Pattern two, iterative retrieval for open text.
    A planner decomposes the question into sub-questions, retrieves for the first, extracts the bridging
    entity, and retrieves again with it, with a hop limit, typically three, and a stop when the evidence is
    sufficient. Pattern three, federated query across systems: when the facts live in different systems of
    record, the planner calls each through a governed tool, SQL on the warehouse, an API on the CRM, search on
    the document store, each with the user's own permissions, and joins on shared identifiers, never on
    fuzzy text. Across all three, every hop's evidence is kept and cited, so a reviewer can see the chain,
    and the permission check applies at each hop, since a join can reveal what no single document does.
    Evaluation needs multi-hop gold questions with the full evidence chain labelled, scoring each hop's
    recall separately from the final answer.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Cross-source entity resolution into one typed graph
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Callers and impact analysis over a code knowledge graph

- id: iv4-retrieval-eval-protocol
  topics: [interview, rag, evaluation]
  questions:
  - Define a retrieval evaluation protocol including recall@k, precision@k, MRR/nDCG and task-level success.
  - What retrieval evaluation protocol would you use, with recall at k, MRR and nDCG?
  - How do you define a retrieval evaluation protocol with task-level success?
  - Which retrieval metrics do you report, and how are they computed?
  keywords:
  - retrieval evaluation protocol
  - recall k precision k
  - mrr ndcg
  - task level success
  - recall at k mrr
  - retrieval metrics do you report
  answer: >-
    The protocol has five parts: the set, the labels, the metrics, the slices and the gate. The set: a few
    hundred to a few thousand real questions sampled from logs, stratified by department, content type and
    question class, including multi-hop questions and questions with no answer in the corpus, split into a
    development part for tuning and a frozen test part. The labels: for each question, the passages or
    documents that answer it, marked by domain experts, graded 0 to 3 where partial relevance matters, with
    a second labeller on a sample to measure agreement. The metrics, computed per question and averaged.
    Recall at k: the fraction of a question's relevant passages that appear in the top k; for most
    questions a single relevant passage, so it is hit or miss, and I report k at 5, 10 and the context size
    actually sent to the model. Precision at k: the share of the top k that is relevant, which measures how
    much noise reaches the model. MRR: the mean over questions of one over the rank of the first relevant
    result, rewarding the answer being near the top. nDCG at k: discounted cumulative gain, graded relevance
    divided by the log of the rank, normalised by the ideal ordering, for graded labels. And task-level
    success, the one that matters to the business: with this retrieval, did the end-to-end system answer
    correctly and with valid citations, judged by people or a calibrated judge. If retrieval metrics improve
    and task success does not, the retriever is optimising the wrong thing. Slices: every metric by retrieval
    mode, content type and department, plus a permission slice where a restricted user must retrieve
    nothing. The gate: floors in CI on the test part, and a paired comparison against the current release.
    My Knowledge Fabric runs this shape on every build, recall at 5 and 10, MRR and nDCG at 10 in lexical,
    semantic and hybrid modes, with floors of 0.70 recall at 5 and 0.55 MRR for hybrid.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Retrieval gold set with recall, MRR and nDCG in three modes; deploy floors
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI and GenAI systems

- id: iv4-permission-leakage
  topics: [interview, rag, security]
  questions:
  - How do you prevent permission leakage through cached results, rerankers, summaries and generated answers?
  - How do you close permission leakage through caches and precomputed summaries?
  - How can cached results or summaries leak restricted content?
  - How do you prevent a semantic cache from leaking restricted answers?
  keywords:
  - permission leakage
  - cached results
  - rerankers summaries
  - semantic cache from leaking
  - leak restricted
  answer: >-
    Filtering at retrieval is necessary and not sufficient, because every derived artefact downstream of
    retrieval is a copy that can outlive or escape the permission. I close each path explicitly. Caches: a
    semantic or answer cache keyed only by the question is a leak, the finance director's answer served to
    an intern who asks the same thing. The cache key includes a hash of the user's effective permission set,
    or the cache is scoped per user or per permission group, and every entry records the document IDs it was
    built from, so revoking access or deleting a document invalidates exactly those entries. Rerankers: a
    reranker must only ever see candidates that passed the permission filter, so the filter is applied
    inside the index query, before ranking, never after reranking, which also stops a restricted document
    from silently pushing others out of the top k. Summaries: a precomputed summary of a folder, a meeting or
    a document set inherits the most restrictive ACL of everything it summarises, and is regenerated or
    withdrawn when any source's permissions change, which is why I prefer summaries generated at query time
    from permitted chunks over global summaries for sensitive spaces. Generated answers: the answer is grounded
    only in permitted chunks, citations are checked against the user's permissions before display, and
    conversation history and agent memory are per user, never shared across sessions. Logs and evaluation
    sets: prompts and answers are stored with the same classification as their sources and access-controlled
    accordingly. I prove it with forbidden-document tests in CI, users with known permissions asking
    questions whose answers live only in documents they cannot see, through every path, cache hit and miss.
    My Knowledge Fabric applies the same idea to confidential client names: masked in every source before
    indexing, so no cache, summary or answer can ever contain one.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Client names masked before indexing; integration tests check every answer for leaks
  - url: profile:roles/Qualizeal
    source: resume
    why: RAG pipelines and AI governance

- id: iv4-kg-vs-vector
  topics: [interview, rag]
  questions:
  - When would a knowledge graph materially outperform a vector index? What evidence would you require?
  - When would a knowledge graph outperform a vector index?
  - What evidence would justify building a knowledge graph instead of only a vector store?
  - Is GraphRAG worth it over plain vector search?
  keywords:
  - knowledge graph materially
  - outperform a vector index
  - vector index
  - graphrag
  - instead of only a vector store
  answer: >-
    A knowledge graph materially outperforms a vector index when the answer is a relationship, not a
    passage. Four question classes. Multi-hop joins: which open incidents touch services owned by the team
    that changed this configuration; the facts sit in different documents and no single chunk is similar to
    the question. Aggregation and enumeration over entities: list every supplier certified for this part;
    a vector index returns the five most similar passages, not the complete set. Disambiguation and identity:
    two names for one product, or one name for two people, which entity resolution settles once and
    similarity never does. And global sensemaking, the themes across a large corpus, where Microsoft's
    GraphRAG builds entity communities and their summaries for exactly that reason. It underperforms where
    questions are about the content of passages, because extraction loses nuance, and it costs an
    extraction pipeline, an ontology, entity resolution and the upkeep of all three. So the evidence I would
    require is comparative and per class. First, a sample of real questions labelled by class, to see how
    much of the traffic is relational at all; if it is five percent, a graph is a feature, not a platform.
    Second, a head-to-head on those relational questions: the vector baseline with hybrid search and
    reranking against graph retrieval, measured on task success and completeness, not similarity scores.
    Third, the extraction quality itself, precision and recall of entities and relations on a labelled
    sample, because a graph built from bad extraction is confidently wrong. Fourth, the total cost to build
    and keep it fresh. In my own work the graph earned its place: at Primera, mapping mentions to SNOMED,
    LOINC and ICD-10 concepts in a per-patient relationship graph is what let notes from sixty hospitals be
    joined, and my Knowledge Fabric's typed graph is how one project seen on my website and GitHub becomes
    one node with two witnesses.
  evidence:
  - url: profile:roles/Primera Medical Technologies
    source: resume
    why: Ontology mapping and relationship graphs for clinical analytics
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Typed knowledge graph, cross-source entities
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: SNOMED, LOINC and ICD-10 and custom relationship graphs

# ----------------------------------------------------------------------------- S1.4 Agentic systems and reasoning workflows
- id: iv4-agent-boundary
  topics: [interview, agentic]
  questions:
  - Define the boundary between deterministic workflow orchestration, tool-using agents and autonomous multi-agent systems.
  - Where is the boundary between workflow orchestration, tool-using agents and autonomous multi-agent systems?
  - How do you separate deterministic orchestration from tool-using agents?
  - When does a workflow become an agent, and when does an agent become a multi-agent system?
  keywords:
  - deterministic workflow orchestration
  - tool using agents
  - autonomous multi agent
  - workflow become an agent
  - deterministic orchestration
  answer: >-
    I draw the boundary by who decides the next step, and how far that decision can reach. Deterministic
    workflow orchestration: the control flow is written by engineers, a graph of steps, branches and
    retries, and models may run inside steps, to classify, extract or draft, but a model never chooses which
    step comes next. It is testable by enumeration, auditable by design and the right default for regulated,
    repeatable processes. A tool-using agent: within a bounded task, the model chooses the next action from
    a fixed set of tools, observes the result and decides again, until it meets a stop condition. The
    engineer still defines the goal, the tool set, the permissions, the step budget and the exit criteria,
    so autonomy is real but fenced. This fits work where the path depends on what the agent finds, an
    investigation, a triage, a test-design task. An autonomous multi-agent system: several agents with
    separate roles, contexts and often separate tools, delegating to and reviewing each other, possibly
    planning their own sub-goals over long horizons. The decision about what to do next is distributed, and
    so are the failure modes. The practical test I use has three questions. Can I write the steps down in
    advance? Then it is a workflow. Is the set of steps known but their order and number not? Then a single
    agent. Do the subtasks need genuinely different context, tools or permissions that would overload one
    agent, or independent verification? Only then multiple agents. Most enterprise systems I design are
    hybrids: a deterministic outer workflow with agents inside specific steps. That is how I use LangGraph,
    explicit state and edges with agent nodes where judgement is needed, and how Kiro's spec-driven flow works
    for a major US airline, with requirements, design and tasks agreed before any agent generates code.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems with LangGraph, CrewAI and AutoGen
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Spec-driven agentic SDLC with Kiro for a major US airline

- id: iv4-agent-justification
  topics: [interview, agentic]
  questions:
  - What evidence justifies adding an agent rather than implementing a deterministic service?
  - What evidence would justify an agent instead of a deterministic service?
  - How do you justify building an agent rather than a rule-based service?
  - When is an agent worth its extra cost over deterministic code?
  keywords:
  - justifies adding an agent
  - justify an agent
  - instead of a deterministic service
  - rather than implementing a deterministic
  - agent worth its extra cost
  answer: >-
    The burden of proof is on the agent, because it costs more to run, to test and to govern than a
    deterministic service, so I ask for evidence in four forms before I accept one. First, path variability
    measured, not assumed. I take a sample of real cases, often a hundred, and try to write the decision
    path for each. If a decision tree with a manageable number of branches covers ninety-plus percent, it is
    a deterministic service with a model inside one or two steps, not an agent. If the next step genuinely
    depends on what was found, which document, which system, which test, and the paths do not converge, an
    agent earns consideration. Second, a baseline comparison. The agent must beat the best deterministic
    alternative, a workflow plus retrieval, on the same evaluation set, on task success, not only on how
    impressive the demo looks. Third, the economics. Cost per successful task, including retries, tokens,
    human review and the cost of errors, against the value of the task, and latency against what users will
    accept. Agents often take several model calls per task; if the task saves a minute of someone's time, the
    arithmetic can fail. Fourth, controllability: can I bound its tools, permissions and steps, can its
    actions be reversed or approved, and can I evaluate it reliably across repeated runs? If the answer to
    the last is no, it is not ready, however good the average looks. What I reject as evidence: the
    existence of a framework, a vendor demo, and the phrase autonomous agent in a strategy deck. I have built
    deliberately non-agentic systems where that was right. My Knowledge Fabric generates nothing at answer
    time, and Dhinasuthra runs on 131 written rules because it would rather say nothing than make something up.
    And I build agents where variability is real, as in the testing life cycle work at Qualizeal.
  evidence:
  - url: doc:Knowledge_Fabric
    source: notes
    why: A deliberately non-generative design
  - url: https://github.com/PrashobhPaul/Dhinasuthra
    source: github
    why: 131 written rules, no AI model; would rather say nothing than make something up
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Agentic AI across the software testing life cycle

- id: iv4-agent-state-termination
  topics: [interview, agentic]
  questions:
  - How do you reason about planning, state, memory, tool selection, retries and termination?
  - How do you design agent planning, state and memory?
  - How do you handle tool selection, retries and termination in an agent?
  - How do you decide when an agent should stop?
  keywords:
  - planning state memory
  - tool selection retries
  - retries and termination
  - agent planning
  - agent should stop
  answer: >-
    I treat each as an explicit design decision with its own owner in the architecture, never as something
    the model is left to improvise. Planning: for anything consequential I prefer plan-then-execute, the
    agent writes a plan as structured data that can be validated, shown to a reviewer or compared with a
    known-good template, over a free ReAct loop that decides one step at a time. Replanning is allowed at
    defined checkpoints, with the reason logged. State: explicit and typed, held by the orchestrator, not
    hidden in the conversation. In LangGraph that is the graph state, checkpointed after every step, so a run
    can resume after a crash, be replayed for debugging and be inspected by an auditor. Memory: three kinds,
    kept apart. Working memory is the current task's state. Episodic memory is past runs, retrieved only when
    relevant. Long-term knowledge belongs in governed knowledge services with provenance and permissions,
    not in an agent's private store, and anything written to memory carries its source and the user's scope,
    so it cannot leak across users or outlive a permission. Tool selection: a small, well-described tool set
    per task, typed schemas, and a router step that narrows the tools before the model picks, because
    selection accuracy drops as the tool list grows. Retries: idempotent tools, bounded retries with backoff
    for transient errors, no retry of a non-idempotent action without an idempotency key, and a different
    strategy rather than the same call after two failures. Termination: a success condition checked by code,
    not only by the model's opinion; plus hard budgets on steps, tokens, wall-clock time and cost; detection
    of repeated states or tool calls; and an escalation to a human when a budget is hit, carrying the state so
    far. These are the patterns I design into the multi-agent systems I build at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems with LangGraph, CrewAI and AutoGen
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Framework choice follows the client's need and the situation

- id: iv4-consequential-actions
  topics: [interview, agentic, security]
  questions:
  - How would you design an agent that performs consequential actions in enterprise systems?
  - How do you design an agent that takes consequential actions in enterprise systems?
  - How would you let an agent update records in a system of record safely?
  - What controls does an agent need before it can act on business systems?
  keywords:
  - consequential actions
  - performs consequential
  - takes consequential
  - act on business systems
  - update records in a system of record
  answer: >-
    I design it so the model proposes and the platform disposes. The agent never holds the power to act; it
    produces a typed action request, and a deterministic action layer decides whether that request executes.
    Five layers. Identity: the agent acts on behalf of a named user, with that user's delegated permissions
    through OAuth on-behalf-of tokens, intersected with the agent's own narrower scope, so it can never do
    more than the user could and usually much less. Credentials live in the tool gateway, never in the
    prompt. Action design: tools are narrow and business-shaped, update the delivery date on this order, not
    run SQL, with typed parameters, validation, and limits such as one record per call, a maximum amount, an
    allow-list of fields. Every action is classified by risk: read, reversible write, irreversible or
    financial or external communication. Policy and approval: a policy engine evaluates each request against
    rules, the risk class, the amount, the data classification, the time of day, the volume so far, and
    routes high-risk actions to human approval, showing the reviewer the exact diff, the evidence the agent
    used and its stated reason. Blast-radius limits: rate limits per agent and per user, circuit breakers on
    anomalous volume, for example more than fifty writes in ten minutes pauses the agent, and a kill switch.
    Safety of execution: dry run first, idempotency keys so a retry cannot double-apply, the before-state
    recorded so every write can be reversed, and a compensating action defined for each tool. Audit: every
    request, decision, approval and result in an immutable log with the trace ID. Then I stage autonomy:
    shadow mode where the agent proposes and people act, then approval on everything, then approval only
    above a risk threshold, each stage earned with measured precision. That is the standard I set for the
    agentic work I lead at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems and AI governance
  - url: profile:services/Agentic AI System Design
    source: website
    why: Design and delivery of multi-agent systems

- id: iv4-injection-containment
  topics: [interview, agentic, security]
  questions:
  - How do you contain prompt injection from retrieved content, tool outputs and external websites?
  - How do you contain injection from tool outputs and external websites in an agent?
  - How would you contain instructions hidden in retrieved documents or web pages?
  - What is your containment strategy for indirect injection in agents?
  keywords:
  - contain prompt injection
  - tool outputs and external websites
  - external websites
  - containment strategy for indirect
  - instructions hidden in retrieved
  answer: >-
    Containment starts from an admission: no classifier or prompt reliably stops injection, because the
    model cannot tell instructions from data in the same context. So I design for the attack succeeding and
    doing nothing harmful, and I filter as an extra layer, not as the defence. OWASP ranks prompt injection
    first in its Top 10 for LLM applications, and the risk becomes serious when three things meet in one
    agent: access to private data, exposure to untrusted content and a way to send data out. My first
    control is to break that combination per task. An agent that reads external websites gets no private
    data and no outbound channel; an agent with private data never reads arbitrary web content in the same
    context. Second, privilege separation between planning and data. The plan is fixed from the trusted
    user request before untrusted content is read, and content from retrieval, tools or the web is passed
    as data, to a quarantined model step whose output is constrained to a schema, never allowed to add tool
    calls. Research designs such as the dual-model pattern and DeepMind's CaMeL formalise this, and the
    engineering version is simply that untrusted text cannot change control flow. Third, least privilege on
    every tool, credentials held by the tool gateway and the user's own permissions, so an injected
    instruction can only ask for what the user could already do. Fourth, egress control: outbound calls go
    through an allow-listed proxy, no rendering of arbitrary links or images that could carry data out, and
    DLP on outbound payloads. Fifth, human approval for consequential actions, with the provenance of the
    content that motivated them shown to the approver. Then detection: content scanning and spotlighting
    with delimiters to lower the success rate, and every attack found in red-teaming kept as a regression
    test. That is the layered approach I apply across the agents we validate on ValidAIte.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: Nothing an AI model returns is executed as code

- id: iv4-multi-agent-failures
  topics: [interview, agentic]
  questions:
  - What are the failure modes of multi-agent collaboration, shared memory and delegated subtasks?
  - What are the failure modes of multi-agent collaboration?
  - How do shared memory and delegated subtasks fail in multi-agent systems?
  - Why do multi-agent systems fail in production?
  keywords:
  - multi agent collaboration
  - shared memory
  - delegated subtasks
  - multi agent systems fail
  answer: >-
    Published failure studies of multi-agent LLM systems group most failures into three families, and my
    own experience matches them: specification problems, misalignment between agents, and weak verification.
    Collaboration failures. Agents disagree without resolution, loop politely, each deferring to the other;
    they drift from the original goal as each rewrites it in its own words; a reviewer agent rubber-stamps
    a producer agent because both share the same model blind spots, so two agents agreeing is not
    independent evidence. Costs and latency multiply: every hand-off is another set of model calls, and errors
    compound, five steps that are each 95 percent reliable succeed together only about 77 percent of the
    time. Shared memory failures. One agent writes a wrong intermediate fact and every other agent treats it
    as established; stale entries persist after the world changed; concurrent writes overwrite each other
    without a merge rule; and memory becomes a channel for injection, untrusted content written by one agent
    and read as instruction by another. Without provenance on every memory entry nobody can tell which agent
    wrote what, from what evidence. Delegated subtask failures. The delegator under-specifies the task, so
    the sub-agent solves a different problem; the result comes back in a format the delegator misreads;
    sub-agents are given broader tools than their subtask needs; and failures are reported as success,
    because the sub-agent's own stop condition was met. My mitigations follow directly: typed hand-off
    contracts with schemas and acceptance criteria, shared state owned by the orchestrator with provenance
    and versioning rather than a free-for-all scratchpad, verification by code or by a differently configured
    checker, per-agent least privilege, and global budgets on steps and cost. And I prefer fewer agents:
    I add one only when a subtask needs different context or permissions, which is how I approach the
    multi-agent systems I build with LangGraph, CrewAI and AutoGen at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems with LangGraph, CrewAI and AutoGen
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Multi-agent orchestration frameworks for customer insights and automated decisions

- id: iv4-agent-testing-paths
  topics: [interview, agentic, evaluation]
  questions:
  - How would you test an agent when multiple valid execution paths exist?
  - How do you test an agent that can take several valid paths to the same result?
  - How would you evaluate agents with non-unique execution paths?
  - How do you write tests for an agent whose trajectory varies?
  keywords:
  - multiple valid execution paths
  - valid execution paths
  - several valid paths
  - execution paths
  - trajectory varies
  answer: >-
    I stop testing the path and test the outcome, the invariants and the reliability, because asserting one
    golden trajectory fails the moment a correct agent takes a different correct route. Outcome first: each
    test case defines the end state, not the steps. For an agent that files a defect, the test checks the
    resulting ticket, its fields, its links and its severity against acceptance criteria, by code wherever
    possible, and by a rubric-based judge, calibrated against human labels, only where the output is
    language. I run agents against sandboxed copies of the systems they touch, seeded with known data, so the
    end state can be inspected. Invariants second: properties every valid path must respect, whichever route
    is taken. Never call a write tool without the required approval, never touch records outside scope, never
    exceed the step or cost budget, always cite the evidence used, never send data to a destination outside
    the allow-list. These are checked over the full trace of every run, and a single violation fails the
    test even if the outcome was right. Partial trajectory checks third, only where order is a real
    requirement: the agent must look up the customer before it changes the order, expressed as ordering
    constraints, not an exact sequence. Reliability fourth: I run each case several times, five or more, and
    report the rate at which all runs succeed, the pass-to-the-k measure from agent benchmarks such as
    tau-bench, rather than whether it succeeded once, because users experience consistency, not best cases.
    Plus efficiency metrics, steps, tokens, latency and cost per successful task, so a regression that makes
    the agent wander is caught even when it still succeeds. And adversarial cases: tools that time out,
    return errors or contain injected instructions. That is the philosophy behind ValidAIte and QMentisAI at
    Qualizeal: behaviour against criteria across repeated runs, not exact matches.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering

- id: iv4-approval-reversibility
  topics: [interview, agentic, governance]
  questions:
  - How would you implement human approval, reversibility, idempotency and auditability?
  - How do you implement human approval and reversibility for agent actions?
  - How do you make agent actions idempotent and auditable?
  - How would you make every agent action reversible?
  keywords:
  - human approval reversibility
  - reversibility
  - idempotency and auditability
  - idempotent and auditable
  - agent actions idempotent
  answer: >-
    As four mechanisms in the action layer, outside the model, so they hold whatever the model does. Human
    approval: high-risk action requests are queued, not executed, and the approver sees a decision-ready
    view: the exact change as a diff, the records affected, the evidence and reasoning the agent used with
    links to sources, the policy rule that triggered review and the consequence of approving. Approvals are
    signed by an identified person with the authority for that action class, time-limited, and bound to that
    exact request, so an approved request cannot be swapped for another. Reversibility: before any write the
    tool records the before-state, and each tool declares its compensating action, restore the field, cancel
    the order, retract the message, so a run can be rolled back record by record or as a batch. Truly
    irreversible actions, a payment, an external email, a deletion, are classified as such and always require
    approval, often with a delay window during which they can be cancelled, and deletions are soft first.
    Idempotency: every action request carries an idempotency key derived from the run, step and intent, and
    the tool gateway rejects a duplicate key, so a retry after a timeout cannot double-apply a change; the
    orchestrator's checkpointed state means a resumed run continues rather than repeats. Auditability: an
    append-only, tamper-evident log of every request, policy decision, approval, execution and result,
    linked by the trace ID to the prompt, model version, retrieved evidence and tool outputs, retained per the
    risk tier's policy, and queryable by run, user and record, so you can answer who changed this record, why
    and on whose authority. I test all four the way I test anything else: chaos tests that kill a run
    mid-write, duplicate deliveries and rollback drills. This is the control layer I insist on for agents
    that touch enterprise systems at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production multi-agent systems and AI governance frameworks
  - url: profile:services/Agentic AI System Design
    source: website
    why: Design and hands-on delivery of multi-agent systems

- id: iv4-autonomy-criteria
  topics: [interview, agentic, governance]
  questions:
  - Define measurable criteria for agent autonomy and escalation.
  - What measurable criteria decide how much autonomy an agent gets?
  - How do you decide when an agent must escalate to a human?
  - What metrics would you use to grant an agent more autonomy?
  keywords:
  - agent autonomy and escalation
  - criteria for agent autonomy
  - much autonomy an agent
  - escalate to a human
  - grant an agent more autonomy
  answer: >-
    Autonomy is granted per action class and earned with numbers, never granted to an agent as a whole. I
    define four autonomy levels: shadow, where the agent proposes and a person acts; supervised, where every
    action needs approval; bounded, where actions below a risk threshold run on their own and the rest need
    approval; and autonomous within a scope, with sampling-based review. An action class moves up one level
    only when it meets measured criteria over a minimum volume, for example five hundred proposals or four
    weeks, whichever is later. The criteria. Precision of proposals: the share an expert would have approved
    unchanged, with a threshold set by the cost of an error, say 98 percent for reversible writes and 99.5 for
    customer-facing ones. Severity-weighted error rate, because one wrong refund matters more than ten
    cosmetic slips. Consistency across repeated runs on the same case. Reversal rate: the share of executed
    actions later rolled back. Approval override rate: how often approvers edit or reject; an override rate
    near zero over a long period also triggers a check that approvers are actually reading. And coverage of
    the evaluation set for that action class. Escalation criteria are defined just as precisely, and any
    one triggers a hand-off with the state and evidence so far: the agent's confidence or the grounding check
    below a threshold; an action outside the declared scope or above a value limit; conflicting evidence;
    a budget on steps, time or cost exhausted; a policy rule triggered, such as personal data or an external
    recipient; repeated tool failures; or the user asking for a person. Demotion is automatic: if precision
    drops below the threshold or a severe error occurs, the action class drops a level until reviewed. This
    turns the autonomy conversation with risk owners from opinions into a dashboard, which is how I prefer
    to govern the agentic systems I design at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy, governance and production agentic systems
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI systems against measurable criteria

- id: iv4-prove-multi-agent
  topics: [interview, agentic, evaluation]
  questions:
  - How would you prove that a multi-agent design is better than a single agent or workflow?
  - How do you prove a multi-agent design beats a single agent?
  - What evidence shows a multi-agent architecture is better than a workflow?
  - How would you compare a multi-agent system against a single-agent baseline?
  keywords:
  - prove that a multi agent
  - multi agent design is better
  - multi agent design beats
  - single agent baseline
  - single agent or workflow
  answer: >-
    With a controlled comparison on the same tasks, where the multi-agent design must win on outcomes per
    unit of cost and risk, not on elegance. I build three contenders, each given an honest effort: a
    deterministic workflow with model calls inside its steps, a single agent with the union of the tools and
    a good prompt, and the multi-agent design. They run on the same evaluation set, drawn from real tasks and
    stratified by difficulty, in the same sandboxed environment with the same models, so the architecture is
    the only variable. Each case runs several times. The scorecard: task success measured on end state;
    reliability across repeated runs, the share where every run succeeds; severity of failures; cost per
    successful task including all model calls and retries; latency; and controllability, how often each
    design violates an invariant such as scope, budget or approval. Then I test the claim the multi-agent
    design is supposed to rest on. If its argument is specialisation, the single agent should fail on context
    overload, and I check whether giving the single agent the specialist's context in a retrieval step closes
    the gap. If its argument is independent verification, I check that the reviewer agent actually catches
    planted errors at a measurable rate; reviewers built on the same model often share the producer's blind
    spots. I run ablations, removing one agent at a time, to see which role creates value. The decision rule
    is written beforehand: multi-agent is adopted only if it beats the best simpler design by a margin outside
    the confidence interval on task success, at a cost and latency the business accepts, without more
    invariant violations. My expectation, which the test exists to check, is that it wins on genuinely broad tasks and loses on narrow ones.
    That evidence-first habit comes from validating AI systems on ValidAIte, and from my Knowledge Fabric's
    rule that a new component ships only after it beats the existing baseline on the same harness.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: New components evaluated against the baseline with the existing harness

- id: iv4-sandboxing
  topics: [interview, agentic, security]
  questions:
  - What is your strategy for sandboxing tools and limiting blast radius?
  - How do you sandbox agent tools and limit their blast radius?
  - How would you limit the blast radius of an agent?
  - How do you isolate code execution and tools that agents use?
  keywords:
  - sandboxing tools
  - blast radius
  - sandbox agent tools
  - isolate code execution
  - limiting blast
  answer: >-
    I assume any tool call can be hostile or wrong, and I size every boundary so the worst case is small and
    recoverable. Execution sandboxes: code an agent writes or runs executes in an ephemeral, isolated
    environment, a gVisor or Firecracker-style micro-VM or a locked-down container, created per task and
    destroyed after, with no host mounts, a read-only base image, CPU, memory and time limits, no credentials
    inside, and no network by default. If it needs the network, it goes through an egress proxy with an
    allow-list. Nothing a model returns is executed in a trusted context without validation, the rule I hold
    in CogniFlow, where the default compiler is deterministic and generated output is never run as code.
    Tool boundaries: every tool is a service behind a tool gateway that authenticates the agent, applies the
    user's delegated permissions, validates typed parameters and enforces per-tool quotas. Tools are narrow,
    update this field on this record, rather than general, run this query, so the most an injected
    instruction can do is the most the narrow tool allows. Data boundaries: read-only by default; write
    access scoped to specific records or tenants; production data replaced by masked or synthetic copies
    for anything experimental. Blast-radius limits: rate limits per agent, per user and per tool; volume
    circuit breakers that pause the agent when writes exceed a threshold in a window; value limits on
    financial actions; a global kill switch per agent; and segmentation, so an agent for one business unit
    cannot reach another's systems at all. Recovery: before-state recorded for every write and compensating
    actions defined, so a bad run can be reversed. And I test the boundaries with red-team tasks that try to
    escape them, kept in CI as regression tests. Scenario B in this interview is exactly what these limits prevent.
  evidence:
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: Deterministic compiler; nothing a model returns is executed as code
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade agentic systems and governance

# ----------------------------------------------------------------------------- S1.5 Research-to-production synthesis
- id: iv4-not-productionized
  topics: [interview, research, delivery]
  questions:
  - Describe a research idea you chose not to productionize. Why?
  - Tell me about a research idea you chose not to productionize.
  - Which promising technique did you decide not to put into production, and why?
  - Have you ever kept a research idea out of production on purpose?
  keywords:
  - not to productionize
  - chose not to productionize
  - decide not to put into production
  - out of production on purpose
  - research idea you chose
  answer: >-
    Two, one decided and one still waiting, and both from my Knowledge Fabric, where I can show you the
    evidence. The decided one: a transformer embedding model running in the browser at answer time. The
    research case was strong, sentence transformers understand paraphrase far better than lexical methods, and
    shipping one client-side would have kept the zero-backend design. I chose not to, at the start, because the
    model payload was over 20 MB, which broke the site's constraint of a fast, free, static page on a phone.
    So semantic retrieval began as LSA over TF-IDF, about 0.4 MB of int8 vectors, and MiniLM came in later in
    a form that respected the constraint: embeddings precomputed in the build, so the heavy work happens once,
    not on every visitor's device. The technique was right; the deployment form was wrong for the product.
    The one still waiting is my own PhD idea. A measured trust score per source and per claim is, I believe,
    better than the precedence rules Eidolon uses today, and it would be easy to wire one in. I am not doing
    that, because I have no evidence yet that it beats the rules, and the rules have properties production
    values: they are explainable to anyone who asks why the resume beat the website, deterministic, and
    already proven by every build's checks. A trust score would change rankings in ways a visitor or an
    auditor cannot easily contest. It enters production only after the fault-injection evaluation shows a
    gain outside the confidence interval, and then behind the same proof gate. A third example sits on the
    fabric's roadmap: a transformer re-ranker, to be evaluated against the LSA baseline using the existing
    harness before it ships. The principle: research earns production by beating the incumbent on our own
    evaluation, within the product's real constraints, not by being newer.
