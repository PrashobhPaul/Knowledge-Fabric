- id: iv4-gp-trust-boundaries
  topics: [interview, whiteboard, architecture]
  questions:
  - Logical architecture and trust boundaries.
  - What is the logical architecture of the GenAI platform, and where are its trust boundaries?
  - Where would you draw the trust boundaries in the enterprise GenAI platform?
  - Walk me through the logical architecture and trust zones of your GenAI platform.
  keywords:
  - trust boundaries
  - trust zones
  - logical architecture and trust
  - logical architecture of the genai platform
  answer: >-
    Five zones, and a trust boundary wherever data or authority crosses from one owner to another. Zone one,
    experiences: chat, IDE plug-ins, workflow and API clients. Untrusted from the platform's point of view:
    they authenticate the user, hold no secrets or model keys, and call only platform APIs. Boundary one sits
    here, where every request acquires a verified identity, a tenant and a business unit, and is rate-limited.
    Zone two, the global control plane: identity federation, the policy decision point, the model, prompt,
    tool and agent registries, the AI inventory, evaluation and FinOps. It holds configuration and metadata,
    never documents or prompts, so it can be global without breaking residency. Zone three, regional data
    planes, one cell per residency region: the AI gateway, knowledge services with their indexes, self-hosted
    model serving, the agent runtime and the regional telemetry and audit stores. Boundary two is the region
    edge: content enters a cell and never leaves it, and a request is routed to its cell by the user's home
    region and the data classification. Cells share nothing at runtime, so a failure or a breach is
    contained to one. Inside a cell, boundary three sits between orchestration and the gateway, where policy
    is enforced on every model call, and boundary four between agents and enterprise systems, at the tool
    gateway, where delegated permissions, approvals and quotas apply. Zone four, model providers: external
    APIs are a separate trust domain, reached through private endpoints in the same region, under contracts
    with no training on our data and defined retention; boundary five is the gateway's egress, where
    redaction and classification checks run before anything leaves. Zone five, enterprise systems of record,
    trusted for their own data but reached only through tools. Retrieved content and tool output are
    treated as untrusted input everywhere, whatever zone they came from. The diagram stays deliberately small,
    because every extra box is another boundary to secure.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Architecture reviews for organisations adopting AI

- id: iv4-gp-identity-residency
  topics: [interview, whiteboard, security]
  questions:
  - Identity, authorization, data classification and regional isolation.
  - How would you handle identity, authorization and regional isolation in the GenAI platform?
  - How does the platform enforce data classification and regional isolation?
  - How would you design authorization and data classification for the GenAI platform?
  keywords:
  - regional isolation
  - identity authorization data classification
  - authorization and regional
  - authorization and data classification
  - enforce data classification
  answer: >-
    Identity is reused, authorisation is decided centrally and enforced locally, classification travels with
    the data, and region is a property of every request. Identity: the enterprise identity provider is the
    only source of users, groups and attributes, federated by OIDC or SAML, with service identities through
    workload identity rather than keys. Agents get no identity of their own power: they act on behalf of a
    user, with an on-behalf-of token whose scope is the intersection of the user's rights and the agent's
    declared scope. Authorisation: role-based access for platform features, who may build, deploy or approve,
    and attribute-based access for data, business unit, region, classification, project membership. A
    policy decision point, policy as code in something like Open Policy Agent, answers one question for the
    gateway, the retrieval layer and the tool gateway alike: may this user, through this application or
    agent, do this to this data? Decisions are logged. Data classification: every source is mapped to the
    enterprise scheme, public, internal, confidential, restricted, and every chunk inherits its document's
    label and ACL at ingestion. Classification drives three things: which models may see it, restricted only
    to in-region self-hosted or approved private endpoints; which caches may hold it; and how long traces of
    it are kept. Regional isolation: each residency region is a separate cell with its own indexes, model
    serving, logs and keys, customer-managed keys held in that region's key management service. A user's
    home region and the data's region decide the cell, and the gateway refuses cross-region routing for
    resident data, so it fails closed rather than falling back abroad. The global control plane sees only
    metadata. Tests prove it: forbidden-document tests per business unit, and residency tests that try to
    route resident data to another region and must be refused. Identity outages fail closed.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks and enterprise programs
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Confidential data handled before indexing

- id: iv4-gp-model-access
  topics: [interview, whiteboard, models]
  questions:
  - Model access, routing, fallback, evaluation and provider abstraction.
  - How would the GenAI platform handle model access, routing and fallback?
  - How do you abstract model providers without a false abstraction?
  - How would you design provider abstraction and model evaluation in the platform?
  keywords:
  - provider abstraction
  - false abstraction
  - routing fallback
  - model access routing
  - abstract model providers
  answer: >-
    Through one AI gateway per regional cell, with routing as policy, fallback as an evaluated chain, and an
    abstraction that hides plumbing but not capability. Access: every model call, external API or
    self-hosted, goes through the gateway, which authenticates the caller, attaches tenant, user and data
    class, enforces quotas and budgets, redacts sensitive data before external calls, caches where policy
    allows, and records tokens, latency and cost per call. Applications hold no provider keys. Routing: in
    order, data classification and region decide which models are eligible; the declared task class picks
    the default model for that task, a small model for classification and extraction, a frontier model for
    hard reasoning; then live conditions, health, latency and budget, choose among the eligible ones. Cascades
    escalate to a stronger model only when a validation step fails. Fallback: each route has an ordered chain
    of models that have each passed that route's golden set, with per-model prompt variants, circuit breakers
    on error and latency thresholds, and a final degraded mode, retrieval-only answers with citations or a
    queued response, declared in advance. A model is only a fallback if it has been evaluated for that task.
    Evaluation: a model is admitted to the registry with its exact version, licence, data terms and results
    on each route's golden set; changes are promoted by canary with automatic rollback on quality, error or
    cost thresholds. Provider abstraction without false abstraction: the gateway standardises
    authentication, transport, streaming, logging and error codes, but capabilities stay explicit. A route
    declares what it needs, tool calling, structured output, context length, vision, and only models with
    those capabilities are eligible. I do not pretend all models are interchangeable behind one prompt; I
    make switching cheap by keeping prompts versioned per model and tests per route. That is the difference
    between portability and lowest-common-denominator design.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy; GenAI integration practices
  - url: profile:skills/LLM Platforms
    source: resume
    why: OpenAI, Claude and Gemini

- id: iv4-gp-knowledge
  topics: [interview, whiteboard, rag]
  questions:
  - Knowledge ingestion, indexing, retrieval and source-of-truth strategy.
  - What is the knowledge ingestion, indexing and retrieval strategy for the GenAI platform?
  - What source-of-truth strategy would the GenAI platform follow for knowledge?
  - How would the platform ingest and index SharePoint, Confluence, data lakes and SaaS content?
  keywords:
  - source of truth strategy
  - knowledge ingestion indexing
  - ingestion indexing and retrieval
  - ingest and index sharepoint
  - data lakes and saas
  answer: >-
    The source system stays the single source of truth; the platform holds governed, rebuildable derivatives
    and never becomes a second document store people edit. Ingestion: a connector framework, owned by the
    platform and extended by domains, for SharePoint through Microsoft Graph, Confluence, relational
    databases, data-lake tables and SaaS applications, driven by change events where the source offers them,
    with a nightly reconciliation crawl that catches what events missed. Each connector brings the content,
    its ACL, its version and its deletions. Parsing is per format, layout-aware for PDFs, table-preserving for
    spreadsheets, OCR with confidence for scans. Indexing: structure-aware chunks with provenance, the source
    URL, document ID, version, validity dates, business unit, region, classification and ACL groups; hybrid
    indexes, BM25 and dense vectors in one engine with filters, built per region and per domain where
    residency or isolation demands. An index is versioned by source snapshot, chunking configuration and
    embedding model, rebuilt side by side and switched by alias. Retrieval: identity-aware, the ACL filter
    applied inside the query before ranking; hybrid with reciprocal rank fusion and a cross-encoder
    reranker; validity filters so a superseded policy never answers a current question; and a no-answer
    path when evidence is weak. Structured and fast-changing data are not embedded: they are queried live
    through governed tools on the system of record, so answers about stock levels or ticket status are never
    stale. Source-of-truth strategy: every domain names an owner for each knowledge source and an
    authoritative tier, so when a wiki page and the policy system disagree the authoritative one wins and the
    owner is told. Freshness, deletions and permission changes have SLOs. This is my Knowledge Fabric's design
    at enterprise scale: provenance and dates on every record, evidence resolved at build, cross-source
    entity resolution and hybrid retrieval fused by rank.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Connectors to one record shape, provenance, hybrid retrieval fused by rank
  - url: doc:PhD_Anurag_University
    source: notes
    why: Provenance and date confidence on every record

- id: iv4-gp-agent-execution
  topics: [interview, whiteboard, agentic]
  questions:
  - Agent/workflow execution, tool registry, approvals and action controls.
  - How would the GenAI platform run agents and workflows with a tool registry and approvals?
  - What action controls and tool registry would the platform provide for agents?
  - How does the platform govern tool registration and agent approvals?
  keywords:
  - tool registry
  - action controls
  - approvals and action
  - workflow execution
  - tool registration
  answer: >-
    One governed runtime for agents and workflows, a registry that knows every tool, and an action layer that
    decides what executes. Execution: a managed runtime in each regional cell runs workflows and agents with
    explicit, checkpointed state, LangGraph-style graphs or the Microsoft Agent Framework for .NET teams, so a
    run can pause for approval, survive a restart, be replayed and be audited. Deterministic workflows are the
    default; agent nodes sit inside them where judgement is needed, with budgets on steps, tokens, time and
    cost, and code-checked termination. Long-running and batch work goes through queues with idempotent
    workers. Tool registry: every tool an agent can call is registered with an owner, a typed schema and
    version, a description written for the model, a risk class, read, reversible write, irreversible or
    external communication, the data classes it touches, its rate limits and its compensating action. Domains
    build tools on the platform's contract and register them; nothing unregistered is callable. MCP is the
    preferred protocol for exposing tools, behind the tool gateway rather than directly. Approvals: policy
    decides per call. Reads run; reversible writes below a value or volume threshold run with logging; higher
    risk goes to an approval queue showing the exact diff, affected records, the agent's evidence and the
    triggering rule, approved by a named person with the authority, bound to that exact request and
    time-limited. Action controls: on-behalf-of credentials intersected with the agent's scope, so an agent
    can never exceed its user; idempotency keys on every write; before-state recorded for reversal; volume
    circuit breakers that pause an agent on anomalous activity; a kill switch per agent and per tool; and
    autonomy levels per action class, earned with measured precision. Every request, decision and result goes
    to the immutable audit log. The 90-day slice ships the runtime and registry with read-only tools only;
    writes come later, under approval.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade multi-agent systems with LangGraph, CrewAI and AutoGen
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Microsoft Agent Framework and .NET

- id: iv4-gp-runtime-isolation
  topics: [interview, whiteboard, security]
  questions:
  - Runtime isolation, secrets, network egress and data-loss prevention.
  - How would the GenAI platform handle runtime isolation, secrets and network egress?
  - What data-loss prevention would you build into the GenAI platform?
  - How do you isolate tenants and control egress in the GenAI platform?
  keywords:
  - runtime isolation
  - data loss prevention
  - network egress
  - control egress
  - isolate tenants
  answer: >-
    Defence in depth, with every layer assuming the one above it can fail. Runtime isolation: workloads run
    in separate Kubernetes namespaces per business unit or tenant tier, with network policies that deny by
    default, pod security standards, and separate node pools for the highest classification. Code that agents
    write or run executes in ephemeral sandboxes, micro-VM or gVisor isolation, no credentials inside, no
    network unless allow-listed, destroyed after the task. Self-hosted models run on GPU pools isolated by
    tenant tier, with hardware partitioning such as MIG where GPUs are shared, so one tenant's memory is never
    another's. Caches are scoped by tenant and permission set. Secrets: in the vault, a cloud secrets manager
    or HashiCorp Vault, issued to workloads by identity, short-lived and rotated, never in code, images,
    prompts or traces. Tools get credentials from the tool gateway at call time, so a model never sees one.
    Provider API keys live only in the gateway. Network egress: everything leaves through egress gateways
    with allow-lists by destination; model providers through private endpoints in-region; agents' web access,
    where allowed at all, through a proxy that filters and logs. No direct internet from application or agent
    pods. Data-loss prevention: classification-aware redaction in the gateway before any external call,
    masking personal data, secrets and confidential names, with values re-inserted on the way back where the
    application needs them; DLP scanning on outbound tool payloads such as emails and tickets; output filters
    that block rendering of links or images to unknown domains, a common exfiltration path; and upload
    controls on what users may paste. Redaction happens before telemetry is stored, too. And I verify, rather
    than trust, the layers: egress tests from inside pods, secret scanners in CI, and red-team attempts to
    exfiltrate through each channel. Masking before anything is indexed is what my own Knowledge Fabric does
    for confidential client names.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Confidential client names masked in every source before indexing
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Docker, Kubernetes, AWS and GCP

- id: iv4-gp-observability
  topics: [interview, whiteboard, reliability]
  questions:
  - Observability, audit, evaluation, incident response and model lifecycle.
  - How would the GenAI platform handle observability, audit and incident response?
  - What model lifecycle and evaluation process would the GenAI platform run?
  - How would you design observability and audit for the GenAI platform?
  keywords:
  - incident response and model lifecycle
  - model lifecycle
  - observability audit evaluation
  - observability and audit
  - audit and incident response
  answer: >-
    Five capabilities sharing one trace ID, so any answer or action can be followed from the user to the
    model, the evidence and the outcome. Observability: OpenTelemetry tracing across the experience, the
    orchestration, retrieval, the gateway, model calls and tools, using the GenAI semantic conventions, with
    prompt and completion content captured only where policy allows and redacted first. Metrics per layer:
    availability, time to first token, latency per stage, tokens and cost per call, cache hit rate, retrieval
    scores, tool error rates, guardrail triggers. Stored per region, with dashboards per application and a
    portfolio view. Audit: an append-only, tamper-evident store per region recording who asked what, which
    documents were retrieved and at which versions, which model and prompt versions answered, which tools were
    called with what parameters, which approvals were given, and what happened, retained by the risk tier's
    policy. It is separate from debugging logs, with stricter access. Evaluation: offline, golden sets per
    application gating every change in CI; online, sampled production traffic scored for groundedness and
    task success by calibrated judges, user feedback and human review queues, with drift alerts when quality
    or input distributions shift. Incident response: an AI incident taxonomy, quality, safety, security,
    privacy, cost, availability, with severity levels, on-call ownership by the platform for platform layers
    and by domains for use cases, runbooks for the common ones, a provider outage, a prompt-injection
    finding, a leak, a cost spike, and post-incident reviews whose findings become tests. Model lifecycle:
    admission to the registry after evaluation and vendor review; promotion by canary; monitoring; periodic
    re-evaluation as providers change versions; and deprecation by alias with published dates. The same
    discipline runs at small scale in my Knowledge Fabric, where every answer carries the lineage of its
    sentences, visitors' flags become curator work and then regression tests, and every pull request runs the
    proof.
