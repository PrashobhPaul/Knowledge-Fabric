- id: iv4-demo-not-production
  topics: [interview, executive]
  questions:
  - How would you explain to a board why an apparently successful GenAI demo is not yet production-ready?
  - How do you explain to a board that a successful GenAI demo is not production-ready?
  - Why is a working GenAI demo not ready for production?
  - How do you tell executives a great AI demo still needs months of work?
  keywords:
  - apparently successful
  - genai demo
  - demo is not production
  - demo not ready for production
  - ai demo still needs
  answer: >-
    I would explain it in their terms, risk, scale and money, with one picture and four numbers, and I would
    never make the team that built the demo look foolish, because the demo did its job: it proved the idea.
    The picture: a demo is one good drive on a closed road; production is a fleet on public roads every day,
    in all weather. Then the four gaps. Scale of errors: the demo answered twenty hand-picked questions well.
    In production we expect perhaps fifty thousand questions a month; at the 91 percent accuracy our
    evaluation set shows, that is four and a half thousand wrong answers a month, some of them to customers.
    We need to know which ones, how bad, and how to catch them. Security: the demo used one person's access to
    clean data. Production has thousands of users with different permissions, and the system must never show
    a document to someone who cannot see it, and must resist people trying to trick it into leaking data;
    that is a known class of attack, not a hypothetical one. Cost: the demo's cost was invisible. At
    production volume we can estimate it, and we must be sure it is less than the value, per task. Operations
    and accountability: who is called at night when it fails, how we roll back a bad update, how we answer
    a regulator or an auditor who asks why it said what it said. Then the plan: what it takes to close each
    gap, usually eight to twelve weeks for a well-scoped use case, the milestones, and the measured bar it must
    clear before launch, so the board sees a date and a test rather than a refusal. I would close with the
    upside: if it clears the bar, the value is real and it is safe to scale. That is the gap ValidAIte exists
    to measure at Qualizeal: whether an AI system works reliably, not whether it once impressed.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders; production deployments

- id: iv4-sponsor-committed
  topics: [interview, executive]
  questions:
  - How do you handle an executive sponsor who has committed publicly to an agentic solution before feasibility has been established?
  - How do you handle a sponsor who announced an agentic solution before anyone checked feasibility?
  - What do you do when an executive has publicly promised an AI agent that may not be feasible?
  - How would you manage a sponsor who committed to agents too early?
  keywords:
  - committed publicly
  - executive sponsor
  - before feasibility
  - publicly promised
  - committed to agents too early
  answer: >-
    My job is to protect the sponsor's credibility and the enterprise from a bad system at the same time,
    and those turn out to be the same job if I move fast. First, a private conversation within days, not a
    public challenge. I acknowledge the goal behind the announcement, which is usually sound, faster claims,
    fewer handoffs, and I tell the sponsor plainly that I want them to be able to stand behind what ships.
    Second, a time-boxed feasibility sprint, two to four weeks, on real data and real cases, measuring what
    an agent can actually do: task success on a representative sample, error severity, the integrations and
    permissions it would need, cost per task. Evidence settles what opinions cannot, and it lets the sponsor
    change course on facts rather than on my say-so. Third, reframe the commitment rather than retract it.
    Agentic is a spectrum. Almost every public promise can be honoured with a staged path: an assistant that
    drafts and recommends, with people approving, in the first release; bounded autonomy for the low-risk
    action classes once measured precision clears the bar; more autonomy later. The sponsor can truthfully
    say the agentic programme launched on schedule, with the first stage live and the next gated on results.
    Fourth, I make the risks of the alternative explicit in writing: an autonomous agent acting on business
    records before its error rate is known is the scenario where a valid tool with excessive permissions
    modifies thousands of records. Fifth, I give the sponsor visible wins and a narrative: early metrics, a
    demo of the governed version, the reasoning for the staged approach in language they can repeat.
    What I do not do is go along silently and let it fail, or go around them. If evidence shows the core
    promise is infeasible, I say so with the data, early, while there is still time to reshape it. That
    preference for agreed stages over one big autonomous leap is the same one behind the spec-driven Kiro
    flow I use for a major US airline.
  evidence:
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Spec-driven agentic SDLC with Kiro, reviewed in stages
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy

- id: iv4-communicate-uncertainty
  topics: [interview, executive]
  questions:
  - How would you communicate uncertainty, risk and limitations without blocking innovation?
  - How do you communicate AI uncertainty and limitations without blocking innovation?
  - How do you talk about AI risk without becoming the person who says no?
  - How do you present the limitations of an AI system to leadership?
  keywords:
  - communicate uncertainty
  - without blocking innovation
  - limitations without blocking
  - person who says no
  - limitations of an ai system
  answer: >-
    I communicate uncertainty as ranges and plans, risk as owned decisions, and limitations as design
    constraints, so the message is always here is how we proceed, not here is why we cannot. Uncertainty:
    numbers with ranges and the evidence behind them. Not the assistant is accurate, but on our evaluation set
    of five hundred real questions it answers 91 percent correctly, the true figure is probably between 88 and
    93, and here is what the wrong nine percent look like. I separate what we know, what we do not know yet,
    and how and when we will find out, usually by a pilot or an evaluation with a date. Executives are
    comfortable with uncertainty that has a plan; they are uncomfortable with vagueness. Risk: each material
    risk goes in a register with a likelihood, an impact, a mitigation and a named owner who accepts the
    residual risk. That turns a worry into a decision someone makes, and it means my role is to make risks
    visible and options clear, not to veto. Limitations: framed as boundaries of the design. It drafts, a
    person approves; it covers these three document types, not scanned handwriting; it answers from our
    policies, and says so when they do not cover the question. A clear boundary often unlocks a launch,
    because the risk owner can accept a bounded system they could not accept unbounded. Two habits keep
    innovation moving. Tiers: low-risk experiments in a sandbox with synthetic or public data need no
    committee, so the cost of trying is low. And pre-mortems: before launch, the team imagines it failed and
    lists why, which surfaces risks early without making anyone the pessimist. My Knowledge Fabric is a
    small proof that limits build trust: it says when something is not on record instead of guessing, and
    that is precisely why people can rely on what it does say.
  evidence:
  - url: doc:Knowledge_Fabric
    source: notes
    why: Cited answers; honest when nothing is on record
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy

