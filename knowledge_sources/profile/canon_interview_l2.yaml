# ----------------------------------------------------------------------------- The defining question, ownership and the evidence capture sheet
- id: iv4-defining-question
  topics: [interview, strategy, close]
  questions:
  - Imagine you are accountable for the enterprise's GenAI direction for the next three years. What capabilities would you build, what would you deliberately avoid building, what would you standardize, what would you leave to individual teams, and what evidence would tell you that the strategy is working?
  - Imagine you are accountable for the enterprise's GenAI direction for the next three years.
  - If you owned our GenAI direction for three years, what would you build and what would you deliberately avoid building?
  - What evidence would tell you that a three-year GenAI strategy is working?
  - What would you deliberately avoid building in an enterprise GenAI strategy?
  keywords:
  - genai direction
  - next three years
  - deliberately avoid building
  - avoid building
  - strategy is working
  answer: >-
    Build, three capabilities that compound. A governed AI platform: one gateway for every model call with
    identity, policy, redaction and cost attribution; an agent runtime with a tool registry, approvals and
    sandboxing; and observability and audit in one schema. Knowledge services: our documents and systems of
    record made retrievable with permissions, provenance and freshness, and a knowledge graph for the domains
    where relationships matter; this is the part competitors cannot buy, and the part my research on source
    trust is about. And an evaluation capability: golden sets per workflow, calibrated judges, release gates
    and online quality monitoring, because the ability to measure is what lets us adopt new models quickly
    and safely. Deliberately avoid building: our own foundation model; a bespoke orchestration framework when
    LangGraph or the Microsoft Agent Framework will do; our own vector database; a chatbot for every
    department; and any agent that acts in business systems before its precision is measured. Standardise,
    and enforce in the platform: model access through the gateway, identity on every retrieval and tool call,
    data classification and residency, the trace and audit schema, the evaluation gate, risk tiering, and the
    tool contract and MCP for integrations. Leave to teams: the use cases and their outcomes, prompts and
    workflow design, user experience, domain tools built on the contract, their golden sets, and model choice
    among approved options. Evidence that it is working, reviewed quarterly against baselines: business
    outcomes moved by production use cases, with owners and finance signing the benefits; cost per successful
    task falling for comparable tasks; the share of GenAI traffic and spend through the platform rising
    towards all of it; time from idea to a governed pilot falling to days; the number of serious incidents,
    leaks, unauthorised actions, residency breaches, at or near zero; the time to adopt a better model
    shrinking from months to weeks because evaluation is ready; and adoption by employees that persists after
    the novelty. If after a year the platform is used but no business metric has moved, the strategy is not
    working, however elegant the architecture, and I would change the portfolio before changing the platform.
  evidence:
