# ----------------------------------------------------------------------------- S3.2 Governance, safety and regulatory readiness
- id: iv4-risk-tiering
  topics: [interview, governance]
  diagram: assets/diagrams/iv4-risk-tiering.svg
  questions:
  - Design a risk-tiering framework for enterprise GenAI use cases.
  - How would you design a risk-tiering framework for GenAI use cases?
  - How do you classify GenAI use cases into risk tiers?
  - What risk tiers would you define for enterprise AI, and what controls go with each?
  keywords:
  - risk tiering framework
  - risk tiering
  - risk tiers
  - classify genai use cases
  - controls go with each
  answer: >-
    Four tiers, assigned by the worst dimension rather than an average, each with a fixed control set so a
    team knows on day one what its use case will need. Seven dimensions are scored at intake: impact on
    individuals, does the output affect someone's rights, money, job, health or access to a service; autonomy,
    from information only through recommendation to action in systems; data sensitivity, from public to
    restricted and special-category personal data; exposure, internal or customer-facing; scale; reversibility
    of errors; and the regulatory domain. Tier zero, prohibited: practices the EU AI Act bans under Article 5,
    such as social scoring, manipulative techniques or emotion recognition in the workplace, plus the
    company's own red lines. Not built, whatever the business case. Tier one, high: decisions about
    individuals in the areas the AI Act lists as high-risk in Annex III, employment, credit scoring,
    insurance pricing, education, essential services, or agents taking irreversible or financial actions, or
    regulated model use such as credit decisions under model risk management. Controls: a full risk and
    impact assessment, documented design and data governance, designed human oversight, independent
    validation and red-teaming before launch, complete logging and retention, risk-council approval, ongoing
    monitoring and an annual review. Tier two, medium: customer-facing generation, decision support with human
    review, agents with reversible writes. Controls: golden-set and red-team gates, AI disclosure to users
    under the Act's transparency rules, labelled generated content, sampled human review and owner sign-off.
    Tier three, low: internal, read-only productivity, an assistant over internal documents. Controls: the
    paved road, standard evaluation gates and self-certification, so these move in days. Any material change,
    new data, new tools, more autonomy, a new market, re-triggers tiering. The framework is the MAP function of
    the NIST AI RMF made operational, and it feeds the impact assessments ISO/IEC 42001 expects. It is the risk
    tiering I build into the AI governance frameworks I drive at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Driving AI architecture strategy and governance frameworks
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: AI governance for organisations adopting AI

- id: iv4-operationalize-rai
  topics: [interview, governance]
  questions:
  - How would you operationalize responsible AI principles rather than leave them as policy statements?
  - How do you operationalize responsible AI principles?
  - How do you turn responsible AI principles into practice?
  - How do you make responsible AI more than a policy document?
  keywords:
  - responsible ai principles
  - operationalize responsible
  - policy statements
  - responsible ai more than
  - responsible ai into practice
  answer: >-
    By turning each principle into a control, each control into a test, and each test into evidence produced
    by the pipeline as a by-product of shipping, so compliance is something the system does, not something
    people remember. Step one, a control library. Each principle, fairness, transparency, privacy, safety,
    accountability, reliability, is decomposed into concrete controls with owners. Transparency becomes users
    told they are talking to AI, citations on every grounded answer, and generated content labelled. Privacy
    becomes redaction before external calls, data minimisation and retention limits. Fairness becomes
    disaggregated evaluation across relevant groups for tier-one use cases. Step two, embed controls in the
    life cycle by tier. Intake asks the tiering questions; design reviews check the pattern; CI runs the
    evaluation gates, groundedness, safety, fairness slices, permission tests; release is blocked
    automatically if a required control lacks evidence; production monitoring tracks the same metrics. Step
    three, enforce at runtime where possible: policy as code in the gateway and tool gateway, so a rule such
    as restricted data never goes to external models is enforced, not advised. Step four, accountability: a
    named owner for every AI system in the inventory, a responsible AI review board that sees only the high
    tier and new patterns, and decision rights written down, including who may accept residual risk. Step
    five, measure the programme itself: share of systems in the inventory, share passing their gates, time
    through review, incidents and how fast they close. Step six, people: training for builders on the control
    library, for users on appropriate reliance, and an easy route to raise concerns. ISO/IEC 42001 gives the
    management-system wrapper, policy, objectives, internal audit and management review, and the NIST AI RMF
    the risk method. I hold my own work to it: my Knowledge Fabric's principles are enforced by its build,
    evidence resolved, names masked, every answer cited, the proof gating every change.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Principles enforced by the build and the proof gate
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-regulatory-mapping
  topics: [interview, governance]
  questions:
  - How would you map a use case to applicable regulatory and contractual obligations across jurisdictions?
  - How do you map a GenAI use case to its regulatory and contractual obligations?
  - How would you work out which regulations apply to an AI use case in several jurisdictions?
  - How do you build an obligations register for AI across countries?
  keywords:
  - regulatory and contractual obligations
  - contractual obligations
  - across jurisdictions
  - obligations register
  - several jurisdictions
  answer: >-
    I treat it as a structured lookup with legal judgement at the end, not a fresh legal essay per use case.
    Step one, describe the use case in the attributes that trigger law: where the users, the affected people
    and the data are; the sector; our role, provider or deployer of the AI system, and whether we modify a
    general-purpose model; the data categories, personal, special-category, children's, client-confidential;
    what the output does, inform, recommend or decide, and about whom; and its autonomy. Step two, run those
    attributes against an obligations register maintained with legal. In the EU, the AI Act: is it
    prohibited, high-risk under Annex III, subject to transparency duties, and what does our role require, a
    deployer's duties under Article 26, perhaps a fundamental rights impact assessment. The GDPR: lawful basis,
    a data protection impact assessment, Article 22 on solely automated decisions, transfers. In India, the
    Digital Personal Data Protection Act. Sector rules: model risk management such as the Federal Reserve's
    SR 11-7 for banks in the US, health-data rules such as HIPAA for US patient data, consumer protection and
    employment law. Step three, contracts, which bind as hard as law: client agreements that restrict how
    their data may be processed or whether AI may be used on it at all; model-provider terms on retention,
    training use and IP indemnity; open-weight model licences and acceptable-use policies; and data licences.
    Step four, map every obligation to controls in the shared control library, so one control, say logging
    of inputs and outputs, satisfies several obligations, and jurisdiction-specific deltas, residency or
    retention, become policy-as-code parameters per region. Step five, legal and the privacy office sign off
    the interpretation; architecture owns the controls; the register is versioned and re-run when a law, a
    market or the use case changes. Client contracts are why my own systems treat confidentiality as a build
    rule: client names are masked before anything is indexed.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks across enterprise programs
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Client names masked before indexing

- id: iv4-ai-act-nist-iso
  topics: [interview, governance]
  questions:
  - How would you use the EU AI Act, NIST AI RMF and ISO/IEC 42001 together in an enterprise AI governance programme?
  - How do the EU AI Act, the NIST AI RMF and ISO 42001 fit together?
  - How would you combine the EU AI Act, NIST AI RMF and ISO/IEC 42001 in AI governance?
  - What is the difference between the EU AI Act, NIST AI RMF and ISO 42001?
  keywords:
  - eu ai act
  - nist ai rmf
  - iso iec 42001
  - iso 42001
  - ai act nist
  answer: >-
    They are three different kinds of instrument, and the mistake is to treat them as three checklists. The
    EU AI Act is law: a risk-based regulation that prohibits some practices outright, imposes strict
    requirements on high-risk systems, adds transparency duties for systems such as chatbots and generated
    content, and sets obligations for providers of general-purpose AI models. It entered into force in August
    2024; the prohibitions have applied since February 2025 and the general-purpose model obligations since
    August 2025, while the high-risk requirements phase in from 2026 to 2027, with dates subject to the EU's
    simplification proposals, so I track the official timeline rather than hard-code it. Fines reach 35
    million euros or 7 percent of global turnover for prohibited practices. The NIST AI RMF is a voluntary
    framework, a risk method: Govern, Map, Measure and Manage, with trustworthiness characteristics such as
    valid and reliable, safe, secure and resilient, accountable and transparent, explainable, privacy-enhanced
    and fair, and a Generative AI Profile, NIST AI 600-1, that catalogues GenAI risks like confabulation,
    information security and data privacy. ISO/IEC 42001 is a certifiable management-system standard: it
    makes an organisation run AI governance like ISO 27001 runs security, with policy, roles, objectives, an
    AI impact assessment, Annex A controls, internal audit, management review and continual improvement. How
    I combine them: ISO/IEC 42001 is the operating system, the management system that gives governance owners,
    a rhythm and auditability. The NIST AI RMF is the risk engine inside it: Map is our use-case intake and
    risk tiering, Measure is the evaluation and red-team programme, Manage is risk treatment and monitoring,
    Govern is accountability and culture, and its GenAI profile is our risk catalogue. The EU AI Act is the
    legal requirements layer mapped onto that machinery: for a high-risk system, its articles on risk
    management, data governance, technical documentation, logging, transparency, human oversight, accuracy and
    robustness, and post-market monitoring each map to controls and evidence we already produce. One control
    library, one evidence trail from the platform, three audiences. One caution I always give: ISO 42001
    certification does not by itself make a system AI Act compliant; conformity needs the Act's own
    requirements and, as they arrive, the harmonised standards. This is the governance architecture I drive
    at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Driving AI architecture strategy and governance frameworks
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: AI governance for organisations adopting AI

- id: iv4-privacy-controls
  topics: [interview, governance, security]
  questions:
  - What controls are needed for privacy, data retention, copyright, explainability and auditability?
  - What controls do you need for privacy and data retention in GenAI?
  - How do you handle copyright and explainability controls for generative AI?
  - Which auditability and explainability controls does a GenAI system need?
  keywords:
  - data retention copyright
  - copyright explainability
  - privacy and data retention
  - explainability and auditability
  - copyright and explainability
  answer: >-
    Five areas, each with preventive controls, detective controls and evidence. Privacy: data minimisation in
    prompt design and retrieval, sending only the fields a task needs; classification-aware redaction of
    personal data before external model calls; a lawful basis and, where risk is high, a data protection
    impact assessment before launch; model providers contracted as processors with no training on our data;
    residency enforced in the platform; and support for data-subject rights, so an erasure request deletes the
    person's data from sources, indexes, caches, conversation history and evaluation sets, propagated as
    tombstones. Data retention: retention set per data class and artefact, prompts, outputs, traces, feedback,
    audit records, each with its own period, enforced by automated expiry, with legal holds overriding it; audit
    records kept longest, debug content shortest. Copyright: on the input side, only content we have rights to
    index or fine-tune on, with licences recorded in the catalogue; on the output side, provider IP
    indemnities where available, filters for verbatim reproduction of long protected text and code with
    licence detection for generated code, and attribution through citations in grounded answers; and a
    policy that generated content is reviewed before external publication. Explainability, honest about what
    is possible: a large model's internals are not explainable in the classic sense, so I explain the system,
    not the weights. Grounded answers cite the sources each claim came from; agent runs keep the plan, the
    tool calls and the evidence used; decisions show the rules and thresholds applied; and high-impact
    decisions about people are made or confirmed by a person who can give reasons. Auditability: immutable
    logs linking each output to its inputs, retrieved document versions, model and prompt versions, tools and
    approvals, retrievable per decision. My Knowledge Fabric is built on the same idea: every sentence of
    an answer carries its lineage back to the record it came from.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Every sentence cited, with lineage to its source record
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-vendor-assessment
  topics: [interview, governance, security]
  questions:
  - How would you assess third-party models and vendors for security, resilience, data use and contractual risk?
  - How do you assess third-party AI vendors for security and data use?
  - How would you evaluate a model provider's resilience and contractual risk?
  - What is your due diligence for third-party AI models and vendors?
  keywords:
  - third party models
  - third party ai vendors
  - contractual risk
  - due diligence
  - model provider s resilience
  answer: >-
    A tiered due-diligence process, proportionate to what the vendor will touch, covering five areas and
    ending in a contract that encodes the answers. Security: certifications such as SOC 2 Type II and ISO
    27001, and ISO/IEC 42001 where the vendor has it; penetration-test summaries; how they isolate customers;
    encryption and customer-managed keys; access controls on their staff; vulnerability and incident
    disclosure; and, for AI specifically, their defences against prompt injection and abuse and their own
    red-teaming. For models we host, supply-chain checks: provenance of the weights, signed artefacts, safe
    serialisation formats, and a licence review. Resilience: published availability and historical incidents,
    regional redundancy, rate limits and capacity guarantees, version deprecation policy and how much warning
    they give, and their financial and concentration risk. A provider that can retire a model at short warning is a
    risk to every workflow pinned to it, so exit planning is part of the assessment. Data use: whether
    inputs and outputs are used for training, by default or ever; retention periods, including abuse
    monitoring logs; where processing happens; sub-processors; and whether human reviewers at the vendor can
    see our data. Contractual risk: a data-processing agreement, residency commitments, IP indemnity for
    outputs, liability caps proportionate to the use, audit rights, breach notification times, and the right
    to export our data and fine-tuned artefacts on exit. Model quality and behaviour: our own evaluation on our
    golden sets, bias and safety testing for the intended use, documentation such as model cards, and how the
    vendor communicates silent model updates. The result is an approval per vendor and per model, scoped to
    data classes and risk tiers, recorded in the registry and re-assessed yearly or on any material change.
    It is the same evaluation-first stance ValidAIte takes at Qualizeal: trust a model after testing it on
    our cases, not because of a datasheet.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-synthetic-generated-content
  topics: [interview, governance]
  questions:
  - How would you govern synthetic data, generated content and AI-assisted decisions?
  - How do you govern synthetic data and generated content?
  - What governance would you apply to AI-assisted decisions?
  - How should an enterprise control AI-generated content and synthetic data?
  keywords:
  - synthetic data
  - generated content
  - ai assisted decisions
  - ai generated content and synthetic
  answer: >-
    Three different artefacts with three different risks, so three sets of rules. Synthetic data, used to
    test, evaluate or train: the risks are leakage, synthetic records that re-identify real people, and
    distortion, data that does not represent reality and misleads a model or a test. Controls: synthetic data
    generated from approved sources with documented methods; a privacy check that no generated record is too
    close to a real one, for example nearest-neighbour distance tests for tabular data; labelling of every
    dataset as synthetic, with lineage to its generator and source, so it is never mistaken for production
    data; fitness tests that the synthetic set reproduces the distributions and edge cases that matter; and a
    rule that synthetic evaluation never fully replaces real evaluation for a high-risk use. For sensitive
    golden sets I prefer synthetic cases, the structure of real questions without the confidential content. Generated content, text,
    images, code and audio that leaves the system: the risks are error, IP, deception and brand. Controls:
    disclosure, people told when they interact with an AI and synthetic media marked as such, which the EU AI
    Act's transparency obligations require in many cases; machine-readable provenance, watermarking or
    content credentials where the tooling supports it; human review before external publication, scaled by
    tier; filters for protected-text reproduction and licence detection for generated code; and a ban on
    presenting generated reviews, testimonials or people as real. AI-assisted decisions, where the risk is
    harm to individuals and lost accountability: controls are that a named human decision-maker is
    accountable and recorded; the AI's recommendation, its evidence and its confidence are shown and logged;
    the decision-maker can override easily, and overrides are monitored; people affected can get an
    explanation and contest the decision; and outcomes are monitored for disparity across groups. For
    tier-one decisions the record must let us reconstruct exactly what the person saw when they decided.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI systems, including evaluation datasets

- id: iv4-red-teaming-incidents
  topics: [interview, governance, security]
  questions:
  - How do you establish red-teaming, incident classification, escalation and post-incident learning?
  - How would you set up AI incident classification and escalation?
  - How do you establish red-teaming and post-incident learning for AI?
  - What does an AI incident management process look like?
  keywords:
  - incident classification
  - post incident learning
  - ai incident classification
  - ai incident management
  - incident classification escalation
  answer: >-
    As one loop: red-teaming finds failures before users do, incident management handles the ones they find,
    and post-incident learning turns both into tests. Red-teaming: a standing programme, not a launch event.
    Scope by risk tier, every tier-one system before launch and after material changes. Attack catalogues
    organised around the OWASP Top 10 for LLM applications, prompt injection, sensitive-information
    disclosure, excessive agency, system-prompt leakage, misinformation, unbounded consumption, and MITRE
    ATLAS for adversary techniques, plus domain abuse cases written with the business. Automated tools such as
    PyRIT or garak generate variants at scale; people, including people outside the build team, find the
    creative ones. Findings are rated by severity and fixed before launch for high and critical. Incident
    classification: an AI-specific taxonomy on top of the existing IT one, categories of harmful or wrong
    output, data leakage, security compromise such as injection or exfiltration, unauthorised action,
    discrimination, cost runaway and availability; and severities by impact, severity one for harm to people,
    regulated data exposure or unauthorised changes to business records, down to severity four for cosmetic
    quality issues. Escalation: severity sets the clock and the audience, platform on-call and the system
    owner always; security and privacy for leaks and compromise; legal and the risk council for harm,
    regulated exposure or reportable events. Under the EU AI Act, providers of high-risk systems must report
    serious incidents to authorities, so the timeline is defined in advance, not discovered. Kill switches and
    degraded modes are part of the runbook. Post-incident learning: a blameless review within days, with a
    timeline from traces and audit logs, the root cause by layer, model, prompt, retrieval, tool, data or
    process, and actions with owners. Every incident and red-team finding becomes a regression test in that
    system's suite, so the same failure cannot return silently. My Knowledge Fabric does the small version:
    a flagged answer becomes a regression test once fixed.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Flags become regression checks once resolved
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems

- id: iv4-human-oversight
  topics: [interview, governance]
  questions:
  - Where should human oversight be mandatory, and how do you avoid approval becoming a rubber stamp?
  - Where should human oversight be mandatory for AI?
  - How do you stop human approval of AI outputs becoming a rubber stamp?
  - How do you design meaningful human oversight for AI decisions?
  keywords:
  - human oversight
  - rubber stamp
  - oversight be mandatory
  - meaningful human oversight
  answer: >-
    Mandatory where the stakes justify a person's time, and designed so the person is genuinely deciding,
    because a human who approves everything is worse than no human: it adds cost and a false sense of
    safety. Where it is mandatory: decisions with legal or similarly significant effects on individuals,
    hiring, credit, benefits, health, discipline, which is also where the GDPR's Article 22 and the EU AI
    Act's human-oversight requirement for high-risk systems point; irreversible or financial actions by agents,
    payments, deletions, contract changes; external communications in the company's name above a defined
    risk; actions outside an agent's earned autonomy level; and any case the system itself flags as
    low-confidence or conflicting. Elsewhere oversight is sampling-based, reviewing a share of outputs after
    the fact, which scales. Avoiding the rubber stamp, six design choices. One, show the decision, not just
    the output: the exact change, the evidence with sources, the system's confidence and what it is unsure of,
    so the reviewer evaluates rather than trusts. Two, manageable volume: if a reviewer sees hundreds of items
    an hour, approval becomes reflex; tiered routing keeps human review for the cases that need it. Three,
    authority and skill: the approver must be qualified for that decision and free to reject without penalty.
    Four, friction in the right place: high-impact approvals require a reason or a check of one specific
    field. Five, measure the reviewers: approval rates near 100 percent over long periods, very short review
    times, and missed planted errors are signals. I would seed known-bad cases into review queues to measure
    whether reviewers catch them. Six, accountability: the approver's name is recorded, so approval is a decision
    someone owns. The aim is calibrated reliance: people trusting the system where it has earned it and
    checking where it has not, which is what the staged autonomy levels I use for agents are built on.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance and production agentic systems
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Spec-driven flow with human review at each stage

- id: iv4-accountability-unauthorized
  topics: [interview, governance]
  questions:
  - Who is accountable when an agent takes an unauthorized action?
  - Who is accountable when an AI agent takes an unauthorized action?
  - Who owns the consequences when your agent does something it was not allowed to do?
  - Who is responsible if an AI agent acts without authorization?
  keywords:
  - unauthorized action
  - takes an unauthorized
  - acts without authorization
  - who is accountable
  - who owns the consequences
  answer: >-
    Never the agent. Accountability has to land on people and on roles defined before anything goes wrong,
    and I separate three layers. Accountable for the outcome, to the business and to anyone harmed: the
    business owner of the AI system, the named executive who approved deploying it at its risk tier and
    accepted its residual risk. Externally, the enterprise is accountable as the deployer; under the EU AI
    Act a deployer of a high-risk system carries its own duties, using it as instructed, assigning
    competent human oversight and keeping logs, and the provider carries others. Inside, accountability does
    not dissolve into the platform. Responsible for the controls that should have prevented it: if the agent
    could take the action because its permissions were too broad, the owner of the agent's definition and
    tool scope; if a platform control failed, the policy engine, the tool gateway, the circuit breaker, the
    platform team that owns it; if an approver approved it, the approver for that decision, provided they were
    shown what they needed to decide. That is why every agent has an owner in the inventory and every tool
    has an owner in the registry. Responsible for the response: the incident commander under the incident
    process, from containment to remediation and disclosure. Two principles keep this fair and useful. The
    review is blameless about individuals and strict about design: the question is which control allowed an
    unauthorised action to be possible, because a valid tool with excessive permissions is a design failure,
    not an AI personality trait. And there is no accountability gap by construction: the agent acts on
    behalf of a named user with delegated, logged authority, so every action traces to a person whose rights
    it used and to the owner who granted the agent its scope. If nobody can be named in advance, the agent is
    not ready to act. That is the principle I build into the agent governance I set at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks and production agentic systems
  - url: profile:services/Agentic AI System Design
    source: website
    why: Design and delivery of multi-agent systems

- id: iv4-decision-evidence
  topics: [interview, governance]
  questions:
  - What evidence would you retain to reconstruct a disputed AI-assisted decision?
  - What would you keep to reconstruct a disputed AI-assisted decision?
  - How do you make an AI-assisted decision reconstructable for an audit or dispute?
  - What audit evidence should an AI decision leave behind?
  keywords:
  - disputed ai assisted decision
  - reconstruct a disputed
  - reconstructable
  - audit evidence should
  - ai decision leave behind
  answer: >-
    Enough to replay what the system saw, what it did and what the person saw when they decided, at that
    moment, with versions, not just today's state. The record, keyed by one decision ID and trace ID. The
    request: who asked, on whose behalf, when, through which application, and the input as received, with
    personal data handled under the retention policy. The context: the exact retrieved documents and chunks
    with their version identifiers and the permissions applied, the structured data fetched from systems of
    record with timestamps, and any memory used. The system configuration: model name and exact version,
    provider and region, prompt version, agent definition version, tool versions, index version and policy
    versions, which is why a release manifest pins them all. The processing: tool calls with parameters and
    results, intermediate outputs, guardrail and policy decisions with the rules that fired, confidence or
    grounding scores, and retries or fallbacks taken, because a decision made by a fallback model is a
    different decision. The output: what the system recommended or did, its explanation and citations. The
    human step: who reviewed it, exactly what was displayed to them, how long they took, what they changed,
    and their stated reason. The outcome: what happened afterwards, the action executed, any reversal, and any
    complaint. Storage: append-only and tamper-evident, with hashes chained or anchored, retained for the
    period the risk tier and the regulation require, in the right region, with access restricted and logged.
    I also keep the ability to re-run: with the pinned versions and the stored context, a reviewer can
    reproduce the model's behaviour as closely as a non-deterministic system allows, and can tell whether the
    error was in the evidence, the model or the human step. My Knowledge Fabric's lineage of every sentence
    back to its record is the same principle at small scale.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Lineage of every sentence; deterministic build
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-policy-runtime-test
  topics: [interview, governance, security]
  questions:
  - How do you test whether a policy is actually enforced at runtime?
  - How do you test that an AI policy is enforced at runtime?
  - How would you verify AI governance policies are really enforced in production?
  - How do you prove a control works rather than just exists?
  keywords:
  - enforced at runtime
  - policy is actually enforced
  - policies are really enforced
  - control works rather than
  answer: >-
    By attacking it continuously and measuring the result, because a policy that only exists in a document or
    a configuration file is a hope. Four kinds of evidence. One, policy as code with unit tests: rules in the
    policy engine are code, restricted data may not route to external models, agents may not call write tools
    above their autonomy level, each with tests for allowed and denied cases, run in CI on every policy
    change. That proves the rule is what we think it is. Two, synthetic transactions in production: canary
    requests that should be refused, a request tagged with resident data trying to reach a foreign region, a
    forbidden-document query from a test user, a tool call outside an agent's scope, sent continuously, with
    an alert if any one succeeds. That proves the rule is actually in the request path, not bypassed by a team
    calling a provider directly. Three, coverage of the path: network-level proof that no workload can reach
    model providers except through the gateway, egress logs reconciled against gateway logs and provider
    invoices; a spend that appears on an invoice but not in the gateway is a bypass. Four, adversarial
    testing: red-team exercises that try to defeat the control, injection to trigger a privileged tool,
    prompt variations to leak restricted content, and chaos tests that disable a dependency to check the
    control fails closed rather than open. Results go on a control dashboard: each control, its last test, its
    pass rate, and its exceptions, which is the evidence an auditor or an ISO/IEC 42001 internal audit wants.
    The same principle runs in my own system: my Knowledge Fabric's integration tests check every curated
    answer and indexed record for client names on every push, so the confidentiality rule is proven on every
    build rather than asserted.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Integration tests prove confidentiality on every push
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

# ----------------------------------------------------------------------------- S3.3 Leadership and organizational design
- id: iv4-architecture-function
  topics: [interview, leadership]
  questions:
  - How would you organize an enterprise AI architecture function and its relationship with platform engineering, security, data, product and business teams?
  - How would you organize an enterprise AI architecture function?
  - How should an AI architecture team work with platform engineering, security and data teams?
  - What is the right structure for an enterprise AI architecture group?
  keywords:
  - ai architecture function
  - architecture function
  - platform engineering security
  - ai architecture group
  - ai architecture team work with
  answer: >-
    Small at the centre, embedded at the edges, and defined by the decisions it owns rather than the reviews
    it runs. Shape: a head of AI architecture with a few principal architects at the centre, owning the
    reference architecture, the standards, the technology radar and the platform's architecture, and domain
    AI architects embedded in the business units' product groups, roughly one per three to five product
    teams, reporting on a dotted line to the centre and a solid line to the domain, so they serve the domain
    but carry the standards. Relationships, each with a clear interface. Platform engineering: architecture
    defines the target capabilities and contracts; platform engineering owns building and running them as a
    product. We share one roadmap, and the principal architect for the platform sits in its planning. Security:
    a jointly owned AI threat model and control library, an AI security architect who belongs to both teams,
    and security as a co-signer for the high-risk tier only, so it is involved early instead of reviewing late.
    Data: the knowledge services depend on data ownership, quality and classification, so data architecture
    and AI architecture share the semantic layer, the catalogue and the source-of-truth decisions, and data
    owners in the domains are named for every knowledge source. Product: product managers own outcomes and
    priorities; architects own technical direction and trade-offs; disagreements go to a written decision
    record, not escalation. Business: domain architects work with business owners on value cases and
    baselines, and they translate between the two languages. Forums: a lightweight architecture review only
    for high-risk and one-way-door decisions, decision records for everything significant, a community of
    practice open to every engineer, and a quarterly portfolio review with leadership. Success measures for the
    function itself: lead time for decisions, adoption of the paved road, incidents traced to architecture
    gaps, and how often teams ask for architects, not how often they are forced to see them. It is the
    direction I take with the AI Center of Excellence roadmap I lead at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading the AI CoE roadmap; AI architecture strategy and governance
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Technical Architect; mentored AI teams across three geographies

- id: iv4-platform-roles
  topics: [interview, leadership]
  questions:
  - What roles and skills are needed to operate a mature GenAI platform?
  - What roles are needed to operate a mature GenAI platform?
  - Which skills does a team running a GenAI platform need?
  - Who do you need on a team that operates an enterprise AI platform?
  keywords:
  - mature genai platform
  - operate a mature
  - running a genai platform
  - operates an enterprise ai platform
  answer: >-
    Operating a platform is a different job from building one use case, so the roles shift towards product,
    reliability, evaluation and risk. The core platform team. A platform product manager who treats the
    platform as a product with internal customers, a roadmap and SLOs. Platform and backend engineers for the
    gateway, APIs, SDKs and self-service. LLMOps and MLOps engineers for model serving, GPU pools, deployment
    pipelines, registries and canary releases. Site reliability engineers owning SLOs, on-call, capacity and
    disaster recovery. Knowledge engineers and data engineers for connectors, parsing, indexing, ACL sync and
    freshness, the part most often understaffed. Evaluation engineers, a role I care about because it is my
    own field at Qualizeal: they build harnesses, judges, golden-set tooling and release gates, and keep the
    judges calibrated against humans. AI security engineers and red-teamers for threat models, guardrails,
    injection defences and continuous adversarial testing. Applied scientists for routing, retrieval quality,
    fine-tuning and adapting research. A FinOps analyst for attribution, forecasting and optimisation. Around
    the core: an AI governance and risk lead who runs tiering, the inventory and audits; privacy and legal
    partners; developer-experience engineers who write templates, documentation and run enablement; and, in
    each domain, the people the platform depends on, domain experts who define correct and build golden sets,
    and conversation or interaction designers for user-facing assistants. Skills that cut across every role:
    systems thinking, because quality, cost and risk are coupled; statistical literacy for evaluation; security
    instinct around untrusted input; and the ability to explain trade-offs to business owners. I hire for
    those as much as for frameworks, which change every year. The sizes depend on the estate, but the
    evaluation, knowledge and reliability roles are the ones organisations forget until an incident.
  evidence:
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering platform
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems

- id: iv4-no-gatekeeping
  topics: [interview, leadership]
  questions:
  - How do you build architecture capability in teams without making the architecture group a gatekeeping function?
  - How do you build architecture capability in teams without gatekeeping?
  - How do you keep the architecture group from becoming gatekeepers?
  - How do you spread architecture skills across engineering teams?
  keywords:
  - gatekeeping
  - gatekeepers
  - architecture capability in teams
  - spread architecture skills
  answer: >-
    I aim for the architecture group to be the place teams come to for help, measured by how often they ask,
    and the way to get there is to move decisions to the teams with good defaults and good questions. Five
    practices. One, an advice process for most decisions: a team may make an architecture decision itself
    after seeking advice from the people affected and an architect, and recording it in a short decision
    record. Only one-way doors, high-risk tier systems, security boundaries, irreversible data choices, need
    formal review. Two, make the right thing the easy thing: paved-road templates, reference patterns and
    automated checks in CI for the mandatory standards, so compliance does not need a meeting. If a rule needs
    a human gate, I ask whether it can be a test instead. Three, teach by designing together. Architects
    pair with teams on real designs rather than reviewing finished ones; architecture katas, short exercises
    on realistic problems such as a permission-aware assistant or an agent with write access, build the skill
    in a safe setting; and I ask questions instead of handing down answers: what happens at ten times the
    load, when the provider is down, when a user loses access, what does a request cost? Four, a growth path:
    engineers who show architectural judgement get to own a decision record, present at the community of
    practice and lead a design, with an architect as a backstop. Five, the architecture group measures itself
    by enablement: time to decision, share of decisions made by teams, the quality of decision records and
    teams' satisfaction, not by the number of reviews held or designs rejected. I mentor this way in the AI
    Center of Excellence at Qualizeal, where interns and freshers own a piece early; and with teams spread
    across three geographies, as the AI teams I mentored at Tech Mahindra were, gatekeeping from one time zone
    simply does not work.
  evidence:
  - url: doc:Career_In_Depth
    source: resume
    why: Mentors the interns and freshers of the AI CoE; mentored AI teams across three geographies
  - url: profile:roles/Tech Mahindra
    source: resume
