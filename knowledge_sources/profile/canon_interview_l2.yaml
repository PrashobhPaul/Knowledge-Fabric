  answer: >-
    Yes, six areas, and I would ask them in this order because each answer changes what the next one means.
    Business strategy: what are the two or three business problems the company most needs GenAI to help with
    in the next eighteen months, and which outcome would make the board say this role was worth it? Existing
    architecture and constraints: what is already in production, which platforms must I build on, and where is
    the technical debt you already know about, the duplicated tools, the shadow usage, the integrations nobody
    owns? Sponsorship and decision rights: who sponsors this role, what decisions does it own outright, which
    does it only advise on, and how are disagreements between architecture, security and a business unit
    settled today? Who is accountable when an AI system causes harm? Data and security: how mature is data
    ownership and classification, how clean are permissions in the main knowledge sources, what is the
    security team's current position on external model APIs, and who owns the platform once it exists?
    Success and operations: how will you measure my first year, which metrics matter to the CIO, adoption,
