- id: iv4-gp-build-buy
  topics: [interview, whiteboard, strategy]
  questions:
  - Build-versus-buy decisions and integration with existing enterprise platforms.
  - What would you build versus buy for the GenAI platform, and how does it integrate with existing enterprise platforms?
  - How would the GenAI platform reuse existing cloud, identity, data and security platforms?
  - Which parts of the GenAI platform would you buy rather than build?
  keywords:
  - integration with existing enterprise platforms
  - existing enterprise platforms
  - reuse existing cloud identity
  - buy rather than build
  - build versus buy decisions
  answer: >-
    Reuse what the enterprise already runs well, buy what is commodity, and build only the thin layer where
    our policy and knowledge make the difference. Reuse, explicitly required by the brief: the enterprise
    identity provider for users, groups and conditional access; the existing cloud landing zones, networking
    and Kubernetes platform; the key management service and secrets vault; the SIEM, so AI audit events and
    guardrail alerts land where the security operations team already looks; the data catalogue and
    classification scheme, so AI does not invent a second taxonomy; DLP tooling; the ITSM platform for
    incidents and approvals where that fits; and the observability stack, extended with GenAI traces. Every
    reuse saves months and keeps the platform inside controls the auditors already know. Buy: model access
    from two or more providers, through enterprise agreements with no training on our data, regional
    processing and defined retention; the search and vector engine, managed where residency allows; parsing
    and OCR services for difficult formats; and possibly a commercial AI gateway or evaluation product if it
    meets our policy needs out of the box, judged against a written requirement list, not a demo. Build: the
    policy layer that encodes our classification, residency and approval rules; knowledge services that know
    our sources, permissions and authoritative tiers; the evaluation sets and gates, because only we know what
    correct means for our workflows; the tool contracts for our systems; and the paved-road templates. Even
    there I prefer configuring open components, an open-source gateway, LangGraph, OpenTelemetry, to writing
    from scratch. Each decision is recorded with its exit strategy: open interfaces, our data exportable, and
    a test suite that lets us swap a vendor. I would revisit them yearly, because commodity moves fast in this
    market. It is the same build-versus-buy discipline I bring to client architecture at Qualizeal, where the
    client's estate, a .NET shop for instance, shapes the framework choice.
