# =============================================================================
# Canon, interview set L2: the Enterprise GenAI Architect advanced interview
# (tests/interview_brief_l2.md), one level above the Senior / Enterprise AI
# Architect brief: research and the PhD, model and inference architecture,
# advanced RAG, agentic systems, research to production, platform strategy,
# the Enterprise GenAI platform whiteboard and its injects, reliability,
# security, economics, executive communication, governance and regulation,
# leadership, Scenarios A to E, the candidate's questions and the close.
# =============================================================================
#
# Same schema and rules as canon.yaml: first person, as Prashobh would say it
# aloud; the first question is the playbook question verbatim, the rest are the
# ways an interviewer rephrases it. Keywords are precise multi-word cues, so these
# answers never take a question an earlier entry owns. Examples come only from his
# own record: Qualizeal (ValidAIte, QMentisAI, agentic SDLC with Kiro for a major
# US airline, agentic STLC with the Microsoft Agent Framework and .NET for a global
# professional-services firm), Tech Mahindra, Yash, Brane, Primera, TCS, and his
# public repositories (Knowledge Fabric, CodeFabric, CogniFlow). The PhD at Anurag
# University is a direction, not results: no result, baseline run or publication
# is claimed. Designs for systems he has not run are said as "I would". Standard
# numbers (KV-cache sizes, Little's law, regulation dates) are stated as
# assumptions or as the framework says them, never as his own measurements.
#
# Tested by tests/qa_interview_l2.json; diagrams by scripts/diagrams_interview_l2.py.

as_of: "2026-11-26"

canon:

# ----------------------------------------------------------------------------- S1.1 Research and PhD
- id: iv4-phd-hypothesis
  topics: [interview, research]
  diagram: assets/diagrams/iv4-trust-research.svg
  questions:
  - State your PhD research problem in one precise sentence. What is the central hypothesis, and what would falsify it?
  - What is your PhD research problem in one sentence, and what is your hypothesis?
  - What is the central hypothesis of your PhD, and what would falsify it?
  - What result would falsify your PhD hypothesis?
  keywords:
  - central hypothesis
  - one precise sentence
  - would falsify
  - falsify it
  - falsify your
  - phd research problem
  - research problem in one
  answer: >-
    In one sentence: when an AI system answers from many sources, how should it measure how far to trust
    each source and each claim, and use that trust to decide what it retrieves, what it states and when it
    declines? The central hypothesis is that a trust score the system computes itself, from corroboration
    by independent sources, internal consistency, consistency over time, the confidence of each record's
    date, authority of the source and feedback against answers that cite it, makes answers more accurate
    and abstentions better calibrated than treating every source alike or following hand-written precedence
    rules. It came from my supervisor Dr. Amarajothi's work on users whose ratings cannot be fully trusted:
    a source can mislead the way a rater can. It is falsifiable on purpose, and I have written down
    what would falsify it before running anything. One, on Eidolon's golden question sets with controlled
    faults injected, stale copies of a page, claims that contradict the other sources and records without
    provenance, trust weighting does not beat the rule-based baseline beyond the confidence interval of a
    paired test. Two, it gains accuracy only by declining more, so answered-question accuracy rises while
    coverage falls by the same amount. Three, a trivial heuristic, recency alone or counting sources, does
    as well, which would mean the measured score adds nothing. Four, the gain disappears on a corpus I did
    not build. Any one of those and the hypothesis is wrong or much narrower than I think. Eidolon, the twin
    you are talking to, is the test bed, because it already records provenance and date confidence for every
    record and fails its build when accuracy drops. To be precise about status: my PhD at Anurag University
    has just begun, so this is the direction and the protocol, not a finding. I would rather defend a sharp
    hypothesis that can fail than a vague one that cannot.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The research question, the trust signals and the evaluation plan
  - url: doc:Knowledge_Fabric
    source: notes
    why: Eidolon, the test bed

- id: iv4-prior-work
  topics: [interview, research]
  questions:
  - What is the strongest prior work related to your research? Where does it fall short?
  - What is the strongest prior work related to your PhD, and where does it fall short?
  - Which existing research is closest to yours, and what are its gaps?
  - Where does the best published work on source trust fall short?
  keywords:
  - strongest prior work
  - prior work related
  - prior work
  - closest to yours
  - published work on source trust
  - fall short
  - falls short
  answer: >-
    Three bodies of work, and the strongest is not the one people expect. The closest is truth discovery
    from the data-integration community: TruthFinder by Yin, Han and Yu, and Google's Knowledge-Based Trust
    by Dong and colleagues, estimate how reliable each source is and how likely each fact is true, jointly
    and iteratively, so a source earns trust by agreeing with facts that other reliable sources confirm.
    That is the right idea. Where it falls short for my question: it assumes claims already extracted as
    clean subject, predicate and object triples, it mostly treats a snapshot rather than a source's version
    history, it struggles when sources copy each other, and it was never wired into retrieval ranking or
    into the decision to abstain. The second is the retrieval-augmented generation robustness work, Self-RAG
    and Corrective RAG, which grade retrieved passages for relevance and quality per query, and the
    knowledge-conflict studies showing that language models follow coherent but wrong evidence. They judge a
    passage in the moment; they do not remember that a source has been stale three times before, and they
    rarely measure calibration of the decision to decline. The third is the line I build on directly, my
    supervisor Dr. Amarajothi's papers: refining user ratings with the emotion in the review at iiWAS 2021,
    enemos-p in Expert Systems with Applications in 2023, and the 2025 paper in Knowledge and Information
    Systems on users whose rating and review disagree. Their insight, that an inconsistency between two signals from the same source is
    information rather than noise, is the one I carry over; their limit, for me, is that the setting is
    ratings and recommendations, not knowledge sources feeding an AI answer. The gap I see sits between the
    three: trust per source and per claim, with time and date confidence in it, acting on retrieval,
    answering and abstention together, evaluated with injected faults. I hold that view provisionally; part
    of the first year is a systematic literature review to confirm the gap is real rather than one I have
    not yet read about.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The base papers and the analogy from untrustworthy raters to untrustworthy sources

- id: iv4-novelty
  topics: [interview, research]
  questions:
  - 'What is genuinely novel in your contribution: the problem formulation, method, dataset, evaluation, theory, or application?'
  - What is genuinely novel in your PhD contribution?
  - Is your contribution a new method, a new dataset or a new evaluation?
  - What exactly is new in your research compared with existing work?
  keywords:
  - genuinely novel
  - novel in your contribution
  - novel in your phd
  - new in your research
  - problem formulation
  - new method a new dataset
  answer: >-
    I separate what I hope is new from what is borrowed, because a reviewer will. The problem formulation
    is the main novelty I am aiming for: carrying the idea of a rater who cannot be fully trusted to the
    sources an AI system reads, so trust is estimated per source and per claim and then acts in three
    places at once, as a weight in retrieval, as a signal in the answer's confidence and as the rule for
    when to decline. Truth discovery estimates source reliability but stops at the fact table; RAG robustness
    judges passages but forgets sources. Putting the two on one decision is the formulation. The evaluation
    is the second contribution: a fault-injection protocol on a system whose every answer is already gated,
    stale copies, contradicting claims and records without provenance injected at controlled rates, measuring
    accuracy, abstention and calibration together rather than accuracy alone. A smaller, concrete piece is
    treating the confidence of a record's date as a first-class signal. Eidolon already records how each
    date was found, the source system's own timestamp at 0.95 down to the crawl date at 0.30, and freshness
    must never treat an unknown date as old; I have not seen date provenance used as a trust input. What is
    not novel: the method components. Corroboration, reciprocal rank fusion and iterative reliability
    estimation exist, and I will say so in every paper. The dataset is not the contribution either; Eidolon
    is one person's corpus that I built, which is exactly why it is a test bed and not a benchmark claim.
    Theory is not a contribution I would promise at this stage. And application to enterprise knowledge
    systems is the eventual payoff, not something I would claim until it generalises beyond my own corpus.
    All of this is the direction I am starting my PhD with at Anurag University, not results.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Trust signals, the date-confidence scale and the evaluation plan
  - url: doc:Knowledge_Fabric
    source: notes
    why: Eidolon, the worked example

- id: iv4-baselines
  topics: [interview, research]
  questions:
  - Which baselines have you compared against, and why are they fair and sufficiently strong?
  - Which baselines will your PhD method be compared against?
  - What baselines are you using in your research, and are they strong enough?
  - How do you make sure your research baselines are fair?
  keywords:
  - baselines have you compared
  - compared against
  - baselines will your
  - baselines are you using
  - research baselines
  - sufficiently strong
  - baselines are fair
  answer: >-
    Honestly, none yet: my PhD has just begun, and I will not quote a comparison I have not run. What I can
    give you is the baseline ladder I have committed to, and why each rung is there. First, Eidolon as it
    runs today, with hand-written precedence rules, the resume over the website and an older resume marked
    not current; its proof report, every question set at 100 percent with determinism and grounding checks,
    is the measured starting point. Second, uniform trust, every source weighted equally, which tells me
    whether trust matters at all. Third, the cheap heuristics a sceptic would propose: recency only, and
    majority vote by source count. If my method cannot beat those, it does not deserve its complexity.
    Fourth, the strong prior methods: a truth-discovery estimator in the TruthFinder and Knowledge-Based
    Trust family, adapted to score sources iteratively from agreement. Fifth, the passage-level approach
    from RAG robustness work, a corrective-retrieval grader that judges each retrieved passage, and an
    LLM-as-judge verifier, so I am not only beating rules. Fairness is a protocol, not an intention. Every
    method runs on the same retrieval stack, BM25, LSA and MiniLM fused with reciprocal rank fusion, the
    same golden sets and the same injected faults. Each gets the same tuning budget on a development split,
    and the test split is frozen before any method sees it. Hyperparameters are logged, and the baselines'
    best configuration is reported, not their default, because beating a weak default is the most common
    way a paper flatters itself. Strength I judge by one question: would the author of that baseline
    recognise it as a faithful implementation? Where I adapt a method, I say what I changed. And if a simple
    rung wins, that result gets reported as the finding.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The proof report as the baseline; the planned evaluation
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: The retrieval stack and the proof every build runs

- id: iv4-experimental-design
  topics: [interview, research]
  questions:
  - Describe your experimental design. How do you control confounders, data leakage, benchmark contamination and cherry-picking?
  - How do you control confounders, data leakage and cherry-picking in your experiments?
  - What is your experimental design for the PhD research?
  - How will you prevent benchmark contamination in your research?
  keywords:
  - experimental design
  - confounders
  - data leakage
  - benchmark contamination
  - cherry picking
  - cherry-picking
  answer: >-
    The design is controlled fault injection on a system I can reproduce exactly. The unit is a question
    with a known correct answer, a known set of supporting records, and a fault condition: clean, a stale
    copy of a source page, a claim that contradicts the other sources, a record stripped of provenance, or
    combinations at set rates such as 5, 10 and 20 percent of records. Outcomes are answer accuracy,
    accuracy on answered questions, coverage, correct abstention when no trustworthy source exists, and
    calibration of confidence, measured by expected calibration error. Confounders first. Question difficulty
    and source type both affect accuracy, so I stratify by question category and by which source holds the
    answer, and every method sees the identical fault draw per seed, so comparisons are paired. Data leakage:
    I wrote Eidolon's curated answers myself, so tuning on the same questions I test would be circular. The
    golden sets are split, the trust method is tuned on a development split, and the test split, including
    the held-out interview set written after the answers, is frozen and never used for tuning. Faults are
    generated by a script with a seed, not hand-placed where I know the method will catch them.
    Contamination: Eidolon's core retrieval uses no pretrained language model at answer time, so pretraining
    contamination cannot inflate it; any LLM-based baseline or verifier is tested on facts about me that
    post-date its training cutoff, and I report that cutoff. Cherry-picking: the metrics, splits and fault
    rates are written down before the runs, every condition and every seed is reported, and the proof
    script already refuses selective reporting by running every set. Eidolon's build is deterministic, same
    files in and same index out, so a run is reproducible to the hash. This is the protocol I am starting
    with; no results are claimed yet.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Controlled faults, golden sets as the benchmark, calibration
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deterministic build and the proof run on every pull request

- id: iv4-generalization
  topics: [interview, research]
  questions:
  - What evidence would convince a skeptical reviewer that your method generalizes beyond the dataset or benchmark on which it was developed?
  - How would you show that your method generalizes beyond Eidolon?
  - What evidence would show your research generalizes to other datasets?
  - How do you prove your method is not overfitted to your own benchmark?
  keywords:
  - skeptical reviewer
  - generalizes beyond
  - generalises beyond
  - beyond the dataset
  - overfitted to your own benchmark
  - research generalizes
  answer: >-
    A sceptical reviewer would be right to be suspicious, because Eidolon is the worst possible sole
    benchmark: one person's corpus, curated by the same person who designed the method. So I treat Eidolon
    as the development bed and plan the evidence of generalisation around four tests. First, corpora I did
    not build, with different structure: an enterprise-style documentation corpus with real version history,
    where staleness and contradiction occur naturally, and public truth-discovery datasets, such as the
    flight and stock datasets that literature uses, where source reliability is known. Second, frozen
    settings: the trust model is configured on Eidolon and then run elsewhere with the same hyperparameters;
    if it needs re-tuning per corpus to win, I report that as a limitation rather than a result. Third,
    fault types held out from development: if I developed against stale copies and contradictions, the
    test includes a fault I never tuned for, such as a source that silently copies another, which breaks
    naive corroboration. Fourth, questions written by other people, so the question distribution is not
    mine. I would also report where it fails, by slice: which source types, which fault rates and which
    question categories, because a method that wins on average and loses badly on one slice is not ready.
    The reviewer should see effect sizes with confidence intervals on every corpus, not a single headline
    number. If the gain holds on the external corpora with frozen settings, that is credible; if it holds
    only on Eidolon, the honest claim is a case study, and I would publish it as exactly that. None of this
    has been run yet; it is the plan I am taking into the PhD.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Eidolon as the worked example and the evaluation plan

- id: iv4-research-changed-opinion
  topics: [interview, research]
  questions:
  - Which research result has changed your architectural opinion? Give a concrete example.
  - Which research result changed your architectural opinion?
  - Give an example of a paper that changed how you design systems.
  - Has any research finding changed one of your architecture decisions?
  keywords:
  - changed your architectural opinion
  - architectural opinion
  - changed how you design
  - research finding changed
  - research result
  answer: >-
    Two, and both are visible in systems I built. The first is the one that started my PhD. My supervisor
    Dr. Amarajothi's work on rating systems treats a user whose star rating disagrees with the emotion
    in their own review as someone whose rating cannot be taken at face value, and refines it with the review instead of trusting it or
    throwing the user out. Before that I thought of source conflicts as a precedence problem: pick the
    authoritative source and move on. After it, I design for inconsistency as a signal. Concretely, Eidolon
    keeps every source, records how confident it is in each date, from 0.95 for a source system's own
    timestamp down to 0.30 for a crawl date, refuses to treat an unknown date as old, and when the resume and
    the website disagree it keeps the older resume in the index marked as not current rather than deleting
    it. That shift is why my research question is how far to trust each source, not which source wins. The
    second is reciprocal rank fusion, from Cormack, Clarke and Büttcher in 2009: fusing ranked lists by
    rank alone, one over sixty plus the rank, is hard to beat and needs no score calibration between
    retrievers. It changed my opinion about hybrid search, which I used to think needed learned weights
    tuned per corpus. Both my Knowledge Fabric, fusing BM25, LSA and MiniLM, and CodeFabric, fusing
    field-boosted BM25 with dense embeddings, use RRF for exactly that reason, and CodeFabric's README
    cites the paper because the algorithm is implemented from it, not ported from a library. The lesson I
    take from both: the results that change architecture are usually simple and robust, and the architect's
    job is to notice them early and then keep measuring whether they still hold on our data, which is why
    every build of the fabric runs its retrieval gold set in all three modes.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Untrustworthy ratings, date confidence and the older resume kept but marked not current
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Reciprocal Rank Fusion (Cormack et al. 2009) implemented from the paper
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: BM25, LSA and MiniLM fused by reciprocal rank

- id: iv4-research-transferable
  topics: [interview, research]
  questions:
  - What part of your research is transferable to production, and what part is currently impractical?
  - Which part of your PhD research could go into production today?
  - What in your research is still impractical for production?
  - How much of your research is production-ready?
  keywords:
  - transferable to production
  - currently impractical
  - still impractical
  - research could go into production
  - research is production ready
  answer: >-
    More is transferable than people expect, because half of it already runs in production on Eidolon,
    and the half that is impractical is the measured part. Transferable today, to any enterprise RAG or
    agent platform: provenance on every record, the URL a person can verify and the date with the method
    that found it; a date-confidence scale, so freshness never treats an unknown date as old; evidence that
    must resolve at build, so a curated answer that cites nothing real is reported instead of shipped;
    cross-source entity resolution, so one fact seen from several sources counts as corroborated; masking of
    confidential names before indexing; and an honest no-answer when nothing trustworthy covers the
    question. Those are rules, cheap to run, explainable to an auditor, and they map straight onto
    enterprise needs such as document lineage, stale-content detection and right-to-be-forgotten
    deletions. What is currently impractical is the full measured trust score. It needs claims extracted
    and aligned across sources, which at enterprise scale means an extraction model on millions of
    documents, its own error rate, and a cost per document that has to be justified. It needs ground truth
    to learn and validate the weights, and nobody labels source reliability for a 50,000-document estate. It
    needs a defence against sources that copy each other, or corroboration inflates. And a trust score that
    changes rankings must be explainable, or a user cannot contest why their department's policy page was
    down-weighted. So my production advice is the staged one: ship the rules now, log the signals the score
    would use, and switch on measured trust per use case only when an offline evaluation, and then a pilot,
    shows it beats the rules. That is also my honest research status: the direction is set at Anurag
    University, the measured score is not built yet.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: How Eidolon handles trust today, and the trust score still to be built
  - url: doc:Knowledge_Fabric
    source: notes
    why: The production system those rules run in

- id: iv4-method-assumptions
  topics: [interview, research]
  questions:
  - Explain the assumptions under which your method works.
  - What assumptions does your PhD method rely on?
  - Under what assumptions does your trust method work?
  - When would your research method break down?
  keywords:
  - assumptions under which
  - method rely on
  - assumptions does your
  - trust method work
  - method break down
  answer: >-
    Five assumptions, and each one tells me where the method breaks. One, independence of sources.
    Corroboration only means something if the witnesses are independent. If my LinkedIn summary was copied
    from my website, two sources agreeing is one source twice. The truth-discovery literature has studied
    source dependence for exactly this reason, so I need a copy detector, near-duplicate text and shared
    errors, before corroboration counts. Two, most sources are mostly right. Trust estimated from agreement
    assumes errors are the minority and not coordinated. A coordinated, poisoned corpus breaks it, which is
    why corpus poisoning is a threat I must test, not assume away. Three, claims can be extracted and
    aligned. In Eidolon claims are small and structured, a role, a date, a project, so aligning "eleven
    years of experience" across sources is feasible. In free text the extractor becomes a source of error
    the method inherits. Four, dates are recoverable with a known confidence. My scale from 0.95 for a
    system timestamp to 0.30 for a crawl date assumes the method that found the date is itself reliable,
    and that unknown means unknown, never old. Five, the world changes slowly relative to the sync. Eidolon's
    Factory syncs weekly; if facts change daily, consistency over time punishes the sources that update
    first, and the method would mistake the most current source for the inconsistent one. There is also a
    sixth, about evaluation rather than method: that the golden questions represent what people actually
    ask. I wrote most of them, which is the bias I most need to correct with questions from other people.
    Stating these up front is what lets a reviewer, or a production team, know when not to use the method.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The signals, the date scale and the worked case of conflicting experience figures

- id: iv4-ablation
  topics: [interview, research]
  questions:
  - What is the ablation that most clearly demonstrates which component creates value?
  - Which ablation would show which component of your method creates value?
  - How would you design the ablation study for your research?
  - What ablation would you run to prove each trust signal matters?
  keywords:
  - ablation
  - ablation study
  - which component creates value
  - component creates value
  - trust signal matters
  answer: >-
    The ablation I would lead with removes one trust signal at a time and, separately, one point of action
    at a time, because those are the two claims a reviewer will challenge. The signals are corroboration
    by independent sources, internal consistency, consistency over time, date confidence, authority and
    feedback. I run the full method, then the method minus each signal, on the same fault-injected question
    sets and seeds, and report the paired change in accuracy, abstention correctness and calibration with
    confidence intervals. My prior, which the ablation is designed to test rather than confirm, is that
    corroboration and date confidence carry most of the value against stale copies, and consistency over
    time carries it against silent contradictions. The action ablation is subtler and, I think, more
    informative for production: trust applied only in retrieval as a ranking weight, only in answering as
    a confidence signal, and only as the rule that says a low-trust claim needs a second source or the
    twin declines. If nearly all the value comes from the abstention rule, the production recommendation
    is cheap: keep retrieval as it is and gate statements on trust. If it comes from re-ranking, I need the
    score at query time, which costs more. Two controls keep the ablation honest. A shuffled-trust control,
    the same score distribution assigned to random sources, shows whether the gain comes from trust or just
    from adding noise to the ranking. And the simple heuristics, recency only and source counting, sit in
    the same table, so a signal that only matches recency is visible as such. Every condition is reported,
    including the ones where removing a signal makes no difference; that is a result too. This is the
    planned design; none of it has been run.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The trust signals and the three places a trust score would act

- id: iv4-uncertainty-reporting
  topics: [interview, research]
  questions:
  - How do you report uncertainty, statistical significance and reproducibility?
  - How do you report statistical significance and uncertainty in your experiments?
  - How do you make your research results reproducible?
  - What statistics do you use to show a result is significant?
  keywords:
  - statistical significance
  - report uncertainty
  - research results reproducible
  - result is significant
  - confidence intervals
  answer: >-
    I report every headline number with its interval, its test and the exact way to regenerate it. For
    uncertainty, the unit of analysis is the question, so I use a paired bootstrap over questions, resampling
    the question set ten thousand times, to put a 95 percent confidence interval on accuracy, coverage and
    the difference between two methods. Paired matters: both methods answer the same questions under the
    same fault draw, so the comparison removes question difficulty from the noise. For significance on
    paired right-or-wrong outcomes I use McNemar's test, and where I compare several methods or fault rates
    I correct for multiple comparisons with Holm's method, because running twenty comparisons and reporting
    the one at p below 0.05 is cherry-picking with statistics. I report effect sizes, the absolute change
    in accuracy and in calibration error, not just p-values, because a significant one-point gain on an
    easy set is not a reason to change an architecture. Variation across random seeds for the fault
    injection is reported separately from variation across questions, so a reader can see whether a result
    depends on which records happened to be corrupted. Reproducibility is engineered, not promised. Eidolon's
    build is deterministic, the same files in and the same index out, and its proof already checks that
    every interview question gets the identical answer, by id and by a SHA-256 hash of the text, across
    three runs in different orders. For the research I add a pinned environment, the fault-injection seeds,
    the frozen splits, the exact commit, and a single command that regenerates every table. I would publish
    the code and the fault generator with the paper. And I state the limits next to the numbers: one corpus,
    built by me, until the external corpora are in. These are the reporting standards I am setting for my
    PhD; there are no results to report yet.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deterministic build; the proof's determinism check over three runs
  - url: doc:PhD_Anurag_University
    source: notes
    why: Golden sets as the benchmark and the proof report as the baseline

- id: iv4-reproduce-failure
  topics: [interview, research]
  questions:
  - If your result cannot be reproduced by another team, what would you investigate first?
  - What would you investigate first if another team cannot reproduce your result?
  - Another lab cannot reproduce your research result. What do you check?
  - How do you debug a result that another team fails to reproduce?
  keywords:
  - cannot be reproduced
  - cannot reproduce your
  - fails to reproduce
  - reproduce your result
  - reproduce your research
  answer: >-
    I would assume the problem is mine until I can show otherwise, and I would investigate in the order
    that is cheapest to rule out. First, are we running the same thing? Commit, configuration, dependency
    versions, tokenizer and embedding model versions, and the random seeds. A different MiniLM revision or
    a changed stop-word list moves retrieval more than people think. I would send them the single command
    that regenerates my tables and compare intermediate artefacts, the index hash, the retrieved lists, the
    trust scores, stage by stage, so we find the first point where our runs diverge rather than arguing
    about the final number. Second, the data. Is their corpus, split or fault injection actually the same?
    If they rebuilt the fault generator from the paper's description, a different notion of a stale copy
    could explain everything, which tells me the paper under-specified it. Third, my own leakage. Did any
    test question influence a design choice? Did I tune a threshold after looking at the test split? That
    is the uncomfortable check and the one most often guilty. Fourth, the metric implementation: how ties
    are broken, whether abstentions count as wrong or are excluded, how calibration bins are drawn. Fifth,
    whether the effect was ever real: if my confidence interval was wide, a failure to reproduce may simply
    be regression to the mean. A strong diagnostic is to swap halves, run my method on their data and their
    implementation on my data, which separates a method that does not generalise from an implementation
    difference. Whatever the cause, I would publish the outcome, including a correction if the error is
    mine. Eidolon helps here because its build is deterministic and every pull request runs the proof, so I
    can always rebuild exactly what a result was measured on.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deterministic build; same files in, same index out
  - url: doc:PhD_Anurag_University
    source: notes
