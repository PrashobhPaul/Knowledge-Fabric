- id: iv4-portfolio-quality
  topics: [interview, leadership, architecture]
  questions:
  - How would you assess architecture quality across a portfolio of independently delivered AI products?
  - How would you assess architecture quality across a portfolio of AI products?
  - How do you measure architecture quality across independently built AI applications?
  - How would you review the architecture health of many AI products at once?
  keywords:
  - architecture quality across
  - independently delivered
  - portfolio of independently
  - architecture health
  - independently built ai applications
  answer: >-
    With a small scorecard computed mostly from data the platform already has, a sampled deep review for the
    rest, and attention on trends rather than one-off grades. The scorecard, per product, in five groups.
    Conformance to the mandatory standards, measured automatically: all model calls through the gateway,
    identity on every retrieval and tool call, traces in the standard schema, registered in the inventory with
    an owner and a tier, evaluation gate in CI, secrets in the vault. These are architecture fitness functions:
    automated tests of architectural properties that run continuously rather than at review time. Quality in
    production: SLO attainment for availability and latency, groundedness and task success from sampled
    evaluation, abstention behaviour, and incidents by category and severity. Economics: cost per successful
    task and its trend, and the share of spend on frontier models compared with what the evaluations justify.
    Delivery health: the DORA measures, lead time, deployment frequency, change failure rate and time to
    restore, for prompts, models and code. Sustainability: decision records for significant choices, test
    coverage of golden sets, dependency on deprecated models or frameworks, and the age of known risks in the
    register. The deep review: each quarter I sample a few products, the highest risk tier first, for an
    architecture review in person, threat model, failure modes, data flows and permission paths, because
    some qualities, such as whether a design is simple enough to operate, do not show up in metrics. The
    output is a portfolio heat map for leadership, products by tier and score, with the two or three
    systemic issues across the portfolio, for example many teams building their own retrieval, which become
    platform priorities rather than findings against teams. I share each team's scorecard with them first and
    treat it as a conversation; a scorecard used to punish gets gamed. This is the portfolio view I would bring
    to AI governance, the same one behind consolidating independently built applications onto a governed
    platform.
