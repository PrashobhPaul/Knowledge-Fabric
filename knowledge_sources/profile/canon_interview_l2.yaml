# ----------------------------------------------------------------------------- S3.4 High-pressure decision scenarios
- id: iv4-scenario-accuracy-promise
  topics: [interview, scenario, executive]
  questions:
  - A business leader has promised 99.9% answer accuracy for an open-domain enterprise assistant. The available evaluation set shows 91% task success. What do you do in the next 48 hours? What do you communicate, measure, constrain and renegotiate?
  - A business leader has promised 99.9% answer accuracy for an open-domain enterprise assistant. The available evaluation set shows 91% task success.
  - 'Scenario A: the accuracy promise. A leader promised 99.9% accuracy and the evaluation shows 91%.'
  - A leader promised 99.9 percent accuracy but the evaluation shows 91 percent task success. What do you do?
  - What would you do in the next 48 hours if a 99.9% accuracy promise meets a 91% evaluation?
  keywords:
  - 99.9 answer accuracy
  - 99.9 accuracy
  - 99.9 percent accuracy
  - 91 task success
  - 91 percent task success
  - next 48 hours
  - accuracy promise
  answer: >-
    Forty-eight hours is enough to replace a promise nobody can keep with one we can, if I bring the leader
    facts and options rather than a no. Hours one to twelve, measure. What exactly was promised, to whom, and
    is it in a contract or a slide? Then the 91 percent: is the evaluation set representative of real traffic,
    and what does the failing nine percent consist of? I run an error analysis by layer and severity:
    questions where retrieval missed, where the answer was wrong despite good evidence, where the question was
    out of scope for our knowledge, and how many errors are harmful versus merely incomplete. And I measure
    the abstention trade-off: if the assistant declines when its evidence is weak, what is accuracy on the
    questions it answers, and what share does it still answer? Those two numbers, not one, are the real
    design space. Hours twelve to twenty-four, communicate, privately and first to the leader, never in front
    of their audience: 99.9 percent on open-domain questions means one error in a thousand, and 91 percent is
    roughly one in eleven; no current system closes that gap by tuning, and pretending otherwise puts their
    credibility and our customers at risk. Hours twenty-four to forty-eight, constrain and renegotiate.
    Constrain the scope from open-domain to the domains where the evaluation is strong; require citations on
    every answer; decline and hand off to a person when evidence is weak; add human review for high-impact
    answer types. Then propose replacement commitments the leader can announce with confidence, for example:
    in the covered domains, at least 98 percent accuracy on answered questions, correct abstention on the
    rest with a route to a human, every answer cited, zero permission leaks, and coverage reported monthly as
    it grows, with the exact targets set from the measurements we just took. I put it in a one-page memo with
    the data, so the decision is theirs and informed. My Knowledge Fabric makes the same trade on purpose: it
    says something is not on record rather than guess.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Honest no-answer and cited answers
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI systems

- id: iv4-scenario-agent-incident
  topics: [interview, scenario, security]
  diagram: assets/diagrams/iv4-agent-incident.svg
  questions:
  - An agent used a valid tool with excessive permissions and modified thousands of business records. What is your immediate response? How do you contain the incident, preserve evidence, restore state, determine root cause and redesign controls?
  - An agent used a valid tool with excessive permissions and modified thousands of business records.
  - 'Scenario B: the autonomous agent incident. An agent with excessive permissions modified thousands of records.'
  - An AI agent modified thousands of business records through an over-permissioned tool. What do you do?
  - How do you respond when an agent with excessive permissions changes thousands of records?
  keywords:
  - excessive permissions
  - thousands of business records
  - modified thousands
  - over permissioned tool
  - autonomous agent incident
  answer: >-
    I run it as a severity-one incident with five tracks in a fixed order: contain, preserve, restore,
    explain, redesign. Contain, in minutes: hit the agent's kill switch, revoke its credentials and remove the
    tool from its scope at the tool gateway, pause its queues and any scheduled runs, and check whether other
    agents share the same tool grant, because the flaw is probably not unique. Declare the incident, name an
    incident commander, and inform the business owners of the affected records, security and the data owner;
    legal and privacy join if personal or financial data is involved, since there may be notification duties.
    Preserve evidence before anyone fixes anything: freeze copies of the audit log, traces, prompts, model
    and prompt versions, tool-call logs and the agent's state, write-once, under a legal hold if needed. The
    reconstruction depends on them. Scope it from the audit log: which records, which fields, which runs,
    which times, and which downstream systems already consumed the changes. Restore state: if the tools
    recorded before-states, roll back record by record with compensating actions; otherwise use point-in-time
    restore of the affected records, never the whole database blindly; reconcile downstream systems; and have
    the business owners verify a sample before declaring it restored. Root cause, by layer and blamelessly:
    why could it, a valid tool with permissions far broader than the task, which is the design failure; why
    did it, a misread instruction, a planning loop, an injected instruction in content it read, or a bug;
    and why was it not stopped or noticed, no approval for bulk writes, no volume circuit breaker, no anomaly
    alert. Redesign: narrow, business-shaped tools; scopes intersected with the user's rights; per-run and
    per-hour write limits that pause the agent; approval for bulk or irreversible changes; dry runs with a
    diff; before-state recording on every write; an access review of every agent's grants; and the incident
    replayed as a regression test. Then a written review to leadership.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production agentic systems and AI governance
  - url: profile:services/Agentic AI System Design
    source: website
    why: Design and delivery of multi-agent systems

- id: iv4-scenario-research-breakthrough
  topics: [interview, scenario, research]
  questions:
  - Your PhD research suggests a new retrieval or reasoning approach that outperforms the existing solution in a controlled benchmark but increases operational complexity. What evidence and gates are required before adoption? How do you design a fair pilot and decide whether to scale?
  - Your PhD research suggests a new retrieval or reasoning approach that outperforms the existing solution in a controlled benchmark but increases operational complexity.
  - 'Scenario C: the research breakthrough. A new approach wins in a controlled benchmark but adds operational complexity.'
  - Your research approach beats production in a benchmark but is harder to operate. How do you decide to adopt it?
  - How do you design a fair pilot for your own research approach?
  keywords:
  - research breakthrough
  - controlled benchmark
  - increases operational complexity
  - fair pilot
  - harder to operate
  answer: >-
    This is the scenario where I have to be most careful, because I would be the author of the approach, so
    the gates must not depend on my enthusiasm. If my trust-weighted retrieval beat the current rules on a
    benchmark, I would treat it as a hypothesis for production, not a conclusion. Gate one, replicate: the
    result reproduced by someone other than me, on a frozen test set I did not tune on, with confidence
    intervals, and an ablation showing which component carries the gain. Gate two, relevance: the benchmark
    resembles production; I re-run it on a sample of real production questions and on the slices that matter,
    because benchmark wins often concentrate in cases that are rare in practice. Gate three, total cost: the
    added operational complexity priced honestly, new components to run, on-call load, failure modes, latency,
    compute cost, explainability to users and auditors, and the people who must understand it at three in the
    morning. The gain must be worth that, stated as a threshold in advance. The fair pilot: shadow mode first,
    the new approach running beside production on live traffic, scored on the same metrics without affecting
    users; then a randomised experiment, a share of traffic, users or tenants assigned at random, with metrics,
    sample size, duration and decision rules written down before it starts: task success, groundedness,
    abstention correctness, latency, cost per successful task and incident rate. The production team operates
    it during the pilot, not me, so the operability test is real. Decide: scale only if the gain on task
    success clears the pre-set margin outside the confidence interval, with no regression on safety or
    permissions, and the operating team accepts the burden. Otherwise, publish the research result and keep
    production simple, or look for a cheaper form that captures most of the gain, the way the abstention rule
    alone might capture most of the value of a full trust score. Being right in a paper and being right in
    production are different claims.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The research direction and its evaluation plan on Eidolon
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: New components evaluated against the baseline with the existing harness

- id: iv4-scenario-build-vs-buy
  topics: [interview, scenario, strategy]
  questions:
  - A vendor offers a fast, polished GenAI platform. Your engineering team argues for building internally to retain control and reduce long-term cost. How do you structure the decision? What should be evaluated, and how do you avoid ideological bias?
  - A vendor offers a fast, polished GenAI platform. Your engineering team argues for building internally to retain control and reduce long-term cost.
  - 'Scenario D: the build-versus-buy conflict between a polished vendor platform and an engineering team that wants to build.'
  - How do you avoid ideological bias in a build-versus-buy decision for a GenAI platform?
  - Your engineers want to build but a vendor platform is ready now. How do you structure that decision?
  keywords:
  - ideological bias
  - polished genai platform
  - vendor offers
  - building internally
  - retain control
  - vendor platform is ready
  answer: >-
    I structure it so the criteria are agreed before anyone sees a demo or a cost spreadsheet, because the
    bias in these debates usually enters through the choice of what to measure. Step one, decide what the
    decision is about. Which layers are we choosing for: the gateway, knowledge services, agent runtime,
    evaluation, the user-facing assistant? The right answer is often split by layer, buy the commodity, build
    the differentiator, so I refuse to frame it as one vendor against one build. Step two, criteria and
    weights, set jointly by engineering, security, the business and finance: fit to our must-have requirements,
    residency, identity integration, permission-aware retrieval, audit, evaluation hooks, extensibility; time
    to value; total cost of ownership over three to five years, including the build team, run costs, vendor
    licences, price escalation, and the integration work a vendor still needs; strategic differentiation;
    lock-in and exit, data export, open standards such as MCP and OpenTelemetry, contract terms; vendor
    viability; and the risk profile. Step three, evidence: a time-boxed bake-off on two of our real use cases,
    with our golden sets, our data classes and our identity provider, the vendor's platform against a thin
    internal prototype, scored against the agreed criteria. Reference calls with customers at our scale.
    Step four, de-bias deliberately: each camp writes the strongest case for the other option; scoring is done
    by people without a stake, with the criteria fixed; build estimates are checked against the team's past
    estimates, since internal builds are usually under-costed and vendor demos over-polished; and I write down
    what evidence would change the recommendation. Step five, decide and record: an architecture decision
    record with the scores, the trade-offs accepted and a review trigger, for example renewal date or a
    capability gap. A common outcome is buy now for speed with an exit plan and an abstraction at the
    boundary, while the team builds the knowledge and evaluation layers that are ours. I try to apply the
    same discipline to my own instinct to build, which is strong.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy for internal platforms and client solutions
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Always builds tools that make his own work easier

- id: iv4-scenario-90-day-mandate
  topics: [interview, scenario, strategy]
  questions:
  - You are appointed Enterprise GenAI Architect. Leadership expects visible outcomes in 90 days, but the organization has fragmented data, duplicated tools, no evaluation standards and unclear ownership. Present your 30/60/90-day plan, including deliverables, decision forums, dependencies, risks and measurable outcomes.
  - You are appointed Enterprise GenAI Architect. Leadership expects visible outcomes in 90 days, but the organization has fragmented data, duplicated tools, no evaluation standards and unclear ownership.
