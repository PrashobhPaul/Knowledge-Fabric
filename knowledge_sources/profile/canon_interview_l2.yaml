- id: iv4-availability-vs-usefulness
  topics: [interview, reliability]
  questions:
  - How do you distinguish availability from usefulness and correctness?
  - How do you tell availability apart from usefulness and correctness in an AI service?
  - Why is an available GenAI service not necessarily a useful one?
  - How do you measure usefulness and correctness separately from uptime?
  keywords:
  - availability from usefulness
  - usefulness and correctness
  - not necessarily a useful
  - separately from uptime
  answer: >-
    They are three different questions with three different measurements, and an AI service can score
    perfectly on the first while failing the other two. Availability asks whether the service responded,
    within its latency objective, with a well-formed response. It is measured on every request, by the
    platform, like any service. A model that replies instantly with a confident wrong answer counts as
    available, which is exactly why availability is necessary and nowhere near sufficient. Correctness asks
    whether the response is true and grounded: every claim supported by a permitted source, numbers right,
    no invented policy, the right tool called with the right arguments. It cannot be measured on every
    request, so I measure it on samples, by calibrated judges and by humans, plus deterministic checks where
    they exist, schema validity, citation resolution, arithmetic, and on the golden set before every release.
    Usefulness asks whether the response helped the user do the job: it answered the question actually asked,
    at the right level of detail, and the user did not need to redo the work. A correct answer to the wrong
    question is useless. I measure it through behaviour rather than opinion where possible, task completion,
    follow-up questions that rephrase the same need, abandonment, copy or accept rates for generated drafts,
    downstream rework, and through feedback with reasons. I report the three separately on the same
    dashboard, because each points to a different owner: availability to the platform team, correctness
    usually to retrieval or the model, usefulness to the product team's design and the use case itself. One
    honest refinement: a correct refusal, I do not have that on record, is a success on correctness, and it
    should count as useful when the alternative was a guess. My Knowledge Fabric is built on that principle,
    declining honestly rather than answering with a collage.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Honest no-answer instead of a collage
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI and GenAI systems

- id: iv4-failure-strategy
  topics: [interview, reliability]
  questions:
  - Design a failure strategy for model API errors, rate limits, malformed outputs, tool timeouts and vector-store degradation.
  - What is your failure strategy for model API errors, rate limits and malformed outputs?
  - How do you handle tool timeouts and vector-store degradation in a GenAI system?
  - How would you design for rate limits and malformed LLM outputs?
  keywords:
  - failure strategy
  - malformed outputs
  - malformed llm outputs
  - tool timeouts
  - vector store degradation
  - model api errors
  answer: >-
    One principle per failure, decided in advance and implemented in the platform, so applications inherit it.
    Model API errors: classify them. Transient errors, timeouts and 5xx responses get a bounded retry with
    exponential backoff and jitter, two attempts at most, inside the user's latency budget; then the circuit
    breaker for that provider opens and the route fails over to the next evaluated model. Non-retryable
    errors, an invalid request or a content refusal, are never retried blindly; they are logged and surfaced.
    Rate limits: avoid them before handling them. The gateway pools quota across applications, shapes traffic
    with token-bucket limits per tenant, and prioritises interactive over batch, so a nightly job never starves
    users. A 429 response triggers backoff that honours the provider's retry-after header, then spill-over to a
    secondary provider or deployment. Malformed outputs: prevent with structured outputs or constrained
    decoding against a JSON schema; validate every response against the schema; on failure, one repair attempt
    with the validation error fed back, then a fallback to a stronger model, then a safe failure that tells
    the user, never passing invalid output downstream. Tool timeouts: every tool call has a timeout and a
    budget; idempotent tools may retry once; non-idempotent ones only with an idempotency key; the agent is
    told the tool failed, as a structured result, so it can choose another path or escalate, and repeated
    failures trip a circuit breaker on that tool. Vector-store degradation: health checks on latency and error
    rate; on degradation, fall back to keyword search on the same permission-filtered corpus, which loses
    some semantic recall but keeps answers grounded and access-controlled; serve hot queries from a
    permission-scoped cache; and mark answers as produced in degraded mode. Across all five: timeouts on every
    hop, bulkheads so one dependency cannot exhaust shared threads, every fallback evaluated on the golden set,
    and chaos tests that inject each failure in staging.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Managed production deployments

- id: iv4-dr-testing
  topics: [interview, reliability]
  questions:
  - How would you test disaster recovery for a platform whose state spans databases, vector indexes, object stores, prompts and model configurations?
  - How do you test disaster recovery for a GenAI platform with vector indexes and prompts?
  - How would you run a disaster recovery drill for an AI platform?
  - What does disaster recovery testing look like when state includes model configurations?
  keywords:
  - test disaster recovery
  - disaster recovery drill
  - disaster recovery testing
  - vector indexes object stores
  - model configurations
  answer: >-
    I test recovery of behaviour, not just of data, because a platform can restore every byte and still
    answer differently if one version is out of step. First, inventory the state and give each class a
    recovery strategy and targets. Configuration, prompts, agent definitions, routing rules and policies are
    code in Git, deployed by pipeline, so their recovery point is the last commit and recovery is a
    redeploy. Model configurations and registries are replicated, and each release manifest pins exact
    model, prompt, index and tool versions. Relational databases, conversation state, registries and
    approvals, use replicated backups with point-in-time recovery, a recovery point of minutes. Object stores
    with versioning and cross-zone replication, within the residency jurisdiction. Vector and search indexes
    are derived data: for critical domains, snapshots restore in minutes; for others, a rebuild from the
    sources of truth takes hours, and I measure that time instead of assuming it, because re-embedding
    millions of chunks can be rate-limited by the embedding service. Audit logs are write-once and
    replicated, a recovery point of zero. Then the drills, each quarter, with an escalating scope: restore a
    single index from snapshot; rebuild one index from scratch and time it; fail a whole zone; and once a
    year, a full regional recovery in the same jurisdiction. The pass criterion is behavioural: after
    recovery, the golden sets for every critical workflow must pass at their release baseline, permission
    tests must show no leaks, the restored manifest must match what was running, and audit continuity must
    be unbroken. A restored index whose ACL metadata is a day older than the documents is a security
    incident, so permission freshness is checked explicitly. Results are written up with measured recovery
    times against targets, and the gaps become backlog. My Knowledge Fabric shows the principle at small
    scale: a deterministic build means the index can always be rebuilt exactly from its sources.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deterministic build; same files in, same index out
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture

- id: iv4-gpu-isolation
  topics: [interview, reliability, security]
  questions:
  - How do you secure model-serving infrastructure and isolate workloads in a shared GPU environment?
  - How do you isolate workloads in a shared GPU environment?
  - How would you secure self-hosted model-serving infrastructure?
  - How do you keep tenants apart on shared GPUs?
  keywords:
  - shared gpu environment
  - model serving infrastructure
  - isolate workloads
  - tenants apart on shared gpus
  - shared gpus
  answer: >-
    I secure it like any multi-tenant compute platform and then add the GPU-specific gaps, because GPUs
    were not designed for strong isolation. Isolation levels, chosen by the data classification of the
    workload. The strongest is dedicated nodes or node pools per tenant tier, restricted data on its own
    GPUs, which is the default for the highest classification. Next is hardware partitioning: NVIDIA's
    Multi-Instance GPU on A100 and H100 class cards splits one GPU into instances with dedicated memory and
    compute slices, a real isolation boundary suitable for separating internal tenants of similar trust.
    Time-slicing and MPS share a GPU without memory isolation, so I use them only within one tenant, for
    utilisation, never across trust boundaries. For the most sensitive cases, confidential computing on
    GPUs that support it, the H100 class does, protects data in use from the host. Serving-layer
    isolation: one inference server process per tenant tier, so KV caches and prefix caches are never
    shared across tenants, because a shared prefix cache can leak through timing or content. Requests carry
    tenant identity, and batching is restricted to the same tenant tier. Supply chain: model weights come
    only from the registry, with verified hashes and signatures, scanned for unsafe serialisation such as
    pickle files, preferring safetensors; serving images are minimal, patched and scanned; and no model
    is loaded from the internet at runtime. Platform hardening: Kubernetes with namespaces, network policies
    that deny by default, workload identity, no privileged pods except the device plugin, admission policies,
    and nodes patched for GPU driver vulnerabilities. Access: inference endpoints are reachable only from the
    AI gateway, never directly, and operators get just-in-time access. Monitoring: GPU and process telemetry,
    anomaly alerts, and audit of every model deployment. The cost of strong isolation is utilisation, so I
    make that trade-off explicit per tier rather than letting utilisation decide it silently.
  evidence:
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Kubernetes, Docker, AWS SageMaker and GCP Vertex AI
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture

- id: iv4-secrets-egress
  topics: [interview, security]
  questions:
  - How would you manage secrets, tool permissions, network egress and sensitive data in prompts and traces?
  - How do you manage secrets and tool permissions for LLM agents?
  - How would you keep sensitive data out of prompts and traces?
  - How do you control network egress for an agent platform?
  keywords:
  - prompts and traces
  - tool permissions network egress
  - secrets and tool permissions
  - out of prompts and traces
  - egress for an agent platform
  answer: >-
    Four rules: no secret ever enters a prompt, every permission is borrowed and scoped, nothing leaves the
    network unannounced, and sensitive data is minimised before it is logged. Secrets: held in a vault and
    issued to workloads by workload identity, short-lived and rotated automatically. Model provider keys exist
    only inside the AI gateway; tool credentials only inside the tool gateway, injected at call time. A model
    never sees a credential, so no injection can extract one, and secret scanners in CI and on traces catch
    leaks into code or logs. Tool permissions: agents act on behalf of a user through delegated, on-behalf-of
    tokens, intersected with the agent's declared scope; every tool is registered with its scope and risk
    class; permissions are reviewed when an agent's version changes, the same way access reviews work for
    people. Network egress: application and agent workloads have no direct internet access. Outbound traffic
    goes through egress gateways with destination allow-lists, to model providers over private endpoints and
    to approved SaaS APIs, and web access for agents, where allowed, through a filtering proxy that logs every
    call. Sensitive data in prompts: classification-aware redaction in the gateway masks personal data,
    secrets and confidential names before external calls, with reversible tokens where the application needs
    the values back; data minimisation in prompt design, sending the three fields the task needs, not the whole
    record. Sensitive data in traces: OpenTelemetry's GenAI conventions treat prompt and completion content as
    opt-in, and I keep it off by default for confidential classes, recording metadata, token counts and
    document IDs instead; where content is captured for debugging, it is redacted before storage, kept in-region,
    access-controlled and expired quickly. The same instinct is built into my Knowledge Fabric, where
    confidential client names are masked in every source before anything is indexed.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Confidential names masked before indexing
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-telemetry-leakage
  topics: [interview, security]
  questions:
  - How do you prevent sensitive information from leaking through logs, feedback systems, evaluation datasets or observability vendors?
  - How do you stop sensitive data leaking through logs and evaluation datasets?
  - How would you protect sensitive information in feedback systems and observability vendors?
  - How do you keep evaluation datasets free of personal data?
  keywords:
  - feedback systems
  - observability vendors
  - evaluation datasets
  - leaking through logs
  - free of personal data
  answer: >-
    These are the side channels most designs forget: the main path is locked down, while copies of the same
    data flow into logs, thumbs-down comments, test sets and a vendor's dashboard. I treat each as a data store
    with the classification of its contents. Logs: structured logging with an allow-list of fields, not
    free-text dumps; prompt and completion content off by default for confidential classes; redaction of
    personal data and secrets at the source, in the logging library, before anything is written; retention
    set by classification, days for debug logs; and access restricted and audited. Error messages are a
    classic leak, a stack trace containing the prompt, so exception handlers are reviewed for that. Feedback
    systems: user comments attached to a thumbs-down often quote the answer, and with it the confidential
    content. Feedback inherits the classification of the conversation it came from, is stored in-region,
    visible only to people cleared for that data, and redacted before it reaches any shared triage board.
    Evaluation datasets: golden sets built from production traffic are pseudonymised or synthesised before
    use, with personal data replaced by realistic placeholders, reviewed by the data owner, versioned with
    their classification, and never copied into notebooks or vendor tools outside the policy. For the most
    sensitive domains, I generate synthetic cases that preserve the structure of real questions without their
    content. Observability vendors: they receive metadata, latencies, token counts, error codes, trace
    structure, and not content, unless the vendor is contracted as a processor, runs in the required region
    and is covered by the data-processing agreement; sampling and redaction happen in our collector before
    export, not at the vendor. Then I verify it: automated scanners for personal data and secrets on log,
    feedback and evaluation stores, and periodic audits. My Knowledge Fabric's rule, mask confidential client
    names in every source before indexing, is the same idea applied at the earliest possible point.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Confidential names masked in every source before indexing
  - url: profile:engagements/ValidAIte
    source: resume
    why: Validating AI systems, with evaluation datasets

# ----------------------------------------------------------------------------- S2.4 Economics and portfolio prioritization
- id: iv4-cost-per-task
  topics: [interview, economics]
  questions:
  - How do you calculate cost per successful task rather than cost per token?
  - How do you calculate the cost per successful task of a GenAI system?
  - Why is cost per token the wrong metric for GenAI?
  - How would you measure unit economics for an AI use case?
  keywords:
  - cost per successful task
  - rather than cost per token
  - cost per token the wrong
  - unit economics for an ai
  answer: >-
    Cost per successful task is the total cost of getting a task done correctly, divided by the number of
    tasks done correctly, and it almost always tells a different story from the token bill. The numerator has
    five parts: model cost for every attempt, including retries, escalations to a larger model and the
    judge or guardrail calls; retrieval and infrastructure, search, embedding, GPU time, storage, allocated
    by usage; tool and API calls to other systems; human time, reviewers approving drafts, agents correcting
    outputs, escalations handled by people, at a loaded hourly rate; and the cost of errors that escape,
    rework, refunds, incidents, estimated from the measured error rate. The denominator counts only tasks
    that met the acceptance criteria, measured on sampled production traffic. An illustrative month: 10,000
    tasks, 1.3 model attempts each at four cents, 520 dollars; infrastructure, 100 dollars; twenty percent
    of tasks reviewed by a person for two minutes at thirty dollars an hour, 2,000 dollars; and 85 percent
    succeed. That is about 2,620 dollars for 8,500 successes, roughly 31 cents per successful task, against
    five cents if you only looked at model calls. The insight is the lever: here human review dominates, so
    improving precision enough to review half as many tasks saves more than switching to a model at half the
    price. I then compare that number to the value of the task, the cost of the same task done the current way,
    and that comparison is what goes in front of a CFO. It also stops false optimisations: a cheaper model that
    lowers success from 85 to 75 percent can raise the cost per successful task. Implementation: the gateway
    attributes tokens and cost to use case and task by trace ID, the workflow records outcomes and human
    touches, and a FinOps job joins them weekly. This is the unit I ask every use case to report.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Enterprise GenAI strategy for organisations adopting AI

- id: iv4-finops
  topics: [interview, economics]
  questions:
  - How would you build a FinOps model for shared GenAI infrastructure?
  - How do you build FinOps for a shared GenAI platform?
  - How would you do chargeback or showback for GenAI usage?
  - How do you allocate shared GPU and model costs to business units?
  keywords:
  - finops
  - chargeback
  - showback
  - shared genai infrastructure
  - allocate shared gpu
  answer: >-
    I follow the FinOps Foundation's loop, inform, optimise, operate, adapted to the fact that GenAI cost is
    driven by usage patterns that change weekly. Inform, allocation first, because nothing can be optimised
    that cannot be attributed. Every model call goes through the gateway tagged with business unit, use case,
    environment and user, so external API spend is attributed exactly. Shared self-hosted GPU capacity is
    allocated by consumption, GPU-seconds or tokens served per use case, with idle capacity either spread
    pro rata or carried by the platform as an explicit investment. Platform fixed costs, the team, the
    gateway, evaluation and observability, are allocated as a transparent platform fee proportional to usage.
    Showback from day one: every business unit sees its spend, its unit costs and its forecast weekly.
    Chargeback only once the numbers are trusted, typically after two or three quarters, because charging on
    disputed numbers destroys adoption. Optimise, the platform's levers: model routing to the cheapest model
    that passes each route's evaluation, semantic and prompt caching, context trimming, batching of
    non-urgent work onto batch APIs or off-peak GPU time, right-sizing GPU pools, and committed-use or
    provisioned-throughput contracts negotiated centrally once demand is predictable. Each lever is tracked
    by the cost per successful task it changes, not by tokens saved. Operate, the governance rhythm: budgets
    and quotas per business unit enforced at the gateway, alerts at 80 percent, anomaly detection on daily
    spend for runaway agents or leaked keys, a monthly review between FinOps, the platform and business-unit
    owners, and an explicit exception process. Two numbers anchor the conversation with finance: total
    spend against value delivered by use case, and the platform's marginal cost per additional team, which
    should fall as the platform matures. The point is not to minimise GenAI spend; it is to make every
    increase a decision someone owns.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy

- id: iv4-reject-use-cases
  topics: [interview, economics, governance]
  questions:
  - Which use cases should be rejected even if technically feasible?
  - Which GenAI use cases would you reject even though they are technically feasible?
  - What kinds of AI use cases do you say no to?
  - When should a feasible AI use case be turned down?
  keywords:
  - rejected even if technically feasible
  - technically feasible
  - use cases would you reject
  - say no to
  - turned down
  answer: >-
    Feasible is the lowest bar; I reject use cases that fail on value, fit, risk or trust, and I say why in
    writing so the decision is not taken personally. Seven categories. One, no owner and no measurable
    outcome: if nobody will be accountable for a metric moving, it is a demo, not a use case. Two, a
    deterministic solution is better: rules, a form, a database query or classic machine learning would be
    cheaper, more accurate and auditable. Routing tickets by a known field does not need an LLM. Three, the
    error cost exceeds what the achievable accuracy allows: when a single wrong output is severe and the
    error rate cannot be pushed low enough, or human review would cost more than doing the work, the
    economics fail even if the demo succeeds. Four, prohibited or near-prohibited practices: the EU AI Act
    bans, for example, emotion recognition in the workplace and in education, social scoring and
    manipulative techniques, and I treat covert monitoring of employees' behaviour in the same spirit even
    where it is legal. Five, consequential decisions about individuals without meaningful human oversight,
    hiring rejections, credit denials, benefit decisions, made by a generative model; these are high-risk
    territory requiring controls the use case cannot carry. Six, data we have no right to use: content
    licensed for another purpose, personal data without a lawful basis, or client data whose contract
    forbids it. Seven, anything that undermines trust in the company's word: generated reviews or
    testimonials presented as real, synthetic people presented as customers, undisclosed AI in contexts where
    people expect a human. And a practical eighth: we cannot evaluate it. If there is no way to tell good
    output from bad, we cannot run it safely. Rejection is often redirection: the same need served by a
    narrower scope, a human-in-the-loop design or a non-AI solution, which is how I would want an AI
    governance function to be experienced.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance frameworks
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: AI governance for organisations adopting AI

- id: iv4-tco-api-vs-self-host
  topics: [interview, economics]
  questions:
  - How do you compare API inference, self-hosting and hybrid serving on total cost of ownership?
  - How do you compare the TCO of API inference against self-hosting?
  - When does self-hosting an LLM become cheaper than an API?
  - How would you build a TCO model for hybrid LLM serving?
  keywords:
  - api inference
  - hybrid serving
  - tco of api
  - self hosting an llm become cheaper
  - tco model for hybrid
  answer: >-
    I compare them on cost per successful task at our forecast volume, with every cost the API price hides
    put on the self-hosting side, and with utilisation as the variable that decides it. API inference: tokens
    times price, plus the gateway, plus the engineering to integrate and evaluate, and a premium for capacity
    guarantees if we need provisioned throughput. It scales to zero, needs no GPU team and gets model
    improvements for free, but cost grows linearly with volume and data-terms constraints apply. Self-hosting:
    GPUs, reserved or on-demand or bought, and a GPU at 3 a.m. costs the same as at noon; plus the serving
    platform, a team of platform and ML engineers on call, model evaluation and upgrades, security and
    patching, power and hosting if on-premises, and the opportunity cost of open models trailing the
    frontier. Its cost is mostly fixed, so cost per token falls with utilisation. A worked comparison, with
    illustrative prices I would replace with our contracts. The platform I sized earlier needs about 18
    billion tokens a month: at a blended two dollars per million through APIs, about 36,000 dollars. Serving a
    70-billion-parameter class model for the same peak needs around twenty H100s; at an illustrative three
    dollars per GPU-hour that is about 44,000 dollars a month before the team. At this volume the API wins on
    cost, unless the data cannot leave our control or the volume grows several-fold with steady load, where
    utilisation approaches the peak and self-hosting a smaller model flips the answer. So hybrid is usually the
    right design: APIs for frontier reasoning and spiky demand; self-hosted open models for restricted data,
    high-volume narrow tasks such as classification and extraction, and steady batch work that keeps GPUs
    busy; with the gateway able to move a route between them. I recompute the model twice a year, because
    prices fall fast. The hidden costs of a fully self-hosted estate, the GPU team, the evaluation burden and
    the capability gap, are why I rarely recommend it outright.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy
  - url: profile:skills/LLM Platforms
    source: resume
    why: OpenAI, Claude and Gemini

- id: iv4-prioritize-100
  topics: [interview, economics, strategy]
  questions:
  - How would you prioritize 100 proposed use cases across value, feasibility, risk, reuse and time-to-value?
  - How would you prioritize a hundred proposed GenAI use cases?
  - How do you rank 100 AI use cases by value, risk, reuse and time to value?
  - How would you triage a backlog of a hundred AI ideas?
  keywords:
  - 100 proposed use cases
  - hundred proposed
  - time to value
  - prioritize 100
  - hundred ai ideas
  answer: >-
    Gates first, then a score, then a portfolio view, because a single weighted number on its own picks a
    hundred small wins and no strategy. Gates, pass or fail, before any scoring: a named business owner, a
    measurable outcome with a baseline, data that exists and that we have the right to use, and no prohibited
    or unacceptable risk. Typically a large share fails a gate and is parked with a reason, which is itself
    a service to the business. Score, on a one-to-five scale with written
    definitions so different assessors agree: value, the annual impact on the outcome metric times the
    likelihood of adoption, weighted about 35 percent; feasibility, data readiness, technical maturity and
    integration effort, 25 percent; risk, inverted, the risk tier and the cost of an error, 15 percent; reuse,
    how much platform capability it builds or uses, shared knowledge, tools or patterns, 15 percent; and time
    to value, months to measurable benefit, 10 percent. The weights are the steering group's decision, and I
    make them explicit so they can be argued with. Portfolio: I plot value against feasibility and choose a
    balanced set. Quick wins, high feasibility and solid value, to build credibility and fund the platform;
    two or three strategic bets with larger value and more uncertainty, staged with kill criteria; and
    platform builders, use cases chosen partly because they create the knowledge service or the tool others
    need. Clusters matter: ten use cases needing the same HR knowledge base are one platform investment and
    ten cheap applications. Capacity: the top of the list is cut to what teams can actually deliver in a
    quarter. Rhythm: re-scored quarterly with actual results, and stopped use cases count as successes of the
    process. It extends the value-and-feasibility scoring I use in AI strategy work to a portfolio of a
    hundred.
  evidence:
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy and roadmap
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading the AI CoE roadmap

# ----------------------------------------------------------------------------- S3.1 Executive communication and strategic choices
- id: iv4-cio-strategy
  topics: [interview, executive, strategy]
  questions:
  - The CIO asks, "What should our enterprise GenAI strategy be?" Give a concise answer suitable for a five-minute executive discussion.
  - What should our enterprise GenAI strategy be?
  - The CIO asks what our enterprise GenAI strategy should be. What do you say in five minutes?
  - Give the CIO a five-minute answer on enterprise GenAI strategy.
  keywords:
  - cio asks
  - five minute executive
  - enterprise genai strategy be
  - genai strategy should be
  - five minute answer
  answer: >-
    In five minutes I would say five things, and stop. One, GenAI is a capability for changing how work gets
    done, not a technology project, so our strategy starts from three to five business outcomes we will move
    in the next eighteen months, each with an executive owner and a baseline. I would propose candidates such
    as customer-service handling time, software delivery lead time and the cost of document-heavy processes,
    and let the business choose. Not a hundred pilots; a few outcomes. Two, we build one governed platform
    and many applications. A shared AI gateway, knowledge services over our own data with permissions
    respected, evaluation and observability, so every team builds on the same safe foundation and we pay for
    it once. That platform is our main technical investment. Three, we buy what is commodity and build what
    differentiates. Models, we buy access to, from more than one provider, so we are never locked in. What we
    build is the layer only we can build: our knowledge, our workflows, our evaluation of what good looks like.
    Four, we govern by risk, not by fear. A tiering framework means low-risk internal assistants move in weeks,
    while anything that decides about customers or acts in our systems gets human oversight, testing and audit
    proportionate to the risk. That is how we stay ahead of regulation such as the EU AI Act without slowing
    everything. Five, people and measurement. We train the workforce to use it and a core team to build it,
    and we report every quarter on outcomes moved, cost per successful task and incidents, and we stop what
    does not work. The ask: a platform budget and a team for the first year, two or three lighthouse use
    cases with owners, and a quarterly review with you. What I would deliberately not do is train our own
    foundation model or let every department sign its own AI contracts. Then I stop and take questions.
  evidence:
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy and roadmap
  - url: profile:roles/Qualizeal
    source: resume
