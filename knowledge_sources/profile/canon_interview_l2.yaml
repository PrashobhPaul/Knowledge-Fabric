- id: iv4-paper-to-production
  topics: [interview, research, delivery]
  questions:
  - How do you turn a paper into a reproducible internal experiment and then a production decision?
  - How do you take a research paper to a reproducible experiment and a production decision?
  - What is your process from reading a paper to deciding whether to ship it?
  - How do you turn a paper into a production decision?
  keywords:
  - turn a paper into
  - reproducible internal experiment
  - research paper to a reproducible
  - reading a paper to deciding
  - paper into a production decision
  answer: >-
    In four gates, each with a written exit criterion, so enthusiasm cannot skip a step. Gate one, read for
    the claim and the conditions. What exactly improves, on which data, against which baseline, at what
    cost, and under which assumptions? I write a one-page brief: the claim, why it might matter to one of
    our problems, what would make it irrelevant to us, and the metric we would use. Most papers stop here,
    because their conditions are not ours. Gate two, reproduce the paper's own result on its own data or
    benchmark, from their code if available or from the description if not. If I cannot reproduce it, I do
    not know whether a later failure on our data is the method or my implementation. Implementing from the
    paper, not porting a library, is how I built CodeFabric: BM25 from Robertson and Zaragoza, reciprocal
    rank fusion from Cormack and colleagues, structure-aware chunking from the cAST paper and feature hashing
    from Weinberger and colleagues, each cited in its README. Gate three, the internal experiment: the method
    against our current production baseline, on our evaluation set, under our constraints of latency, cost,
    memory and privacy, with paired comparisons, confidence intervals and an ablation of its key component.
    Everything is versioned, code, data snapshot, configuration and seeds, so anyone can rerun it with one
    command. Gate four, the production decision, made against criteria written before the experiment: the
    minimum gain on task success, the maximum acceptable cost and latency, and the operational burden, who
    runs it, how it fails, how we roll it back. A positive decision goes to a canary or shadow deployment with
    the same metrics live; a negative one is recorded in an architecture decision record so nobody repeats the
    exercise blindly. My Knowledge Fabric's roadmap item, a transformer re-ranker evaluated against the LSA
    baseline with the existing harness, is this process applied to my own system.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Algorithms implemented from their published papers and cited
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Roadmap items evaluated against the baseline with the existing harness

- id: iv4-technique-maturity
  topics: [interview, research, strategy]
  questions:
  - What is your framework for deciding whether a new model or agent technique is mature enough for enterprise use?
  - How do you decide whether a new agent technique is mature enough for enterprise use?
  - What makes a new model technique enterprise-ready in your view?
  - How do you judge the maturity of a new GenAI technique?
  keywords:
  - mature enough for enterprise
  - mature enough
  - enterprise ready in your view
  - maturity of a new
  - new agent technique
  answer: >-
    I score six dimensions, and a technique is enterprise-ready only when none of them is red, however good
    its headline result. One, evidence: replicated results by more than one group, on tasks like ours,
    ideally reproduced by us on our evaluation set, rather than one paper or a vendor benchmark. Two,
    reliability: consistent behaviour across repeated runs and inputs, with failure modes that are known and
    detectable. A technique that works brilliantly four times in five is a research result, not a product.
    Three, operability: it can be deployed, monitored, versioned, rolled back and debugged with our tools; a
    method that needs a researcher to babysit it is not mature. Four, security and governance: its attack
    surface is understood, for agent techniques that means how it behaves under prompt injection and with
    least-privilege tools; its data handling meets our policies; and it can produce the logs and evidence
    our risk tier requires. Five, ecosystem and supply: maintained open-source implementations or more than
    one vendor, licensing we can live with, and skills we can hire or train for, so we are not betting on
    one maintainer. Six, economics: cost per successful task at our volume, including the people who run
    it. I then map the result to an adoption ring, borrowing the technology-radar idea: assess, where we read
    and reproduce; trial, a bounded pilot with a business owner and exit criteria; adopt, a supported paved
    road; and hold. I publish the ring for each technique so teams are not each re-evaluating it. An example
    of the discipline: MCP reached adopt quickly, as a simple, open protocol with several implementations,
    and my CodeFabric and CogniFlow both expose MCP servers, while fully autonomous long-horizon agents
    stay in trial for consequential work until their reliability across repeated runs is measured.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Exposes its tools to AI agents over MCP
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: MCP server for drawing architectures from any LLM
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and the AI CoE roadmap

- id: iv4-publish-patent
  topics: [interview, research, strategy]
  questions:
  - What would you publish, patent, open-source or retain as proprietary capability, and how would you make that decision?
  - How do you decide what to publish, patent or open-source?
  - What would you keep proprietary versus open-source?
  - How do you make intellectual property decisions on AI research?
  keywords:
  - patent
  - open source or retain
  - retain as proprietary
  - keep proprietary versus open
  - intellectual property decisions
  - publish patent
  answer: >-
    I decide by asking where the value actually lives: in the idea, the implementation, the data or the
    operation, and who benefits from it being known. Publish: methods and evaluation protocols whose value
    grows when others test them, and where credibility matters more than secrecy. My PhD work on trust in
    knowledge sources is like that; a fault-injection protocol for source trust is worth more if others can
    reproduce it and challenge it. Publishing also creates prior art, which protects freedom to operate.
    Open-source: infrastructure and tooling that is not our differentiator, where community adoption brings
    contributions, hiring signal and trust. My own repositories show the choice. CodeFabric is Apache-2.0,
    a licence that includes an explicit patent grant, with only permissively licensed
    optional dependencies and no GPL or AGPL in the tree, so an enterprise can adopt it without legal
    worries. Knowledge Fabric's code is public because its value to me is demonstrating explainable,
    cited AI, while the knowledge it serves is curated and confidential names are masked. Patent: rarely in
    applied GenAI. A patent is worth it only for a genuinely novel, detectable technical mechanism that a
    competitor would otherwise copy, in a jurisdiction where we would enforce it; most architecture patterns
    are neither novel nor detectable in a competitor's product. Retain as proprietary: the things that are
    actually hard to copy, our domain data and its curation, our evaluation sets, the client-specific
    integrations and the operating know-how. For an employer the decision is not mine alone: it goes through
    the company's IP policy, legal counsel and client contracts, since work for a client may belong to the
    client. So at Qualizeal, ValidAIte and QMentisAI are internal platforms, and client solutions such as the
    agentic SDLC work for a major US airline stay confidential.
  evidence:
  - url: https://github.com/PrashobhPaul/CodeFabric
    source: github
    why: Apache-2.0 with an explicit patent grant; permissive dependencies only
  - url: profile:engagements/ValidAIte
    source: resume
    why: Internal platform at the Qualizeal AI Center of Excellence
  - url: doc:PhD_Anurag_University
    source: notes
    why: The research direction and its evaluation protocol

# ----------------------------------------------------------------------------- S2.1 Architecture strategy and operating model
- id: iv4-roadmap-2-3-year
  topics: [interview, strategy]
  questions:
  - How would you define a 2--3 year enterprise GenAI architecture roadmap?
  - How would you define a two to three year enterprise GenAI architecture roadmap?
  - What would your three-year GenAI architecture roadmap look like?
  - How do you build a multi-year GenAI architecture roadmap?
  keywords:
  - 2 3 year
  - three year genai
  - two to three year
  - multi year genai
  - genai architecture roadmap
  answer: >-
    I define it backwards from business outcomes and forwards from capabilities, in three horizons, and I
    revisit it every quarter, because the model landscape moves faster than any annual plan. The inputs are
    the business strategy and its measurable goals, the portfolio of candidate use cases scored on value,
    feasibility, risk and reuse, and an honest current-state assessment of data, platforms, skills and
    governance. Horizon one, the first six to nine months: foundations and proof. The control plane every
    use case needs, an AI gateway for all model access with identity, logging, redaction, quotas and cost
    attribution; an evaluation service with golden sets and release gates; a first shared knowledge service
    with permission-aware hybrid retrieval; and the governance basics, risk tiers, an AI inventory and
    decision records. Delivered alongside two or three lighthouse use cases with named owners and baselines,
    so the platform is shaped by real work. Horizon two, roughly months nine to eighteen: scale and reuse.
    The paved road matures, templates, SDKs and self-service onboarding; agent and tool infrastructure arrives
    with a tool registry, approvals and sandboxing; more knowledge domains are onboarded; FinOps moves from
    showback to chargeback; and the use-case pipeline runs as a portfolio with quarterly reprioritisation.
    Horizon three, eighteen to thirty-six months: differentiation. Bounded autonomous workflows in the
    processes where measured precision justifies them, domain-adapted models where evaluation shows the gap,
    knowledge graphs for the relational domains, and the operating model handed increasingly to federated
    domain teams. Each horizon has exit criteria, adoption, cost per successful task, incident rates,
    business KPIs moved, and the roadmap names what we will deliberately not build, such as our own
    foundation model. I keep it to one page for executives with a detailed architecture backlog underneath.
    This is the shape of the AI Center of Excellence roadmap I lead at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading the AI CoE roadmap; AI architecture strategy and governance
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy and roadmap

- id: iv4-centralize-vs-domain
  topics: [interview, strategy]
  questions:
  - Which capabilities should be centralized as a platform and which should remain owned by product/domain teams?
  - Which GenAI capabilities should be centralized as a platform and which owned by domain teams?
  - What belongs in the central AI platform and what stays with product teams?
  - How do you split ownership between the platform team and domain teams?
  keywords:
  - centralized as a platform
  - owned by product domain
  - owned by domain teams
  - central ai platform
  - platform team and domain teams
  answer: >-
    I centralise what has economies of scale, carries enterprise risk, or must be consistent to be trusted,
    and I leave to domain teams whatever encodes their knowledge of the business. Centralised as the
    platform: the AI gateway and model access, with provider contracts, routing, quotas, redaction and cost
    attribution, because one negotiated contract and one choke point for policy beat thirty; identity and
    authorisation integration, so every call carries the user and their permissions; model serving for
    self-hosted models, because GPU capacity is expensive and shared; the evaluation service, its harness,
    its judges and its release gates, though not the golden sets themselves; observability and audit, one
    trace format and one audit store, so a regulator's question has one answer; the knowledge-service
    infrastructure, connectors, indexing, permission-aware hybrid retrieval, as a product; the tool registry,
    approval workflow and sandboxing for agents; and the guardrail and policy engine. Owned by product and
    domain teams: the use cases themselves and their business outcomes; prompts and workflow logic; their
    golden sets and acceptance criteria, because only the domain knows what correct means; their knowledge
    content and its curation, since a central team cannot know which policy version is authoritative; the
    user experience; and the decision to accept a residual risk within their tier. Shared, with clear rules:
    domain-specific tools, built by domains on the platform's tool contract and registered centrally; and
    fine-tuned or specialised models, owned by the domain but served and evaluated on the platform. The test
    I apply to any proposed central capability: would at least three teams otherwise build it, or would a
    mistake in it be an enterprise incident? If neither, it stays with the domain. That is how I approach
    the AI CoE at Qualizeal: shared platforms such as ValidAIte, with domain solutions built on top.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI CoE, internal platforms and client solutions
  - url: profile:engagements/ValidAIte
    source: resume
    why: A shared internal platform

- id: iv4-paved-road
  topics: [interview, strategy]
  questions:
  - How would you create a paved road for teams without forcing every use case into the same architecture?
  - How do you create a paved road without forcing every use case into one architecture?
  - What is a GenAI paved road, and how do you keep it optional?
  - How do you give teams a golden path while allowing exceptions?
  keywords:
  - paved road
  - golden path
  - same architecture
  - one architecture
  - forcing every use case
  answer: >-
    A paved road is the easiest way to do the right thing, not the only way allowed. I build it so that
    taking it is cheaper than leaving it, and I make leaving it legitimate but explicit. What it contains:
    three or four reference patterns, not one, because use cases differ. A retrieval-grounded assistant; a
    document-processing pipeline for extraction and classification; a bounded tool-using agent; and a
    batch-generation pattern. Each comes as a template repository with the gateway client, retrieval SDK,
    evaluation harness wired into CI, tracing, guardrails, deployment manifests and a filled-in risk
    assessment, so a team gets from idea to a governed pilot in days. Why teams take it: the road comes with
    things they would otherwise have to build or argue for, pre-approved security review for the pattern,
    model access without procurement, quota, observability dashboards, and a faster path through the risk
    tier. Those benefits only exist on the road. How it avoids forcing one architecture: the mandatory part is
    small and is about interfaces, not implementation. Every use case, on the road or off it, must call models
    through the gateway, carry user identity, emit traces in the standard format, pass an evaluation gate
    and register in the AI inventory. Everything else, the orchestration framework, the prompt design, the
    retrieval tuning, the user interface, is the team's choice. A team that leaves the road writes a short
    decision record explaining why, and takes on the operational burden the road would have carried. I
    review those records quarterly, because a repeated exit is a signal the road is missing a pattern, and
    the best off-road solutions get absorbed into it. The road is a product with users, so it has a
    roadmap and a satisfaction survey like any other. It is how I approach the GenAI integration practices
    I define at the Qualizeal AI Center of Excellence.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Defining best practices for GenAI integration, prompt engineering and RAG
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Architecture reviews and AI governance

- id: iv4-reference-boundaries
  topics: [interview, strategy, architecture]
  questions:
  - 'Define your reference architecture boundaries: AI gateway, model serving, orchestration, knowledge services, evaluation, identity, policy and observability.'
  - How do you define the reference architecture boundaries between the AI gateway, orchestration and knowledge services?
  - What are the boundaries between model serving, orchestration, evaluation and policy in your reference architecture?
  - Where would you draw the boundaries in a GenAI reference architecture?
  keywords:
  - reference architecture boundaries
  - knowledge services evaluation
  - model serving orchestration
  - boundaries in a genai reference
  - boundaries between the ai gateway
  answer: >-
    I define each boundary by what the component owns, what it must never do, and the contract it exposes,
    because unclear boundaries are where duplicated logic and security gaps grow. The AI gateway owns access
    to every model: authentication, the caller's identity and data classification on each call, routing,
    quotas and budgets, redaction, caching, retries and failover, and cost attribution. It must never hold
    business logic or prompts. Its contract is a capability API, chat, embed, rerank, classify, independent of
    provider. Model serving owns running self-hosted models: GPU pools, the inference servers, autoscaling,
    model artefacts and their versions. It sits behind the gateway and is never called directly by
    applications. Orchestration owns the control flow of an application or agent: workflow and agent state,
    tool calls, retries, checkpoints and human-approval steps. It belongs to the product team, built on a
    platform runtime, and it must never call a model or a tool except through the gateway and the tool
    gateway. Knowledge services own content: connectors, parsing, indexes, permission-aware retrieval,
    provenance and freshness, exposed as retrieve and query APIs that take the user's identity. They never
    generate answers. Evaluation owns measuring quality: harnesses, judges, golden-set storage, release gates
    and online quality sampling. It reads traces and writes verdicts, and it never sits in the request path
    except for synchronous guardrail checks. Identity is the enterprise identity provider, reused, not rebuilt:
    users, groups, attributes and service identities, with on-behalf-of tokens for agents. Policy is a
    central decision point, policy as code, that the gateway, the tool gateway and retrieval all ask: may this
    user, through this agent, do this to this data? Observability owns traces, metrics, logs and the audit
    store in one schema, with OpenTelemetry's GenAI conventions and redaction before storage. Drawn this way,
    each box can be replaced without touching the others, which is the real test of a reference architecture.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance frameworks
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Enterprise GenAI strategy and architecture reviews

- id: iv4-version-governance
  topics: [interview, strategy, governance]
  questions:
  - How would you govern model, prompt, agent, tool, dataset and knowledge-base versions?
  - How do you govern agent, tool and knowledge-base versions?
  - How would you version models, prompts, tools and datasets together across a platform?
  - What is your governance for knowledge-base and agent versions?
  keywords:
  - knowledge base versions
  - agent tool dataset
  - agent and tool versions
  - govern agent
  - versions together across a platform
  answer: >-
    Every artefact that changes behaviour gets a version, a registry entry, an owner and a gate, and a
    release is a manifest that pins them all together, because behaviour emerges from the combination, not
    any single piece. Models: a model registry with the exact provider version identifier or artefact hash,
    licence, evaluation results, approved use tiers and a deprecation date; aliases such as default-chat
    point to a version, so applications never hard-code one. Prompts: stored as code, versioned in the
    application repository or a prompt registry, each version linked to the model it was tuned for, since
    prompts are not portable across models. Agents: the agent definition, its instructions, tool set,
    permissions, budgets and autonomy level, is a versioned artefact; widening its tools or autonomy is a
    governed change with its own review. Tools: registered in the tool registry with a schema version, an
    owner, a risk class and the permission scope; breaking schema changes get a new major version, and old
    versions are retired on a published schedule. Datasets, training data, fine-tuning sets and golden sets,
    versioned as immutable snapshots with lineage and data-classification tags. Knowledge bases: an index is
    versioned by its source snapshot, chunking configuration and embedding model, so a change of embedding
    model is a new index built side by side and switched by alias, never an in-place mutation. The release
    manifest pins model, prompt, agent, tools, index and evaluation set versions; it must pass the golden-set
    gate to be promoted, it is deployed by canary, and rollback is one step to the previous manifest. Change
    control is proportional to the risk tier: a low-risk assistant ships on green tests, a high-risk agent
    also needs sign-off. My Knowledge Fabric is a small version of the idea: the deterministic build pins
    every input, so the same files always give the same index, and the proof gates every change.
  evidence:
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Deterministic build; the proof gates every change
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks

- id: iv4-mandate-recommend
  topics: [interview, strategy]
  questions:
  - What architectural standards would you mandate, recommend or leave to team discretion?
  - Which architecture standards would you mandate, and which would you only recommend?
  - What would you leave to team discretion in a GenAI architecture?
  - How do you decide which standards are mandatory?
  keywords:
  - mandate recommend
  - team discretion
  - only recommend
  - standards are mandatory
  answer: >-
    Three tiers, and the rule for putting something in the mandatory tier is that its absence would create
    an enterprise risk or make the portfolio ungovernable. Mandated, few and enforced by the platform, not by
    review: all model calls through the AI gateway; user identity and authorisation on every retrieval and
    every tool call, applied before ranking and before execution; data classification respected end to end,
    with restricted data never sent to unapproved models or regions; traces and audit records in the standard
    schema with redaction; registration in the AI inventory with an owner and a risk tier; an evaluation gate
    with a golden set before every production change; human approval for consequential actions as defined by
    the tier; secrets in the vault, never in code or prompts; and an incident process. If I cannot enforce a
    mandate automatically, I question whether it belongs here. Recommended, the paved road: the reference
    patterns and templates; LangGraph for stateful agents and the Microsoft Agent Framework for .NET estates;
    hybrid retrieval with reranking as the default; structured outputs with schemas; the shared vector and
    search stack; prompt registries; and cost-optimisation practices such as routing and caching. Teams may
    deviate with a short decision record. Team discretion: prompt wording and workflow design; user
    experience; which approved model within the gateway suits their task; chunking and retrieval tuning for
    their content; their test cases beyond the minimum gate; their delivery cadence and internal tooling. I
    revisit the tiers every quarter: a recommendation that every team adopts can stay a recommendation, and
    a discretionary area that keeps causing incidents moves up. The principle I hold to: mandate outcomes and
    interfaces, recommend implementations, and trust teams with the rest. It reflects how I set practices at
    the Qualizeal AI Center of Excellence, where the client's estate often decides the framework.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Defining best practices for GenAI integration and RAG; governance
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Framework choice depends on the client's need

- id: iv4-platform-bottleneck
  topics: [interview, strategy, leadership]
  questions:
  - How would you avoid creating a centralized platform bottleneck?
  - How do you stop a central AI platform team from becoming a bottleneck?
  - How would you keep the GenAI platform from slowing teams down?
  - What prevents a centralized platform from becoming a bottleneck?
  keywords:
  - platform bottleneck
  - becoming a bottleneck
  - centralized platform
  - slowing teams down
  answer: >-
    A platform becomes a bottleneck when teams must ask it for things; it stays out of the way when teams can
    serve themselves within guardrails. So the design principle is self-service by default and tickets only
    for exceptions. Concretely, five mechanisms. One, self-service onboarding: a team gets gateway access,
    quota, a retrieval index, a template repository and dashboards through an API or portal in minutes,
    with policy checks automated, not reviewed. If onboarding takes a meeting, it will not scale past twenty
    teams. Two, the thinnest viable platform, in the Team Topologies sense: the platform builds what many
    teams need, and stops. Domain-specific features belong to domains, built on the platform's extension
    points, a tool contract, a connector SDK, plug-in guardrails. A platform that tries to build every
    team's feature becomes the queue. Three, governance as code: risk tiers, evaluation gates and data rules
    enforced in the pipeline and the gateway, so compliance does not wait for a review board. The board
    reviews only the high-risk tier and new patterns. Four, an inner-source model: teams can contribute
    connectors, tools and patterns to the platform through pull requests with platform review, so a team in
    a hurry is not blocked by the platform's backlog. Five, an enabling function alongside the platform:
    a few architects and engineers who embed with a domain team for a few weeks to get it started, then
    leave, rather than doing the work for them indefinitely. And I measure the bottleneck directly: lead time
    from request to first production call, the share of onboarding done without human touch, the size and
    age of the platform's request queue, and the number of teams building around the platform, which is the
    clearest sign it is in the way. If shadow platforms appear, the platform has failed its users, and I
    treat that as product feedback, not as non-compliance.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading the AI CoE roadmap and best practices
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Mentored AI teams across three geographies

- id: iv4-platform-slos
  topics: [interview, strategy, reliability]
  questions:
  - What are the platform's internal product interfaces and service-level objectives?
  - What internal product interfaces and SLOs would the GenAI platform offer?
  - Which service-level objectives would you set for an internal AI platform?
  - What does the AI platform promise its internal users?
  keywords:
  - internal product interfaces
  - service level objectives
  - internal ai platform
  - platform promise
  - platform offer
  answer: >-
    I treat the platform as a set of internal products, each with a versioned interface, a documented
    contract and SLOs that teams can build on. The interfaces: a model API through the gateway, chat,
    embed, rerank and classify, with streaming, structured output and per-call metadata such as tenant,
    user and data class; a knowledge API, retrieve and query with the caller's identity, plus an ingestion
    API and connector SDK for domain content; a tool registry and tool-gateway API for agents, with
    approval hooks; an evaluation API, register a golden set, run an evaluation, get a gate verdict; a
    telemetry and cost API; and self-service provisioning for quota, keys, indexes and environments. Each is
    versioned with semantic versioning, backward compatible within a major version, and announced deprecations.
    The SLOs, examples I would start from and then tune with data. Gateway availability 99.9 percent monthly
    for interactive traffic, measured as successful responses, with added gateway latency under 50
    milliseconds at p95; the model latency itself is reported per model rather than promised, because
    providers own it. Retrieval: p95 under 300 milliseconds for a hybrid query at the agreed corpus size, and
    freshness, a source change visible in the index within fifteen minutes for change-event sources, and a
    a removed permission enforced within five. Ingestion throughput per connector. Evaluation: a gate verdict
    within thirty minutes for a standard golden set, so it fits in CI. Onboarding: a new team to first
    production call in under five working days. Support: a severity-one response within fifteen minutes.
    Every SLO has an error budget; when a budget is spent, platform feature work pauses for reliability work.
    I also publish what the platform does not promise, provider-side quality changes, for example, so
    teams design for them, and I review the SLOs quarterly with the consuming teams.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and the AI CoE roadmap
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Managed production deployments

- id: iv4-platform-adoption
  topics: [interview, strategy]
  questions:
  - How would you measure platform adoption and developer productivity?
  - How do you measure adoption of the GenAI platform?
  - How would you measure developer productivity on an AI platform?
  - Which metrics show the platform is being adopted?
  keywords:
  - platform adoption
  - developer productivity
  - adoption of the genai platform
  - platform is being adopted
  answer: >-
    I measure three layers, reach, flow and value, and I am careful that none of them becomes a vanity
    number. Reach, is the platform where the work is: the share of AI use cases in the inventory that call
    models through the gateway, the target is all of them; the number of teams and applications in
    production on it; the share of model spend flowing through it, which exposes shadow usage that a count
    of teams would hide; reuse, the number of applications using each shared knowledge index, tool and
    template; and the number of shadow platforms, workarounds that bypass it. Flow, does it make teams
    faster, using the DORA metrics adapted for AI: lead time from idea to first production call; deployment
    frequency of prompt, model and agent changes; change failure rate, the share of releases rolled back or
    causing incidents; and time to restore. Plus platform-specific flow: onboarding time without human
    touch, time to run an evaluation gate, and the time a team waits on the platform's queue. I balance
    those with the SPACE view, so a developer satisfaction survey every quarter sits beside the activity
    data, because activity without satisfaction usually means the platform is mandated, not loved. Value,
    is it worth it: cost per successful task per use case, before and after moving onto the platform;
    incidents avoided, measured as security and quality incidents per application; business KPIs moved by
    applications on the platform; and the cost of the platform itself against the duplicated effort it
    replaced. What I avoid: counting prompts or tokens as productivity, and lines of AI-generated code as
    output. For AI-assisted engineering in particular, the agentic SDLC and STLC work at Qualizeal, I look at
    lead time and change failure rate together, because faster delivery that breaks more often is not
    productivity.
  evidence:
  - url: profile:engagements/Agentic AI for the SDLC
    source: resume
    why: Agentic AI for the software development life cycle
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Agentic AI for the software testing life cycle

- id: iv4-deprecation
  topics: [interview, strategy, delivery]
  questions:
  - What is your deprecation strategy when a shared model or framework changes?
  - How do you deprecate a shared model that many applications depend on?
  - What happens when a provider retires a model your platform uses?
  - How would you migrate teams off a deprecated framework?
  keywords:
  - deprecation strategy
  - deprecate a shared model
  - retires a model
  - deprecated framework
  - shared model or framework
  answer: >-
    Deprecation is a planned product event with dates, tooling and evidence, not an email. It starts long
    before the change: applications never hard-code a model, they call an alias in the gateway, default
    chat or extraction small, and the registry knows which applications use which alias and version, so I
    know the blast radius on the day a provider announces a retirement. When a shared model changes, whether
    the provider retires it or we choose a better one, five steps. One, evaluate the successor against every
    consuming application's golden set, not a public benchmark, and publish the per-application results,
    because a model that is better on average can break one workflow. Two, announce a timeline proportional to
    the risk: typically an announcement, a migration window and a sunset date, with the provider's own
    retirement date as the hard limit. Three, make migration cheap: per-model prompt variants prepared and
    tested by the platform where possible, a compatibility mode in the gateway for parameter differences,
    and a canary switch that moves a percentage of an application's traffic to the new version with
    automatic rollback on quality or error thresholds. Four, track and help: a migration dashboard per
    application, and the platform team pairing with the stragglers, highest risk first. Five, sunset: the
    alias moves, the old version is removed, and calls that still pin it fail loudly with a clear message,
    not silently. Frameworks follow the same pattern with a longer clock. When an orchestration framework
    changes major version or a team must leave one, the platform keeps adapters and contract tests at the
    boundaries, tool contracts, state schemas, the gateway API, so the framework is replaceable behind them.
    Choosing among LangGraph, CrewAI, AutoGen or the Microsoft Agent Framework per need, as I do at
    Qualizeal, only works if those boundaries hold.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Multi-agent systems with LangGraph, CrewAI and AutoGen
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Framework choice depends on the client's need and the situation

# ----------------------------------------------------------------------------- S2.2 Whiteboard: Enterprise GenAI platform
- id: iv4-genai-platform
  topics: [interview, whiteboard, architecture]
  diagram: assets/diagrams/iv4-genai-platform.svg
  questions:
  - A global enterprise wants a secure GenAI platform supporting 30,000 employees across multiple business units and regions. Design the enterprise target architecture and the first 90-day delivery slice.
  - A global enterprise wants a secure GenAI platform supporting 30,000 employees across multiple business units and regions.
  - Design the enterprise target architecture and the first 90-day delivery slice.
  - 'Whiteboard: Enterprise GenAI platform for 30,000 employees across business units and regions.'
  - Design a secure enterprise GenAI platform for 30,000 employees across regions.
  - How would you architect a multi-region GenAI platform for a global enterprise?
  - Design a multi-tenant agent platform for a global enterprise with data residency.
  keywords:
  - 30 000 employees
  - secure genai platform
  - enterprise target architecture
  - 90 day delivery slice
  - multi region genai platform
  - multi tenant agent platform
  - enterprise genai platform
  answer: >-
    Discovery before drawing. Which three of the hundred use cases matter most, and who owns their
    outcomes? Which regions have residency rules, and do they cover prompts, telemetry and support access?
    What counts as a consequential action? Which identity, cloud, data and security platforms must I reuse?
    The budget and its owner, the availability target, and what production in 90 days must mean. My working
    assumptions: 3,000 concurrent users at peak sending a request every two to three minutes, about 20
    requests per second interactive, batch off-peak; 99.9 percent availability for interactive use;
    restricted data never leaves its region.

    Logical architecture, five zones with explicit trust boundaries. One, experiences: chat, IDE and
    workflow front ends, which hold no secrets and call only platform APIs. Two, a global control plane:
    identity federation with the existing identity provider, a policy decision point as code, the model and
    tool registries, the AI inventory, the evaluation service and FinOps. It stores configuration and
    metadata, never content. Three, regional data planes, one cell per residency region: the AI gateway,
    permission-aware knowledge services, self-hosted model serving, the agent runtime, and regional
    observability and audit stores. A request is pinned to its region by the user's home region and the data
    classification, so a cell failure stays regional. Four, model providers behind the gateway: external APIs
    reached through private endpoints in-region, with no-retention terms, plus open-weight models in each cell
    for restricted data. Five, enterprise systems reached only through a tool gateway.

    The decisions that matter. Identity-aware authorisation at retrieval time, ACLs filtered inside the index
    query, and at action time, on-behalf-of tokens intersected with the agent's scope. Routing by
    classification first, then task and cost, with an evaluated fallback chain and per-model prompts, so
    portability is real rather than a false abstraction. Knowledge: connectors for SharePoint, Confluence,
    databases, lakes and SaaS on change events, the source system as the single source of truth, hybrid
    retrieval with reranking, provenance and validity dates on every chunk, deletion as tombstones. Agents:
    a tool registry with risk classes, least privilege, approvals with diffs for consequential actions,
    idempotency keys and recorded before-states. Runtime: sandboxed execution, vault-held secrets, egress
    allow-lists and DLP. Operations: OpenTelemetry traces with redaction, immutable audit, golden-set release
    gates and an AI incident process. Economics: per-business-unit quotas and budgets at the gateway, showback
    first, cost per successful task as the unit.

    Build versus buy: reuse identity, cloud, SIEM and data catalogue; buy model access and probably the
    vector and search engine; build the thin layer that differentiates, gateway policy, knowledge services
    and evaluation, as much configuration as code.

    The first 90-day slice: one region, two use cases, a knowledge assistant for one business unit over
    SharePoint and Confluence and an engineering assistant, both read-only. In scope: the gateway with two
    providers, identity and policy, one knowledge service, the evaluation gate, audit and showback. Out of
    scope: autonomous writes and the second region. Acceptance: golden-set targets agreed with the business
    owner, zero permission-leak tests failing, p95 time to first token under two seconds, and cost per
    successful task reported weekly. Ownership: a platform team owns the zones, domain teams own use cases
    and their golden sets, and a risk council owns the tiers.

    I would rather defend this simple version than a diagram with forty boxes. It applies at enterprise scale
    what I built in my Knowledge Fabric, cited answers with resolved evidence and masked confidential names,
    and the agentic patterns I design at Qualizeal.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production multi-agent systems, AI architecture strategy and governance
  - url: doc:Knowledge_Fabric
    source: notes
    why: Cited answers with lineage and resolved evidence
