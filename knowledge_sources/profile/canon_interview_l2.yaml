- id: iv4-major-disagreement
  topics: [interview, leadership, experience]
  questions:
  - Describe a major disagreement with engineering, security or business leadership. How did you resolve it?
  - Describe a major disagreement you had with leadership and how you resolved it.
  - Tell me about a serious disagreement with business or security leadership.
  - How did you resolve your biggest disagreement with senior leadership?
  keywords:
  - major disagreement
  - disagreement with engineering security
  - disagreement you had with leadership
  - serious disagreement
  - disagreement with senior leadership
  answer: >-
    The one I can put on record in full is early in my career, and I tell it because the way it was resolved
    still shapes how I handle disagreements; the ones with client leadership since then are confidential, and
    I will not present an anonymised story with numbers you cannot check. At TCS, after campus placement and
    training, I was put on a regular client project. I wanted to work in the AI Labs in Kochi, so I formally
    emailed the zonal head and the digital team head, copying resource management and HR. The lab, formed with
    senior architects and an elite group of freshers from the IITs and IIITs, said no, and I disagreed with
    that decision. How I resolved it: I did not go around them
    or argue that the decision was unfair. I kept the request open and professional for a month and a half
    until they offered a test, interviews, which is what I wanted, a decision based on evidence. Then I went
    through sixteen of them, until the architect Manoj Madhavan gave me an NLP problem and took me into his
    team for my approach and my persistence. Resource management attached a condition, no differential
    package like the IIT freshers had, and I accepted it, because what I disagreed about was the work, not the
    pay. Three things from that I still use as an architect. Turn a disagreement into a question evidence can
    settle, which is why I propose time-boxed spikes on the same golden set when two teams disagree. Never
    win by escalating around people you will have to work with next week. And separate what you must have
    from what you can concede, then concede it visibly. When I do have to overrule a team now, on a one-way
    door such as a security flaw, I do it in a written decision record that states what we gave up, so the
    disagreement becomes part of the design rather than a grudge.
  evidence:
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: The emails, the sixteen interviews and the condition attached
  - url: profile:roles/Tata Consultancy Services
    source: resume
    why: AI and Robotics Labs at TCS

- id: iv4-coach-seniors
  topics: [interview, leadership]
  questions:
  - How do you coach senior engineers to think in terms of systems, economics and business outcomes?
  - How do you coach senior engineers to think about economics and business outcomes?
  - How do you get senior engineers to think in systems rather than components?
  - How would you grow senior engineers into architects who think about cost and outcomes?
  keywords:
  - coach senior engineers
  - systems economics and business
  - think in systems
  - economics and business outcomes
  - senior engineers into architects
  answer: >-
    Senior engineers already think well about components; the coaching is about widening the boundary of
    what they feel responsible for, and the most effective way I know is to give them ownership of a number
    beyond their code. Economics: I ask a senior engineer to own the cost per successful task of the feature
    they built, the model calls, retries, infrastructure and human review, and to present it monthly. Once
    someone has to explain why the cost rose, they start designing for it, choosing the smaller model that
    passes the evaluation, caching, trimming context. Business outcomes: every design review starts with the
    business metric and its baseline, so the engineer learns to ask what this is for before how to build it.
    I take them into stakeholder conversations, first to listen, then to present the part they know best,
    because hearing a business owner explain what a wrong answer costs changes priorities faster than any
    slide. Systems: I review their designs with the questions I would ask in an architecture review: what
    happens at ten times the load, when the provider is down, when a user loses access, when the input is
    hostile, how will we know it is working in production? Over time they ask those questions themselves,
    which is the point. I have them write decision records that state the trade-offs and the alternatives
    rejected, including cost and risk, and I give feedback on the reasoning, not only the choice. Pre-mortems
    before launches teach failure thinking. And I give them a real cross-cutting problem to lead, a platform
    capability or an incident review, where no single component explains the outcome. Throughout, I model it
    myself by staying hands-on, because an architect who still builds is more credible when talking about
    trade-offs. I mentor the interns and freshers of the Qualizeal AI Center of Excellence on the same habits,
    starting earlier, and I mentored AI teams across three geographies at Tech Mahindra.
  evidence:
  - url: doc:Career_In_Depth
    source: resume
    why: Mentors the interns and freshers of the AI CoE; mentored AI teams across three geographies
  - url: profile:roles/Qualizeal
