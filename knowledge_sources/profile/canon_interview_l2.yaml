# ----------------------------------------------------------------------------- S2.2 Injects
- id: iv4-inject-provider-outage
  topics: [interview, whiteboard, reliability]
  questions:
  - The primary model provider is unavailable during a critical business period. What degrades, what fails over, and what quality guarantees remain?
  - 'Provider outage: The primary model provider is unavailable during a critical business period. What degrades, what fails over, and what quality guarantees remain?'
  - What happens to the GenAI platform when the primary model provider is down during a critical period?
  - Your main LLM provider goes down at quarter end. What fails over and what quality is guaranteed?
  keywords:
  - primary model provider
  - critical business period
  - what fails over
  - quality guarantees remain
  - main llm provider goes down
  answer: >-
    The answer was decided before the outage, route by route, because a fallback that has not been evaluated
    is a guess. What fails over automatically: the gateway's circuit breaker trips on the provider's error
    rate or latency within seconds, and each route moves to the next model in its chain, the second
    provider's equivalent, or the in-region open-weight model, each of which has passed that route's golden
    set with its own prompt variant. Applications change nothing; they call capabilities, not providers.
    Embeddings are the exception that must not fail over silently: a different embedding model cannot query
    an index built with another, so embedding is either served by a self-hosted model we control or the
    index is dual-built for critical domains. What degrades, by design and announced in the application:
    lower-priority traffic, batch jobs, bulk summarisation and experimental use, is shed or queued so the
    fallback capacity, which is smaller and rate-limited, serves the critical workflows first, by priority
    class set per use case. Long-context and multimodal routes may fall back to retrieval-only answers with
    citations, or to a queued response, if no evaluated fallback has the capability. Agents drop to read-only
    or propose-only, with consequential actions held for approval, because a less capable model should not
    act unsupervised. What quality guarantees remain: exactly the ones measured. Each route's fallback has a
    known golden-set score, so I can tell the business before the crisis that the claims workflow keeps, say,
    task success within three points, while the open-ended drafting assistant drops further and is labelled
    as degraded. Grounding checks, citations, permission filtering, redaction and audit do not degrade at
    all, because they live in the platform, not the model. Afterwards, the post-incident review checks
    failover time, the quality actually delivered against the predicted numbers and the cost, and the
    outcome tunes the chains. A critical business period should also trigger a pre-emptive game day the
    week before.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Production-grade GenAI architecture
  - url: profile:skills/LLM Platforms
    source: resume
    why: OpenAI, Claude and Gemini

- id: iv4-inject-regional-restriction
  topics: [interview, whiteboard, security, governance]
  questions:
  - A business unit's data cannot leave its country. How do you enforce this end-to-end, including telemetry and support access?
  - 'Regional restriction: A business unit''s data cannot leave its country. How do you enforce this end-to-end, including telemetry and support access?'
  - How would you keep a business unit's data inside its country, including telemetry and support access?
  - How do you enforce data residency end to end in a GenAI platform?
  keywords:
  - cannot leave its country
  - data cannot leave
  - telemetry and support access
  - data residency end to end
  - inside its country
  answer: >-
    End to end means every copy, not just the documents: prompts, embeddings, indexes, caches, model
    inference, logs, traces, evaluation sets, backups and the people who can look at them. I enforce it by
    construction, a dedicated in-country cell, and then I prove it. Data and compute: the business unit gets
    its own regional cell in that country, its own indexes, caches, object storage and audit store, with
    encryption keys held in that country's key management service and customer-managed. Inference happens
    in-country too: self-hosted open-weight models in the cell, or a provider's in-country endpoint where the
    contract guarantees in-country processing and no retention. The gateway enforces it by policy: requests
    tagged with that unit's data class can only route to in-country models, and when none is available the
    request fails closed, never falling back abroad. Disaster recovery uses a second zone or region inside the
    same country. Telemetry: traces, logs and metrics are written to an in-country observability store, with
    content redacted at source; only aggregate, content-free metrics, counts, latencies, costs, flow to the
    global dashboards, and I check that a trace attribute cannot smuggle content, such as a prompt in an error
    message. Observability vendors either run in-country or receive only the content-free stream. Support
    access: just-in-time, approved and time-limited access for named in-country staff, every session logged
    and recorded; vendor support through lockbox-style approval where the vendor offers it; no standing
    access for global teams to content. The control plane holds configuration, never content. Contracts
    matter as much as code: sub-processors, data-processing terms and the provider's legal exposure to foreign
    access requests are reviewed by legal. Proof: automated residency tests that try to route that data abroad
    and must be refused, egress monitoring on the cell, and an annual audit against the data map.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI governance frameworks
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: AI governance for organisations adopting AI

- id: iv4-inject-permission-revocation
  topics: [interview, whiteboard, security]
  questions:
  - A user loses access to a source document. How quickly does that restriction take effect in indexes, caches, summaries and agent memory?
  - How quickly does a removed permission reach caches, summaries and agent memory?
  - How fast must revoked access take effect across indexes and agent memory?
  keywords:
  - removed permission
  - caches summaries and agent memory
  - agent memory
  - revoked access take effect
  - how quickly does that restriction
  answer: >-
    I commit to a number per path, because the honest answer differs by where the access was removed. If
    access is removed through group membership in the identity provider, the effect is immediate at query
    time: retrieval resolves the user's groups on each request, so the next query is filtered. The only lag
    is token lifetime, which I keep short, minutes, with continuous access evaluation where the identity
    provider supports it. If the document's own ACL changes in SharePoint or Confluence, the index must learn
    it: change events drive an ACL sync with a target of under five minutes, a reconciliation crawl catches
    missed events nightly, and for restricted content I add a late-binding check, the retrieved document's
    permission re-verified against the source system before it is used, closing the gap entirely at the cost
    of a little latency. Indexes: the ACL update rewrites the chunk metadata in place; no re-embedding is
    needed. Caches: answer and semantic caches are keyed by a hash of the user's permission set, so a
    membership change is a cache miss by construction, and every cache entry lists the document IDs it was
    built from, so an ACL change on a document purges its entries within the same five minutes. Summaries:
    any precomputed summary inherits the strictest ACL of its sources and is invalidated when one changes;
    for sensitive spaces I generate summaries at query time from permitted chunks instead. Agent memory:
    entries carry the IDs of the documents they came from and are re-checked against permissions when read,
    and a lost-access event purges entries derived from that document. What removing access cannot do is unsee: an
    answer already shown remains in the user's history, so the audit log records what was disclosed when it
    was still permitted, and for a sensitive case the history is redacted too. I test each path with
    forbidden-document tests run right after access is removed by script.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: RAG pipelines and AI governance
  - url: https://github.com/PrashobhPaul/Knowledge-Fabric
    source: github
    why: Integration tests for leaks in every answer

- id: iv4-inject-prompt-injection
  topics: [interview, whiteboard, security]
  questions:
  - A retrieved document instructs the agent to exfiltrate data or invoke a privileged tool. What controls prevent the action?
  - 'Prompt injection: A retrieved document instructs the agent to exfiltrate data or invoke a privileged tool. What controls prevent the action?'
  - What stops an agent when a retrieved document tells it to exfiltrate data?
  - Which controls prevent a planted instruction from invoking a privileged tool?
  keywords:
  - exfiltrate data
  - privileged tool
  - retrieved document instructs
  - planted instruction
  - controls prevent the action
  answer: >-
    Layers that do not depend on the model noticing the attack, so the action fails even if the model is
    fooled. One, the privileged tool is not reachable. The agent's tool set is fixed for its task before it
    reads any content; a document-reading agent has no privileged tools in scope, and even if the model emits
    a call to one, the tool gateway rejects it because the agent's declared scope does not include it. Two,
    the user's permissions bound everything: tools run with an on-behalf-of token intersected with the
    agent's scope, so a planted instruction can at most ask for what this user could already do, and a
    privileged administrative tool is outside almost every user's rights. Three, control flow is fixed by
    trusted input. The plan comes from the user's request; retrieved text is passed as data to steps whose
    output is constrained to a schema, so it cannot add tool calls or change the plan. Four, policy checks
    intent: a tool call must trace back to the user's request; an action with no connection to it, an email
    to an external address while answering a policy question, is blocked or sent for approval with the
    triggering document shown. Five, exfiltration channels are closed. Outbound calls go through the egress
    allow-list, DLP scans outbound payloads, and the interface refuses to render links or images to unknown
    domains, the classic way data leaks through a markdown image. Six, consequential actions need human
    approval, and the approver sees the content that motivated them. Then detection and response: content
    scanners flag instruction-like text in retrieved documents, the attempt is logged with the document ID, an
    alert goes to security, the document is quarantined and its owner told, because a planted instruction in
    our own SharePoint is itself a security incident. The case becomes a regression test. This is OWASP's
    prompt injection and excessive agency, handled by architecture rather than by hoping the model refuses.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI systems
  - url: https://github.com/PrashobhPaul/CogniFlow
    source: github
    why: Nothing an AI model returns is executed as code

- id: iv4-inject-cost-shock
  topics: [interview, whiteboard, economics]
  questions:
  - Usage triples and monthly spend exceeds budget by 40%. What controls act automatically, and who owns exceptions?
  - 'Cost shock: Usage triples and monthly spend exceeds budget by 40%. What controls act automatically, and who owns exceptions?'
  - Usage triples and spend is 40 percent over budget. What happens automatically?
  - What automatic cost controls kick in when GenAI spend blows the budget?
  keywords:
  - usage triples
  - exceeds budget
  - over budget
  - owns exceptions
  - cost controls kick in
  answer: >-
    Automatic controls act in tiers by priority, and a named budget owner decides exceptions, because a
    platform that silently overspends and one that silently switches off critical work are both failures.
    Before anything acts, the first automatic control is visibility: budgets per business unit and use case
    in the gateway, forecasts updated daily, alerts at 80 and 100 percent of the monthly budget to the
    use-case owner, the business unit's budget owner and FinOps. Spending 40 percent over budget should never
    be discovered on the invoice. Then automatic actions, in order of least business impact. Optimisation
    with no visible effect: routing low-difficulty requests to smaller models where the route's golden set
    allows, higher cache use, prompt caching on long shared prefixes, trimming retrieved context to what the
    evaluation shows is needed. Shifting: batch and non-urgent workloads deferred to off-peak or to cheaper
    batch APIs. Throttling: per-user and per-application rate limits tightened for non-critical tiers,
    experimental and sandbox use capped first. Hard caps: only for use cases tagged non-critical, which stop
    at their limit. Critical workflows, declared as such in the inventory, are never cut off automatically;
    they alert and escalate. Exceptions are owned by the business unit's budget owner, who can approve a
    temporary increase with FinOps, with the platform team advising on optimisation; above a threshold the
    CIO or the AI steering group decides. In parallel I diagnose, because tripled usage has three different
    causes: real adoption, which is good news and needs a budget conversation with the value in hand, cost
    per successful task and outcomes; a runaway loop, an agent or a batch job retrying, which a circuit
    breaker should already have caught and becomes an incident; or abuse, a leaked key or a scraping
    pattern, which is a security incident. The fix differs for each, so the controls buy time and the
    diagnosis decides.
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: AI architecture strategy and governance
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Production GenAI deployments for enterprise clients

- id: iv4-inject-quality-regression
  topics: [interview, whiteboard, evaluation]
  questions:
  - A new model version improves benchmark scores but causes a material decline in one business workflow. How do you detect, isolate and roll back?
  - 'Quality regression: A new model version improves benchmark scores but causes a material decline in one business workflow. How do you detect, isolate and roll back?'
  - A model upgrade scores better on benchmarks but breaks one workflow. How do you detect and roll it back?
  - How do you catch a model version that regresses one business workflow?
  keywords:
  - improves benchmark scores
  - decline in one business workflow
  - one business workflow
  - detect isolate and roll back
  - breaks one workflow
  answer: >-
    The design assumption is that this will happen, so model changes are never global switches and quality
    is measured per workflow, never as one average. Detect, before production: a new model version is admitted
    route by route. Each workflow's golden set runs against the candidate, with paired comparison to the
    current version, and results are reported per workflow and per slice. A public benchmark gain is not
    evidence for our workflows; a two-point drop on the claims-triage set blocks that route even if every
    other route improves. Detect, in production: rollout is by canary per route, five percent of traffic,
    then twenty-five, then all, with online metrics per workflow, grounding-check pass rate, schema
    validity, task completion, escalation and override rates, user feedback, and business metrics such as
    rework, compared against the control group. Automatic rollback triggers are set per route. Silent
    provider-side changes are caught by pinning exact model versions and re-running golden sets on a
    schedule. Isolate: because applications call aliases and routes, I roll back only the affected route to
    the previous version while the others keep the improvement. Then I find the cause with the trace data:
    is it the model's behaviour on our prompt, the output format, tool-calling differences, a refusal pattern
    or a shift in length? Often a prompt variant tuned for the new model fixes it; sometimes the workflow
    needs the old model until the provider fixes it, and then that route stays pinned, with a deprecation
    date as its constraint. Learn: the failing cases go into that workflow's golden set, so the gate catches
    the pattern next time, and the post-incident review asks why the evaluation did not see it first. The same
    principle is behind ValidAIte, testing AI behaviour against criteria rather than leaderboard scores.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
  - url: profile:engagements/QMentisAI
    source: resume
    why: AI testing and quality engineering

# ----------------------------------------------------------------------------- S2.3 Reliability, security and operational engineering
- id: iv4-llm-slos
  topics: [interview, reliability]
  questions:
  - How would you define SLOs for an LLM-backed service when response quality is probabilistic?
  - How do you define SLOs for an LLM service when quality is probabilistic?
  - What service-level objectives make sense for a GenAI application?
  - How do you set a quality SLO for a non-deterministic AI service?
  keywords:
  - slos for an llm
  - response quality is probabilistic
  - quality is probabilistic
  - quality slo
  - non deterministic ai service
  answer: >-
    I split SLOs into the ones engineering can promise as in any service and the ones that are statistical by
    nature, and I write the second kind as rates over windows with confidence, not as guarantees on single
    responses. Classic SLOs, per user-facing journey: availability, the share of requests that return a valid
    response, 99.9 percent over thirty days for interactive use; latency, time to first token under 1.5
    seconds and full response under eight seconds at p95 for a grounded answer; and freshness for knowledge,
    a source change searchable within fifteen minutes. Each has an error budget, and a spent budget pauses
    feature releases. Quality SLOs, defined as rates measured on samples. Groundedness: at least 97 percent of
    sampled answers have every claim supported by a cited source, judged by a calibrated judge and audited
    weekly by humans. Task success on the golden set: at or above the release baseline, say 90 percent, with
    any drop beyond two points blocking a release. Safety: zero tolerance for permission leaks in the
    forbidden-document suite, and harmful-output rate below a small threshold on the red-team suite. Correct
    abstention: the share of unanswerable questions declined, because a service that answers everything
    confidently is failing a quality SLO that most teams never define. Format validity for structured
    outputs, which should be near 100 percent with constrained decoding. Two disciplines make these real.
    The measurement must be statistically sound: a sample size large enough for the confidence interval to be
    narrower than the gap we care about, a few hundred judged answers a week for a busy service, with the
    judge's agreement with humans measured. And quality SLOs need owners: the domain team owns task success
    for its workflow, the platform owns availability and latency. The SLO document also says what is not
    promised, such as identical wording between runs. It is the distinction ValidAIte is built on at
    Qualizeal: testing AI behaviour against criteria rather than exact matches.
  evidence:
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing AI behaviour against criteria such as groundedness and consistency
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Managed production deployments of LLM-based systems

- id: iv4-metrics-levels
  topics: [interview, reliability, evaluation]
  questions:
  - Which metrics belong at model, retrieval, agent, application and business-process levels?
  - Which metrics belong at the model, retrieval and agent levels?
  - What would you measure at the application and business-process levels for GenAI?
  - How do you layer GenAI metrics from model to business process?
  keywords:
  - business process levels
  - metrics belong
  - model retrieval agent
  - application and business process
  - layer genai metrics
  answer: >-
    Five layers, each answering a different question, linked by one trace ID so a business metric can be
    traced down to its cause. Model level, is the model behaving as expected: latency, time to first token
    and tokens per second; tokens in and out per call; error and throttling rates by provider; cost per call;
    format validity of structured outputs; refusal rate; and drift in the distributions of output length and
    confidence after any version change. Retrieval level, does the right evidence arrive: recall at k and MRR
    on the golden set offline; online proxies such as the top-score distribution, the no-result rate, the
    share of answers whose citations pass the grounding check, index freshness lag and permission-filter
    latency. Agent level, does it reach its goal sensibly: task success on end state, pass rate over
    repeated runs, steps, tool calls and cost per completed task, tool error and timeout rates, loop or budget
    terminations, escalation rate to humans, approval override rate, and invariant violations, which should be
    zero. Application level, is the product working for users: availability and latency SLOs, groundedness
    and task success sampled from production, abstention rate, thumbs-up and thumbs-down with reasons,
    retention and weekly active users, and safety triggers. Business-process level, is it worth it: the KPI
    the use case was approved for, handling time, first-contact resolution, cycle time, defect escape rate,
    with a baseline and ideally a control group; cost per successful task against the value of the task; and
    rework, the human corrections downstream. The common mistake is to stop at the model and application
    layers, which tell you the system is up, not that it is useful. My rule is that every use case enters
    production with at least one business metric and its baseline, or it does not enter. In the testing life
    cycle work at Qualizeal that metric is usually defect escape and cycle time, not generated test counts.
  evidence:
  - url: profile:engagements/Agentic AI for the STLC
    source: resume
    why: Agentic AI for the software testing life cycle
  - url: profile:engagements/QMentisAI
    source: resume
