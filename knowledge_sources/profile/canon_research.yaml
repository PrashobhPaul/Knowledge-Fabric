- id: research-trust-sources
  topics:
  - research
  - knowledge-engineering
  questions:
  - Which knowledge sources can an AI system trust?
  - What makes a knowledge source trustworthy?
  - How can an AI system know which sources to trust?
  answer: 'Trust has to be earned per source and per claim, not granted by default: an AI system should
    not believe everything it reads. I look for five things. Provenance: every record carries where a person
    can verify it and when it was dated, and how that date was found; a claim nobody can trace should not
    be stated as fact. Corroboration: a fact that independent sources agree on, say my website, my resume
    and my GitHub, is stronger than one any single source asserts. Consistency: a source that contradicts
    itself or the others, or silently changes its story between versions, earns less weight, the way a rating
    that disagrees with the reviewer''s own words does in my supervisor''s research. Recency: a newer record
    outranks an older one only when its date is known; an unknown date is unknown, not old. Authority: the
    owner or the system of record outranks a copy. And when no source is good enough, the system should say
    it is not on record instead of guessing. In Eidolon these are rules today: evidence links resolved at
    build, the resume over the website, client names masked, every answer citing its proof. My PhD is about
    turning them into a measured trust score per source that weights retrieval.'
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: Which knowledge sources an AI system can trust
