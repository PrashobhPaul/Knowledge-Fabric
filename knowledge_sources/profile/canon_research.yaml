- id: research-discrepant-user
  topics:
  - research
  questions:
  - What is a discrepant user?
  - Who are discrepant users?
  answer: As I understand the term from this line of research, it means a user whose rating and review do
    not express the same intent. A user counts as discrepant when, say, five stars come with a disappointed
    review, so the rating alone would mislead a recommender system. The papers I build on read the emotion
    in the review and use it to refine the rating, rather than trusting the rating blindly or throwing the
    user out, and the 2025 paper in
    Knowledge and Information Systems is about discrepant users by name. In my PhD the parallel is a
    discrepant source, one whose claim disagrees with corroborating sources or with its own earlier
    versions, and its weight should be refined in the same spirit.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: The analogy between discrepant users and discrepant sources
