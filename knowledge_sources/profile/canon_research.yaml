  questions:
  - What is your PhD research about?
  - What is your PhD topic?
  - What are you researching?
  - What is your research area?
  answer: 'My PhD research asks a question that came straight out of building this system: which knowledge
    sources can an AI system trust, and how should that trust shape what it retrieves, what it says and when
    it declines? It started from my supervisor Dr. Amarajothi''s work on rating systems, where some users''
    ratings cannot be fully trusted, for instance when a star rating disagrees with the emotion in the user''s
    own review. AI has the same problem with a stale page, a source that contradicts the others or a claim
    with no provenance. My direction is to measure trust for every source from signals the system can compute
    itself: agreement with independent sources, consistency over time and with its own earlier versions,
    recency with honest date provenance, authority and ownership, and the flags raised against answers that
    cite it. Then that trust score would weight retrieval and decide when to answer, when to ask for
    corroboration and when to say it is not on record. Eidolon, built on my Knowledge Fabric, is my worked
    example and test bed, and its golden question sets are the benchmark. This is the direction I am starting
    from, not finished results.'
