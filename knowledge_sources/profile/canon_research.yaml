- id: research-papers
  topics:
  - research
  questions:
  - Which papers is your PhD research based on?
  - What are your base papers?
  - What has your supervisor published that you build on?
  answer: Three base papers, from my supervisor Dr. Amarajothi's line of research on rating and recommender
    systems. The first is Refining User Ratings Using User Emotions for Recommender Systems, at iiWAS 2021,
    published by ACM, which detects the emotion in a user's review text and uses it to refine that user's
    rating before collaborative filtering predicts ratings. The second is enemos-p, an enhanced emotion
    specific prediction for recommender systems, in Expert Systems with Applications, 2023, which addresses
    the inconsistency between what users rate and what they write in three stages, extracting emotional
    features from reviews, computing refined ratings and generating recommendations, evaluated on eight
    Amazon and Yelp datasets. The third is Emotions in recommender systems for discrepant-users, in Knowledge
    and Information Systems, 2025. What I take from them is refining a signal you cannot fully trust with a
    second signal from the same source, and I am carrying that from ratings to knowledge sources, a claim
    checked against its provenance and against corroborating sources, the way a rating is checked against
    the review.
