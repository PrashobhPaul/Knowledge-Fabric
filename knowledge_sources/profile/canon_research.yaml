- id: research-eidolon-trust
  topics:
  - research
  - knowledge-engineering
  project: Knowledge Fabric
  questions:
  - How does this system decide which sources to trust?
  - How does Eidolon decide which sources to trust?
  answer: Today it decides by rules I can show you, not by a learned score. Every record from my website,
    resume, GitHub, YouTube, LinkedIn and notes carries its provenance URL and a date with the method that
    found it, the source's own timestamp counting most, then a revision stamp, the PDF metadata, a date in
    the text and the crawl date, and an unknown date stays unknown. My curated answers must prove themselves,
    because the build resolves every evidence link to the records behind it and reports any link that proves
    nothing. Entity resolution joins the same project or employer across the website, GitHub, YouTube, the
    resume and LinkedIn, so a fact is seen from several sources at once. Where sources disagree, the resume
    wins over the website, and an older resume is kept but marked as not current. Client names are masked
    in every source before indexing. When nothing answers a question, it says so instead of guessing. Visitors
    can flag an answer, and the curator re-checks every flag against the current index, closes the ones the
    sources now cover and proposes stubs for me to fill, never facts of its own. And every pull request runs
    the proof, every question set plus determinism, paraphrase and grounding checks, so a change that lowers
    accuracy fails. Turning these rules into a trust score per source is my PhD direction.
  evidence:
  - url: doc:PhD_Anurag_University
    source: notes
    why: How Eidolon handles trust today
