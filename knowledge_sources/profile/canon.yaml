  questions:
  - What was the hardest problem you solved?
  - Tell me about the physician's note reader.
  answer: 'The physician''s note reader at Primera. It had to read every inpatient note across more than
    sixty hospitals, each with at least a hundred beds, from Epic and Meditech, some in HL7 and some in
    MAR. Per patient it had to collate physician notes, nursing notes and medication records, map them
    through clinical ontologies like SNOMED, LOINC and ICD-10, build custom relationship graphs and feed
    real-time analytics. The hard part was not one clever model; it was making many small NLP and ML pieces
    reliable together on huge data, for the first time: abbreviations and negations in clinical text,
    the same drug or condition written many ways, and records that had to line up per patient across systems.
    Mapping to standard ontologies is what made it work, because once a mention resolved to a SNOMED or
    ICD-10 concept, notes from different hospitals and formats could be joined and reasoned over. I was
    the pillar of the NLP team then, and I am prouder of that than of today''s sophisticated agentic work;
    it is also where I learned that a shared vocabulary of concepts matters as much as the model.'
