  answer: 'Having evolved with AI itself, from basic NLP to transformers, LSTMs, LLMs and SLMs, and now
    agents. From a solutioning point of view I am prouder of my approach than of awards: at Brane, object
    detection accuracy had dropped from 86 to 76 percent when the classes went from 80 to 120, YOLO was
    weak on Indian data, and I had never trained custom weights. Instead of fighting only at the bounding-box
    level, I brought my NLP side to a vision problem: describing scenes, tagging text to images and layering
    a custom word2vec on top, so the model could use context, what usually appears together in a scene,
    to tell similar classes apart. That took it not just back to 86 but to 89.5. Dr. Roshy, the man who
    kick-started the driverless car in India, appreciated that call, and that means more to me than any
    award. The lesson I still use is that the best fix often comes from another field, which is why I
    keep my toolbox wide.'
