  questions:
  - How do you choose between LangGraph, CrewAI and AutoGen?
  - What does AI governance mean to you?
  - How do you evaluate AI systems?
  answer: 'I do not marry a framework: between LangGraph, CrewAI, AutoGen or custom orchestration, the
    choice depends on the client''s need and the situation. I start from the problem and its constraints,
    scale, latency, cost, compliance and the stack the client already runs, then pick the model for the
    reasoning layer and design the agent or retrieval layer around it. LangGraph is my default when a
    workflow needs explicit state, branching, retries and human approval steps, because the graph makes
    every path visible and testable. CrewAI is quicker for role-based crews on a well-defined task, AutoGen
    suits conversational multi-agent patterns, and on a Microsoft estate the Microsoft Agent Framework
    with .NET is the natural fit, which is what I use for a global professional-services firm. When most
    of the flow is deterministic, a plain orchestrator that calls a model only at the decision points
    is simpler, cheaper and easier to test. AI governance means a lot to me because AI adoption is now
    in everything, so guardrails, audit trails, access control and human checkpoints go into the design
    from day one. On evaluating AI systems I have my own approaches beyond the products Qualizeal offers:
    a golden set of real questions with expected behaviour, run on every change, with traces I can inspect
    and gates that block a release when quality drops, which is how this fabric itself is tested.'
