  answer: 'In 2012, on Engineer''s Day, I flew a voice-controlled UAV, a climate-analyser smart plane,
    using speech recognition I built on Hidden Markov Models. It started because I wanted machines to
    read my textbooks aloud, since reading bored me and there were no audiobooks for everything then,
    and that pulled me into voice-controlled systems in 2011 and 2012. Hidden Markov Models treat speech
    as a sequence of hidden states, which works well for recognising a small set of spoken commands, exactly
    what flying a plane by voice needs. Dr. Uma N. Dulhera backed it, it made the regional Telugu newspapers,
    it carried me into my M.Tech in Knowledge Engineering, and my job offer came partly because of it.
    Those paper cuttings are worth more to me than any other record: they were my launchpad into AI.'
