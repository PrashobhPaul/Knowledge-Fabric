- id: agentic-view
  topics:
  - opinion
  - agentic
  questions:
  - What is agentic AI according to Prashobh?
  - What is your view on agentic AI?
  answer: 'Agentic AI is my primary area of work right now. For me it means systems where models plan,
    call tools and hand work to each other to finish a real task, not a chatbot that only answers. The
    model is rarely what makes an agent trustworthy in production; the engineering around it is: clear
    limits on what each agent may do, tools exposed through standard interfaces like MCP, state you can
    inspect, and a human checkpoint wherever a mistake is expensive. I widen autonomy in steps, starting
    with a narrow task and giving the agent more room only when the evaluations show it holds. Governance,
    evaluation and observability are designed in from the start, because an agent you cannot trace is
    an agent you cannot debug or defend. The next step, as I see it, is knowledge rather than more agents:
    they do their best work when the organisation''s own knowledge layer feeds them the right context.
    I pick the tooling for the problem, LangGraph, CrewAI or AutoGen, and I care more about clean architecture
    and reliable delivery than about any single framework.'
