  - How did your career start?
  - Tell me the story of your first job.
  answer: TCS gave me the real-world taste of AI; until then I had worked on expert systems and probabilistic
    predictions. After campus placement and three months of training as a regular IT engineer, I started
    on a client project in Kochi, home of the Digital Enterprise Systems and Solutions wing with its AI,
    Robotics and IoT labs. I asked, by formal email to the zonal head and the digital team head, to be
    moved into the AI Labs. They said no, then said pass our interviews, and after sixteen interviews
    the architect Manoj Madhavan took me in, for the relentlessness as much as for my NLP answer, even
    without the differential package the IIT freshers had. There I built custom OpenNLP models, an intelligent
    date tagger that inferred indirect references to a day or date and was reused across TCS, multi-class
    classification for the Ultimatix ticketing tool with the CTO team, and type-ahead and intelligent
    prompting for in-house search. I also spent a short time in the Robotics lab under Dr. Roshy and Rajaram.
    TCS taught me resilience and both the industrial and the research side of AI, and it gave me the foundation
    of who I am.
