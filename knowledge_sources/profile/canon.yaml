- id: aidlc
  topics:
  - projects
  - agentic
  questions:
  - Does Prashobh work on AI-driven SDLC?
  - What is your work on AIDLC?
  - Tell me about Kiro automation.
  answer: 'Yes. Agentic AI across the software life cycle is my core work at Qualizeal. I build agentic
    AI for the software development life cycle with Kiro for a major US airline, and agentic AI for the
    software testing life cycle with the Microsoft Agent Framework and .NET for a global professional-services
    firm. Kiro suits the development side because it is spec-driven: requirements, design and tasks are
    written down before code is generated, so the agents work from an agreed specification and a team
    can review each step instead of trusting one big generation. On the testing side, agents help across
    the life cycle, from analysing requirements to designing tests, writing test cases and automating
    them, and the Microsoft Agent Framework keeps them native to an enterprise .NET stack. In my experience
    the harder part is not the agents but the knowledge underneath them, a project''s conventions, decisions
