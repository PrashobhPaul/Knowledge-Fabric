    questions:
      - What has Prashobh posted about on LinkedIn?
      - What do you think about knowledge layers and ontologies for companies?
    answer: >-
      On LinkedIn I write about how companies will build their own ontology and knowledge
      layer. My view is that this pattern will emerge in every organisation as agents become
      major contributors to work, and that the architecture will evolve towards one cohesive
      "brain" for the company. The nuance I keep pointing at is risk: a company's knowledge,
      how it works and its product thinking can be leaked or hacked, and that can be
      catastrophic. This fabric is my working answer to that problem.
