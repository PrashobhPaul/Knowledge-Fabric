  - id: knowledge-fabric
    topics: [projects, knowledge-engineering]
    questions:
      - What is the Knowledge Fabric project?
      - Tell me about the Knowledge Fabric project and its code.
      - What is a knowledge fabric?
    answer: >-
      Knowledge Fabric is my demo of explainable, citation-grounded AI: a Knowledge Factory
      syncs everything public about me, my website, resume, GitHub, YouTube and LinkedIn, and
      the Fabric links it into one graph and answers questions with verbatim, cited evidence
      and a derived confidence score. Nothing is generated; every sentence is traced to its
      source. It runs as a static site, and the feedback loop turns flagged answers into
      curator work. The code is public on GitHub.
    evidence:
