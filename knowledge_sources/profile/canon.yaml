  questions:
  - What does CogniFlow do?
  - What is CogniFlow?
  answer: 'CogniFlow makes architecture diagrams with motion and animation, the kind my clients prefer
    over the static ones I used to draw in draw.io. Even with Claude it took a lot of prompting, so I
    built it and attached it to my Claude as an MCP server: Claude hands over a short description of the
    architecture, and CogniFlow compiles it into a validated graph and renders the animated, editable
    diagram, instead of the model drawing every shape itself. It is a free, browser-only studio in TypeScript:
    you describe a system or import draw.io and Mermaid, watch data flow along the connectors, and export
    GIFs, videos or slides, with a small open-weight model running in the browser and no backend. Two
    rules keep it dependable: the graph is the source of truth, and nothing an AI model returns is executed
    as code. It makes my own architecture design work easier, which is why I built it.'
