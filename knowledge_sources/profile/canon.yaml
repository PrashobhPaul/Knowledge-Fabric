      you travel: it lets family and friends know you are okay on a long journey without you
      having to call or text. It is fully open source and zero cost, using OpenStreetMap for
      maps and Supabase for live sharing, with no Google services and no billing anywhere. It is
      an Android app written in Kotlin with Jetpack Compose.
