# =============================================================================
# Canon — the major questions about Prashobh, answered the way he answers them
# =============================================================================
#
# This is the curated layer of the fabric. Each entry is an answer in Prashobh's
# own words, with the EVIDENCE that backs it: links into the website, resume,
# GitHub, YouTube and LinkedIn records the Factory already syncs. At build time
# every evidence link is resolved against the index (a link that matches no
# record is reported), and at answer time the fabric shows the canon answer
# first and the supporting records beneath it as proof.
#
# Rules for editing:
#   - First person, as Prashobh would say it aloud. Short sentences.
#   - No claim without evidence. If a fact is not on any source yet, add it to
#     profile.yaml (self-reported) or the website first, then cite it.
#   - `questions` are the phrasings that should land here; the first is canonical.
#   - `evidence` entries: a record URL (website page, resume, repo, video, post)
#     or a profile reference (profile:roles/Qualizeal). `why` says what it proves.

canon:
- id: who
  topics:
  - identity
  questions:
  - Who is Prashobh Paul?
  - Tell me about yourself.
  - Give me a short bio of Prashobh.
  - Introduce yourself.
  answer: I am Prashobh Paul, an AI Architect based in Hyderabad, India, with over eleven years in AI,
    Generative AI, NLP and robotics. Today I lead the AI Center of Excellence work at Qualizeal, where
    I design and build agentic AI systems for enterprises and AI-testing platforms. Before that I spent
    years in healthcare NLP, BFSI analytics and autonomous robotics. Outside work I run a travel channel
    on YouTube called The Canvas of Earth and I build small apps that solve real problems for people around
    me.
  evidence:
