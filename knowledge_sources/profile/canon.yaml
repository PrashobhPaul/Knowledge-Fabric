- id: linkedin-knowledge
  topics:
  - posts
  - knowledge-engineering
  questions:
  - What has Prashobh posted about on LinkedIn?
  - What do you think about knowledge layers and ontologies for companies?
  answer: 'On LinkedIn I write about how companies will build their own ontology and knowledge layer.
    My view is that this pattern will emerge in every organisation as agents become major contributors
    to work, and that the architecture will evolve as models get better at consolidating knowledge across
    segregated domains into one cohesive "brain" for the company. The distinction I draw is between context
    and knowledge: context is what an agent has available while doing a task, and knowledge is the reusable
    understanding we maintain so it can do that task correctly, what a metric means, which source to trust,
    how we handle a particular situation, sometimes written down and often not. A knowledge factory turns
    scattered documents and experience into knowledge that can become context for future work. The nuance
    I keep pointing at is risk: a company''s knowledge, how it works and its product thinking can be leaked
    or hacked, and that can be catastrophic, so the knowledge layer needs access control and provenance
    as much as it needs search. This fabric is my working answer to that problem, and I also post about
    AI governance and agentic orchestration.'
