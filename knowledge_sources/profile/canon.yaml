  - How did your career start?
  - Tell me the story of your first job.
  answer: TCS gave me the real-world taste of AI. I started in Kochi, home of the Digital Enterprise Systems
    and Solutions wing with its AI and Robotics labs, and I asked, by formal email, to be moved into the
    AI Labs. They said no, then said pass our interviews, and after sixteen interviews the architect Manoj
    Madhavan took me in, for the relentlessness as much as for my NLP answer. There I built custom OpenNLP
    models, an intelligent date tagger reused across TCS, multi-class classification for the Ultimatix
    ticketing tool with the CTO team, type-ahead and intelligent prompting for in-house search, and I
    spent a short time in the Robotics lab under Dr. Roshy and Rajaram. TCS taught me resilience and both
    the industrial and the research side of AI.
