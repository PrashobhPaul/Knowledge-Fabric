  questions:
  - What is Invest.IQ?
  - Tell me about your stock research app.
  - Do you have an AI based prediction system?
  answer: 'Invest.IQ is where I pushed the AI the furthest in my side projects: agentic AI applied to
    the Indian stock market. Heavy analytics plus an AI reasoning layer turn a tiered universe of Indian
    equities into one opinionated, backtest-first shortlist across short, medium and long horizons. Quality
    scores, technicals and news influence are all weighed and explained, so you can see exactly why each
    pick ranks where it does; a pick I cannot explain is a pick I do not trust. Backtest-first matters
    because markets punish overfitting: in my earlier stock-analysis pipeline a stock had to clear a 60
    percent walk-forward win rate over three years of history, with no look-ahead, before it could appear,
    and every stage falls back to the last good data instead of publishing a bad run. My earlier stock-analysis
    and ProfitPilot experiments are also on GitHub. Invest.IQ is live on the web and as an Android app
    built with React, TypeScript and Capacitor. It is educational, not financial advice.'
