# =============================================================================
# Canon, the smart plane: my 2012 B.Tech project in the Telugu press and on YouTube,
# answered the way Prashobh answers it.
# =============================================================================
#
# Same schema and rules as canon.yaml: first person, no claim without evidence,
# the first question is the canonical one. The press facts come only from the two
# clippings transcribed in docs_source/notes/press/Smart_Plane_Press_2012.md and are
# said as the papers reported them; the videos come from
# docs_source/notes/press/Smart_Plane_Videos.md and the records in
# knowledge_sources/youtube/extra_videos.json (resolved at build; an unresolved link
# is reported). Flying the plane by voice, with speech recognition on Hidden Markov
# Models, is his own account; the papers describe the climate-analyser robot plane.
# Not on record, and so not answered: the sensor list, which dimension is which, the
# speed, range, flight time and cost, and which newspaper profiles name him.
# Keywords are precise cues: "What was your college project?" and "What happened on
# Engineer's Day 2012?" stay with voice-uav, which now points to these answers.

as_of: "2026-11-26"

canon:
- id: smartplane-press
  topics:
  - education
  - personal
  questions:
  - Was your smart plane in the newspapers?
  - What did the newspapers say about your college project?
  - Did the newspapers write about your smart plane?
  - Which newspapers covered your smart plane?
  - Was your smart plane covered in the press?
  - What did the papers write about the smart plane?
  answer: Two Telugu newspapers wrote about it after Engineers' Day 2012. Eenadu, in its Jangaon
    edition, ran it as "The little plane flew", with a photo of the plane flying over our college, and
    reported that the students of Christu Jyothi Institute of Technology and Science had built the Smart
    Plane Climate Analyser Robot under the college's R&D department. Namasthe Telangana followed on Monday,
    24 September 2012, on page 8, with "With the sky as the limit", a feature on our students' innovations
    with photos of the smart plane. The papers describe the climate-analyser robot plane; flying it by voice,
    with speech recognition on Hidden Markov Models, is my own account of it. Those paper cuttings are worth
    more to me than any other record, because they were my launchpad.
  evidence:
  - url: doc:Smart_Plane_Press_2012
    source: notes
    why: The Eenadu and Namasthe Telangana clippings, transcribed from the Telugu
