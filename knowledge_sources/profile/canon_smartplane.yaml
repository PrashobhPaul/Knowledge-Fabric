- id: smartplane-specs
  topics:
  - education
  questions:
  - What were the specifications of your smart plane?
  - What were the specs of the smart plane?
  - How big was your smart plane?
  - What material was the smart plane made of?
  - What are the technical details of your smart plane?
  answer: 'Eenadu printed them in a box on the smart plane''s special features: a 4-stroke engine
    of 0.6 cc capacity, running on fuel with 20 percent nitro; the sensors it carried, which the box lists;
    dimensions of 6.2 ft and 6.5 ft; a weight of 8 kg; and a body of balsa and plywood. That is the Smart
    Plane Climate Analyser Robot as the paper described it. What the box does not show is the voice control,
    flying it with speech recognition on Hidden Markov Models, which is my own account of the project.'
