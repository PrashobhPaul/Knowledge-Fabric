    from it, because in an enterprise as safety-conscious as an airline I want every change reviewable
    and owned by the team that ships it, and an autonomous run nobody can trace is a liability however
    clever it is. So I prefer, and we use, Kiro''s spec-driven flow: requirements, design and tasks are
    written down and reviewed before code is generated, and the agents work from that agreed specification.
    The trade-off is slower first output and more ceremony, in exchange for changes a team can trace,
    review and own. The example I can show you end to end is the system answering you now. When I built
    Knowledge Fabric to replace the earlier chatbot on my digital card, the attractive design was the
    GenAI one everyone builds: an LLM chatbot over a vector database, generating fluent answers. Its business
    is trust: recruiters, clients and colleagues ask it about my career, and a twin that invents one fact,
    a client name, a number, a skill I do not have, costs me more than a hundred good answers earn. It
    also had to be private and cheap to run for years. So it is a fully static site with no backend, no
    vector database and no API keys. Nothing is generated: curated answers in my own words on top, cited
    BM25, LSA and MiniLM retrieval underneath, and an honest no-answer when nothing on record covers a
    question. The trade-off is real: it cannot improvise beyond what I have covered, and the curated layer
    is ongoing work. CogniFlow is the same call: its default is a rule-based, deterministic compiler,
    with an open-weight model only as an option. The most impressive architecture is not the goal; the
    one the business can trust, afford and operate is.'
