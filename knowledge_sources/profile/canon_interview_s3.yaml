- id: iv3-30-day-ask
  topics:
  - interview
  - scenario
  questions:
  - The business wants an AI solution in 30 days; data quality and security architecture are insufficient.
    How do you handle it?
  - The business wants an AI solution in 30 days, but the data quality and security architecture are not
    ready. How would you handle it?
  - What do you do when leadership pushes for a 30-day AI launch with poor data quality?
  - How do you respond when the business wants AI delivered before the data and security are ready?
  keywords:
  - in 30 days
  - within 30 days
  - 30 day ai
  - 30 day launch
  - 30 day deadline
  - data quality and security
  - security architecture are insufficient
  - poor data quality
  - security are not ready
  - security are ready
  answer: 'I would not say no, and I would not silently say yes. I make the trade-off explicit and give
    the business a version of yes that does not create a breach: in effect, I negotiate scope, not security.
    In the first few days I find out what the 30 days is really for, a board demo, a customer commitment,
    a regulatory date or a competitor, and I assess the gaps concretely: which data is poor and in what
    way, which security controls are missing, and what could go wrong if we ignored them. Then I put options
    on the table. Option one is a guarded MVP on safe data: a narrow scope on data we trust and are allowed
    to use, such as public, synthetic or a cleaned and curated subset; internal users only; read-only,
    with no actions on customer systems; every call through a controlled gateway with logging and access
    control; and a human reviewing outputs. That can be live in 30 days and prove the value. Option two
    is the full solution on a realistic timeline, with the data remediation and the security work planned
    in phases. What I will not do is put sensitive data into a GenAI system without the controls it needs,
    because a 30-day win that becomes a data incident costs the business far more than a month. If leadership
    still wants to accept a risk, that is their call, but it has to be explicit: written into the risk
    register with its impact, a named business owner signing the risk acceptance, the CISO informed, compensating
    controls in place, and a date by which the gap is closed. In parallel I start the real fixes: data
    quality rules and lineage for the sources we will need, and the security architecture, meaning identity,
    permission-aware retrieval, encryption and redaction before any external LLM call, so the MVP grows
    into production instead of being thrown away. I report weekly on both tracks. Once the options are
    clear, most business leaders choose the guarded MVP, because what they need in 30 days is visible
    progress, not every feature.'
