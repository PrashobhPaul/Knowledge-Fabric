  answer: 'I mentor the way I was mentored: real problems and real ownership, early. At Qualizeal I mentor
    the young engineering graduates who join the AI Center of Excellence as interns and freshers, and
    I learned how from people such as Manoj Madhavan at TCS, who took me into the AI Labs after sixteen
    interviews and made me strong in Python, and Roshy sir and Rajaram sir, who gave me a chance before
    I had fully proved myself. In practice it has four parts. First, fundamentals before frameworks: how
    a transformer works, why retrieval fails, what makes an evaluation trustworthy, because GenAI frameworks
    change every few months and fundamentals do not. Second, a real piece of a real system, small enough
    to finish, with a definition of done that includes tests and an evaluation, so they learn that a demo
    is not a deliverable. Third, review as teaching: I review their designs and code with questions rather
    than corrections, what happens when the model is wrong, how would you know, what does it cost, until
    they start asking those questions themselves. Fourth, exposure: they present their own work to stakeholders,
    write a short design note and sit in on architecture discussions, because communication is half the
    job. I also teach them to measure before they argue, and to look across fields for ideas; my own best
    result, taking an object detection model at Brane from 76 to 89.5 percent accuracy, came from bringing
    an NLP idea to a vision problem. And I try to pass on what TCS taught me: relentless effort beats
    a perfect resume. I know it is working when they ask the hard questions before I do.'
