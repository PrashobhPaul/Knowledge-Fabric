# =============================================================================
# Canon — Senior / Enterprise AI Architect interview, Session 3
# Leadership, consulting and strategy (tests/interview_brief.md, sections A–D,
# all five scenarios), plus "Five questions never to skip" #2 and the
# architect-versus-senior-developer distinction from the scorecard.
# =============================================================================
#
# Same schema and rules as canon.yaml: first person, as Prashobh would say it
# aloud; every example from his own record (Qualizeal AI CoE, ValidAIte and
# QMentisAI, agentic SDLC with Kiro for a major US airline, agentic STLC with
# the Microsoft Agent Framework and .NET for a global professional-services
# firm, Tech Mahindra, TCS, Brane, Knowledge Fabric, CogniFlow). Client names
# stay confidential; no invented metrics, team sizes or clients.
# Keywords are precise cue phrases so these answers never take the personal
# questions (mentors, teams, services, framework-choice) that canon.yaml owns.
# Tested by tests/qa_interview_s3.json; diagrams by scripts/diagrams_interview_s3.py.

canon:

# ----------------------------------------------------------------------------- A. Architecture leadership
- id: iv3-ai-strategy
  topics:
  - interview
  - strategy
  questions:
  - How do you establish an enterprise AI architecture strategy?
  - How would you define an AI architecture strategy for an enterprise?
  - How do you create an enterprise AI strategy?
  - What is your approach to setting an enterprise AI architecture strategy?
  keywords:
  - enterprise ai architecture strategy
  - ai architecture strategy
  - enterprise ai strategy
  - architecture strategy
  - strategy for an enterprise
  - ai roadmap
  - strategy and roadmap
  - roadmap and strategy
  answer: 'I start from the business strategy, not the technology. In the first weeks I meet the business
    owners, the CIO and CISO teams and the people who run operations, and I ask what the company is trying
    to move: revenue, cost to serve, risk, cycle time or customer experience. Then I take stock of what
    exists: the AI already running, the data estate and who owns it, the cloud and security standards,
    the skills, and the regulations that apply. From there the strategy has four parts. First, a portfolio
    of use cases scored on value and feasibility, with two or three lighthouse projects that can show
    measurable results within a quarter. Second, a target reference architecture: a central AI gateway
    in front of every model provider, shared retrieval and knowledge services, an agent orchestration
    layer, an evaluation service, and observability for latency, cost and quality, all on the identity
    and data controls the enterprise already trusts. Third, governance that matches risk: a model and
    prompt registry, an architecture review board for new use cases, golden-set evaluation gates before
    release, and human approval wherever a mistake is expensive. Fourth, the operating model: who builds,
    who owns what in production, how teams reuse accelerators instead of rebuilding, and how we skill
    people. This is the work I lead at Qualizeal, where I own the AI Center of Excellence roadmap and
    the practices our programmes follow for GenAI integration, prompt engineering and RAG; at Tech Mahindra,
    advising C-level stakeholders on AI strategy, it always started with choosing the few use cases worth
    doing first. I write it as a roadmap with measurable checkpoints, not a slide of principles, and I
    revisit it every quarter, because models and prices change faster than any enterprise plan.'
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Driving AI architecture strategy and governance; leading the AI CoE roadmap
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Advised C-level stakeholders on AI strategy and roadmap
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Enterprise GenAI strategy, architecture reviews and AI governance
- id: iv3-value-opportunities
  topics:
  - interview
  - strategy
  questions:
  - How do you identify opportunities where AI can deliver measurable business value?
  - How do you find the right AI use cases for a business?
  - How do you prioritise AI use cases?
  - How do you identify where AI can create business value?
  - Where should a company use AI first?
  keywords:
  - measurable business value
  - business value
  - ai use cases
  - right use cases
  - prioritise use cases
  - prioritize use cases
  - prioritise ai use cases
  - prioritize ai use cases
  - ai opportunities
  - value and feasibility
  - use ai first
  - start with ai
  - where should a company
  answer: 'I look for pain that already has a number on it. I sit with the teams that run a process and
    ask where time, money or quality leaks: hours spent reading and routing documents, tickets bouncing
    between queues, decisions waiting on an expert, errors that cost rework or compliance findings. Each
    candidate gets a one-page brief: the business owner, the metric it moves, today''s baseline, the data
    it needs and who owns that data, the risk if the AI is wrong, and how a human would check it. Then
    I score the candidates on a value and feasibility grid. Value is the size of the metric times how
    often it happens. Feasibility is data readiness, integration effort, risk and regulatory exposure,
    and whether we can evaluate the output objectively. The best first projects are frequent, measurable,
    on data we can reach, with a cheap way to catch errors. Classification and routing problems are often
    the quiet winners; on my resume is an AI ticket classifier that achieved a 300x reduction in ticket
    resolution time, and an operational number of that kind convinces a CFO faster than any demo. I also
    push back on use cases that are really a rule or a report: if a deterministic workflow or a dashboard
    solves it, that is cheaper and safer than an LLM. Before anything is built we agree the success criteria
    and the baseline in writing, so the outcome is proven rather than claimed.'
  evidence:
  - url: profile:career_projects/AI Ticket Classifier
    source: resume
    why: AI ticket classifier with a 300x reduction in ticket resolution time
  - url: profile:roles/Tech Mahindra
    source: resume
    why: GenAI and agentic AI for telecom and BFSI clients, driving measurable business outcomes
  - url: profile:roles/Qualizeal
    source: resume
    why: Leading the AI CoE roadmap
- id: iv3-build-vs-buy
  topics:
  - interview
  - strategy
  questions:
  - How do you decide whether an organization should build an AI solution internally or purchase an existing
    product?
  - When should a company build an AI solution instead of buying one?
  - How do you make build versus buy decisions for AI?
  - Build or buy, how do you decide for an AI solution?
  - How do you decide whether to build or buy a GenAI solution?
  keywords:
  - build or buy
  - buy or build
  - build vs buy
  - build versus buy
  - build internally
  - purchase an existing product
  - existing product
  - instead of buying
  - off the shelf
  answer: 'I decide on five questions, and I record the answer as an architecture decision record so the
    reasoning outlives the meeting. First, is the capability a differentiator? If it is the company''s
    edge, its proprietary data, process or customer experience, we build or at least own the core. If
    it is a commodity, such as meeting transcription, a coding assistant or a generic HR chatbot, we buy.
    Second, fit: does the product work with our data, our identity and permission model, our residency
    and compliance needs, and can we get our data back out? Third, total cost of ownership over three
    years, not the licence price: integration, run cost per transaction, the people needed to operate
    and evaluate it, and the cost of switching later. Fourth, time to value against risk: a mature product
    can be live in weeks while a build carries delivery risk, but a product carries vendor risk, roadmap
    dependency and lock-in. Fifth, control: can we evaluate it on our own golden set, see its traces,
    set guardrails and audit it? If a vendor cannot show me how its system behaves on our questions, it
    does not pass. In practice the answer for GenAI is usually a blend: buy the platform pieces, LLMs
    through an API, a vector store, an observability tool, and build the thin layer that encodes our knowledge,
    workflows and guardrails, all behind our own AI gateway so any piece can be swapped. It is the same
    logic behind our internal platforms at Qualizeal: we build ValidAIte and QMentisAI ourselves because
    testing and validating AI is our own expertise, a differentiator worth owning. Whichever way it leans,
    I run the same short proof for both options, on real data and scored against agreed criteria, so the
    decision is evidence against evidence, not a demo against a slide.'
  evidence:
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Architecture reviews and AI strategy for organisations adopting AI
  - url: profile:engagements/ValidAIte
    source: resume
    why: ValidAIte, built in-house at the Qualizeal AI CoE
  - url: profile:engagements/QMentisAI
    source: resume
    why: QMentisAI, built in-house for AI testing and quality engineering
- id: iv3-conflicting-opinions
  topics:
  - interview
  - leadership
  questions:
  - How do you handle conflicting architectural opinions between engineering teams?
  - What do you do when two engineering teams disagree on the architecture?
  - How do you resolve architecture disagreements between teams?
  - How do you settle technical disagreements between teams?
  keywords:
  - conflicting architectural opinions
  - conflicting opinions
  - architectural opinions
  - teams disagree
  - disagree on the architecture
  - architecture disagreements
  - technical disagreements
  - disagreements between teams
  answer: 'First I make sure the teams are arguing about the same problem. Most architectural disagreements
    are really disagreements about unstated requirements, so I ask both teams to write down the decision
    drivers: latency, cost, scale, security, time to market and what the team can operate. Very often
    one team is optimising for speed and the other for long-term maintainability, and both are right for
    different drivers. Then each side puts its option into a short architecture decision record: the context,
    the option, the trade-offs, and what evidence would prove it wrong. Where the facts are uncertain,
    I prefer a time-boxed spike to another meeting: a few days on each option, measured on the same golden
    set and the same load. Evidence settles what opinions cannot, and it lets people change their minds
    without losing face. If it is still split after that, I make the call, because owning technical direction
    is the architect''s job, and I explain the reasoning in writing, including what we gave up. The decision
    goes to the architecture review board so it becomes a standard rather than a one-off, with a note
    of what would make us revisit it. I apply the same discipline to my own preferences: when I choose
    between LangGraph, CrewAI, AutoGen or a plain orchestrator, the problem and its constraints decide,
    and the choice is written down so a team can challenge it. Two rules I hold to: seniority and the
    loudest voice never decide, and the team whose option lost is never punished; their concerns usually
    become the risks we monitor.'
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Owns AI architecture strategy and the practices teams follow
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: Framework choice depends on the client's need and the situation
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Mentored AI teams across three geographies
- id: iv3-accelerators
  topics:
  - interview
  - leadership
  questions:
  - How do you establish reusable AI frameworks and accelerators?
  - How do you build reusable AI accelerators?
  - How do you create reusable components for AI projects?
  - What reusable assets would you build for an AI practice?
  keywords:
  - accelerators
  - reusable
  - reusable ai frameworks
  - reusable components
  - reusable assets
  - ai accelerators
  - inner source
  answer: 'I do not start by designing a framework; I harvest one. The first two or three GenAI projects
    are built well, with clean boundaries, and then I look at what they repeated: document ingestion and
    chunking, permission-aware retrieval, LLM calls through a gateway, prompt templates, guardrails, the
    evaluation harness, tracing and cost tracking, and tool wrappers for agents. Those repeated parts
    become the accelerators, each with an owner, a version, documentation and a reference implementation
    a new team can run on day one. I package them at three levels: a reference architecture that says
    how the pieces fit; reusable components and templates, such as a RAG starter or an agent skeleton
    with human approval built in; and shared platform services, such as the AI gateway, the model and
    prompt registry and the evaluation service, which teams call rather than copy. Adoption matters more
    than elegance, so the accelerator has to be the easiest path: one template that sets up the repository,
    the CI pipeline, the evaluation gate and the dashboards in minutes. I run accelerators as products,
    measured by how many projects use them, the time they save and the defects they prevent, and I retire
    the ones nobody uses. Improvements flow back through an inner-source model, so a project that improves
    a component improves it for everyone. I learned the value of this early: at TCS I built an intelligent
    date tagger that was reused across many TCS projects, because it solved one common problem well. That
    is still the bar: an accelerator earns its place by being reused, not by being designed.'
  evidence:
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: The intelligent date tagger reused across many TCS projects
  - url: profile:engagements/ValidAIte
    source: resume
    why: ValidAIte, the AI-testing platform at the Qualizeal AI CoE
  - url: profile:roles/Qualizeal
    source: resume
    why: Defining best practices for GenAI integration, prompt engineering and RAG
- id: iv3-consistency
  topics:
  - interview
  - leadership
  questions:
  - How do you ensure architectural consistency across multiple AI projects?
  - How do you keep the architecture consistent across many AI projects?
  - How do you make sure different AI teams follow the same architecture standards?
  - How do you enforce architecture standards across AI programmes?
  keywords:
  - architectural consistency
  - consistency across
  - consistent across
  - architecture standards
  - same architecture
  - multiple ai projects
  - across ai projects
  - enforce standards
  answer: 'Consistency comes from three things: a few mandatory standards, a paved road that makes the
    standard the easiest choice, and reviews that check outcomes rather than paperwork. The standards
    are deliberately short. Every LLM call goes through the central AI gateway. Every application uses
    the enterprise identity and permission model, including inside retrieval. Prompts, models and datasets
    are versioned in a registry. Every release passes a golden-set evaluation gate. And every application
    emits the same traces and metrics for latency, cost and quality. Beyond those, teams are free in how
    they build. The paved road is the reference architecture plus templates and shared services, so following
    the standard is faster than ignoring it. Then the review: an architecture review board on a fixed
    cadence for new use cases and significant changes, with decisions recorded as architecture decision
    records that other teams can read and reuse. I keep it light for low-risk work and stricter where
    data is sensitive or an agent takes actions. I also make consistency visible: a portfolio view of
    every AI application with its owner, models, risk tier, evaluation scores and cost, so drift shows
    up as data rather than as a surprise in an audit. Fitness functions in CI catch the rest automatically,
    for example checks that every call goes through the gateway and that no secret or personal data reaches
    a prompt. Finally, people: architects working inside the teams, a community of practice and regular
    design reviews, which is how I set these practices for GenAI integration, prompt engineering and RAG
    across our programmes at Qualizeal. The test of success is simple: two teams solving similar problems
    end up with recognisably the same architecture.'
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Defining best practices for GenAI integration, prompt engineering and RAG pipelines
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: Solution architecture, AI governance, MLOps, microservices
- id: iv3-innovation-governance
  topics:
  - interview
  - leadership
  questions:
  - How do you balance innovation with enterprise governance?
  - How do you balance speed of innovation with governance and compliance?
  - How do you let teams experiment with AI without losing control?
  - How do you keep governance from slowing down AI innovation?
  keywords:
  - innovation with enterprise governance
  - innovation with governance
  - balance innovation
  - innovation and governance
  - governance and innovation
  - experiment with ai
  - slowing down ai innovation
  - slow down innovation
  - shadow ai
  answer: 'I do not treat them as opposites. I tier the governance by risk, so GenAI experiments are cheap
    and production is safe, and I run three lanes. The sandbox lane is for exploration: approved LLMs
    through the gateway, synthetic or non-sensitive data, a cost cap, no customer exposure and very little
    paperwork, so a team can try an idea in days. The pilot lane is a real use case with real users: it
    needs a business owner, agreed success criteria, a data and privacy review, a golden-set evaluation
    and human review of outputs. The production lane carries the full controls: architecture review, security
    and red-team testing, monitoring for quality, cost and drift, an incident process and a rollback plan.
    Moving between lanes is a gate with published criteria, so teams know exactly what it takes to graduate,
    and governance becomes a checklist they can plan for instead of a committee that surprises them. The
    other half is to build governance into the platform so it costs teams nothing: the AI gateway handles
    logging, redaction, rate limits and the approved-model list; the evaluation service runs the gates;
    the registry gives lineage for free. When guardrails are automatic, people stop seeing them as friction.
    I also keep a fast track for new models and tools, a small evaluation against our golden sets within
    days, because blocking innovation only pushes it into shadow AI, which is the worst governance outcome
    of all. AI governance matters a lot to me because AI adoption is now in everything, and in my experience
    teams move faster, not slower, when the rules are clear and automated.'
  evidence:
  - url: doc:Prashobh_In_His_Own_Words
    source: resume
    why: What AI governance means to him
  - url: profile:roles/Qualizeal
    source: resume
    why: Governance frameworks and scalable GenAI adoption across enterprise programmes

# ----------------------------------------------------------------------------- B. Project and delivery
- id: iv3-six-weeks
  topics:
  - interview
  - delivery
  questions:
  - You have an AI project with a six-week deadline and unclear requirements. How would you proceed?
  - How would you deliver an AI project in six weeks when the requirements are unclear?
  - What do you do when an AI project has a tight deadline and vague requirements?
  - How do you handle unclear requirements on an AI project?
  keywords:
  - six week deadline
  - six weeks
  - 6 weeks
  - 6 week deadline
  - unclear requirements
  - vague requirements
  - requirements are unclear
  - tight deadline
  answer: 'I would fix the deadline and the quality bar, and let the scope flex. Week one is discovery,
    and I do not skip it: with the business owner and real users I turn the unclear requirement into a
    problem statement, three to five measurable success criteria, the data we can actually access, the
    security and privacy constraints, and an explicit list of what is out of scope. In the same week I
    collect fifty to a hundred real examples with expected outcomes, because when requirements are vague,
    that golden set becomes the definition of done. Weeks two and three build a thin vertical slice: one
    user journey, end to end, on real data, with the simplest architecture that could work, often retrieval
    and a well-structured LLM prompt, or a deterministic workflow with a model only at the decision points.
    I demo it every week, because seeing a working system clarifies requirements faster than any workshop.
    Weeks four and five harden it: evaluation against the golden set, guardrails, access control, logging,
    cost and latency checks, and the edge cases the demos surfaced. Week six is a controlled release to
    a pilot group, with monitoring, a feedback loop and a written plan for what comes next. Throughout,
    I keep a risk register and a decision log, and I make trade-offs visible early: if the data is not
    there, I say so in week one, not week five. What I will not do is build a full platform on assumptions
    or promise every feature. On a six-week clock, a narrow GenAI system that demonstrably works beats
    a broad one that might.'
  evidence:
  - url: profile:roles/Qualizeal
    source: resume
    why: Hands-on across architecture, development and implementation
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Led GenAI implementations and managed production deployments
- id: iv3-estimation
  topics:
  - interview
  - delivery
  questions:
  - How do you estimate the effort and cost of an AI implementation?
  - How do you estimate the cost of an AI project?
  - How would you estimate effort for an AI solution?
  - How do you size and budget an AI programme?
  - How do you estimate the cost of a GenAI solution?
  keywords:
  - estimate the effort
  - estimate the cost
  - estimate effort
  - estimate cost
  - effort and cost
  - effort estimation
  - cost estimation
  - size and budget
  answer: 'I estimate two things separately, the cost to build and the cost to run, and I give ranges
    with stated assumptions, never a single number. For the build, I split the work into what is predictable
    and what is not. Integration, ingestion pipelines, APIs, the user interface, security, deployment
    and observability estimate as ordinary software does, in team-weeks per layer of the reference architecture.
    The uncertain part is reaching the quality bar: how much retrieval, prompt and data work it takes
    to hit the agreed evaluation targets. Nobody can size that honestly up front, so I quote a wide range,
    run a short, time-boxed proof on real data against the golden set, and then re-quote with a much tighter
    one. I budget explicitly for building the golden set, evaluation, red-teaming and user acceptance,
    which teams usually forget. The run cost I model bottom-up and show as a cost per transaction next
    to the value per transaction. A worked example: a support assistant taking 10,000 requests a day handles
    some 300,000 a month; at roughly 1.7 cents a request on a frontier model that is $5,000 a month. Route
    70 percent of requests to a model a tenth the price and serve 20 percent from a semantic cache, and
    the same traffic costs under $1,500. Add retrieval and vector storage, hosting or GPUs if we self-host,
    monitoring and the people to operate it, then the sensitivity: what if usage triples, or the cheaper
    model fails the evaluation. The people side goes in too: change management, training, subject-matter
    experts'' time for labelling and review, and support after go-live. Each estimate lists the risks
    and the decisions that would change it, and I re-estimate at every phase gate, because the first number
    on an AI project is a hypothesis, not a promise.'
  evidence:
  - url: profile:roles/Tech Mahindra
    source: resume
    why: Led GenAI implementations and managed production deployments
  - url: profile:services/AI Consulting & Strategy
    source: website
    why: Architecture reviews and GenAI strategy
- id: iv3-accuracy-expectations
  topics:
  - interview
  - delivery
  questions:
  - How do you handle a client who expects 100% accuracy from an LLM?
  - What do you tell a client who wants an LLM that is never wrong?
  - How do you manage expectations of 100 percent accuracy from AI?
  - A client wants 100 percent accurate answers from GenAI. What do you say?
  keywords:
  - 100 accuracy
  - 100 percent accuracy
  - 100 percent accurate
  - expects 100
  - never wrong
  - perfect accuracy
  - accuracy expectations
  - manage expectations
  answer: 'I take the expectation seriously, because behind it is a real worry: they cannot afford a wrong
    answer in front of a customer or a regulator. So I move the conversation from the accuracy of the
    model to the reliability of the system. I explain plainly that an LLM is probabilistic: no model gives
    100 percent, and neither do the people doing the job today, so the first step is to measure that human
    baseline. Then we define what correct means for their use case, build a golden set of real cases with
    expected outcomes, and agree thresholds per type of error, because a wrong refund amount and a clumsy
    sentence are not the same risk. Then I design the system so that errors are caught before they matter:
    answers grounded in their own documents with citations, validation and rule checks on anything structured,
    confidence thresholds below which the system says it does not know or hands over to a human, human
    approval on high-impact actions, and plain deterministic code for whatever must be exact, such as
    calculations and policy rules. Monitoring and user feedback keep it honest after go-live. The commitment
    I can make is not 100 percent; it is measured accuracy on their cases, known failure modes, and no
    silent errors on the things that matter. Clients usually relax once they see the evaluation report
    and the escalation path, because what they wanted was control, not a magic number.'
  evidence:
  - url: doc:Knowledge_Fabric
    source: resume
    why: Cited answers, confidence and lineage instead of generated guesses
  - url: profile:engagements/ValidAIte
    source: resume
    why: Testing and validating AI and GenAI systems
- id: iv3-team-wrong-architecture
  topics:
  - interview
  - delivery
  questions:
  - What would you do if your team proposed an architecture that you believe is technically incorrect?
  - What if your team proposes an architecture you think is wrong?
  - How do you handle a design from your team that you disagree with?
  - How do you push back on a flawed architecture from your own team?
  keywords:
  - technically incorrect
  - architecture you think is wrong
  - architecture is wrong
  - wrong architecture
  - flawed architecture
  - push back
  - team proposed
  - team proposes
  - that you disagree with
  answer: 'First I check my own belief, because sometimes the team knows something I do not. I ask them
    to walk me through the drivers and trade-offs they optimised for, and I ask questions rather than
    issue a verdict: how does this behave at ten times the load, what happens when the LLM provider is
    down, what happens when a user loses access to a document, how will we evaluate it, what does each
    request cost. Often the questions are enough and the team finds the gap itself, which teaches far
    more than being told. If I still believe it is wrong, I say so clearly and specifically, in terms
    of the requirement it fails rather than my preference: this breaks the permission model, this will
    miss the latency target, this cost grows linearly with users. Where it is genuinely debatable, I propose
    a time-boxed spike on both options against the same tests and load, and let the numbers decide. If
    it is a one-way door, a security flaw, a compliance breach or something expensive to reverse, I make
    the call and stop it, explain why in an architecture decision record, and own the consequences. If
    it is a two-way door with a small downside, I sometimes let the team go ahead with agreed checkpoints,
    because owning a decision builds better engineers than being overruled. Either way I keep the disagreement
    private and respectful, never in front of stakeholders, and I make sure the team''s good ideas survive
    into the final design. The order I hold to is questions first, evidence second, and a firm line only
    where the risk is real.'
  evidence:
  - url: doc:Career_In_Depth
    source: resume
    why: Mentors the interns and freshers who join the AI Center of Excellence
  - url: profile:roles/Qualizeal
    source: resume
    why: Owns AI architecture strategy
- id: iv3-tech-debt
  topics:
  - interview
  - delivery
  questions:
  - How do you manage technical debt in AI projects?
  - How do you handle tech debt in GenAI projects?
  - What kind of technical debt do AI systems accumulate?
  - How do you keep AI prototypes from becoming unmaintainable?
  keywords:
  - technical debt
  - tech debt
  - debt
  - unmaintainable
  - debt register
  answer: 'AI projects carry ordinary code debt plus a kind that is easy to miss: prompts nobody owns,
    evaluation sets that no longer reflect real usage, pipelines that silently depend on one LLM version,
    retrieval code copied into every team, undocumented data dependencies, and pinned models the provider
    will retire. I manage it in four ways. I make it visible: a debt register next to the risk register,
    each item with an owner and its impact on cost, quality, security or delivery speed. I prevent the
    worst of it by design: model calls behind a gateway so a provider or version change is configuration,
    prompts and datasets versioned as code, evaluation in CI so a regression shows up on the pull request,
    and shared accelerators instead of every team rolling its own RAG. I pay it down continuously: a fixed
    share of every sprint, often fifteen to twenty percent, plus a clean-up gate before a pilot becomes
    production, because a proof of concept''s shortcuts are acceptable only until real users depend on
    them. And I treat model and data changes as first-class events: when a provider deprecates a model
    or the data shifts, we rerun the golden set, compare, and decide deliberately. The trap I watch for
    is the demo that quietly went live, with deadline shortcuts nobody revisited; I would rather negotiate
    a smaller scope than ship a pilot that cannot be maintained.'
  evidence:
  - url: doc:Knowledge_Fabric
    source: resume
    why: Gold question sets gate every deploy
  - url: profile:skills/Architecture & Cloud
    source: resume
    why: MLOps, microservices, solution architecture
- id: iv3-success-metrics
  topics:
  - interview
  - delivery
  questions:
  - How do you measure the success of an AI implementation beyond model accuracy?
  - How do you measure whether an AI project is successful?
  - What KPIs do you use for an AI solution beyond accuracy?
  - How do you prove the ROI of an AI project?
  keywords:
  - measure the success
  - measure success
  - beyond model accuracy
  - beyond accuracy
  - success metrics
  - kpis
  - prove the roi
  - roi of an ai
  - project is successful
  answer: 'Model accuracy is a means; success is a business outcome that holds up in production. I measure
    four layers, agree them with the business owner before we build, and capture a baseline for each.
    Business outcomes come first: the metric the project was funded to move, such as handling time, cost
    per case, resolution time, conversion, revenue at risk or compliance findings. Adoption and experience
    second: active users, how often people accept, edit or override the AI''s output, escalation rates,
    task completion and satisfaction, because an accurate system that nobody trusts is worth nothing.
    Operational health third: latency at the 95th percentile, availability, cost per transaction and per
    user, LLM token consumption and incidents. Fourth, trust and risk, which matter most for GenAI: groundedness
    and citation accuracy, hallucination and refusal rates on the golden set, safety and policy violations,
    fairness checks where people are affected, and audit completeness. For agents I add task success rate,
    steps per task, tool errors and how often a human had to step in. All of it sits on one dashboard
    that I review with the business owner on a fixed cadence, compared against the baseline and, where
    possible, a control group, so the improvement can be attributed to the AI and not to something else.
    A project succeeds when the business metric moved, people keep using it, it runs within its cost and
    reliability budget, and nothing unsafe reached a customer. The number I watch most closely is the
    override and edit rate, because it shows exactly where the system and its users disagree, and that
    is where the next improvement is.'
