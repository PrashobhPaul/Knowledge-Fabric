- id: iv3-communication-gap
  topics:
  - interview
  - team-leadership
  questions:
  - How do you handle a technically strong engineer who cannot communicate effectively with business stakeholders?
  - How do you help an engineer who struggles to communicate with business stakeholders?
  - What do you do with a brilliant engineer who is poor at communication?
  - How do you improve an engineer's communication with stakeholders?
  keywords:
  - communicate effectively
  - cannot communicate
  - struggles to communicate
  - business stakeholders
  - poor at communication
  - communication with stakeholders
  - stakeholder communication
  - communication skills
  answer: 'I treat it as a skill gap, not a personality flaw, because communication can be learned. First
    I give specific feedback, privately and with examples: in that meeting you explained the retrieval
    pipeline, but the stakeholder had asked whether it would reduce handling time. Usually the engineer
    is answering the question they find interesting, not the one being asked. Then I give them a simple
    structure to practise: lead with the business outcome and the answer, then the trade-off or risk in
    plain words, then the decision or help you need, and keep the architecture for the appendix. Next
    comes safe practice: they rehearse with me before a stakeholder meeting, then co-present with me,
    taking the part they know best while I handle the framing, and gradually they lead and I only support.
    I help them build a translation habit: latency in milliseconds becomes how long a customer waits,
    and a hallucination rate becomes how many answers a reviewer would have to correct. Writing helps
    too, so I ask for a one-page decision note in business language before each review. It is the same
    idea I teach in the workshops I run, where I tailor the level to the room: leaders need outcomes,
    engineers need patterns. Meanwhile I protect their strength. Not every brilliant engineer needs to
    become client-facing; if they prefer to stay deep, I pair them with someone who bridges, and I make
    sure their work gets the credit. What I avoid is shielding them from stakeholders forever, because
    exposure with support is the only way it improves.'
