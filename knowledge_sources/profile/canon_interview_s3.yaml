# ----------------------------------------------------------------------------- D. Scenarios
- id: iv3-agents-everywhere
  topics:
  - interview
  - scenario
  questions:
  - The client wants to convert all existing workflows into autonomous AI agents. Would you agree? How
    do you decide which workflows need agents?
  - A client wants to turn every workflow into an autonomous AI agent. Would you agree?
  - How do you decide which workflows need AI agents?
  - Should every business workflow become an autonomous agent?
  keywords:
  - autonomous ai agents
  - autonomous ai agent
  - autonomous agent
  - existing workflows
  - every workflow
  - all workflows
  - which workflows
  - workflows need agents
  - workflows need ai agents
  - agents everywhere
  - stay as automation
  - should stay as automation
  - remain automation
  answer: 'No, not all of them, and I would tell the client so directly, with a method rather than an
    opinion. Agents are the right tool where a task needs judgement over unstructured information, has
    many possible paths, and has to choose its tools at run time. They are the wrong tool where the process
    is already well defined, because an agent adds cost, latency, non-determinism and a larger attack
    surface to something a workflow does reliably today. So I would assess their workflows as a portfolio
    and score each on five criteria. Determinism: are the steps and rules known in advance? If yes, keep
    it as workflow automation, perhaps with an LLM at a single step. Variability: how much do the inputs
    and paths vary, free text, exceptions, documents in many formats? High variability favours an agent.
    Risk: what does an error cost, financially, legally or with a customer? Reversibility: can a wrong
    action be undone? Irreversible, high-risk actions need a human approval step whatever we build. And
    ROI: volume times value per case, against the cost to build, run and evaluate. That gives a spectrum
    rather than a yes or no: deterministic automation for the stable core, a GenAI step where the work
    is reading, extracting or classifying, an assistant that drafts while a human decides, and a bounded
    agent for exceptions and investigations, with limited tools, a step and cost budget, and full traces.
    Then we prove it: pick two or three high-scoring workflows, run the agent against the current process
    on a golden set of real cases, compare quality, cost per case and cycle time, and widen autonomy only
    when the evaluations show it holds. The deterministic backbone stays as automation, and agents work
    at the edges where judgement is needed. That is how I build agentic AI for the software life cycle
    today: for a major US airline, the agents built with Kiro work from an agreed specification, with
    requirements, design and tasks written down and reviewed, not one big autonomous generation, and on
    the testing life cycle for a global professional-services firm, agents help at defined steps, from
    analysing requirements to designing and automating tests. My own agent projects follow the same rule:
    a plain orchestrator that calls a model only at the decision points, and a rule-based fallback that
    keeps working when the model does not. What the client really wants is speed and lower cost; agents
    everywhere is one way to ask for it, and rarely the cheapest.'
