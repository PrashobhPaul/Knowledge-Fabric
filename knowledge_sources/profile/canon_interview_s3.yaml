- id: iv3-architect-readiness
  topics:
  - interview
  - team-leadership
  questions:
  - How do you assess whether an engineer is ready to become an AI architect?
  - How do you know an engineer is ready to be an architect?
  - What does a senior engineer need to become an AI architect?
  - How do you groom engineers into architects?
  keywords:
  - ready to become an ai architect
  - ready to become
  - ready to be an architect
  - become an ai architect
  - become an architect
  - into architects
  - engineer is ready
  answer: 'I look for a shift from how to build it to whether and why to build it. A strong senior engineer
    optimises a component; an architect owns the outcome of the whole system and its trade-offs. So I
    assess five things, mostly by watching how someone handles real decisions. One, problem framing: before
    designing, do they ask about the business objective, the users, the data, the constraints, SLAs, security
    and budget? Two, breadth with depth: can they reason across retrieval, LLMs, agents, data, infrastructure,
    security and cost, and still go deep where it matters, such as evaluation or permission-aware retrieval?
    Three, trade-off judgement: can they lay out two or three options with honest pros and cons, choose
    one, record it as a decision, and say what would change their mind? Can they say no to a technically
    attractive design that is wrong for the business? Four, production thinking: do they design for failure,
    observability, rollback, cost and evaluation from the start rather than after go-live? Five, communication
    and influence: can they explain the same design to a CFO, a security team and junior engineers, and
    bring a disagreeing team along without pulling rank? I test readiness with stretch assignments rather
    than interviews: they lead the design of a real use case, present it at the architecture review, defend
    it and own it through delivery, with me as the safety net. If they come back having changed the design
    because of what they heard, that is a good sign. Many brilliant engineers are not ready yet because
    they still fall in love with the solution; an architect falls in love with the problem.'
