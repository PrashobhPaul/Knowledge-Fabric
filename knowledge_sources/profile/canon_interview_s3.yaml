  keywords:
  - ai team from scratch
  - team from scratch
  - build an ai team
  - set up a new ai team
  - start an ai team
  - new ai team
  - hire first
  answer: 'I would start from the roadmap, not an org chart: the first use cases decide the first hires.
    The core is a small team that can take one GenAI or ML use case to production end to end: an AI architect
    or lead who owns technical direction, two or three strong AI engineers who can build retrieval, agents
    and evaluation and also write solid backend code, a data engineer, and a platform or MLOps engineer
    who owns deployment, the gateway, observability and cost. Next to them I need a product owner from
    the business who owns the outcome, and time from subject-matter experts for golden sets and reviews;
    without those, the team builds clever things nobody uses. As the portfolio grows I add specialists:
    an evaluation and quality engineer, security and responsible-AI expertise, a data scientist for classical
    ML where it beats an LLM, and UX for AI-specific interaction design. I hire for fundamentals and judgement
    over framework names: people who understand how models fail, can design an experiment, write production
    code and explain a trade-off to a business stakeholder. In interviews I give a real, messy problem
    and listen to the questions they ask before they design. Then I make the team self-sustaining with
    shared standards and accelerators, pairing, design reviews, a clear path from junior to senior to
    architect, and a mix of experienced engineers and fresh graduates who learn fast. That mix is what
    I work with at the Qualizeal AI Center of Excellence, where I mentor the interns and freshers who
    join, and at Tech Mahindra I mentored AI teams across three geographies. The aim is a team that ships
    its second and third use case faster than the first, without me in every decision.'
