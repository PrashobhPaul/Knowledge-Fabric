    the AI Center of Excellence roadmap at Qualizeal, and I would publish the plan in the first week so
    nobody has to guess. Days 1 to 30 are for listening and mapping. I meet the business leaders, the
    CIO and CISO teams, data owners, legal and risk, and the teams already building AI, and I ask what
    the company is trying to achieve and where AI has helped or hurt so far. I build an inventory of every
