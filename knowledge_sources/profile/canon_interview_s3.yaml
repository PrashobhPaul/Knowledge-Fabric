- id: iv3-governance-25-apps
  topics:
  - interview
  - scenario
  questions:
  - 25 AI applications built independently, no central governance, monitoring or model registry. Establish
    enterprise AI governance.
  - An organization has 25 AI applications built independently with no central governance, monitoring
    or model registry. How would you establish enterprise AI governance?
  - How would you establish enterprise AI governance across many AI applications?
  - How would you set up an AI governance framework for an enterprise?
  keywords:
  - 25 ai applications
  - 25 ai apps
  - model registry
  - central governance
  - no central governance
  - enterprise ai governance
  - ai governance framework
  - governance framework
  - built independently
  - establish governance
  answer: 'I would not start by stopping the 25 teams; I would start by seeing them. Phase one, the first
    month, is inventory and triage: every AI and GenAI application, its owner, the models and providers
    it calls, the data it touches, its users, its cost, and whether it takes actions or only advises.
    I classify each into a risk tier by data sensitivity, customer exposure, autonomy and regulatory impact,
    and I close the critical gaps immediately: secrets in code, personal data reaching external APIs without
    agreements, agents with unrestricted tool access. Phase two puts in the shared control plane that
    every application must use. A central AI gateway for all LLM calls gives us authentication, logging,
    redaction of sensitive data, rate limits, cost attribution per application and an approved-model list
    in one place. A model and prompt registry tells us which model version and prompt each application
    runs, with lineage and rollback. An evaluation service holds golden sets per application and gates
    in CI, so no change reaches production without passing them. And common observability puts traces,
    latency, cost, quality and drift for all 25 on one portfolio dashboard. Phase three is the operating
    model: an AI governance council with the business, security, legal and architecture; an architecture
    review board for new use cases and major changes; risk-tiered policies, so low-risk tools move fast
    while high-risk ones get human approval and red-team testing; and a reference architecture with accelerators,
    so new applications start compliant. Then I migrate the 25 onto the gateway and registry in waves,
    highest risk first, with the platform team doing much of the work, and I consolidate duplicates where
    several teams built the same RAG. I measure progress by coverage, how many applications are behind
    the gateway, registered and evaluated, and by fewer incidents and lower cost. Governance that teams
    experience as a free platform gets adopted; governance experienced as a committee gets bypassed.'
