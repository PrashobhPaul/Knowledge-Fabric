- id: iv3-self-hosted
  topics:
  - interview
  - scenario
  questions:
  - Leadership wants to drop OpenAI, Anthropic and Google for an entirely self-hosted AI ecosystem. Approach,
    hidden costs and risks?
  - Leadership wants to replace OpenAI, Anthropic and Google with a fully self-hosted AI ecosystem. What
    would be your approach, and what are the hidden costs and risks?
  - What are the hidden costs of self-hosting LLMs?
  - How would you approach moving a company to self-hosted AI models?
  keywords:
  - self hosted
  - self hosting
  - self-hosted
  - self-hosting
  - hidden costs
  - host our own models
  - host its own models
  - self hosted ai ecosystem
  - drop openai
  - on premise llm
  answer: 'I would treat it as a business decision with a total cost of ownership, not an ideology, and
    I would start by asking why. The usual drivers are data sovereignty, regulation, vendor lock-in, unpredictable
    API bills or latency, and each has a cheaper answer than going fully self-hosted overnight. Having
    managed production deployments of LLM-based systems at Tech Mahindra, I know serving a model is the
    easy part; operating it is where the cost is. So I put the hidden costs on the table. GPUs: buying
    or reserving capacity for peak load that sits idle off-peak, plus redundancy across zones. People:
    MLOps and inference engineers who can run serving stacks such as vLLM on Kubernetes, quantise models,
    tune batching and throughput, and be on call. Evaluation parity: open-weight models are good and improving
    fast, but we must prove on our own golden sets that each one matches the model it replaces for each
    use case, and prove it again with every upgrade. Security patching: we now own the model supply chain,
    container and driver vulnerabilities, access control and abuse monitoring that the providers handled
    for us. Capacity: traffic spikes, long contexts and every new use case become our planning problem.
    And the frontier: proprietary models still lead on some reasoning and multimodal tasks. The risks
    are lower quality on hard tasks, outages we absorb ourselves, slower innovation, and a large fixed
    cost if adoption grows slower than planned. My recommendation would almost always be a hybrid, phased
    path behind a model gateway. Every GenAI application calls one AI gateway with a standard interface,
    so the model becomes a routing decision, not an application rewrite. I classify use cases by data
    sensitivity and difficulty: sensitive data and high-volume, simpler tasks such as classification,
    extraction and embeddings move first to open models we host, where the privacy and economics case
    is strongest, possibly through managed hosting in our own cloud account as a middle step. Complex
    reasoning stays on the providers'' APIs, under enterprise terms with no data retention and regional
    hosting, until an open model passes the evaluation. Each move is gated by evaluation parity and a
    measured cost per transaction. Leadership gets sovereignty where it matters, a cost curve it can see,
    and no single switch-off day that could break production.'
