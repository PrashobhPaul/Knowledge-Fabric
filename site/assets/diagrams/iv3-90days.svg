<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 563" width="560" height="563" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>First 30, 60 and 90 days as AI Enterprise Architect</title><desc>Days 1–30 · Listen and map → Days 31–60 · Decide and design → Days 61–90 · Deliver and scale → By day 90</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="563" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">First 30, 60 and 90 days as AI Enterprise Architect</text><g><rect x="20" y="58" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="105" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Days 1–30 · Listen and map</text><text x="70" y="108" font-size="13" fill="#334155">Business, CIO, CISO, data owners, AI teams</text><text x="70" y="127" font-size="13" fill="#334155">Inventory every AI app, model, vendor, risk</text><text x="70" y="146" font-size="13" fill="#334155">Current state · use cases by value, feasibility</text></g><path d="M280 167 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="191" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="191" width="6" height="105" rx="3" fill="#7c3aed"/><circle cx="50" cy="213" r="11" fill="#7c3aed"/><text x="50" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="218" font-size="15" font-weight="700" fill="#0f172a">Days 31–60 · Decide and design</text><text x="70" y="241" font-size="13" fill="#334155">Principles · target reference architecture</text><text x="70" y="260" font-siz