<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 772" width="560" height="772" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Risk tiers for GenAI: the worst dimension decides</title><desc>Score seven dimensions at intake → Tier 0 · prohibited → Tier 1 · high → Tier 2 · medium → Tier 3 · low → Re-tier on any material change</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="772" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Risk tiers for GenAI: the worst dimension decides</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Score seven dimensions at intake</text><text x="70" y="108" font-size="13" fill="#334155">Impact on individuals · autonomy · data sensitivity</text><text x="70" y="127" font-size="13" fill="#334155">Exposure · scale · reversibility · regulatory domain</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Tier 0 · prohibited</text><text x="70" y="222" font-size="13" fill="#334155">EU AI Act Article 5 practices and company red lines</text><text x="70" y="241" font-size="13" fill="#334155">Not built, whatever the business case</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="105" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Tier 1 · high</text><text x="70" y="336" font-size="13" fill="#334155">Annex III areas · irreversible or financial actions</text><text x="70" y="355" font-size="13" fill="#334155">Impact assessment · independent validation · red-team</text><text x="70" y="374" font-size="13" fill="#334155">Designed human oversight · risk-council approval</text></g><path d="M280 395 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="419" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="419" width="6" height="105" rx="3" fill="#059669"/><circle cx="50" cy="441" r="11" fill="#059669"/><text x="50" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="446" font-size="15" font-weight="700" fill="#0f172a">Tier 2 · medium</text><text x="70" y="469" font-size="13" fill="#334155">Customer-facing generation · reversible writes</text><text x="70" y="488" font-size="13" fill="#334155">Eval and red-team gates · AI disclosure to users</text><text x="70" y="507" font-size="13" fill="#334155">Labelled content · sampled human review</text></g><path d="M280 528 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="552" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="552" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="574" r="11" fill="#d97706"/><text x="50" y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="579" font-size="15" font-weight="700" fill="#0f172a">Tier 3 · low</text><text x="70" y="602" font-size="13" fill="#334155">Internal, read-only productivity</text><text x="70" y="621" font-size="13" fill="#334155">Paved road · standard gates · self-certification</text></g><path d="M280 642 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="666" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="666" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="688" r="11" fill="#2563eb"/><text x="50" y="692" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="693" font-size="15" font-weight="700" fill="#0f172a">Re-tier on any material change</text><text x="70" y="716" font-size="13" fill="#334155">New data, tools, autonomy or market</text><text x="70" y="735" font-size="13" fill="#334155">NIST AI RMF MAP · ISO/IEC 42001 impact assessment</text></g></svg>
