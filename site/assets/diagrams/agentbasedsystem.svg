<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 536" width="560" height="536" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>AgentBasedSystem · event management assistant</title><desc>Visitor message → Intent agent → LangGraph orchestration → Agents → Data</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="536" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">AgentBasedSystem · event management assistant</text><g><rect x="20" y="58" width="520" height="40" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="40" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Visitor message</text></g><path d="M280 102 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="126" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="126" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="148" r="11" fill="#7c3aed"/><text x="50" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="153" font-size="15" font-weight="700" fill="#0f172a">Intent agent</text><text x="70" y="176" font-size="13" fill="#334155">Rule-based classifier</text><text x="70" y="195" font-size="13" fill="#334155">Optional provider-agnostic LLM, graceful fallback</text></g><path d="M280 216 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="240" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="240" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="262" r="11" fill="#0891b2"/><text x="50" y="266" text-anchor="middle