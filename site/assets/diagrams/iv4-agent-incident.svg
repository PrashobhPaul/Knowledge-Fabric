<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 658" width="560" height="658" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Scenario B: an over-permissioned agent</title><desc>Contain, in minutes → Preserve evidence → Scope and restore → Root cause, blameless, by layer → Redesign controls</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="658" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Scenario B: an over-permissioned agent</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Contain, in minutes</text><text x="70" y="108" font-size="13" fill="#334155">Kill switch · revoke credentials · remove the tool</text><text x="70" y="127" font-size="13" fill="#334155">Pause queues · check other agents with the same grant</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Preserve evidence</text><text x="70" y="222" font-size="13" fill="#334155">Freeze audit log, traces, prompts and versions</text><text x="70" y="241" font-size="13" fill="#334155">Tool-call logs write-once · legal hold if needed</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="105" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Scope and restore</text><text x="70" y="336" font-size="13" fill="#334155">Which records, fields, runs, downstream systems</text><text x="70" y="355" font-size="13" fill="#334155">Roll back from recorded before-states</text><text x="70" y="374" font-size="13" fill="#334155">Point-in-time restore of affected records only</text></g><path d="M280 395 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="419" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="419" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="441" r="11" fill="#059669"/><text x="50" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="446" font-size="15" font-weight="700" fill="#0f172a">Root cause, blameless, by layer</text><text x="70" y="469" font-size="13" fill="#334155">Why could it: excessive permissions (design)</text><text x="70" y="488" font-size="13" fill="#334155">Why did it · why was it not stopped or noticed</text></g><path d="M280 509 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="533" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="533" width="6" height="105" rx="3" fill="#d97706"/><circle cx="50" cy="555" r="11" fill="#d97706"/><text x="50" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="560" font-size="15" font-weight="700" fill="#0f172a">Redesign controls</text><text x="70" y="583" font-size="13" fill="#334155">Narrow tools · scopes intersected with user rights</text><text x="70" y="602" font-size="13" fill="#334155">Write limits that pause the agent · bulk approvals</text><text x="70" y="621" font-size="13" fill="#334155">Dry runs · regression test · access review</text></g></svg>
