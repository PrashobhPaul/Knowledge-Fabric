<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 715" width="560" height="715" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Clinical NLP platform · physician's note reader</title><desc>EMR sources → Ingestion and per-patient collation → Clinical NLP → Ontology mapping → Patient relationship graph → Real-time analytics and the note reader</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="715" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Clinical NLP platform · physician's note reader</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">EMR sources</text><text x="70" y="108" font-size="13" fill="#334155">Epic and Meditech across 60+ US hospitals</text><text x="70" y="127" font-size="13" fill="#334155">HL7 messages · FHIR resources · MAR medication records</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Ingestion and per-patient collation</text><text x="70" y="222" font-size="13" fill="#334155">Physician notes, nursing notes, medication records</text><text x="70" y="241" font-size="13" fill="#334155">Brought together for each patient</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Clinical NLP</text><text x="70" y="336" font-size="13" fill="#334155">Abbreviations · negation · spelling variants</text><text x="70" y="355" font-size="13" fill="#334155">Many small, separately tested components</text></g><path d="M280 376 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="400" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="400" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="422" r="11" fill="#059669"/><text x="50" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="427" font-size="15" font-weight="700" fill="#0f172a">Ontology mapping</text><text x="70" y="450" font-size="13" fill="#334155">SNOMED · LOINC · ICD-10</text><text x="70" y="469" font-size="13" fill="#334155">One vocabulary joins every hospital's notes</text></g><path d="M280 490 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="514" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="514" width="6" height="67" rx="3" fill="#d97706"/><circle cx="50" cy="536" r="11" fill="#d97706"/><text x="50" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="541" font-size="15" font-weight="700" fill="#0f172a">Patient relationship graph</text><text x="70" y="564" font-size="13" fill="#334155">Conditions, medications, labs and events</text></g><path d="M280 585 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="609" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="609" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="631" r="11" fill="#2563eb"/><text x="50" y="635" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="636" font-size="15" font-weight="700" fill="#0f172a">Real-time analytics and the note reader</text><text x="70" y="659" font-size="13" fill="#334155">Predictive models for patient outcomes</text><text x="70" y="678" font-size="13" fill="#334155">Every finding traced back to its source</text></g></svg>
