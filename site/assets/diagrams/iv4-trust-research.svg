<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 677" width="560" height="677" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>PhD direction: trusting knowledge sources</title><desc>Question (a plan, not results) → Signals the system measures itself → Where trust would act → Test bed: Eidolon → Falsified if</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="677" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">PhD direction: trusting knowledge sources</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Question (a plan, not results)</text><text x="70" y="108" font-size="13" fill="#334155">How far should an AI system trust each source?</text><text x="70" y="127" font-size="13" fill="#334155">How should trust change retrieval and answers?</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Signals the system measures itself</text><text x="70" y="222" font-size="13" fill="#334155">Corroboration · internal and temporal consistency</text><text x="70" y="241" font-size="13" fill="#334155">Date confidence (0.95 to 0.30) · authority · feedback</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Where trust would act</text><text x="70" y="336" font-size="13" fill="#334155">A weight in retrieval (one more run in RRF)</text><text x="70" y="355" font-size="13" fill="#334155">A signal in confidence · the rule for when to decline</text></g><path d="M280 376 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="400" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="400" width="6" height="105" rx="3" fill="#059669"/><circle cx="50" cy="422" r="11" fill="#059669"/><text x="50" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="427" font-size="15" font-weight="700" fill="#0f172a">Test bed: Eidolon</text><text x="70" y="450" font-size="13" fill="#334155">Golden question sets as the benchmark</text><text x="70" y="469" font-size="13" fill="#334155">Proof report as the baseline</text><text x="70" y="488" font-size="13" fill="#334155">Injected faults: stale copies, contradictions</text></g><path d="M280 509 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="533" width="520" height="124" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="533" width="6" height="124" rx="3" fill="#d97706"/><circle cx="50" cy="555" r="11" fill="#d97706"/><text x="50" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="560" font-size="15" font-weight="700" fill="#0f172a">Falsified if</text><text x="70" y="583" font-size="13" fill="#334155">No gain beyond the confidence interval</text><text x="70" y="602" font-size="13" fill="#334155">Gain only by declining more</text><text x="70" y="621" font-size="13" fill="#334155">Recency or source count does as well</text><text x="70" y="640" font-size="13" fill="#334155">Gain vanishes on corpora I did not build</text></g></svg>
