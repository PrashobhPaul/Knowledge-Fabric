<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 753" width="560" height="753" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Estimating serving capacity, assumptions stated</title><desc>Assume → Token demand → Concurrency, Little's law → Memory → Replicas, from a measured per-replica rate → Challenge the inputs</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="753" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Estimating serving capacity, assumptions stated</text><g><rect x="20" y="58" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="105" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Assume</text><text x="70" y="108" font-size="13" fill="#334155">20 req/s · 2,000 in / 300 out tokens per request</text><text x="70" y="127" font-size="13" fill="#334155">70B-class model in FP8 on H100 80 GB GPUs</text><text x="70" y="146" font-size="13" fill="#334155">Targets: TTFT &lt; 1.5 s · ~25 tokens/s per stream at p95</text></g><path d="M280 167 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="191" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="191" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="213" r="11" fill="#7c3aed"/><text x="50" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="218" font-size="15" font-weight="700" fill="#0f172a">Token demand</text><text x="70" y="241" font-size="13" fill="#334155">Decode: 20 × 300 = 6,000 tokens/s</text><text x="70" y="260" font-size="13" fill="#334155">Prefill: 20 × 2,000 = 40,000 tokens/s</text></g><path d="M280 281 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="305" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="305" width="6" height="67" rx="3" fill="#0891b2"/><circle cx="50" cy="327" r="11" fill="#0891b2"/><text x="50" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="332" font-size="15" font-weight="700" fill="#0f172a">Concurrency, Little's law</text><text x="70" y="355" font-size="13" fill="#334155">L = λ × W = 20 × ~13 s ≈ 260 sequences in flight</text></g><path d="M280 376 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="400" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="400" width="6" height="105" rx="3" fill="#059669"/><circle cx="50" cy="422" r="11" fill="#059669"/><text x="50" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="427" font-size="15" font-weight="700" fill="#0f172a">Memory</text><text x="70" y="450" font-size="13" fill="#334155">~320 KB KV cache per token (FP16)</text><text x="70" y="469" font-size="13" fill="#334155">260 × 2,300 tokens ≈ 190 GB · half with FP8 KV</text><text x="70" y="488" font-size="13" fill="#334155">Plus 70 GB of FP8 weights</text></g><path d="M280 509 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="533" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="533" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="555" r="11" fill="#d97706"/><text x="50" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="560" font-size="15" font-weight="700" fill="#0f172a">Replicas, from a measured per-replica rate</text><text x="70" y="583" font-size="13" fill="#334155">4-GPU replica at 2,000 output tokens/s → 3 at peak</text><text x="70" y="602" font-size="13" fill="#334155">+30% headroom and N+1 → 5 replicas, 20 GPUs</text></g><path d="M280 623 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="647" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="647" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="669" r="11" fill="#2563eb"/><text x="50" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="674" font-size="15" font-weight="700" fill="#0f172a">Challenge the inputs</text><text x="70" y="697" font-size="13" fill="#334155">Output length and per-stream latency move it most</text><text x="70" y="716" font-size="13" fill="#334155">Compare with the API price and a smaller model</text></g></svg>
