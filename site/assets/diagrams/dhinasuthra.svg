<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 563" width="560" height="563" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Dhinasuthra · the shape of your day</title><desc>On your phone → Activity repository → Rules, not a model → Asks before it decides → Findings</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="563" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Dhinasuthra · the shape of your day</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">On your phone</text><text x="70" y="108" font-size="13" fill="#334155">Signals of your day, captured on device</text><text x="70" y="127" font-size="13" fill="#334155">Nothing leaves the phone</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="67" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Activity repository</text><text x="70" y="222" font-size="13" fill="#334155">Your routine as domain events</text></g><path d="M280 243 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="267" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="267" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="289" r="11" fill="#0891b2"/><text x="50" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="294" font-size="15" font-weight="700" fill="#0f172a">Rules, not a model</text><text x="70" y="317" font-size="13" fill="#334155">131 written IF/THEN rules, each with an ID and weight</text><text x="70" y="336" font-size="13" fill="#334155">Would rather say nothing than make something up</text></g><path d="M280 357 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="381" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="381" width="6" height="67" rx="3" fill="#059669"/><circle cx="50" cy="403" r="11" fill="#059669"/><text x="50" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="408" font-size="15" font-weight="700" fill="#0f172a">Asks before it decides</text><text x="70" y="431" font-size="13" fill="#334155">You confirm what it is unsure of</text></g><path d="M280 452 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="476" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="476" width="6" height="67" rx="3" fill="#d97706"/><circle cx="50" cy="498" r="11" fill="#d97706"/><text x="50" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="503" font-size="15" font-weight="700" fill="#0f172a">Findings</text><text x="70" y="526" font-size="13" fill="#334155">Patterns in your daily routine</text></g></svg>
