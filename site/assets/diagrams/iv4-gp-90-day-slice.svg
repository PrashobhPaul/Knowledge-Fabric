<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 601" width="560" height="601" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>The first 90-day slice: thin, vertical, live</title><desc>Weeks 1-3: discovery and decisions → Weeks 4-8: build on the paved road → Weeks 9-11: pilot → Week 12: go or no-go on written criteria → Out of scope, said explicitly</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="601" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">The first 90-day slice: thin, vertical, live</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Weeks 1-3: discovery and decisions</text><text x="70" y="108" font-size="13" fill="#334155">Golden sets drafted with the business owner</text><text x="70" y="127" font-size="13" fill="#334155">Identity, network, procurement requested day one</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Weeks 4-8: build on the paved road</text><text x="70" y="222" font-size="13" fill="#334155">Gateway with two providers · ingestion with ACL sync</text><text x="70" y="241" font-size="13" fill="#334155">Hybrid retrieval, reranking · red-team from week six</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="67" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Weeks 9-11: pilot</text><text x="70" y="336" font-size="13" fill="#334155">100 to 300 users · measure against the baseline · fix</text></g><path d="M280 357 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="381" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="381" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="403" r="11" fill="#059669"/><text x="50" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="408" font-size="15" font-weight="700" fill="#0f172a">Week 12: go or no-go on written criteria</text><text x="70" y="431" font-size="13" fill="#334155">Golden-set target · zero forbidden-document failures</text><text x="70" y="450" font-size="13" fill="#334155">p95 first token under 2 s · cost per successful task</text></g><path d="M280 471 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="495" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="495" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="517" r="11" fill="#d97706"/><text x="50" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="522" font-size="15" font-weight="700" fill="#0f172a">Out of scope, said explicitly</text><text x="70" y="545" font-size="13" fill="#334155">Autonomous writes · second region · self-hosted GPUs</text><text x="70" y="564" font-size="13" fill="#334155">Customer-facing use · the other 98 use cases</text></g></svg>
