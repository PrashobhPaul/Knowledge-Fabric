<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 677" width="560" height="677" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Sizing the platform: capacity, availability, cost</title><desc>Load → Monthly volume → Availability → Disaster recovery inside each jurisdiction → Cost controls</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="677" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Sizing the platform: capacity, availability, cost</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Load</text><text x="70" y="108" font-size="13" fill="#334155">3,000 users, a request every 2-3 min ≈ 20 req/s peak</text><text x="70" y="127" font-size="13" fill="#334155">2,000 input + 300 output tokens per request</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Monthly volume</text><text x="70" y="222" font-size="13" fill="#334155">~8 million requests · ~18 billion tokens before batch</text><text x="70" y="241" font-size="13" fill="#334155">Illustrative $2 per million tokens ≈ $36,000 a month</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="105" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Availability</text><text x="70" y="336" font-size="13" fill="#334155">99.9% ≈ 43 minutes a month · multi-provider failover</text><text x="70" y="355" font-size="13" fill="#334155">Degrade: cited retrieval-only answers, queued batch</text><text x="70" y="374" font-size="13" fill="#334155">Agents drop to read-only</text></g><path d="M280 395 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="419" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="419" width="6" height="105" rx="3" fill="#059669"/><circle cx="50" cy="441" r="11" fill="#059669"/><text x="50" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="446" font-size="15" font-weight="700" fill="#0f172a">Disaster recovery inside each jurisdiction</text><text x="70" y="469" font-size="13" fill="#334155">Config and prompts as code · audit write-once</text><text x="70" y="488" font-size="13" fill="#334155">Indexes: snapshot (minutes) or rebuild (hours)</text><text x="70" y="507" font-size="13" fill="#334155">Drills every quarter</text></g><path d="M280 528 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="552" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="552" width="6" height="105" rx="3" fill="#d97706"/><circle cx="50" cy="574" r="11" fill="#d97706"/><text x="50" y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="579" font-size="15" font-weight="700" fill="#0f172a">Cost controls</text><text x="70" y="602" font-size="13" fill="#334155">Quotas and budgets per business unit · alerts at 80%</text><text x="70" y="621" font-size="13" fill="#334155">Showback first, chargeback later</text><text x="70" y="640" font-size="13" fill="#334155">Cost per successful task as the unit</text></g></svg>
