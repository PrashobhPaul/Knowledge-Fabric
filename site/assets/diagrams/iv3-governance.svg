<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 715" width="560" height="715" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Enterprise AI governance for 25 independent apps</title><desc>Inventory and triage → Central AI gateway → Model and prompt registry → Evaluation and observability → Operating model → Migrate in waves</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="715" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Enterprise AI governance for 25 independent apps</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Inventory and triage</text><text x="70" y="108" font-size="13" fill="#334155">Every app: owner, models, data, users, cost</text><text x="70" y="127" font-size="13" fill="#334155">Risk tier per app · close critical gaps now</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Central AI gateway</text><text x="70" y="222" font-size="13" fill="#334155">Every model call: auth, logging, redaction</text><text x="70" y="241" font-size="13" fill="#334155">Rate limits · cost per app · approved models</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="67" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="67" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Model and prompt registry</text><text x="70" y="336" font-size="13" fill="#334155">Versions, lineage and rollback</text></g><path d="M280 357 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="381" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="381" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="403" r="11" fill="#059669"/><text x="50" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="408" font-size="15" font-weight="700" fill="#0f172a">Evaluation and observability</text><text x="70" y="431" font-size="13" fill="#334155">Golden sets and CI gates per app</text><text x="70" y="450" font-size="13" fill="#334155">Traces · latency · cost · quality · drift</text></g><path d="M280 471 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="495" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="495" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="517" r="11" fill="#d97706"/><text x="50" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="522" font-size="15" font-weight="700" fill="#0f172a">Operating model</text><text x="70" y="545" font-size="13" fill="#334155">Governance council · architecture review board</text><text x="70" y="564" font-size="13" fill="#334155">Risk-tiered policies · reference architecture</text></g><path d="M280 585 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="609" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="609" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="631" r="11" fill="#2563eb"/><text x="50" y="635" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="636" font-size="15" font-weight="700" fill="#0f172a">Migrate in waves</text><text x="70" y="659" font-size="13" fill="#334155">Highest risk first · consolidate duplicates</text><text x="70" y="678" font-size="13" fill="#334155">Measure coverage, incidents and cost</text></g></svg>
