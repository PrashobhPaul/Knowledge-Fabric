<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 639" width="560" height="639" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Knowledge Fabric + Knowledge Factory</title><desc>Public sources → Knowledge Factory (GitHub Actions) → Fabric build → In the browser → Cited answer</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="639" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Knowledge Fabric + Knowledge Factory</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Public sources</text><text x="70" y="108" font-size="13" fill="#334155">Website · resume · GitHub repos and code</text><text x="70" y="127" font-size="13" fill="#334155">YouTube videos and chapters · LinkedIn</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Knowledge Factory (GitHub Actions)</text><text x="70" y="222" font-size="13" fill="#334155">Syncs every source on a schedule</text><text x="70" y="241" font-size="13" fill="#334155">Masks confidential client names</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="105" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="105" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Fabric build</text><text x="70" y="336" font-size="13" fill="#334155">Chunks with provenance and dates</text><text x="70" y="355" font-size="13" fill="#334155">BM25 + LSA + MiniLM vectors · typed graph</text><text x="70" y="374" font-size="13" fill="#334155">Curated answers, each proof resolved to a record</text></g><path d="M280 395 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="419" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="419" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="441" r="11" fill="#059669"/><text x="50" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="446" font-size="15" font-weight="700" fill="#0f172a">In the browser</text><text x="70" y="469" font-size="13" fill="#334155">NLU: typos, Indic scripts, follow-ups, several questions in one</text><text x="70" y="488" font-size="13" fill="#334155">Curated answer first, hybrid retrieval underneath</text></g><path d="M280 509 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="533" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="533" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="555" r="11" fill="#d97706"/><text x="50" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="560" font-size="15" font-weight="700" fill="#0f172a">Cited answer</text><text x="70" y="583" font-size="13" fill="#334155">In Prashobh's own words, with proofs</text><text x="70" y="602" font-size="13" fill="#334155">Spoken by the 3D twin · videos play inline</text></g></svg>
