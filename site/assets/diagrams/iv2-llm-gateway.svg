<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 848" width="560" height="848" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>LLM gateway · switch providers, keep data inside</title><desc>Application asks for a capability → Policy and identity → PII redaction → Routing and cache → Provider adapters → Response path → Release and observe</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="848" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">LLM gateway · switch providers, keep data inside</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Application asks for a capability</text><text x="70" y="108" font-size="13" fill="#334155">A grounded answer, a cheap classification, an embedding</text><text x="70" y="127" font-size="13" fill="#334155">One API; no provider SDK in application code</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Policy and identity</text><text x="70" y="222" font-size="13" fill="#334155">Tenant, user and data classification on every call</text><text x="70" y="241" font-size="13" fill="#334155">Rate limits and token budgets</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">PII redaction</text><text x="70" y="336" font-size="13" fill="#334155">Mask personal data, secrets and client names</text><text x="70" y="355" font-size="13" fill="#334155">Restricted data never leaves the network</text></g><path d="M280 376 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="400" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="400" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="422" r="11" fill="#059669"/><text x="50" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="427" font-size="15" font-weight="700" fill="#0f172a">Routing and cache</text><text x="70" y="450" font-size="13" fill="#334155">Route by task, cost and classification</text><text x="70" y="469" font-size="13" fill="#334155">Semantic cache scoped by permission</text></g><path d="M280 490 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="514" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="514" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="536" r="11" fill="#d97706"/><text x="50" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="541" font-size="15" font-weight="700" fill="#0f172a">Provider adapters</text><text x="70" y="564" font-size="13" fill="#334155">OpenAI · Anthropic · Gemini · Bedrock · Azure OpenAI</text><text x="70" y="583" font-size="13" fill="#334155">Self-hosted open model (vLLM) for restricted data</text></g><path d="M280 604 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="628" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="628" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="650" r="11" fill="#2563eb"/><text x="50" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="655" font-size="15" font-weight="700" fill="#0f172a">Response path</text><text x="70" y="678" font-size="13" fill="#334155">Schema validation · output filter · values re-inserted</text><text x="70" y="697" font-size="13" fill="#334155">Retries, circuit breakers, failover</text></g><path d="M280 718 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="742" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="742" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="764" r="11" fill="#7c3aed"/><text x="50" y="768" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="70" y="769" font-size="15" font-weight="700" fill="#0f172a">Release and observe</text><text x="70" y="792" font-size="13" fill="#334155">Per-model prompts · golden eval set · canary, rollback</text><text x="70" y="811" font-size="13" fill="#334155">Tokens, latency and cost per tenant in the trace</text></g></svg>
