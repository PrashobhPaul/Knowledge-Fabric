<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 734" width="560" height="734" role="img" font-family="Inter, Segoe UI, Roboto, sans-serif"><title>Permission-aware RAG for 20,000 documents</title><desc>Sources with their ACLs → Incremental indexing → Permission-tagged index → Identity-aware retrieval → Grounded generation → Audit and evaluation</desc><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="560" height="734" rx="16" fill="#f8fafc"/><text x="20" y="36" font-size="17" font-weight="800" fill="#0f172a">Permission-aware RAG for 20,000 documents</text><g><rect x="20" y="58" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="58" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="80" r="11" fill="#2563eb"/><text x="50" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="85" font-size="15" font-weight="700" fill="#0f172a">Sources with their ACLs</text><text x="70" y="108" font-size="13" fill="#334155">SharePoint · Confluence · databases</text><text x="70" y="127" font-size="13" fill="#334155">Content and permissions synced together</text></g><path d="M280 148 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="172" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="172" width="6" height="86" rx="3" fill="#7c3aed"/><circle cx="50" cy="194" r="11" fill="#7c3aed"/><text x="50" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="199" font-size="15" font-weight="700" fill="#0f172a">Incremental indexing</text><text x="70" y="222" font-size="13" fill="#334155">Change feeds · content hashes · re-embed only what changed</text><text x="70" y="241" font-size="13" fill="#334155">Permission changes and deletes applied first</text></g><path d="M280 262 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="286" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="286" width="6" height="86" rx="3" fill="#0891b2"/><circle cx="50" cy="308" r="11" fill="#0891b2"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="313" font-size="15" font-weight="700" fill="#0f172a">Permission-tagged index</text><text x="70" y="336" font-size="13" fill="#334155">Every chunk: ACL, department, classification, version</text><text x="70" y="355" font-size="13" fill="#334155">Separate namespaces and keys for HR, legal, finance</text></g><path d="M280 376 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="400" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="400" width="6" height="86" rx="3" fill="#059669"/><circle cx="50" cy="422" r="11" fill="#059669"/><text x="50" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="427" font-size="15" font-weight="700" fill="#0f172a">Identity-aware retrieval</text><text x="70" y="450" font-size="13" fill="#334155">SSO identity and groups resolved per request</text><text x="70" y="469" font-size="13" fill="#334155">Pre-filter inside hybrid search · deny by default</text></g><path d="M280 490 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="514" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="514" width="6" height="86" rx="3" fill="#d97706"/><circle cx="50" cy="536" r="11" fill="#d97706"/><text x="50" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="541" font-size="15" font-weight="700" fill="#0f172a">Grounded generation</text><text x="70" y="564" font-size="13" fill="#334155">The LLM sees only authorized chunks</text><text x="70" y="583" font-size="13" fill="#334155">Citations · caches keyed by permission set</text></g><path d="M280 604 v18" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><g><rect x="20" y="628" width="520" height="86" rx="12" fill="#ffffff" stroke="#d6dde8"/><rect x="20" y="628" width="6" height="86" rx="3" fill="#2563eb"/><circle cx="50" cy="650" r="11" fill="#2563eb"/><text x="50" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="70" y="655" font-size="15" font-weight="700" fill="#0f172a">Audit and evaluation</text><text x="70" y="678" font-size="13" fill="#334155">Who asked, what was retrieved, what was answered</text><text x="70" y="697" font-size="13" fill="#334155">Leakage test set: zero leaked chunks gates every deploy</text></g></svg>
