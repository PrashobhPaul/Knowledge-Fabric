<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prashobh — the twin</title>
  <meta name="description" content="A speaking, 3D version of Prashobh Paul whose every sentence is traced to a source: the Knowledge Fabric with a face and a voice." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="twin.css?v=1" />
</head>
<body>
  <header class="twin-top">
    <a class="back" href="../">← Knowledge Fabric</a>
    <h1>Prashobh <em>— the twin</em></h1>
    <p id="twin-status" class="status">Loading…</p>
  </header>

  <main class="twin-main">
    <section class="twin-stage-wrap">
      <div id="twin-stage" class="twin-stage" data-mood="idle" aria-label="Avatar"></div>
      <div class="stage-actions">
        <button type="button" id="twin-greet" class="ghost">Say hello</button>
        <label class="lang"><span class="sr-only">Language</span><select id="twin-lang" aria-label="Language"></select></label>
      </div>
      <p class="fineprint">Every sentence I say is quoted from my resume, website, LinkedIn, YouTube or GitHub and rewritten only from "he" to "I". Nothing is generated.</p>
    </section>

    <section class="twin-chat">
      <div id="twin-log" class="twin-log" aria-live="polite"></div>
      <div id="twin-chips" class="chips"></div>
      <form id="twin-form" class="twin-form" hidden>
        <button type="button" id="twin-mic" class="mic" aria-label="Ask by voice" title="Ask by voice">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
        </button>
        <input id="twin-input" type="text" placeholder="Ask me anything — or press the mic" autocomplete="off" spellcheck="false" />
        <button type="submit" class="send">Ask</button>
      </form>
    </section>
  </main>

  <script type="module" src="twin.js?v=1"></script>
</body>
</html>
